# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Inherits the organisation's CodeRabbit settings; only owlbear's specifics live here (D-01M5TN7BEVN9YWFEYCHH9GJZG0).
inheritance: true
reviews:
  auto_apply_labels: false  # PR labels cut releases
  path_filters:
    - "!serve/delivery-next/src/owlbear_delivery_next/web/vendor/**"
    - "!serve/delivery-next/src/owlbear_delivery_next/web/pds/**"
  path_instructions:
    - path: ".owlbear/research/**"
      instructions: >-
        Plan and build designs. Flag only contradictions with other
        documents or the code, broken links and stale references. No wording or style comments.
knowledge_base:
  code_guidelines:
    filePatterns:
      - files: ".github/instructions/code-review.instructions.md"
        applyTo: "**"
