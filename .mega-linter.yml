---
# MegaLinter configuration for OwlBear
# https://megalinter.io/latest/config-file/
# Native runner metadata. Local tooling derives the same image from these fields.
MEGALINTER_FLAVOR: cupcake
MEGALINTER_VERSION: v10.0.0

# Explicit linter list — only what applies to this project
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_SHELLCHECK
  - CSS_STYLELINT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - HTML_HTMLHINT
  - JAVASCRIPT_ES
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF
  - PYTHON_RUFF_FORMAT
  - REPOSITORY_GIT_DIFF
  - REPOSITORY_OSV_SCANNER
  - TYPESCRIPT_ES
  - YAML_YAMLLINT

# Allow all fixer-capable linters to apply their standard fixes by default.
# The CLI's --no-fix mode disables fixes; --unsafe-fix adds Ruff unsafe fixes
# and Stylelint lax fixes.
APPLY_FIXES: all

# Reporters
CONFIG_REPORTER: false
GITHUB_STATUS_REPORTER: true
JSON_REPORTER: true
SARIF_REPORTER: true

# Exclude paths that are generated, archived, or third-party.
# This applies to linters that honor global regex filtering; project-mode
# linters must enforce their own scope through native configuration.
# MegaLinter uses markdownlint-cli; .markdownlint-cli2.jsonc is a separate
# authority for the pre-commit hook and VS Code extension.
FILTER_REGEX_EXCLUDE: "(\
  \\.egg-info/|\
  \\.owlbear/(\
    completed/|delivery/(packages|runtime)/|(doc|py|ts)-index\\.md$|\
    legacy/|memory/|research/|sources/|target/\
  )|\
  store/(audit|knowledge)/.*\\.db$\
)"

# Directory-level pre-filter (faster than regex, excluded at any depth)
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .benchmarks
  - .ruff_cache
  - .venv
  - __pycache__
  - _cache
  - artifacts
  - build
  - coverage             # Vitest/Playwright HTML coverage reports
  - dist                 # Vite build output
  - downloads
  - htmlcov
  - node_modules
  - parts
  - playwright-report    # Playwright HTML reports
  - scratch              # Generated scratch workspace files
  - sdist
  - test-results         # Playwright test output
  - wheels
  - worktrees            # Host-local Delivery worktrees

# ──────────────────────────────────────────────
# Linter-specific configuration
# ──────────────────────────────────────────────

# Pin the documented default so FILTER_REGEX_EXCLUDE remains effective.
MARKDOWN_MARKDOWNLINT_CLI_LINT_MODE: list_of_files

# Ruff — uses pyproject.toml config (select=["ALL"] includes bandit S-rules)
# MegaLinter otherwise falls back to its bundled .ruff.toml template.
PYTHON_RUFF_CONFIG_FILE: pyproject.toml
PYTHON_RUFF_CLI_LINT_MODE: project

PYTHON_DEFAULT_STYLE: ruff
PYTHON_RUFF_FORMAT_CONFIG_FILE: pyproject.toml
PYTHON_RUFF_FORMAT_CLI_LINT_MODE: project

# TypeScript — scope to Cockpit web (only dir with eslint.config.js).
TYPESCRIPT_ES_FILTER_REGEX_INCLUDE: '^serve/cockpit/web/.*\.(ts|tsx)$'
TYPESCRIPT_ES_FILE_EXTENSIONS:
  - .ts
  - .tsx
TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
TYPESCRIPT_ES_RULES_PATH: serve/cockpit/web
TYPESCRIPT_ES_ARGUMENTS: "--max-warnings 0"

# CSS — use the Cockpit web policy instead of MegaLinter defaults.
CSS_STYLELINT_FILTER_REGEX_INCLUDE: '^serve/cockpit/web/src/.*\.css$'
CSS_STYLELINT_CONFIG_FILE: .stylelintrc.json
CSS_STYLELINT_RULES_PATH: serve/cockpit/web

# HTML — use the Cockpit web policy instead of MegaLinter defaults.
HTML_HTMLHINT_FILTER_REGEX_INCLUDE: '^serve/cockpit/web/.*\.html$'
HTML_HTMLHINT_CONFIG_FILE: .htmlhintrc
HTML_HTMLHINT_RULES_PATH: serve/cockpit/web

# Actionlint — restrict to workflow files
ACTION_ACTIONLINT_FILTER_REGEX_INCLUDE: '^(\.github/workflows/.*\.ya?ml)$'

# YAML — strict mode
YAML_YAMLLINT_ARGUMENTS: "--strict"

# JSON — use the repository-owned flat config for strict JSON and JSONC.
JAVASCRIPT_ES_FILTER_REGEX_INCLUDE: '(^|/).*\.(json|jsonc)$'
JAVASCRIPT_ES_FILE_EXTENSIONS:
  - .json
  - .jsonc
JAVASCRIPT_ES_CONFIG_FILE: eslint-json.config.cjs
JAVASCRIPT_ES_RULES_PATH: .
JAVASCRIPT_ES_CLI_EXECUTABLE: serve/cockpit/web/node_modules/.bin/eslint
JAVASCRIPT_ES_ARGUMENTS: "--no-config-lookup --no-warn-ignored --no-error-on-unmatched-pattern"

# EditorConfig — GitHub Actions annotations
# --disable-indent-size: ruff handles Python indent; editorconfig-checker
# false-positives on docstring content (2-space RST lists inside 4-space code).
# Tabs-vs-spaces (indent_style) is still enforced.
EDITORCONFIG_EDITORCONFIG_CHECKER_ARGUMENTS: "-f github-actions --disable-indent-size"

# ──────────────────────────────────────────────
# Performance & Display
# ──────────────────────────────────────────────
FLAVOR_SUGGESTIONS: false
PARALLEL_PROCESS_NUMBER: 4
PRINT_ALPACA: false
SECURITY_SUGGESTIONS: false
SHOW_ELAPSED_TIME: true
SHOW_SKIPPED_LINTERS: false
