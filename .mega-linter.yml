---
# MegaLinter configuration for OwlBear
# https://megalinter.io/configuration/
# Version: v9.4.0 (python flavor)

# Explicit linter list — only what applies to this project
ENABLE_LINTERS:
  # Python (bandit rules covered via ruff select=["ALL"] S-prefix)
  - PYTHON_RUFF
  - PYTHON_RUFF_FORMAT
  # PowerShell
  - POWERSHELL_POWERSHELL
  # Formats
  - JSON_JSONLINT
  - MARKDOWN_MARKDOWNLINT
  - YAML_YAMLLINT
  # Tooling
  - ACTION_ACTIONLINT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  # Security / Repository
  - REPOSITORY_GITLEAKS
  - REPOSITORY_DEVSKIM
  - REPOSITORY_TRIVY

# Reporters
GITHUB_STATUS_REPORTER: true
MARKDOWN_SUMMARY_REPORTER: true
SARIF_REPORTER: true

# Exclude paths that are generated, archived, or third-party
FILTER_REGEX_EXCLUDE: >-
  (\.owlbear/kanban/v1-archive/
  |\.owlbear/research/
  |\.owlbear/scratch/
  |\.venv/
  |v1/
  |__pycache__/
  |\.egg-info/
  |uv\.lock$)

# Directory-level pre-filter (faster than regex, excluded at any depth)
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - v1
  - store
  - .venv
  - __pycache__
  - node_modules

# ──────────────────────────────────────────────
# Linter-specific configuration
# ──────────────────────────────────────────────

# Ruff — uses pyproject.toml config (select=["ALL"] includes bandit S-rules)
# Auto-discovers pyproject.toml from project root; no explicit config path needed.
# --extend-exclude ensures v1/ is excluded even when MegaLinter's project-mode
# bypasses file-level FILTER_REGEX_EXCLUDE.
PYTHON_RUFF_CLI_LINT_MODE: project
PYTHON_RUFF_ARGUMENTS: "--extend-exclude v1/"

# Ruff format — uses pyproject.toml config
PYTHON_DEFAULT_STYLE: ruff

# Actionlint — restrict to workflow files
ACTION_ACTIONLINT_FILTER_REGEX_INCLUDE: '^(\.github/workflows/.*\.ya?ml)$'

# YAML — strict mode
YAML_YAMLLINT_ARGUMENTS: "--strict"
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: '\.owlbear/kanban/'

# JSON — quiet output
JSON_JSONLINT_ARGUMENTS: "--quiet"

# Markdown
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: '\.owlbear/kanban/'

# EditorConfig — GitHub Actions annotations
EDITORCONFIG_EDITORCONFIG_CHECKER_ARGUMENTS: "-f github-actions"

# Gitleaks — secret detection
REPOSITORY_GITLEAKS_ARGUMENTS: "--no-banner"

# DevSkim — security anti-pattern detection (all languages)
REPOSITORY_DEVSKIM_DISABLE_ERRORS: false

# Trivy — vulnerability + misconfiguration scanning
REPOSITORY_TRIVY_ARGUMENTS: "--scanners vuln,misconfig --skip-dirs .venv --skip-dirs v1"

# ──────────────────────────────────────────────
# Performance & Display
# ──────────────────────────────────────────────
FLAVOR_SUGGESTIONS: false
PARALLEL: true
SHOW_ELAPSED_TIME: true
SHOW_SKIPPED_LINTERS: false
PRINT_ALPACA: false
SKIP_LINTER_OUTPUT_SANITIZATION: true  # private repo — safe to skip for perf
