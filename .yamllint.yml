---
# yamllint config — extends default rules.
# Line-length is disabled because editorconfig-checker already enforces
# max_line_length from .editorconfig (with per-file-type overrides).
extends: default
# Manual root-wide yamllint runs also skip retained root-only legacy YAML records.
ignore: |
  .owlbear/legacy/**
rules:
  line-length: disable
