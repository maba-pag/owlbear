[project]
name = "owlbear"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear orchestrator — core package"
dependencies = [
	"agent-client-protocol>=0.9.0,<1.0.0",
	"typer>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear", "src/owlbear_orchestrator"]
