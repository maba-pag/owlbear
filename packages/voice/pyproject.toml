[project]
name = "owlbear-voice"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear voice addon (speech recognition + TTS)"
dependencies = [
  "moonshine-voice",
  "numpy",
  "pyttsx3",
  "sounddevice",
]

[project.optional-dependencies]
kokoro = [
  "kokoro",
  "soundfile",
]

[project.scripts]
owlbear-voice = "owlbear_voice.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_voice"]
