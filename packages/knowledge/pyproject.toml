[project]
name = "owlbear-knowledge"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear knowledge engine (graph + vector)"
dependencies = ["pydantic>=2.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_knowledge"]
