---
# Pre-commit config — aligned with CI (MegaLinter v10)
#
# Commands:
#   uv run lint [--staged] [--no-fix | --unsafe-fix]
#                     Workspace files by default; staged files with --staged
#   uv run lint-cockpit [--staged] [--no-fix | --unsafe-fix]
#                     Cockpit frontend lint aggregate
#   uv run megalint [--no-fix | --unsafe-fix]
#                     MegaLinter only
#   uv run lint-full [--no-fix | --unsafe-fix]
#                     All local and full-project lint checks
#   uv run quality-full [--no-fix | --unsafe-fix]
#                     Full format, lint, typecheck, and advisory checks
#
# Auto-fix on commit: Ruff, frontend lint hooks, trailing-whitespace,
# end-of-file-fixer, and markdownlint.

# Exclude the same generated, archived, and third-party paths as MegaLinter
# where pre-commit's path matching can express them.
exclude: |
  (?x)(^|/)(
    [^/]*\.egg-info/
    |\.owlbear/(
      completed/
      |delivery/(packages|runtime)/
      |(doc|py|ts)-index\.md$
      |(legacy|memory|research|target)/
    )
    |store/(audit|knowledge)/.*\.db$
    |(
      \.benchmarks
      |\.ruff_cache
      |\.venv
      |__pycache__
      |_cache
      |artifacts
      |build
      |coverage
      |dist
      |downloads
      |htmlcov
      |node_modules
      |parts
      |playwright-report
      |scratch
      |sdist
      |test-results
      |wheels
      |worktrees
    )/
  )
repos:
  # ── General file checks ──────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        alias: trailing-whitespace-fix
        exclude: ^serve/cockpit/web/public/porsche-design-system/
      - id: end-of-file-fixer
        alias: end-of-file-fix
        exclude: ^serve/cockpit/web/public/porsche-design-system/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # ── Python (matches CI: PYTHON_RUFF + PYTHON_RUFF_FORMAT) ─
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        alias: ruff-fix
        args: [--fix]
      - id: ruff-format
        alias: ruff-format-fix
      - id: ruff
        alias: ruff-check
        name: ruff check (no fix)
        stages: [manual]
      - id: ruff-format
        alias: ruff-format-check
        name: ruff format check (no fix)
        args: [--check]
        stages: [manual]
      - id: ruff
        alias: ruff-unsafe-fix
        name: ruff check (unsafe fixes)
        args: [--fix, --unsafe-fixes]
        stages: [manual]

  # ── YAML (matches CI: YAML_YAMLLINT) ────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # ── Shell (matches CI: BASH_SHELLCHECK) ─────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # ── Actions (matches CI: ACTION_ACTIONLINT) ─────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ── Markdown (matches CI: MARKDOWN_MARKDOWNLINT) ────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        alias: markdownlint-fix
        args: [--fix]
      - id: markdownlint-cli2
        alias: markdownlint-check
        name: markdownlint-cli2 (no fix)
        stages: [manual]

  # ── EditorConfig (matches CI: EDITORCONFIG_EDITORCONFIG_CHECKER) ──
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.11.1"
    hooks:
      - id: editorconfig-checker
        args: [-disable-indent-size]
        exclude: ^serve/cockpit/web/public/porsche-design-system/

  # ── Local hooks ─────────────────────────────────────────
  - repo: local
    hooks:
      # Frontend — matches CI: TYPESCRIPT_ES
      - id: eslint-frontend
        alias: eslint-frontend-fix
        name: ESLint (Cockpit frontend)
        language: system
        entry: >-
          npx --prefix serve/cockpit/web eslint serve/cockpit/web/src/
          serve/cockpit/web/e2e/ --fix --max-warnings 0
        files: ^serve/cockpit/web/(src|e2e)/.*\.(ts|tsx)$
        pass_filenames: false
      - id: eslint-frontend-check
        name: ESLint (Cockpit frontend, no fix)
        language: system
        entry: >-
          npx --prefix serve/cockpit/web eslint serve/cockpit/web/src/
          serve/cockpit/web/e2e/ --max-warnings 0
        files: ^serve/cockpit/web/(src|e2e)/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [manual]
      - id: stylelint-frontend-fix
        name: Stylelint (Cockpit frontend)
        language: system
        entry: npm --prefix serve/cockpit/web run lint:css -- --fix=strict
        files: ^serve/cockpit/web/src/.*\.css$
        pass_filenames: false
      - id: stylelint-frontend-check
        name: Stylelint (Cockpit frontend, no fix)
        language: system
        entry: npm --prefix serve/cockpit/web run lint:css
        files: ^serve/cockpit/web/src/.*\.css$
        pass_filenames: false
        stages: [manual]
      - id: stylelint-frontend-lax
        name: Stylelint (Cockpit frontend, lax fixes)
        language: system
        entry: npm --prefix serve/cockpit/web run lint:css -- --fix=lax
        files: ^serve/cockpit/web/src/.*\.css$
        pass_filenames: false
        stages: [manual]
      - id: eslint-json
        name: ESLint (JSON/JSONC)
        language: system
        entry: uv run lint-json
        files: .*(\.json|\.jsonc)$
        pass_filenames: false
      # Frontend — extra (no CI equivalent, catches type errors early)
      # Manual stage: tsc --noEmit is a whole-project check — can't scope to
      # staged files. Run explicitly: uv run pre-commit run typecheck-frontend --all-files --hook-stage manual
      - id: typecheck-frontend
        name: TypeScript (Cockpit frontend)
        language: system
        entry: npx --prefix serve/cockpit/web tsc --noEmit --project serve/cockpit/web/tsconfig.json
        files: ^serve/cockpit/web/(src/.*\.(ts|tsx)|vite\.config\.ts|vitest\.setup\.ts)$
        pass_filenames: false
        stages: [manual]
      # Project-specific validators
      - id: check-python-runtime
        name: Validate Python runtime declarations
        language: system
        entry: >-
          uv run --frozen python .github/scripts/check_python_runtime.py
          --version-file .python-version --members-root serve --guard-file setup/init.py
        files: '^(\.python-version|serve/[^/]+/pyproject\.toml|(setup/init|\.github/scripts/check_python_runtime)\.py)$'
        pass_filenames: false
      - id: validate-skills
        name: Validate Agent Skills
        language: system
        entry: uv run --frozen python .owlbear/scripts/validate_skills.py
        pass_filenames: false
        always_run: true
      - id: validate-agents
        name: Validate Agent Tool Names
        language: system
        entry: uv run --frozen python .owlbear/scripts/validate_agents.py
        files: >-
          (?x)
          ^(?:share/agents|\.owlbear/agents)/.*\.agent\.md$
          |^\.owlbear/hooks/.*\.py$
          |^\.owlbear/scripts/validate_agents\.py$
        pass_filenames: false
      - id: validate-prompts
        name: Validate Agent Prompts
        language: system
        entry: uv run --frozen python .owlbear/scripts/validate_prompts.py
        files: '^(?:share|\.owlbear)/(?:agents|prompts|skills)/.*|^\.owlbear/scripts/validate_prompts\.py$'
        pass_filenames: false
      # TODO marker scan — warning only (always exit 0, output always shown)
      - id: todo-check
        name: TODO marker scan
        language: system
        entry: uv run --frozen todo
        pass_filenames: false
        always_run: true
        verbose: true

  # ── MegaLinter (manual-only) ────────────────────────────
  # Usage: uv run pre-commit run megalinter --all-files --hook-stage manual
  - repo: local
    hooks:
      - id: megalinter
        name: MegaLinter
        language: system
        entry: uv run --frozen megalint
        pass_filenames: false
        always_run: true
        stages: [manual]
