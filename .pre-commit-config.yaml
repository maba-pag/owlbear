---
# Pre-commit config — aligned with CI (MegaLinter v10)
#
# Commands:
#   uv run lint [--staged] [--no-fix | --unsafe-fix]
#                     Workspace files by default; staged files with --staged
#   uv run lint-cockpit [--staged] [--no-fix | --unsafe-fix]
#                     Cockpit frontend lint aggregate
#   uv run megalint [--no-fix | --unsafe-fix]
#                     MegaLinter only
#   uv run format [--staged] [--no-fix]
#                     Python, Biome, whitespace, and final-newline formatters
#   uv run quality [--no-fix | --unsafe-fix]
#                     Full format, lint, typecheck, and advisory checks
#
# Auto-fix on commit: Ruff, trailing-whitespace, end-of-file-fixer, and
# markdownlint.

# Exclude the same generated, archived, and third-party paths as MegaLinter
# where pre-commit's path matching can express them.
exclude: |
  (?x)(^|/)(
    [^/]*\.egg-info/
    |\.owlbear/(
      delivery/(packages|runtime)/
      |(doc|py|ts)-index\.md$
      |(legacy|memory|research|target)/
    )
    |store/(audit|knowledge)/.*\.db$
    |(
      \.benchmarks
      |\.ruff_cache
      |\.venv
      |__pycache__
      |_cache
      |artifacts
      |build
      |coverage
      |dist
      |downloads
      |htmlcov
      |node_modules
      |parts
      |playwright-report
      |scratch
      |sdist
      |test-results
      |wheels
      |worktrees
    )/
  )
repos:
  # ── General file checks ──────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        alias: trailing-whitespace-fix
        exclude: ^serve/cockpit/web/public/porsche-design-system/
      - id: end-of-file-fixer
        alias: end-of-file-fix
        exclude: ^serve/cockpit/web/public/porsche-design-system/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # ── Python (matches CI: PYTHON_RUFF + PYTHON_RUFF_FORMAT) ─
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        alias: ruff-fix
        args: [--fix]
      - id: ruff-format
        alias: ruff-format-fix
      - id: ruff
        alias: ruff-check
        name: ruff check (no fix)
        stages: [manual]
      - id: ruff-format
        alias: ruff-format-check
        name: ruff format check (no fix)
        args: [--check]
        stages: [manual]
      - id: ruff
        alias: ruff-unsafe-fix
        name: ruff check (unsafe fixes)
        args: [--fix, --unsafe-fixes]
        stages: [manual]

  # ── YAML (matches CI: YAML_YAMLLINT) ────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # ── Shell (matches CI: BASH_SHELLCHECK) ─────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # ── Actions (matches CI: ACTION_ACTIONLINT) ─────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ── Markdown (matches CI: MARKDOWN_MARKDOWNLINT) ────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        alias: markdownlint-fix
        args: [--fix]
      - id: markdownlint-cli2
        alias: markdownlint-check
        name: markdownlint-cli2 (no fix)
        stages: [manual]

  # ── EditorConfig (matches CI: EDITORCONFIG_EDITORCONFIG_CHECKER) ──
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.11.1"
    hooks:
      - id: editorconfig-checker
        args: [-disable-indent-size]
        exclude: ^serve/cockpit/web/public/porsche-design-system/

  # ── Local hooks ─────────────────────────────────────────
  - repo: local
    hooks:
      - id: biome-frontend-check
        name: Biome (Cockpit frontend and repository JSON)
        language: system
        entry: node serve/cockpit/web/scripts/run-biome-check.mjs check --write --no-errors-on-unmatched
        files: ^(serve/cockpit/web/.*\.(css|js|mjs|ts|tsx)|.*\.(json|jsonc))$
      # Frontend — extra (no CI equivalent, catches type errors early)
      # Manual stage: tsc --noEmit is a whole-project check — can't scope to
      # staged files. Run explicitly: uv run pre-commit run typecheck-frontend --all-files --hook-stage manual
      - id: typecheck-frontend
        name: TypeScript (Cockpit frontend)
        language: system
        entry: npx --prefix serve/cockpit/web tsc --noEmit --project serve/cockpit/web/tsconfig.json
        files: ^serve/cockpit/web/(src/.*\.(ts|tsx)|vite\.config\.ts|vitest\.setup\.ts)$
        pass_filenames: false
        stages: [manual]
      # Project-specific validators
      - id: validate-skills
        name: Validate Agent Skills
        language: system
        entry: uv run --frozen python .owlbear/scripts/validate_skills.py
        files: >-
          (?x)
          ^(?:share/skills|\.owlbear/skills)/[^/]+/SKILL\.md$
          |^\.owlbear/scripts/validate_skills\.py$
        pass_filenames: false
      - id: validate-agents
        name: Validate Agent Tool Names
        language: system
        entry: uv run --frozen python .owlbear/scripts/validate_agents.py
        files: >-
          (?x)
          ^(?:share/agents|\.owlbear/agents)/.*\.agent\.md$
          |^\.owlbear/hooks/.*\.py$
          |^\.owlbear/scripts/validate_agents\.py$
          |^\.vscode/mcp\.json$
          |^seed/\.vscode/mcp\.json$
          |^serve/[^/]+-mcp/.*$
        pass_filenames: false
      - id: validate-prompts
        name: Validate Agent Prompts
        language: system
        entry: uv run --frozen python .owlbear/scripts/validate_prompts.py
        files: '^(?:share|\.owlbear)/(?:agents|prompts|skills)/.*|^\.owlbear/scripts/validate_prompts\.py$'
        pass_filenames: false
      # TODO marker scan — warning only (always exit 0, output always shown)
      - id: todo-check
        name: TODO marker scan
        language: system
        entry: uv run --frozen todo
        pass_filenames: false
        always_run: true
        verbose: true

  # ── MegaLinter (manual-only) ────────────────────────────
  # Usage: uv run pre-commit run megalinter --all-files --hook-stage manual
  - repo: local
    hooks:
      - id: megalinter
        name: MegaLinter
        language: system
        entry: uv run --frozen megalint
        pass_filenames: false
        always_run: true
        stages: [manual]
