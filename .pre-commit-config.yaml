---
# Pre-commit config — aligned with CI (MegaLinter v9.5.0)
#
# Commands:
#   uv run lint       Staged files, default hooks (= git commit)
#   uv run lint-all   All files, default hooks
#   uv run megalint   Full CI parity (MegaLinter + typecheck, all files)
#   uv run eslint-fix ESLint --fix on Cockpit frontend
#
# Auto-fix on commit: ruff (lint + format), trailing-whitespace,
# end-of-file-fixer, markdownlint. Everything else is check-only.

# Exclude paths matching MegaLinter FILTER_REGEX_EXCLUDE + ADDITIONAL_EXCLUDED_DIRECTORIES.
# Keep aligned with .mega-linter.yml.
exclude: |
  (?x)^(
    \.owlbear/(briefs|doc-index\.md|kanban/(archive|decisions|tasks)|memory|research|sources)/
    |store/
    |\.egg-info/
    |coverage/
    |dist/
    |playwright-report/
  )
repos:
  # ── General file checks ──────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^serve/cockpit/web/public/porsche-design-system/
      - id: end-of-file-fixer
        exclude: ^serve/cockpit/web/public/porsche-design-system/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # ── Python (matches CI: PYTHON_RUFF + PYTHON_RUFF_FORMAT) ─
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
      - id: ruff-format

  # ── YAML (matches CI: YAML_YAMLLINT) ────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # ── Shell (matches CI: BASH_SHELLCHECK) ─────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # ── Actions (matches CI: ACTION_ACTIONLINT) ─────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ── Markdown (matches CI: MARKDOWN_MARKDOWNLINT) ────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # ── EditorConfig (matches CI: EDITORCONFIG_EDITORCONFIG_CHECKER) ──
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.6.1"
    hooks:
      - id: editorconfig-checker
        args: [-disable-indent-size]
        exclude: ^serve/cockpit/web/public/porsche-design-system/

  # ── Local hooks ─────────────────────────────────────────
  - repo: local
    hooks:
      # Frontend — matches CI: TYPESCRIPT_ES
      - id: eslint-frontend
        name: ESLint (Cockpit frontend)
        language: system
        entry: bash -c 'cd serve/cockpit/web && npx eslint src/ --max-warnings 0'
        files: ^serve/cockpit/web/src/.*\.(ts|tsx)$
        pass_filenames: false
      # Frontend — extra (no CI equivalent, catches type errors early)
      # Manual stage: tsc --noEmit is a whole-project check — can't scope to
      # staged files. Run explicitly: uv run pre-commit run typecheck-frontend --all-files --hook-stage manual
      - id: typecheck-frontend
        name: TypeScript (Cockpit frontend)
        language: system
        entry: bash -c 'cd serve/cockpit/web && npx tsc --noEmit'
        files: ^serve/cockpit/web/src/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [manual]
      # Project-specific validators
      - id: validate-skills
        name: Validate Agent Skills
        language: system
        entry: bash -c 'uv run python .owlbear/scripts/validate_skills.py share/skills/*/'
        pass_filenames: false
        always_run: true
      - id: validate-agents
        name: Validate Agent Tool Names
        language: system
        entry: uv run python .owlbear/scripts/validate_agents.py
        files: ^share/agents/.*\.agent\.md$
        pass_filenames: true
      # TODO marker scan — warning only (always exit 0, output always shown)
      - id: todo-check
        name: TODO marker scan
        language: system
        entry: uv run todo
        pass_filenames: false
        always_run: true
        verbose: true

  # ── MegaLinter (manual-only, full CI parity) ────────────
  # Usage: uv run pre-commit run megalinter --all-files --hook-stage manual
  - repo: local
    hooks:
      - id: megalinter
        name: MegaLinter (full CI parity)
        language: system
        entry: >-
          bash -c 'docker run --rm
          --platform linux/amd64
          -v "$(pwd):/tmp/lint"
          -e APPLY_FIXES=none
          -e UPDATED_SOURCES_REPORTER=false
          -e LOG_LEVEL=INFO
          -e VALIDATE_ALL_CODEBASE=true
          ghcr.io/oxsecurity/megalinter-cupcake:v9.5.0'
        pass_filenames: false
        always_run: true
        stages: [manual]
