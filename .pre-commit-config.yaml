---
# The workspace's one linter registry; CI's Static suite runs `uv run lint --no-fix`.
#
# Commands:
#   uv run lint [--staged] [--no-fix | --unsafe-fix]
#                     Workspace files by default; staged files with --staged
#   uv run format [--staged] [--no-fix]
#                     Python, Biome, whitespace, and final-newline formatters
#   uv run quality [--no-fix | --unsafe-fix]
#                     Full format, lint, and advisory checks

# Deactivated: no hook runs on commit; run them with `pre-commit run --hook-stage manual` (TD-204).
default_stages: [manual]

# Exclude generated, archived, and third-party paths.
exclude: |
  (?x)(^|/)(
    [^/]*\.egg-info/
    |\.owlbear/(
      delivery/(packages|runtime)/
      |(legacy|memory|research|target)/
    )
    |store/(audit|knowledge)/.*\.db$
    |(
      \.benchmarks
      |\.ruff_cache
      |\.venv
      |__pycache__
      |_cache
      |artifacts
      |build
      |coverage
      |dist
      |downloads
      |htmlcov
      |node_modules
      |parts
      |playwright-report
      |scratch
      |sdist
      |test-results
      |wheels
      |worktrees
    )/
  )
repos:
  # ── General file checks ──────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        alias: trailing-whitespace-fix
        stages: [manual]  # its manifest's own stages override default_stages
      - id: end-of-file-fixer
        alias: end-of-file-fix
        stages: [manual]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        stages: [manual]

  # ── Python ──────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        alias: ruff-fix
        args: [--fix]
      - id: ruff-format
        alias: ruff-format-fix
      - id: ruff
        alias: ruff-check
        name: ruff check (no fix)
        stages: [manual]
      - id: ruff-format
        alias: ruff-format-check
        name: ruff format check (no fix)
        args: [--check]
        stages: [manual]
      - id: ruff
        alias: ruff-unsafe-fix
        name: ruff check (unsafe fixes)
        args: [--fix, --unsafe-fixes]
        stages: [manual]

  # ── YAML ────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # ── GitHub Actions ──────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline, --min-severity=medium]

  # ── Markdown ────────────────────────────────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        alias: markdownlint-fix
        args: [--fix]
      - id: markdownlint-cli2
        alias: markdownlint-check
        name: markdownlint-cli2 (no fix)
        stages: [manual]

  # ── EditorConfig ────────────────────────────────────────
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.11.1"
    hooks:
      - id: editorconfig-checker
        args: [-disable-indent-size]

  # ── Local hooks ─────────────────────────────────────────
  - repo: local
    hooks:
      - id: biome-check
        name: Biome (repository JSON)
        language: unsupported
        entry: node node_modules/@biomejs/biome/bin/biome check --write --no-errors-on-unmatched
        files: \.(json|jsonc)$
      # Project-specific validators
      - id: validate-skills
        name: Validate Agent Skills
        language: unsupported
        entry: uv run --frozen python .owlbear/scripts/validate_skills.py
        files: >-
          (?x)
          ^(?:share/skills|\.owlbear/skills)/[^/]+/SKILL\.md$
          |^\.owlbear/scripts/validate_skills\.py$
        pass_filenames: false
      - id: validate-agents
        name: Validate Agent Tool Names
        language: unsupported
        entry: uv run --frozen python .owlbear/scripts/validate_agents.py
        files: >-
          (?x)
          ^(?:share/agents|\.owlbear/agents)/.*\.agent\.md$
          |^\.owlbear/scripts/validate_agents\.py$
          |^\.mcp\.json$
          |^serve/[^/]+-mcp/.*$
        pass_filenames: false
      # TODO marker scan — warning only (always exit 0, output always shown)
      - id: todo-check
        name: TODO marker scan
        language: unsupported
        entry: uv run --frozen todo
        pass_filenames: false
        always_run: true
        verbose: true
