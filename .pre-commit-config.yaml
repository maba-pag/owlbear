---
# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: eslint-frontend
        name: ESLint (Cockpit frontend)
        language: system
        entry: bash -c 'cd serve/cockpit/web && npx eslint src/ --max-warnings 0'
        files: ^serve/cockpit/web/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: typecheck-frontend
        name: TypeScript (Cockpit frontend)
        language: system
        entry: bash -c 'cd serve/cockpit/web && npx tsc --noEmit'
        files: ^serve/cockpit/web/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: validate-skills
        name: Validate Agent Skills
        language: system
        entry: python .owlbear/scripts/validate_skills.py
        pass_filenames: false
        always_run: true
      - id: validate-agents
        name: Validate Agent Tool Names
        language: system
        entry: python .owlbear/scripts/validate_agents.py
        files: ^share/agents/.*\.agent\.md$
        pass_filenames: true
