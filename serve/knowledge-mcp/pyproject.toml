[project]
name = "owlbear-knowledge-mcp"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear MCP server — knowledge operations"
dependencies = ["mcp>=2,<2.1", "owlbear-knowledge[full]"]

[tool.uv.sources]
owlbear-knowledge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_knowledge_mcp"]
