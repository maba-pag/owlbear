[project]
name = "owlbear-browser-mcp"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear MCP browser server — authenticated content fetching via Edge CDP"
dependencies = [
    "mcp>=2,<2.1",
    "owlbear-browser",
]

[tool.uv.sources]
owlbear-browser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_browser_mcp"]
