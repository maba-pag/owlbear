[project]
name = "owlbear-cockpit"
version = "0.1.0"
requires-python = ">=3.12.14"
description = "OwlBear Cockpit — FastAPI backend for the Delivery UI"
dependencies = [
  "owlbear-delivery",
  "owlbear-delivery-github",
  "owlbear-memory",
  "fastapi",
  "uvicorn",
  "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_cockpit"]

[project.scripts]
cockpit = "owlbear_cockpit.main:main"

[tool.uv.sources]
owlbear-delivery = { workspace = true }
owlbear-delivery-github = { workspace = true }
owlbear-memory = { workspace = true }
