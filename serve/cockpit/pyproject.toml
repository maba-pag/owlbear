[project]
name = "owlbear-cockpit"
version = "0.1.0"
requires-python = ">=3.12.13"
description = "OwlBear Cockpit — FastAPI backend for the kanban UI"
dependencies = [
  "owlbear-kanban",
  "fastapi",
  "uvicorn",
  "pydantic",
  "ruamel.yaml",
  "sse-starlette",
  "watchfiles",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_cockpit"]

[project.scripts]
cockpit = "owlbear_cockpit.main:run"

[tool.uv.sources]
owlbear-kanban = { workspace = true }
