[project]
name = "owlbear"
version = "0.1.0"
requires-python = ">=3.14.4"
description = "OwlBear orchestrator — core package"
dependencies = [
  "agent-client-protocol>=0.9.0,<1.0.0",
  "pydantic>=2.13.3",
  "typer>=0.25.1",
]

[project.scripts]
owlbear = "owlbear.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear", "src/owlbear_orchestrator"]
