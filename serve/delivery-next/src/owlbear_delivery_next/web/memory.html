<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Memory</title>
<meta name="owlbear-scope" content="all">
<link rel="stylesheet" href="/assets/pds/4.10.1/index.css">
<script type="module">
  import { load } from "/assets/pds/4.10.1/load.mjs";
  load();
</script>
<!-- base -->
<style>
  #page > p-text:empty { display: none !important; }
  .row { align-items: end; }
  #filters { gap: var(--p-spacing-static-sm) var(--p-spacing-static-md); }
  #filters > * { flex: 0 1 13rem; min-width: 10rem; }  /* compact: filters narrow the list, they are not the page */
  #entries { display: grid; gap: var(--p-spacing-fluid-sm); }
  .entries { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .entry {
    display: grid; gap: var(--p-spacing-static-sm); padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg);
  }
  .entry .title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-spacing-static-sm); }
  .quiet .entry { background: none; box-shadow: inset 0 0 0 1px var(--p-color-contrast-lower); }
  .said { white-space: pre-wrap; }
  fieldset { margin: 0; padding: 0; border: 0; }
  fieldset .row { align-items: center; }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Memory</h1></p-heading>
  <p-text id="shown" size="sm" color="contrast-medium" aria-live="polite"></p-text>
</header>
<div id="page"></div>
</main>
<!-- ask -->
<script type="module">
import { html, nothing, render } from "/assets/lit-html/3.3.3/lit-html.js";
import { live } from "/assets/lit-html/3.3.3/directives/live.js";
import { repeat } from "/assets/lit-html/3.3.3/directives/repeat.js";
import { call, defined, shown as projects } from "/assets/ui.mjs";

const ORDER = ["contested", "disputed", "stale", "curated", "pending", "approved", "deleted"];  // needs you first
const GROUPS = [  // who acts next on an entry in each state
  ["Needs your review", "Approve what the curator kept, or settle what agents contest.", ["contested", "disputed",
    "stale", "curated"]],
  ["Waiting for the curator", "The curator scopes these first; you can still edit or delete them.", ["pending"]],
  ["In use", "", ["approved"]],
  ["Deleted (history kept)", "", ["deleted"]],
];
const TAGS = { contested: "error", disputed: "error", stale: "warning", curated: "info", pending: "secondary",
  approved: "success", deleted: "secondary" };
const ACTIVE = "active", ANY = "any";
const DIALOG = "{ 'aria-haspopup': 'dialog' }";
// editing: the entry being edited and its draft, so what is typed lives in state, not in an element (TD-264);
// pending: the entry and action whose request is under way.
const state = { loaded: null, editing: null, pending: null, error: "", status: "" };
const filter = { state: ACTIVE, category: ANY, agent: ANY, place: ANY };
const answers = new Map();  // each read's last answer by "project id|where", kept while that project fails to answer

function show() {
  render(view(), document.getElementById("page"));
}

function notify(message = "") {
  state.error = message ? message.charAt(0).toUpperCase() + message.slice(1) : "";
  show();
}

// A button, busy while its request is under way.
function button(label, onclick, { variant, icon, aria, busy = false } = {}) {
  return html`<p-button type="button" compact="true" variant=${variant ?? nothing} icon=${icon ?? nothing}
    aria=${aria ?? nothing} .loading=${busy} @click=${onclick}>${label}</p-button>`;
}

function select(key, label, options) {
  const changed = (e) => { filter[key] = e.target.value; show(); };
  return html`<p-select label=${label} compact="true" .value=${filter[key]} @change=${changed}>
    ${options.map(([v, said]) => html`<p-select-option value=${v}>${said}</p-select-option>`)}</p-select>`;
}

// An edit field bound to the draft: typing updates the draft, and a re-render shows the draft again.
function field(key, label, multiline, max) {
  const draft = state.editing.draft, typed = (e) => { draft[key] = e.target.value ?? ""; };
  return multiline
    ? html`<p-textarea label=${label} max-length=${max} rows="5" counter="true" .value=${live(draft[key])}
        @input=${typed} @change=${typed}></p-textarea>`
    : html`<p-input-text label=${label} max-length=${max} .value=${live(draft[key])} @input=${typed}
        @change=${typed}></p-input-text>`;
}

function tick(c) {
  const chosen = state.editing.draft.categories, on = chosen.includes(c);
  const flip = (e) => {
    const checked = e.target.checked === true;
    state.editing.draft.categories = checked ? [...new Set([...chosen, c])] : chosen.filter((x) => x !== c);
    show();
  };
  return html`<p-checkbox label=${c} .checked=${live(on)} @change=${flip}></p-checkbox>`;
}

function age(iso) {
  const minutes = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (minutes < 60) return `${minutes} min ago`;
  if (minutes < 60 * 48) return `${Math.round(minutes / 60)} h ago`;
  return `${Math.round(minutes / 1440)} d ago`;
}

function busy(m, action) {
  return state.pending === `${m.key}:${action}`;
}

// One owner action, through the project that read the entry, or the one named; Global is named with ?where=global.
async function act(m, action, body = {}, of = m.place.of) {
  state.pending = `${m.key}:${action}`;
  show();
  try {
    const moves = ["make-global", "move-back"].includes(action);
    const where = m.place.where === "global" && !moves ? "?where=global" : "";
    const r = await call(`/memory/${encodeURIComponent(m.id)}/${action}${where}`,
      { body: { updated_at: m.updated_at, ...body }, timeout: 60000, of });  // a push can take a while
    state.error = "";
    state.editing = null;
    const title = `"${r.entry.title}"`, again = action === "edit" && m.state === "approved";
    const done = {
      approve: `Approved ${title}: agents in its scope can recall it.`,
      resolve: `Approved ${title} as it reads now; its challenges are cleared.`,
      edit: again ? `Saved ${title}; it needs your approval again.` : `Saved ${title}.`,
      delete: `Deleted ${title}.`,
      "make-global": `Made ${title} global: the agents of every project read it.`,
      "move-back": `Moved ${title} back to ${m.origin}: only its agents read it now.`,
    }[action];
    state.status = `${done}${r.notice ? ` ${r.notice}` : ""}`;
    state.pending = null;
    await refresh();
  } catch (e) {
    state.pending = null;
    notify(e.message);
  }
}

async function remove(m) {
  const sure = await ask({
    title: `Delete “${m.title}”?`, yes: "Delete", no: "Keep it",
    now: m.state === "pending" ? "It was never reviewed, so its file is removed."
      : "It is marked deleted and agents no longer recall it; its history stays in the folder.",
    after: "There is no restore here.",
    instead: "It stays as it is.",
  });
  if (sure) act(m, "delete");
}

async function resolve(m) {
  const sure = await ask({
    title: `Approve “${m.title}” as it reads now?`, yes: "Approve as it reads", no: "Keep it under review",
    now: `It leaves the ${m.state} state: its challenges are cleared and it counts as approved.`,
    then: "Agents in its scope can recall it again.",
    after: "Edit or delete it at any time; an edit needs your approval again.",
    instead: "It stays under review; edit it first if the text is wrong.",
  });
  if (sure) act(m, "resolve");
}

async function globalize(m) {
  const sure = await ask({
    title: `Make “${m.title}” global?`, yes: "Make global", no: `Keep it in ${m.place.label}`,
    now: `It moves from the memory of ${m.place.label} to Global memory, as it reads now.`,
    then: "The agents of every project in this shared repository read it beside their own memory.",
    after: `Edit or delete it in Global memory, or move it back to ${m.place.label}.`,
    instead: `It stays in the memory of ${m.place.label}.`,
  });
  if (sure) act(m, "make-global");
}

// The project a Global entry came from, when its folder is shown: only that project takes it back (TD-292).
function home(m) {
  if (m.place.where !== "global" || !m.origin) return null;
  return state.loaded.places.find((p) => p.where === "project" && p.repository === m.place.repository
    && p.name === m.origin) ?? null;
}

async function moveBack(m, to) {
  const sure = await ask({
    title: `Move “${m.title}” back to ${to.label}?`, yes: "Move back", no: "Keep it global",
    now: `It moves from Global memory back to the memory of ${to.label}, the project it came from, as it reads now.`,
    then: `Only the agents of ${to.label} read it; other projects no longer do.`,
    after: "Make it global again at any time.",
    instead: "It stays in Global memory.",
  });
  if (sure) act(m, "move-back", {}, to.of);
}

const PURGE_DAYS = 30;  // an entry deleted this long ago is removed
const many = (n) => `${n} deleted ${n === 1 ? "entry" : "entries"}`;

// The deleted entries old enough to remove, grouped by the place they are kept in.
function purgeable(deleted) {
  const cutoff = Date.now() - PURGE_DAYS * 86_400_000, by = new Map();
  for (const m of deleted.filter((d) => Date.parse(d.updated_at) <= cutoff)) {
    by.set(m.place.key, [...(by.get(m.place.key) ?? []), m]);
  }
  return [...by.values()];
}

async function purge(old) {
  const place = old[0].place;
  const sure = await ask({
    title: `Remove ${many(old.length)} from ${place.label}?`, yes: "Remove them", no: "Keep them",
    now: `The files of entries deleted ${PURGE_DAYS} days ago or earlier leave the folder; later ones stay.`,
    after: "The shared repository's Git history keeps them; this page cannot bring them back.",
    instead: "They stay listed as deleted.",
  });
  if (!sure) return;
  state.pending = `${place.key}:purge`;
  show();
  try {
    const r = await call(`/memory/purge${place.where === "global" ? "?where=global" : ""}`,
      { body: { min_age_days: PURGE_DAYS }, timeout: 60000, of: place.of });
    state.error = r.failed ? `${many(r.failed)} could not be removed; try again.` : "";
    state.status = `Removed ${many(r.purged)} from ${place.label}.${r.notice ? ` ${r.notice}` : ""}`;
    state.pending = null;
    await refresh();
  } catch (e) {
    state.pending = null;
    notify(e.message);
  }
}

// Every deleted entry counts, filtered or not: the purge removes all of a folder's old ones.
function purges() {
  const groups = purgeable(state.loaded.entries.filter((m) => m.state === "deleted"));
  return groups.length ? html`<div class="row">${groups.map((old) => button(
    `Remove ${many(old.length)} older than ${PURGE_DAYS} days from ${old[0].place.label}`, () => purge(old),
    { variant: "secondary", icon: "delete", aria: DIALOG, busy: state.pending === `${old[0].place.key}:purge` }))}
    </div>` : nothing;
}

function edit(m) {
  state.editing = { id: m.key, draft: { title: m.title, content: m.content, categories: [...m.categories] } };
  show();
}

function editor(m) {
  const draft = state.editing.draft;
  const save = () => {
    const title = draft.title.trim(), content = draft.content.trim();
    const categories = state.loaded.categories.filter((c) => draft.categories.includes(c));
    if (!title) return notify("Give the memory a title.");
    if (!categories.length) return notify("Choose at least one category.");
    act(m, "edit", { title, content, categories });
  };
  const changed = () => draft.title.trim() !== m.title || draft.content.trim() !== m.content
    || state.loaded.categories.some((c) => draft.categories.includes(c) !== m.categories.includes(c));
  const cancel = async () => {
    if (changed() && !(await ask({ title: "Discard your edits?", yes: "Discard", no: "Keep editing",
      now: "Your changes to this memory are lost.", instead: "You go on editing." }))) return;
    state.editing = null;
    show();
  };
  return html`${field("title", "Title", false, 200)}
    ${field("content", "Content", true, 1024)}
    <fieldset><legend>Categories</legend><div class="row">${state.loaded.categories.map(tick)}</div></fieldset>
    <div class="row">${button("Save", save, { icon: "check", busy: busy(m, "edit") })}
      ${button("Cancel", cancel, { variant: "secondary" })}</div>`;
}

// A row's actions are secondary: a list asks about many entries, so no row's answer is its section's one primary
// (D-01M63C7BJZZ7RQV9XS4XVR0DNE).
function actions(m) {
  const parts = [];
  if (m.state === "curated") {
    parts.push(button("Approve", () => act(m, "approve"), { variant: "secondary", icon: "check",
      busy: busy(m, "approve") }));
  }
  if (["contested", "disputed", "stale"].includes(m.state)) {
    parts.push(button("Resolve", () => resolve(m), { variant: "secondary", icon: "check", aria: DIALOG,
      busy: busy(m, "resolve") }));
  }
  if (m.state !== "deleted") {
    parts.push(button("Edit", () => edit(m), { variant: "secondary", icon: "edit" }),
      button("Delete", () => remove(m), { variant: "secondary", icon: "delete", aria: DIALOG,
        busy: busy(m, "delete") }));
  }
  if (m.place.where === "project" && !["pending", "deleted"].includes(m.state)) {  // Global has no curator
    parts.push(button("Make global", () => globalize(m), { variant: "secondary", icon: "globe", aria: DIALOG,
      busy: busy(m, "make-global") }));
  }
  const back = m.state !== "deleted" && home(m);
  if (back) {
    parts.push(button(`Move back to ${back.label}`, () => moveBack(m, back), { variant: "secondary",
      icon: "arrow-left", aria: DIALOG, busy: busy(m, "move-back") }));
  }
  return parts.length ? html`<div class="row">${parts}</div>` : nothing;
}

function card(m) {
  const scope = m.scope_agents.length ? m.scope_agents.map((a) => (a === "*" ? "all agents" : a)).join(", ")
    : "no agent yet";
  const meta = `From ${m.source_agent} · for ${scope} · confidence ${m.confidence} · updated ${age(m.updated_at)}`;
  const advice = m.state === "pending" && m.recommended  // the saver's recommendation; the curator decides (TD-293)
    ? ` · recommended for ${m.recommended === "global" ? "Global" : "this project"}` : "";
  return html`<li class="entry">
    <div class="title"><p-text weight="semibold">${m.title}</p-text>
      <p-tag variant=${TAGS[m.state]} compact="true">${m.state}</p-tag>
      <p-tag class="place" compact="true">${m.place.label}</p-tag>
      ${m.categories.map((c) => html`<p-tag compact="true">${c}</p-tag>`)}</div>
    <p-text size="xs" color="contrast-medium">${meta}${advice}</p-text>
    ${state.editing?.id === m.key ? editor(m) : html`<p-text class="said" size="sm">${m.content}</p-text>${actions(m)}`}
  </li>`;
}

function matches(m) {
  const own = filter.state === ANY || (filter.state === ACTIVE ? m.state !== "deleted" : m.state === filter.state);
  const category = filter.category === ANY || m.categories.includes(filter.category);
  const agent = filter.agent === ANY || m.scope_agents.includes("*") || m.scope_agents.includes(filter.agent);
  return own && category && agent && (filter.place === ANY || m.place.key === filter.place);
}

// The filter choices the loaded entries offer; a choice no longer offered falls back to Any before anything is shown.
function choices() {
  const loaded = state.loaded;
  const agents = [...new Set(loaded.entries.flatMap((m) => m.scope_agents).filter((a) => a !== "*"))].sort();
  const parts = [
    ["state", "State", [[ACTIVE, "All but deleted"], [ANY, "All"], ...loaded.states.map((s) => [s, s])]],
    ["category", "Category", [[ANY, "Any"], ...loaded.categories.map((c) => [c, c])]],
    ["agent", "Agent", [[ANY, "Any"], ...agents.map((a) => [a, a])]],
    ["place", "Kept in", [[ANY, "Anywhere"], ...loaded.places.map((p) => [p.key, p.label])]],
  ];
  for (const [key, , options] of parts) if (!options.some(([v]) => v === filter[key])) filter[key] = ANY;
  return parts;
}

function entries(shown) {
  const sections = GROUPS.map(([title, hint, states]) => {
    const mine = shown.filter((m) => states.includes(m.state));
    if (!mine.length) return nothing;
    return html`<section class=${states.includes("deleted") ? "quiet" : ""}>
      <div><p-heading size="lg"><h2>${title} (${mine.length})</h2></p-heading>${hint ? html`<p-text>${hint}</p-text>`
        : nothing}${states.includes("deleted") ? purges() : nothing}</div>
      <ul class="entries">${repeat(mine, (m) => m.key, card)}</ul></section>`;
  });
  const empty = state.loaded.entries.length ? "No memory matches these filters."
    : "Agents have not remembered anything yet.";
  return shown.length ? sections : html`<p-text color="contrast-medium" class="empty">${empty}</p-text>`;
}

function view() {
  const loaded = state.loaded, available = loaded?.available;
  const parts = available ? choices() : [];
  const shown = available ? loaded.entries.filter(matches).sort((a, b) => ORDER.indexOf(a.state)
    - ORDER.indexOf(b.state) || b.updated_at.localeCompare(a.updated_at)) : [];
  document.getElementById("shown").textContent = available ? `${shown.length} of ${loaded.entries.length} shown` : "";
  const errors = loaded?.parse_errors ? ` ${loaded.parse_errors} file(s) could not be read.` : "";
  return html`
    <p-inline-notification id="error" state="error" dismiss-button="false" ?hidden=${!state.error}>${state.error}
    </p-inline-notification>
    <p-inline-notification id="unavailable" state="info" heading="No shared repository" heading-tag="h2"
      dismiss-button="false" ?hidden=${!loaded || available}>${loaded && !available ? `${loaded.reason}.` : ""}
    </p-inline-notification>
    <p-text id="status" role="status" aria-live="polite">${state.status}</p-text>
    ${available ? html`<section id="filters" class="row" aria-label="Filters">
      ${parts.map(([key, label, options]) => select(key, label, options))}</section>` : nothing}
    ${available ? html`<div id="entries">${entries(shown)}</div>` : nothing}
    ${available ? html`<p-text id="where" size="xs" color="contrast-medium"
      title=${loaded.places.map((p) => p.folder).join("\n")}>Kept in
      ${loaded.places.map((p) => p.folder.split("/").slice(-2).join("/")).join(", ")} of the shared
      repository.${errors}</p-text>` : nothing}`;
}

// What the page reads (TD-241): each shown project's memory and its shared repository's Global memory, each
// through that project's own route; without a machine host, this host's project and Global.
function sources() {
  return (projects() ?? [{ id: "", name: "" }]).flatMap(({ id, name }) => [{ of: id, name, where: "project" },
    { of: id, name, where: "global" }]);
}

// The answers as one list: each shared folder once (twin clones share one), Global once per shared repository;
// an entry keeps its place, so an action goes through the project that read it. A project that failed this time
// stands for its folder only when no other project read it now.
function gather(wanted, fresher) {
  const places = new Map(), entries = [], said = wanted.map((s) => answers.get(`${s.of}|${s.where}`));
  let errors = 0;
  const fresh = (i) => (fresher.has(`${wanted[i].of}|${wanted[i].where}`) ? 0 : 1);
  [...wanted.keys()].sort((i, j) => fresh(i) - fresh(j)).forEach((i) => {  // this refresh's answers before older ones
    const s = wanted[i], a = said[i];
    const key = a?.available && `${a.repository}#${s.where === "global" ? "" : a.project}`;
    if (!key || places.has(key)) return;
    const place = { key, of: s.of, where: s.where, folder: a.folder, repository: a.repository,
      name: s.where === "global" ? "Global" : a.project };
    places.set(key, place);
    errors += a.parse_errors;
    entries.push(...a.entries.map((m) => ({ ...m, key: `${key}/${m.id}`, place })));
  });
  const shape = said.find((a) => a?.available), first = said.find(Boolean);
  if (!first) return null;
  const several = new Set([...places.values()].map((p) => p.repository)).size > 1;
  for (const p of places.values()) p.label = several ? `${p.name} (${p.repository.split("/").pop()})` : p.name;
  return { available: Boolean(shape), reason: first.reason, entries, parse_errors: errors,
    states: shape?.states ?? [], categories: shape?.categories ?? [], places: [...places.values()] };
}

async function refresh() {
  const wanted = sources();
  const got = await Promise.allSettled(wanted.map((s) => call(s.where === "global" ? "/memory?where=global"
    : "/memory", { of: s.of })));
  const failing = new Set(), fresher = new Set();
  got.forEach((r, i) => {
    const key = `${wanted[i].of}|${wanted[i].where}`;
    if (r.status === "fulfilled") {
      answers.set(key, r.value);
      fresher.add(key);
    } else failing.add(`${wanted[i].name ? `${wanted[i].name}: ` : ""}${r.reason.message}`);
  });
  state.loaded = gather(wanted, fresher);
  state.error = failing.size ? [...failing].join(" ") : "";
  show();
}

await defined(["p-select", "p-button", "p-checkbox", "p-input-text", "p-textarea"]);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !state.editing) refresh(); });
refresh();
</script>
</body>
</html>
