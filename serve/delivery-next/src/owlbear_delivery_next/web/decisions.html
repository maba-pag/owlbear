<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Decisions</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  #page > p-text:empty { display: none !important; }
  .row { align-items: end; }
  #filters > * { flex: 1 1 11rem; }
  .entries { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .entry, .queued {
    display: grid; gap: var(--p-spacing-static-sm); padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg);
  }
  :is(.entry, .queued) .title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-spacing-static-sm); }
  :is(.entry, .queued) :is(.title, li, dd) { overflow-wrap: anywhere; }
  :is(.entry, .queued) :is(.detail, .form) { display: grid; gap: var(--p-spacing-static-md); min-width: 0; }
  :is(.entry, .queued) .detail {
    padding-top: var(--p-spacing-static-sm); border-top: 1px solid var(--p-color-contrast-lower);
  }
  dl.facts {
    display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--p-spacing-static-xs)
    var(--p-spacing-static-md); margin: 0; font-size: var(--p-typescale-sm);
  }
  dl.facts dt { font-weight: 600; }
  dl.facts dd { margin: 0; }
  .said { white-space: pre-wrap; }
  #queue { display: grid; gap: var(--p-spacing-static-sm); }
  #queue .why { overflow-wrap: anywhere; }
  #receipts { padding: var(--p-spacing-static-sm) var(--p-spacing-static-md); background: var(--p-color-surface);
    border-radius: var(--p-radius-lg); }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Decisions</h1></p-heading>
  <p-text id="shown" size="sm" color="contrast-medium" aria-live="polite"></p-text>
</header>
<div id="page"></div>
</main>
<!-- ask -->
<script type="module" src="/assets/page/decisions/main.mjs"></script>
</body>
</html>
