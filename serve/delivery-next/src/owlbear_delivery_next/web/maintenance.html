<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Maintenance</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  main > p-text:empty { display: none !important; }
  .actions { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .action {
    display: grid; gap: var(--p-spacing-static-xs); padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg);
  }
  .action .title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-spacing-static-sm); }
  .action a { font-size: var(--p-typescale-sm); color: inherit; }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Maintenance</h1></p-heading>
</header>
<p id="offline" role="status" hidden>The Porsche Design System did not load from cdn.ui.porsche.com, so the page
  uses plain controls. Reload to try again.</p>
<p-inline-notification id="error" state="error" dismiss-button="false" hidden></p-inline-notification>
<p-text id="status" role="status" aria-live="polite"></p-text>
<section aria-labelledby="actions-title">
  <p-heading size="lg"><h2 id="actions-title">Maintenance actions</h2></p-heading>
  <ul id="actions" class="actions"></ul>
</section>
</main>
<script>
"use strict";
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("token")) {
  sessionStorage.setItem("token", hash.get("token"));
  history.replaceState(null, "", location.pathname);
}
const token = sessionStorage.getItem("token");
const RESULTS = { passed: "success", "up-to-date": "success", failed: "error", running: "info" };

function el(tag, text, attrs = {}) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
}

function notify(message = "") {
  const error = document.getElementById("error");
  error.textContent = message ? message.charAt(0).toUpperCase() + message.slice(1) : "";
  error.hidden = !message;
}

async function call(path) {
  if (!token) throw new Error("Open the URL the host printed, including #token=…");
  let response;
  try {
    response = await fetch(`/api/next${path}`,
      { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(15000) });
  } catch {
    throw new Error("Delivery is not running. Start it, then reload this page.");
  }
  if (response.status === 401) {
    throw new Error("Delivery restarted at a new address. Open the link from chat or owlbear-next status.");
  }
  const data = await response.json().catch(() => null);
  if (!response.ok || data === null) throw new Error(data?.detail || `Delivery answered ${response.status}`);
  return data;
}

// The last run in words, so its state never rests on the tag's colour alone.
function lastRun(a) {
  if (!a.built) return [el("p-tag", "not built yet", { variant: "secondary", compact: "true" })];
  if (!a.recorded) return [el("p-text", "No run record kept.", { size: "xs", color: "contrast-medium" })];
  if (!a.last) return [el("p-text", "Never run.", { size: "sm" })];
  const at = a.last.ended_at || a.last.started_at;
  const when = at ? `, ${new Date(at).toLocaleString()}` : "";
  const said = [el("p-text", `Last run: ${a.last.state}${when}`, { size: "sm" })];
  if (RESULTS[a.last.state]) said.push(el("p-tag", a.last.state, { variant: RESULTS[a.last.state], compact: "true" }));
  if (a.last.reason) said.push(el("p-text", a.last.reason, { size: "xs", color: "contrast-medium" }));
  return said;
}

function render(actions) {
  document.getElementById("actions").replaceChildren(...actions.map((a) => {
    const item = el("li", undefined, { class: "action" }), title = el("div", undefined, { class: "title" });
    const head = el("p-heading", undefined, { size: "md" });
    head.append(el("h3", a.name));
    title.append(head, el("p-text", `in ${a.where}`, { size: "sm", color: "contrast-medium" }));
    item.append(title, el("p-text", a.note, { size: "sm" }));
    if (a.href) item.append(el("a", `Open ${a.name} in ${a.where}`, { href: a.href }));
    const last = el("div", undefined, { class: "title" });
    last.append(...lastRun(a));
    item.append(last);
    return item;
  }));
}

async function refresh() {
  try {
    render(await call("/maintenance"));
    notify();
  } catch (e) {
    notify(e.message);
  }
}

async function start() {
  const ready = customElements.whenDefined("p-heading").then(() => true);
  const pds = await Promise.race([ready, new Promise((resolve) => setTimeout(resolve, 3000, false))]);
  if (!pds) {
    document.documentElement.classList.add("no-pds");
    document.getElementById("offline").hidden = false;
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  refresh();
}

start();
</script>
</body>
</html>
