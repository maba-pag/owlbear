<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Maintenance</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  #page > p-text:empty { display: none !important; }
  .actions { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .action {
    display: grid; gap: var(--p-spacing-static-xs); padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg);
  }
  .action .title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-spacing-static-sm); }
  .action a { font-size: var(--p-typescale-sm); color: inherit; }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Maintenance</h1></p-heading>
</header>
<div id="page"></div>
</main>
<script type="module">
import { html, nothing, render } from "/assets/lit-html/3.3.3/lit-html.js";
import { call, designSystem } from "/assets/ui.mjs";

const RESULTS = { passed: "success", "up-to-date": "success", failed: "error", running: "info" };
const state = { pds: true, actions: [], error: "" };

// The last run in words, so its state never rests on the tag's colour alone.
function lastRun(a) {
  if (!a.built) return html`<p-tag variant="secondary" compact="true">not built yet</p-tag>`;
  if (!a.recorded) return html`<p-text size="xs" color="contrast-medium">No run record kept.</p-text>`;
  if (!a.last) return html`<p-text size="sm">Never run.</p-text>`;
  const at = a.last.ended_at || a.last.started_at;
  const when = at ? `, ${new Date(at).toLocaleString()}` : "";
  const tag = RESULTS[a.last.state];
  return html`<p-text size="sm">Last run: ${a.last.state}${when}</p-text>
    ${tag ? html`<p-tag variant=${tag} compact="true">${a.last.state}</p-tag>` : nothing}
    ${a.last.reason ? html`<p-text size="xs" color="contrast-medium">${a.last.reason}</p-text>` : nothing}`;
}

function action(a) {
  return html`<li class="action">
    <div class="title">
      <p-heading size="md"><h3>${a.name}</h3></p-heading>
      <p-text size="sm" color="contrast-medium">in ${a.where}</p-text>
    </div>
    <p-text size="sm">${a.note}</p-text>
    ${a.href ? html`<a href=${a.href}>Open ${a.name} in ${a.where}</a>` : nothing}
    <div class="title">${lastRun(a)}</div>
  </li>`;
}

function view() {
  const error = state.error ? state.error.charAt(0).toUpperCase() + state.error.slice(1) : "";
  return html`
    <p id="offline" role="status" ?hidden=${state.pds}>The Porsche Design System did not load from cdn.ui.porsche.com,
      so the page uses plain controls. Reload to try again.</p>
    <p-inline-notification id="error" state="error" dismiss-button="false" ?hidden=${!error}>${error}
    </p-inline-notification>
    <p-text id="status" role="status" aria-live="polite"></p-text>
    <section aria-labelledby="actions-title">
      <p-heading size="lg"><h2 id="actions-title">Maintenance actions</h2></p-heading>
      <ul id="actions" class="actions">${state.actions.map(action)}</ul>
    </section>`;
}

function show() {
  render(view(), document.getElementById("page"));
}

async function refresh() {
  try {
    state.actions = await call("/maintenance", { timeout: 15000 });
    state.error = "";
  } catch (e) {
    state.error = e.message;
  }
  show();
}

show();
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
state.pds = await designSystem();
show();
</script>
</body>
</html>
