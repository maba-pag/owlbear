<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The OwlBear section is the machine's: the page opens without a project, its project parts then wait for one. -->
<meta name="owlbear-scope" content="all">
<title>OwlBear Delivery · Maintenance</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  #page > p-text:empty { display: none !important; }
  .actions { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .action {
    display: grid; gap: var(--p-spacing-static-xs); padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg);
  }
  .action .title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-spacing-static-sm); }
  .action a { font-size: var(--p-typescale-sm); color: inherit; }
  #use p-table-cell:nth-child(n+2):nth-child(-n+5) { text-align: end; font-variant-numeric: tabular-nums; }
  #tests { display: grid; gap: var(--p-spacing-static-xs); }
  #tests fieldset { display: grid; gap: var(--p-spacing-static-xs); margin: 0; padding: 0; border: 0; }
  #owlbear .row { align-items: center; }
  #pack-stages { display: grid; gap: var(--p-spacing-static-xs); margin: 0; padding-inline-start: 1.5rem; }
  #pack-stages li > * { display: inline-block; vertical-align: middle; margin-inline-end: var(--p-spacing-static-xs); }
  #pack-log { margin: 0; white-space: pre-wrap; font-size: var(--p-typescale-xs); }
  .pack-question { display: grid; gap: var(--p-spacing-static-sm); margin-block: var(--p-spacing-static-md);
    padding-block-start: var(--p-spacing-static-sm); border-block-start: 1px solid var(--p-color-contrast-low); }
  .pack-discard { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-spacing-static-sm);
    margin-block-start: var(--p-spacing-static-lg); padding-block-start: var(--p-spacing-static-md);
    border-block-start: 1px solid var(--p-color-contrast-low); }
  .pack-diff { margin: 0; max-block-size: 24rem; overflow: auto; white-space: pre; font-size: var(--p-typescale-xs); }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Maintenance</h1></p-heading>
</header>
<div id="page"></div>
</main>
<!-- ask -->
<script type="module">
import { html, nothing, render } from "/assets/lit-html/3.3.3/lit-html.js";
import { call, defined, here, project, shown } from "/assets/ui.mjs";
import { follow, owlbearSection, readOwlbear } from "/assets/page/maintenance/owlbear.mjs";

// Under the machine host with no project chosen, only the machine's parts show: the project's wait for one.
const none = shown() !== null && !project;

const RESULTS = { passed: "success", "up-to-date": "success", failed: "error", running: "info" };
const state = {
  actions: [], use: [], error: "", tests: null, skipped: new Set(), starting: false, curation: null,
  curating: "", unread: { tests: "", curation: "", sessions: "" },
  refused: { tests: "", curation: new Map() }, reading: 0,
  sessions: null, confirmed: new Set(), recovering: "", refusedRecover: new Map() };

// The last run in words, so its state never rests on the tag's colour alone.
function lastRun(a) {
  if (!a.built) return html`<p-tag variant="secondary" compact="true">not built yet</p-tag>`;
  if (!a.recorded) return html`<p-text size="xs" color="contrast-medium">No run record kept.</p-text>`;
  if (!a.last) return html`<p-text size="sm">Never run.</p-text>`;
  const at = a.last.ended_at || a.last.started_at;
  const when = at ? `, ${new Date(at).toLocaleString()}` : "";
  const tag = RESULTS[a.last.state];
  return html`<p-text size="sm">Last run: ${a.last.state}${when}</p-text>
    ${tag ? html`<p-tag variant=${tag} compact="true">${a.last.state}</p-tag>` : nothing}
    ${a.last.reason ? html`<p-text size="xs" color="contrast-medium">${a.last.reason}</p-text>` : nothing}`;
}

function action(a) {
  return html`<li class="action">
    <div class="title">
      <p-heading size="md"><h3>${a.name}</h3></p-heading>
      <p-text size="sm" color="contrast-medium">in ${a.where}</p-text>
    </div>
    <p-text size="sm">${a.note}</p-text>
    ${a.href && !a.href.startsWith("#") ? html`<a href=${here({}, a.href)}>Open ${a.name} in ${a.where}</a>` : nothing}
    ${a.href === "#owlbear" ? html`<a href="#owlbear">Go to the OwlBear section</a>` : nothing}
    ${a.href === "#tests" ? testsPart() : nothing}
    <div class="title">${lastRun(a)}</div>
  </li>`;
}

// TD-370, TD-390: the packages whose tests are reviewed, all chosen; the Start, once confirmed, approves the review.
function chosen() {
  return (state.tests?.packages ?? []).filter((p) => !state.skipped.has(p.path));
}

function pick(path, on) {
  if (on) state.skipped.delete(path);
  else state.skipped.add(path);
  show();
}

function box(p) {
  const label = `${p.path === "." ? "the repository's root" : p.path}: ${p.files} files, ${p.lines} lines, `
    + `${p.shares} share${p.shares === 1 ? "" : "s"}`;
  const on = !state.skipped.has(p.path), flip = (e) => pick(p.path, e.target.checked === true);
  return html`<p-checkbox label=${label} .checked=${on} ?disabled=${state.starting} @change=${flip}></p-checkbox>`;
}

function runs() {
  const t = state.tests, r = t.roles["test-reviewer"], c = t.roles["test-curator"];
  const shares = chosen().reduce((n, p) => n + p.shares, 0);
  return `${shares} reviewer session${shares === 1 ? "" : "s"} on ${r.model} at ${r.effort} effort, at most `
    + `${t.sessions} at once in this project; then the curator on ${c.model} at ${c.effort} effort with `
    + `${c.context} context, and the reviews of its edits.`;
}

function testsPart() {
  return html`<div id="tests">${refusal("tests")}${readError("tests")}${testsBody()}</div>`;
}

function testsBody() {
  const t = state.tests;
  if (!t) return state.unread.tests ? nothing : html`<p-text size="sm">Reading the project's tests…</p-text>`;
  if (t.problem) return html`<p-text size="sm">${t.problem}</p-text>`;
  if (t.open) {
    return html`<p-text size="sm">Test review ${t.open.handle} has not finished; follow it on the
      <a href=${here({}, "/")}>Changes page</a>.</p-text>`;
  }
  if (!t.packages.length) return html`<p-text size="sm">No test files found on the target branch.</p-text>`;
  return html`<fieldset><legend><p-text size="sm" weight="semibold">Packages to review</p-text></legend>
      ${t.packages.map(box)}</fieldset>
    <p-text id="tests-runs" size="sm">${runs()}</p-text>
    <div><p-button id="tests-start" type="button" compact="true" .loading=${state.starting}
      ?disabled=${!chosen().length} @click=${startReview}>Review tests</p-button></div>`;
}

async function startReview() {
  const packages = chosen().map((p) => p.path);
  const sure = await ask({
    title: "Review the tests?", yes: "Start the test review", no: "Cancel",
    now: "Delivery opens a Change with a fixed brief and plan, which your Start approves. Reviewers judge each "
      + "share of these packages' tests at the target branch's head, read-only:",
    items: packages,
    then: `${runs()} The curator applies only the retire and merge verdicts that hold, measures the suite before `
      + "and after, and its edits go through review, a pull request and CI before they merge. Each session uses "
      + "AI credits.",
    after: "It is a Change like any other: while Delivery is paused its steps wait for Resume. Pause or abandon it on "
      + "the Changes page at any step until it merges.",
    instead: "Nothing starts.",
  });
  if (!sure) return;
  state.starting = true;
  show();
  try {
    const started = await call("/maintenance/test-review", { body: { packages }, timeout: 30000 });
    document.getElementById("status").textContent = `Started test review ${started.handle}; it runs on the `
      + "Changes page.";
    state.refused.tests = "";
  } catch (e) {
    state.refused.tests = e.message;
  } finally {
    state.starting = false;
    show();
    await refresh();
  }
}

// TD-376: one row per agent, from the steps this project's Changes keep; credits unknown are counted apart.
function useRow(u) {
  const agents = Object.entries(u.agents).map(([name, n]) => `${name} ${n}`).join(", ") || "none";
  const credits = `${u.credits.toFixed(2)}${u.unknown ? ` (${u.unknown} unknown)` : ""}`;
  return html`<p-table-row><p-table-cell>${u.role}</p-table-cell><p-table-cell>${u.steps}</p-table-cell>
    <p-table-cell>${u.with}</p-table-cell><p-table-cell>${u.runs}</p-table-cell><p-table-cell>${credits}</p-table-cell>
    <p-table-cell>${agents}</p-table-cell></p-table-row>`;
}

function useSection() {
  const heads = ["Agent", "Steps", "Steps with subagents", "Subagents", "Their credits", "Which"];
  return html`<section aria-labelledby="use-title">
    <p-heading size="lg"><h2 id="use-title">Subagent use per agent</h2></p-heading>
    <p-text size="sm">Built-in subagents the agents started in this project's Change steps, switched per agent in
      Settings; their credits are part of each step's own. A design pack update keeps no session record.</p-text>
    ${state.use.length ? html`<p-table id="use" caption="Subagent use per agent"><p-table-head><p-table-head-row>
      ${heads.map((h) => html`<p-table-head-cell>${h}</p-table-head-cell>`)}</p-table-head-row></p-table-head>
      <p-table-body>${state.use.map(useRow)}</p-table-body></p-table>`
      : html`<p-text id="use-none" size="sm">No step has run in this project yet.</p-text>`}
  </section>`;
}

// Item 5 slice 4: each memory folder's last automatic curation; the button runs one now, also while paused.
function folderRun(f) {
  const at = f.ended_at || f.started_at, when = at ? `, ${new Date(at).toLocaleString()}` : "";
  const said = f.state === "never" ? "Never curated." : `Last run: ${f.state}${when}`;
  const skipped = f.entries.filter((e) => e.action === "skipped");
  return html`<li class="action">
    <div class="title"><p-heading size="md"><h3>${f.folder}</h3></p-heading>
      <p-button type="button" compact="true" variant="secondary" .loading=${state.curating === f.folder}
        ?disabled=${["waiting", "running"].includes(f.state)} @click=${() => curate(f.folder)}
        aria=${`{"aria-label": "Curate ${f.folder} now"}`}>Curate now</p-button></div>
    <p-text size="sm">${said}</p-text>
    ${f.summary ? html`<p-text size="sm">${f.summary}</p-text>` : nothing}
    ${f.reason ? html`<p-text size="xs" color="contrast-medium">${f.reason}</p-text>` : nothing}
    ${skipped.length ? html`<p-text size="xs">Left for you: ${skipped.map((e) => `${e.entry_id.slice(0, 8)} (${
      e.confidence}%${e.reason ? `: ${e.reason}` : ""})`).join("; ")}</p-text>` : nothing}
  </li>`;
}

function curationSection() {
  const c = state.curation;
  if (!c && !state.unread.curation && !state.refused.curation.size) return nothing;
  return html`<section aria-labelledby="curation-title">
    <p-heading size="lg"><h2 id="curation-title">Memory curation</h2></p-heading>
    <p-text size="sm">The memory curator judges each folder's pending entries: alone at or above your threshold
      (Settings, Memory curation), and leaves the rest for you on the Memory page. It runs after a merge and when
      OwlBear is idle, for folders with entries no run has seen, as each trigger's setting in Settings → This machine
      says: off, on, or on even while paused. Each run is one agent session.</p-text>
    ${refusal("curation")}${readError("curation")}
    ${c?.available ? html`<ul id="curation" class="actions">${c.folders.map(folderRun)}</ul>
      <div><p-button id="curate-all" type="button" compact="true" .loading=${state.curating === "all"}
        @click=${() => curate("all")}>Curate all now</p-button></div>`
      : c ? html`<p-text id="curation-none" size="sm">${sentence(c.reason)}.</p-text>` : nothing}
  </section>`;
}

async function curate(folder) {
  const which = folder === "all" ? "every memory folder, one after the other" : folder;
  const sure = await ask({
    title: `Curate ${folder === "all" ? "all memory" : folder} now?`, yes: "Curate now", no: "Cancel",
    now: `The memory curator judges the pending entries of ${which}, with Global memory beside them.`,
    then: "At or above your threshold it promotes, prunes or makes global alone; it leaves the rest as they are and "
      + "reports them here. It runs now, also while Delivery is paused, and uses AI credits.",
    after: "Approve, edit or move its results on the Memory page.",
    instead: "Nothing starts.",
  });
  if (!sure) return;
  state.curating = folder;
  show();
  try {
    await call("/curation", { machine: true, body: { folder }, timeout: 30000 });
    document.getElementById("status").textContent = `Curating ${folder === "all" ? "every memory folder" : folder}; `
      + "this page shows each report when it ends.";
    if (folder === "all") state.refused.curation.clear();
    else state.refused.curation.delete(folder);
  } catch (e) {
    state.refused.curation.set(folder, e.message);
  } finally {
    state.curating = "";
    show();
    await refresh();
  }
}

// Held sessions keep their slot, workspace and history until the owner confirms a reboot since they failed.
function sessionsSection() {
  const s = state.sessions;
  if (!s && !state.unread.sessions) return nothing;
  const held = (s?.sessions ?? []).filter((x) => x.state === "held");
  return html`<section aria-labelledby="sessions-title">
    <p-heading size="lg"><h2 id="sessions-title">Held maintenance sessions</h2></p-heading>
    <p-text size="sm">A session whose outcome is unknown keeps its slot until you confirm that the computer rebooted
      since it failed. Its workspace and history stay for inspection.</p-text>
    ${state.unread.sessions ? html`<p-inline-notification id="sessions-error" state="error" dismiss-button="false">
      Could not read the held sessions: ${state.unread.sessions}.</p-inline-notification>` : nothing}
    ${held.length ? html`<ul id="sessions" class="actions">${held.map(sessionRow)}</ul>`
      : s ? html`<p-text id="sessions-none" size="sm">No maintenance session is held.</p-text>` : nothing}
    ${[...state.refusedRecover].filter(([id]) => !held.some((x) => x.id === id)).map(([, text]) => html`
      <p-inline-notification state="error" dismiss-button="false">${sentence(text)}</p-inline-notification>`)}
  </section>`;
}

function sessionRow(x) {
  const id = x.id;  // the captured identity: a recovery names this session, not whatever the list shows next
  const refused = state.refusedRecover.get(id);
  return html`<li class="action">
    <div class="title"><p-text size="sm" weight="semibold">${x.project}: ${x.kind}</p-text></div>
    <p-text size="xs" color="contrast-medium">Started ${new Date(x.started_at).toLocaleString()}; its workspace
      ${x.workspace} is kept.</p-text>
    ${x.reason ? html`<p-text size="sm">${sentence(x.reason)}.</p-text>` : nothing}
    ${x.recoverable ? html`
      <p-checkbox label="The computer has rebooted since this session failed" .checked=${state.confirmed.has(id)}
        ?disabled=${state.recovering} @change=${(e) => confirmReboot(id, e.target.checked)}></p-checkbox>
      <div><p-button type="button" compact="true" variant="secondary" ?disabled=${!state.confirmed.has(id)
        || state.recovering} .loading=${state.recovering === id}
        @click=${() => recover(id)}>Release this session</p-button></div>`
      : html`<p-text size="xs">A reboot since it failed is needed before it can be released.</p-text>`}
    ${refused ? html`<p-inline-notification state="error"
      dismiss-button="false">${sentence(refused)}</p-inline-notification>`
      : nothing}
  </li>`;
}

function confirmReboot(id, on) {
  if (on) state.confirmed.add(id);
  else state.confirmed.delete(id);
  show();
}

async function recover(id) {
  const sure = await window.ask({
    title: "Release this maintenance session?", yes: "Release", no: "Cancel",
    now: "The computer rebooted since this session failed, and its outcome is unknown.",
    then: "Its slot is released; its workspace and history are kept for inspection.",
    after: "Work that waited for this slot may now start.",
    instead: "Nothing changes.",
  });
  if (!sure) return;
  state.recovering = id;
  state.refusedRecover.delete(id);
  show();
  try {
    await call(`/maintenance/sessions/${encodeURIComponent(id)}/recover`, {
      machine: true, body: { rebooted: true }, timeout: 15000,
    });
    state.confirmed.delete(id);
  } catch (e) {
    state.refusedRecover.set(id, e.message);
  } finally {
    state.recovering = "";
    show();
    await refresh();
  }
}

function sentence(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function refusal(kind) {
  const errors = kind === "curation" ? [...state.refused.curation]
    : state.refused.tests ? [["tests", state.refused.tests]] : [];
  if (!errors.length) return nothing;
  return html`<div id="${kind}-refused">${errors.map(([key, message]) => html`
    <p-inline-notification state="error" dismiss-button="false">
      ${kind === "curation" ? `${key}: ` : ""}${sentence(message)}
    </p-inline-notification>
    <p-button type="button" compact="true" variant="secondary" @click=${() => {
      if (kind === "curation") state.refused.curation.delete(key);
      else state.refused.tests = "";
      show();
    }}>Dismiss</p-button>`)}</div>`;
}

function readError(kind) {
  if (!state.unread[kind]) return nothing;
  const what = kind === "curation" ? "memory curation" : "the project's tests";
  return html`<p-inline-notification id="${kind}-error" state="error" dismiss-button="false">
    Could not read ${what}: ${state.unread[kind]}.
    ${state[kind] ? "The last successful result remains below." : ""}
    </p-inline-notification>
    <p-button id="${kind}-retry" type="button" compact="true" variant="secondary"
      @click=${refresh}>Try again</p-button>`;
}

function view() {
  const error = state.error ? sentence(state.error) : "";
  return html`
    <p-inline-notification id="error" state="error" dismiss-button="false" ?hidden=${!error}>${error}
    </p-inline-notification>
    <p-text id="status" role="status" aria-live="polite"></p-text>
    ${none ? html`<p-text id="no-project" size="sm">Choose a project above for its maintenance actions, test review
      and subagent use. The OwlBear section below is the machine's, the same in every project.</p-text>` : html`
    <section aria-labelledby="actions-title">
      <p-heading size="lg"><h2 id="actions-title">Maintenance actions</h2></p-heading>
      <ul id="actions" class="actions">${state.actions.map(action)}</ul>
    </section>`}
    ${owlbearSection()}
    ${curationSection()}
    ${sessionsSection()}
    ${none ? nothing : useSection()}`;
}

function show() {
  render(view(), document.getElementById("page"));
}

async function refresh() {
  const generation = ++state.reading;
  readOwlbear();
  // Keep the established read order, collecting failures without losing another section's data.
  const idle = Promise.resolve([[], []]);
  const [overview] = await Promise.allSettled([
    none ? idle : Promise.all([
      call("/maintenance", { timeout: 15000 }), call("/maintenance/subagents", { timeout: 15000 }),
    ]),
  ]);
  const [tests] = await Promise.allSettled([
    none ? Promise.resolve(null) : call("/maintenance/test-review", { timeout: 30000 }),
  ]);
  const [curation] = await Promise.allSettled([
    call("/curation", { machine: true, timeout: 15000 }),
  ]);
  if (generation !== state.reading) return;
  if (overview.status === "fulfilled") {
    [state.actions, state.use] = overview.value;
    state.error = "";
  } else {
    state.error = overview.reason.message;
  }
  if (tests.status === "fulfilled") {
    state.tests = tests.value;
    state.unread.tests = "";
  } else {
    state.unread.tests = tests.reason.message;
  }
  if (curation.status === "fulfilled") {
    state.curation = curation.value;
    state.unread.curation = "";
  } else {
    // Only a missing route before any successful read is expected clone-host capability absence.
    state.unread.curation = curation.reason.status === 404 && !state.curation ? "" : curation.reason.message;
  }
  const [sessions] = await Promise.allSettled([
    call("/maintenance/sessions", { machine: true, timeout: 15000 }),
  ]);
  if (generation !== state.reading) return;
  if (sessions.status === "fulfilled") {
    state.sessions = sessions.value;
    state.unread.sessions = "";
  } else {
    // A clone host has no maintenance sessions route; that is an absence, not a read failure.
    state.unread.sessions = sessions.reason.status === 404 && !state.sessions ? "" : sessions.reason.message;
  }
  show();
  clearTimeout(state.again);  // a run in progress: look again until its report is in
  const busy = (state.curation?.folders ?? []).some((f) => ["waiting", "running"].includes(f.state));
  if (busy) state.again = setTimeout(refresh, 5000);
}

follow(show);
show();
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
await defined(["p-checkbox", "p-button"]);
refresh();
</script>
</body>
</html>
