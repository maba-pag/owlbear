<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Settings</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  p-text:empty { display: none !important; }
  .row { align-items: end; gap: var(--p-spacing-static-md); }
  #scope { min-width: 16rem; }
  p-table-cell p-input-text, p-table-cell p-select { min-width: 11rem; }
  details.panel > summary { font-size: var(--p-typescale-md); }
  details.panel[open] { gap: var(--p-spacing-static-md); }
  .scroll { min-width: 0; overflow-x: auto; }
  .no-pds table { width: 100%; border-collapse: collapse; font-size: var(--p-typescale-sm); }
  .no-pds caption { text-align: start; font-size: var(--p-typescale-xs); color: var(--p-color-contrast-medium); }
  .no-pds :is(th, td) {
    padding: var(--p-spacing-static-xs) var(--p-spacing-static-sm); text-align: start; vertical-align: top;
    border-bottom: 1px solid var(--p-color-contrast-lower);
  }
  .no-pds td { min-width: 7rem; }
  .no-pds td label { display: block; }
  .no-pds td :is(select, input:not([type="checkbox"])) { min-width: 11rem; }
  .no-pds td select { max-width: 14rem; }
  .no-pds p-text[color="error"] { color: var(--p-color-error); }
  #pack-stages { display: grid; gap: var(--p-spacing-static-xs); margin: 0; padding-inline-start: 1.5rem; }
  #pack-stages li > * { display: inline-block; vertical-align: middle; margin-inline-end: var(--p-spacing-static-xs); }
  #pack-log { margin: 0; white-space: pre-wrap; font-size: var(--p-typescale-xs); }
  .pack-question { display: grid; gap: var(--p-spacing-static-sm); margin-block: var(--p-spacing-static-md);
    padding-block-start: var(--p-spacing-static-sm); border-block-start: 1px solid var(--p-color-contrast-low); }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Settings</h1></p-heading>
</header>
<div id="page"></div>
</main>
<!-- ask -->
<script type="module">
import { html, nothing, render } from "/assets/lit-html/3.3.3/lit-html.js";
import { live } from "/assets/lit-html/3.3.3/directives/live.js";
import { call, designSystem, guard, here, loaded as clones, project as current } from "/assets/ui.mjs";

const EFFORTS = ["low", "medium", "high", "xhigh", "max"];
const INHERIT = "inherit";  // the option that clears the layer's own value
const SOURCES = { default: "built-in default", global: "global", machine: "this machine", project: "this project",
  builder: "the builder's value" };
const LAYERS = { project: "This project", machine: "This machine", global: "All projects" };
const ROUNDS = [["max_rounds", "Rounds at most"], ["max_findings", "New findings per round at most"],
  ["last_round_at", "Last round at or below"], ["ask_owner_at", "Ask you at or above"]];  // TD-209
const NUMBERS = [...ROUNDS.map(([f]) => f), "minutes", "sessions"];  // whole numbers (TD-286: minutes; TD-336)
const LOOPS = [["shaper", "Brief challenges (shaper)"], ["planner", "Plan challenges (planner)"],
  ["builder", "Task reviews (builder)"], ["final_review", "Final review"],
  ["updater", "Design pack updates (updater)"]];
const WRITE = 60000;  // a save commits and pushes the shared settings repository (TD-64): a network round trip
// TD-101: the design pack update runs in the host; the page starts it and follows its stages.
const RESULTS = { pending: "not run", running: "running", passed: "passed", failed: "failed", skipped: "skipped",
  returned: "findings back to the updater", waiting: "waiting for you" };
const TAGS = { pending: "secondary", running: "info", passed: "success", failed: "error", skipped: "secondary",
  returned: "warning", waiting: "warning" };
const ENDINGS = { idle: "Never run.", passed: "Last run passed: activated, committed and pushed.",
  failed: "Last run failed.", "up-to-date": "Last run: already up to date.",
  waiting: "The update waits for your answers below.", discarded: "Last run discarded: nothing changed." };
// TD-220: what became of each finding of the update's challenge rounds, in words.
const FOUND = { open: "to fix", fixed: "fixed by the updater", rejected: "rejected by the updater, not judged yet",
  standing: "rejected by the updater; the challenger accepted that",
  escalated: "rejected by the updater; the challenger upheld it", "owner-fix": "you decided: fix it",
  "owner-drop": "you dropped it", withdrawn: "withdrawn by the challenger" };
// Everything shown comes from here (TD-264): drafts per layer ("role.field" -> as typed), the folder being typed,
// the offered models once read, and the design pack's update with the notes typed for its questions.
const state = {
  pds: true, loaded: null, layer: "project", saving: false, offered: null, modelsNote: "", error: "", status: "",
  folder: null, pack: null, packProblem: "", update: null, packNotes: new Map(),
  machine: null, others: [], unread: [],  // the machine's values and the other projects' settings (TD-243)
  everything: false,  // the overview shows every setting, not only those a project sets apart (TD-295)
  machineDraft: null, machineSaving: false,  // the machine's settings as edited, before they are saved
  machineWrites: 0,  // counts machine saves, so a read that started before one never shows older values
};
const drafts = { project: {}, machine: {}, global: {} };
let polling = null, arrived = null;  // arrived: models read while a setting held the focus, applied once it leaves

function show() {
  render(view(), document.getElementById("page"));
}

// Render, applying arrived models only once no setting holds the focus, so they never replace the control in use.
function showIdle() {
  const using = document.activeElement?.closest?.("main [data-key]");
  if (!using && arrived) [state.offered, state.modelsNote, arrived] = [arrived.offered, arrived.note, null];
  show();
  if (using && arrived) {
    document.querySelector("main").addEventListener("focusout", () => setTimeout(showIdle), { once: true });
  }
}

function notify(message) {
  state.error = message ? message.charAt(0).toUpperCase() + message.slice(1) : "";
  show();
}

function shown(value) {
  if (Array.isArray(value)) return value.length ? value.join(", ") : "none";
  if (typeof value === "boolean") return value ? "yes" : "no";
  return String(value);
}

function source(key, inUse) {
  const from = SOURCES[state.loaded.settings.sources[key]];
  const line = inUse === undefined ? `from ${from}` : `in use: ${shown(inUse)}, from ${from}`;
  return html`<p-text size="xs" color="contrast-medium">${line}</p-text>`;
}

function cell(...parts) {
  return state.pds ? html`<p-table-cell multiline="true">${parts}</p-table-cell>` : html`<td>${parts}</td>`;
}

function row(...cells) {
  return state.pds ? html`<p-table-row>${cells}</p-table-row>` : html`<tr>${cells}</tr>`;
}

// A table: the design system's, else a native one in a box that scrolls on a narrow screen and takes the keyboard.
function table(caption, heads, body, rows, { id, hidden = false } = {}) {
  if (state.pds) {
    return html`<p-table id=${id ?? nothing} caption=${caption} ?hidden=${hidden}><p-table-head><p-table-head-row>
      ${heads.map((h) => html`<p-table-head-cell>${h}</p-table-head-cell>`)}</p-table-head-row></p-table-head>
      <p-table-body id=${body}>${rows}</p-table-body></p-table>`;
  }
  return html`<div id=${id ?? nothing} class="scroll" role="region" tabindex="0" aria-label=${caption}
    ?hidden=${hidden}><table><caption>${caption}</caption>
    <thead><tr>${heads.map((h) => html`<th scope="col">${h}</th>`)}</tr></thead>
    <tbody id=${body}>${rows}</tbody></table></div>`;
}

// A table cell's choice: its column says what it is, so the label is for assistive technology only.
// *wrong* says why the choice cannot run, for a choice that is checked (an effort); undefined for the others.
function choose(label, options, value, chosen, { key, disabled = false, filter = false, wrong } = {}) {
  const changed = (e) => chosen(e.target.value);
  const items = options.map(([v, said]) => (state.pds ? html`<p-select-option value=${v}>${said}</p-select-option>`
    : html`<option value=${v} ?selected=${v === value}>${said}</option>`));
  if (state.pds) {
    const checked = wrong === undefined ? nothing : wrong ? "error" : "none";
    return html`<p-select label=${label} hide-label="true" data-key=${key ?? nothing}
      filter=${filter ? "true" : nothing} state=${checked} message=${wrong || nothing} ?disabled=${disabled}
      .value=${live(value)} @change=${changed}>${items}</p-select>`;
  }
  const said = wrong === undefined ? undefined : `${key}-message`;
  return html`<select aria-label=${label} data-key=${key ?? nothing} ?disabled=${disabled} .value=${live(value)}
    aria-invalid=${said ? (wrong ? "true" : "false") : nothing} aria-describedby=${said ?? nothing}
    @change=${changed}>${items}</select>${said ? html`<p-text size="xs" color="error" class="message"
    id=${said}>${wrong}</p-text>` : nothing}`;
}

function typed(label, value, onInput, { key, placeholder, inputmode, disabled = false } = {}) {
  const keep = (e) => onInput(e.target.value ?? "");
  return state.pds
    ? html`<p-input-text label=${label} hide-label="true" data-key=${key ?? nothing}
        placeholder=${placeholder ?? nothing} inputmode=${inputmode ?? nothing} ?disabled=${disabled}
        .value=${live(value)} @input=${keep} @change=${keep}></p-input-text>`
    : html`<input type="text" aria-label=${label} data-key=${key ?? nothing} placeholder=${placeholder ?? nothing}
        inputmode=${inputmode ?? nothing} ?disabled=${disabled} .value=${live(value)} @input=${keep}>`;
}

function tick(label, checked, hideLabel = true) {
  if (state.pds) {
    return html`<p-checkbox label=${label} hide-label=${hideLabel ? "true" : "false"} disabled="true"
      .checked=${checked}></p-checkbox>`;
  }
  const box = html`<input type="checkbox" disabled aria-label=${hideLabel ? label : nothing} .checked=${checked}>`;
  return hideLabel ? box : html`<label>${box} ${label}</label>`;
}

function pure(label, onclick) {
  return state.pds
    ? html`<p-button-pure type="button" size="x-small" icon="reset" @click=${onclick}>${label}</p-button-pure>`
    : html`<button type="button" @click=${onclick}>${label}</button>`;
}

function button(label, onclick, { id, icon, variant, busy = false, disabled = false } = {}) {
  return state.pds
    ? html`<p-button id=${id ?? nothing} type="button" compact="true" icon=${icon ?? nothing}
        variant=${variant ?? nothing} .loading=${busy} ?disabled=${disabled} @click=${onclick}>${label}</p-button>`
    : html`<button id=${id ?? nothing} type="button" .disabled=${busy || disabled} @click=${onclick}>${label}</button>`;
}

function saved(layer, key) {
  const loaded = state.loaded;
  if (key === "widths") return (loaded[layer]?.widths ?? []).join(", ");
  if (key === "design_failures" || key === "sessions") return String(loaded[layer]?.[key] ?? "");
  if (key === "pr_labels" || key === "pr_marker") {
    const v = loaded[layer]?.[key];
    if (v === null || v === undefined) return "";
    return key === "pr_marker" ? (v ? "on" : "off") : v.join(", ") || "none";
  }
  const [role, field] = key.split(".");
  const value = role === "final_review" ? loaded[layer]?.final_review?.[field] : loaded[layer]?.agents?.[role]?.[field];
  return value === null || value === undefined ? "" : String(value);
}

// The edited layer's value of *key*: the draft as typed, else the saved value.
function own(key) {
  return key in drafts[state.layer] ? drafts[state.layer][key] : saved(state.layer, key);
}

function inherited() {
  return state.loaded.inherited[state.layer];
}

// One edit of the edited layer; a value equal to the saved one is no edit, an inherit choice clears the value.
// A *literal* value is typed text, where "inherit" is just a word (a label may be named so).
function edit(key, raw, literal = false) {
  const field = key.split(".")[1] ?? key;
  const value = !literal && !NUMBERS.includes(field) && raw === INHERIT ? "" : raw;
  if (value.trim() === saved(state.layer, key)) delete drafts[state.layer][key];
  else drafts[state.layer][key] = value;
  show();
}

// TD-209: one loop's round value, or a role's minutes (TD-286); blank inherits (the final review, the builder's).
function numberCell(owner, field, label) {
  const key = `${owner}.${field}`, final = owner === "final_review";
  const below = final ? finalBelow(field) : inherited().agents[owner][field];
  const inUse = final ? state.loaded.settings.final_review[field] : state.loaded.settings.agents[owner][field];
  return cell(typed(`${label}, ${owner.replace("_", " ")}`, own(key), (v) => edit(key, v),
    { key, placeholder: `inherit (${below})`, inputmode: "numeric", disabled: state.saving }),
  source(final ? key : `agents.${key}`, inUse));
}

// What a blank final-review value takes: the global one when editing this project, else the builder's as edited.
function finalBelow(field) {
  const wide = { project: [state.loaded.machine, state.loaded.global], machine: [state.loaded.global] }[state.layer];
  const above = (wide ?? []).map((l) => l?.final_review?.[field]).find((v) => v !== null && v !== undefined);
  if (above !== undefined) return above;
  return own(`builder.${field}`).trim() || inherited().agents.builder[field];
}

// TD-78: a design judge's fail goes back to the build, or to the owner's decision page.
function designFailures() {
  const key = "design_failures", below = inherited()[key];
  return cell(choose("When the design judge fails a change", [[INHERIT, `inherit (${below})`],
    ["back", "back: send it back to the build"], ["ask", "ask: show it to me first"]], own(key) || INHERIT,
  (v) => edit(key, v), { key, disabled: state.saving }), source(key, state.loaded.settings.design_failures));
}

function widths() {
  const below = inherited().widths.join(", ");
  return cell(typed("Screenshot widths in px, comma-separated (1280 to 2400)", own("widths"),
    (v) => edit("widths", v), { key: "widths", placeholder: `inherit (${below})`, disabled: state.saving }),
  source("widths", state.loaded.settings.widths));
}

// TD-336: how many agent sessions of one project run at once; the machine's total holds as well.
function sessionsAtOnce() {
  const key = "sessions", below = inherited()[key];
  return cell(typed("Agent sessions at once in one project", own(key), (v) => edit(key, v),
    { key, placeholder: `inherit (${below})`, inputmode: "numeric", disabled: state.saving }),
  source(key, state.loaded.settings[key]));
}

// TD-308: the labels on every pull request OwlBear opens; a project's list replaces the global one.
function prLabels() {
  const key = "pr_labels", below = inherited()[key].join(", ") || "none";
  return cell(typed("Labels, comma-separated; none for no labels", own(key), (v) => edit(key, v, true),
    { key, placeholder: `inherit (${below})`, disabled: state.saving }), source(key, state.loaded.settings[key]));
}

// TD-308: the line "Opened by OwlBear Delivery for …" at the end of a pull request's text, switched per project.
function prMarker() {
  const key = "pr_marker";
  if (state.layer !== "project") {
    return cell(html`<p-text>Set in each project</p-text>`, source(key, state.loaded.settings[key]));
  }
  return cell(choose("The line Opened by OwlBear Delivery", [[INHERIT, "inherit (on)"], ["on", "on: end with the line"],
    ["off", "off: leave it out"]], own(key) || INHERIT, (v) => edit(key, v), { key, disabled: state.saving }),
  source(key, state.loaded.settings[key]));
}

function tokens(n) {
  return n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : `${Math.round(n / 1000)}k`;
}

// TD-376: whether a role's sessions may start the runtime's built-in subagents; on unless a layer says off.
function subagentsCell(role) {
  const key = `${role}.subagents`, below = inherited().agents[role].subagents ? "on" : "off";
  return cell(choose(`Built-in subagents, ${role}`, [[INHERIT, `inherit (${below})`], ["true", "on: may start them"],
    ["false", "off: none"]], own(key) || INHERIT, (v) => edit(key, v), { key, disabled: state.saving }),
  source(`agents.${key}`, state.loaded.settings.agents[role].subagents));
}

// The model a role runs with in the edited layer: its own draft or saved value, else what it inherits.
function modelOf(role) {
  return own(`${role}.model`).trim() || inherited().agents[role].model;
}

function offeredModel(role) {
  return state.offered?.find((m) => m.id === modelOf(role));
}

// Why the role's effort, its own or inherited, cannot run with its model; empty when it can or nothing is known.
function mismatch(role) {
  const model = offeredModel(role), mine = own(`${role}.effort`);
  const effort = mine || inherited().agents[role].effort;
  if (!model || !model.efforts.length || model.efforts.includes(effort)) return "";
  return `${model.id} does not offer effort ${effort}${mine ? "" : " (inherited)"}; choose one it offers`;
}

function tierOf(role) {
  return own(`${role}.context`) || inherited().agents[role].context;
}

// Why the role's context tier cannot run with its model; empty when it can or nothing is known.
function tierMismatch(role) {
  const model = offeredModel(role);
  if (!model || model.long || tierOf(role) !== "long") return "";
  return `${model.id} has no long context${own(`${role}.context`) ? "" : " (inherited)"}; choose its default`;
}

// The long tier costs more per token: higher input or output rates than the default tier.
function dearer(model) {
  const [base, long] = [model.rates, model.long?.rates];
  return Boolean(base && long && (long.input > base.input || long.output > base.output));
}

function contextCell(role) {
  const key = `${role}.context`, mine = own(key), model = offeredModel(role), label = `Context for ${role}`;
  let control;
  if (model?.long) {
    const up = dearer(model), more = up ? "higher rates per token" : "same rates per token";
    const items = [["default", tokens(model.context), `${tokens(model.context)}, default context`],
      ["long", `${tokens(model.long.context)}${up ? "\u00a0\u2191" : ""}`,
        `${tokens(model.long.context)}, long context, ${more}`]];
    control = state.pds
      ? html`<p-segmented-control label=${label} hide-label="true" compact="true" columns="2" data-key=${key}
          ?disabled=${state.saving} .value=${live(tierOf(role))} @change=${(e) => edit(key, e.target.value)}>
          ${items.map(([v, said, aria]) => html`<p-segmented-control-item value=${v}
            aria=${`{ 'aria-label': '${aria}' }`}>${said}</p-segmented-control-item>`)}</p-segmented-control>`
      : choose(label, items.map(([v, , aria]) => [v, aria]), tierOf(role), (v) => edit(key, v),
        { key, disabled: state.saving });
  } else if (model) {
    const wrong = tierMismatch(role);
    control = html`<p-text size="sm">${tokens(model.context)} \u00b7 only tier</p-text>${wrong ? html`
      <p-text size="xs" color="error">${wrong}</p-text>${pure("Use the default tier", () => edit(key, "default"))}`
      : nothing}`;  // the default tier overrides an inherited long one
  } else {
    const below = inherited().agents[role].context;
    control = choose(label, [[INHERIT, `inherit (${below})`], ["default", "default"], ["long", "long"]],
      mine || INHERIT, (v) => edit(key, v), { key, disabled: state.saving });
  }
  const reset = model && mine ? pure("Use inherited", () => edit(key, "")) : nothing;
  return cell(control, reset, source(`agents.${key}`, state.loaded.settings.agents[role].context));
}

function amount(n) {
  return n.toLocaleString("en", { maximumFractionDigits: 2 });
}

function ratesCell(role) {
  const model = offeredModel(role), long = tierOf(role) === "long" && model?.long;
  const rates = long ? model.long.rates : model?.rates;
  if (!rates) return cell(html`<p-text>\u2014</p-text><p-text size="xs" color="contrast-medium">not known</p-text>`);
  const write = rates.cache_write ? ` \u00b7 cache write ${amount(rates.cache_write)}` : "";
  const flow = `in ${amount(rates.input)} \u00b7 out ${amount(rates.output)}`;
  const line = `${flow} \u00b7 cache ${rates.cache == null ? "not known" : amount(rates.cache)}${write}`;
  return cell(html`<p-text>${line}</p-text><p-text size="xs" color="contrast-medium">${model.id}, ${long ? "long"
    : "default"} context</p-text>`);
}

function editable(role, field) {
  const key = `${role}.${field}`, below = inherited().agents[role][field], value = own(key);
  const label = `${field === "model" ? "Model" : "Effort"} for ${role}`, model = offeredModel(role);
  const set = (v) => edit(key, v), common = { key, disabled: state.saving };
  let control, note = nothing;
  if (field === "effort") {
    const efforts = model ? model.efforts : EFFORTS;
    const options = [[INHERIT, `inherit (${below})`],
      ...efforts.map((e) => [e, e === model?.default_effort ? `${e} (model default)` : e])];
    if (value && !efforts.includes(value)) {
      options.push([value, `${value} (not offered by ${model?.id ?? "this model"})`]);
    }
    control = choose(label, options, value || INHERIT, set, { ...common, wrong: mismatch(role) });
    if (model && !model.efforts.length) {
      note = html`<p-text size="xs" color="contrast-medium">${model.id} takes no effort setting</p-text>`;
    }
  } else if (state.offered?.length) {
    const options = [[INHERIT, `inherit (${below})`], ...state.offered.map((m) => {
      const long = m.long ? ` / ${tokens(m.long.context)} long` : "";
      const sizes = m.context ? ` \u00b7 ${tokens(m.context)}${long} context` : "";
      return [m.id, `${m.name} (${m.id})${sizes}`];
    })];
    if (value && !state.offered.some((m) => m.id === value)) options.push([value, `${value} (not offered here)`]);
    control = choose(label, options, value || INHERIT, set, { ...common, filter: true });
  } else {
    control = typed(label, value, set, { ...common, placeholder: `inherit (${below})` });
  }
  return cell(control, note, source(`agents.${key}`, state.loaded.settings.agents[role][field]));
}

// A setting Delivery does not apply yet: its control, disabled, with where its value comes from.
function inactive(label, value, key) {
  let control;
  if (typeof value === "boolean") {
    control = tick(label, value);
  } else if (key.endsWith(".runtime")) {
    control = choose(label, state.loaded.catalogue.runtimes.map((r) => [r.runtime, r.runtime]), value, () => {},
      { disabled: true });
  } else if (key.endsWith(".categories")) {
    const names = Object.keys(state.loaded.catalogue.categories);
    control = html`<div role=${state.pds ? nothing : "group"} aria-label=${state.pds ? nothing : label}>
      ${names.map((name) => tick(name, value.includes(name), false))}</div>`;
  } else {
    control = typed(label, shown(value), () => {}, { disabled: true });
  }
  return cell(control, source(key));
}

// The edited layer's drafts that differ from what is saved, trimmed as they will be sent.
function dirty(layer) {
  return Object.entries(drafts[layer]).filter(([key, value]) => value.trim() !== saved(layer, key));
}

// Each unsaved edit of *layer* as "field: saved → new"; a blank value inherits.
function changes(layer) {
  const said = (v) => (v === "" || v === null || v === undefined ? "inherited" : v);
  return dirty(layer).map(([key, value]) =>
    `${key.replace(".", " ").replaceAll("_", " ")}: ${said(saved(layer, key))} → ${said(value.trim())}`);
}

function pendingLine() {
  const others = Object.keys(drafts).filter((l) => l !== state.layer && dirty(l).length);
  const mine = changes(state.layer), parts = mine.length ? [`Unsaved: ${mine.join("; ")}.`] : ["No unsaved edits."];
  for (const other of others) parts.push(`${LAYERS[other]}: ${dirty(other).length} more unsaved.`);
  return parts.join(" ");
}

function edited(layer) {
  const next = structuredClone(state.loaded[layer]);
  for (const [key, raw] of dirty(layer)) {
    const value = raw.trim();
    if (key === "widths") {
      next.widths = value ? value.split(",").map((w) => Number(w.trim())) : null;
      continue;
    }
    if (key === "design_failures") {
      next[key] = value || null;
      continue;
    }
    if (key === "sessions") {
      next[key] = value === "" ? null : /^\d+$/.test(value) ? Number(value) : value;
      continue;
    }
    if (key === "pr_labels") {
      next[key] = !value ? null : value === "none" ? [] : value.split(",").map((l) => l.trim()).filter(Boolean);
      continue;
    }
    if (key === "pr_marker") {
      next[key] = value ? value === "on" : null;
      continue;
    }
    const [role, field] = key.split(".");
    const number = !NUMBERS.includes(field) || value === "" ? null : /^\d+$/.test(value) ? Number(value) : value;
    if (role === "final_review") {
      const mine = { ...(next.final_review ?? {}), [field]: number };
      next.final_review = Object.values(mine).some((v) => v !== null) ? mine : null;
      continue;
    }
    const agent = next.agents[role] ?? {};
    agent[field] = field === "subagents" ? (value ? value === "true" : null) : number ?? (value || null);
    if (Object.values(agent).some((v) => v !== null)) next.agents[role] = agent;
    else delete next.agents[role];
  }
  return next;
}

async function reload() {
  try {
    state.loaded = await call("/config");
    state.error = state.loaded.notice ? state.loaded.notice.charAt(0).toUpperCase() + state.loaded.notice.slice(1) : "";
    return true;
  } catch (e) {
    notify(e.message);
    return false;
  }
}

async function save() {
  if (state.saving || !state.loaded) return;
  const roles = Object.keys(state.loaded.settings.agents);
  const wrong = roles.flatMap((r) => [mismatch(r), tierMismatch(r)]).filter(Boolean);
  if (wrong.length) return notify(`Not saved: ${wrong.join("; ")}.`);
  const layer = state.layer, sent = { ...drafts[layer] };
  if (layer === "global" && !(await ask({
    title: "Change the defaults for all projects?", yes: "Save global defaults", no: "Keep editing",
    now: "These become the defaults for every project:", items: changes(layer),
    then: "Each project's next session uses them, unless this machine or the project sets its own value; sessions "
      + "running now keep theirs.",
    after: "Change them back here at any time.",
    instead: "Your edits stay unsaved on this page.",
  }))) return;
  if (layer === "machine" && !(await ask({
    title: "Change this machine's preferences?", yes: "Save this machine's preferences", no: "Keep editing",
    now: "These apply to every project on this machine:", items: changes(layer),
    then: "Each project's next session here uses them, unless the project sets its own value; other machines and "
      + "sessions running now keep theirs.",
    after: "Change them back here at any time.",
    instead: "Your edits stay unsaved on this page.",
  }))) return;
  state.saving = true;
  state.status = "Saving…";
  show();
  try {
    state.loaded = await call(`/config/${layer}`,
      { method: "PUT", body: { rev: state.loaded[`${layer}_rev`], layer: edited(layer) }, timeout: WRITE });
    for (const [key, value] of Object.entries(sent)) if (drafts[layer][key] === value) delete drafts[layer][key];
    state.error = state.loaded.notice ? state.loaded.notice.charAt(0).toUpperCase() + state.loaded.notice.slice(1) : "";
    const whose = { global: "the global", machine: "this machine's" }[layer]
      ?? (named() ? `${named()}'s` : "this project's");
    state.status = `Saved ${whose} settings. They apply to the next session.`;
    await readAcross();
  } catch (e) {
    state.status = "";
    if (e.status === 409 && await reload()) {
      await readAcross();
      state.error = `${e.message}. The page loaded the current settings and kept your unsaved edits; `
        + "check them and save again.";
      state.error = state.error.charAt(0).toUpperCase() + state.error.slice(1);
    } else {
      state.error = e.message.charAt(0).toUpperCase() + e.message.slice(1);
    }
  } finally {
    state.saving = false;
    showIdle();  // models that arrived during it apply now
  }
}

async function rename() {
  const loaded = state.loaded, name = (state.folder ?? loaded?.folder ?? "").trim();
  if (state.saving || !loaded?.folder || !name || name === loaded.folder) return;
  const sure = await ask({
    title: `Rename the folder ${loaded.folder} to ${name}?`, yes: "Rename", no: "Keep the name",
    now: "Delivery moves the folder with this project's settings, memory and visual decisions in the shared "
      + "settings repository, then commits and pushes the move. It refuses while a step of this project runs.",
    then: "Other clones of this project use the new name the next time they start.",
    after: "Rename it again here at any time; your source checkout keeps its name.",
    instead: "The folder keeps its name.",
  });
  if (!sure) return;
  state.saving = true;
  state.status = "Renaming…";
  show();
  try {
    state.loaded = await call("/config/folder", { method: "PUT", body: { name }, timeout: WRITE });
    state.folder = null;
    state.error = state.loaded.notice ? state.loaded.notice.charAt(0).toUpperCase() + state.loaded.notice.slice(1) : "";
    state.status = `This project's folder is now ${state.loaded.folder}.`;
  } catch (e) {
    state.status = "";
    state.error = e.message.charAt(0).toUpperCase() + e.message.slice(1);
  } finally {
    state.saving = false;
    showIdle();  // models that arrived during it apply now
  }
}

function when(iso) {
  return iso ? new Date(iso).toLocaleString() : "";
}

function packLine(u) {
  if (state.packProblem) return state.packProblem;
  if (!u) return "";
  const at = u.stages.findIndex((s) => s.name === u.stage);
  let line = ENDINGS[u.state] ?? u.state;
  if (u.state === "running") {
    line = at < 0 ? "Starting the update…" : `Running stage ${at + 1} of ${u.stages.length}: ${u.stages[at].label}…`;
  } else if (u.started_at) {
    line += ` Started ${when(u.started_at)}` + (u.ended_at ? `, ended ${when(u.ended_at)}.` : ".");
  }
  return line;
}

function updated(u) {
  state.update = u;
  state.packProblem = "";
  show();
  if (u.state === "running") poll();
}

function findings(found) {
  return found.map((f) => {
    const why = [f.reason && `Updater: ${f.reason}`, f.judgement && `Challenger: ${f.judgement}`,
      f.note && `Your note: ${f.note}`, f.clarified && `Reconsidered: ${f.clarified}`].filter(Boolean).join(" ");
    return html`<li>${f.id} (round ${f.raised}), ${FOUND[f.state] ?? f.state}: ${f.text}${why ? ` ${why}` : ""}</li>`;
  });
}

// A waiting run's question: one per finding the challenger upheld against the updater (TD-193), or the end without
// a pass (TD-256). A note being typed lives in state, so it survives every reload of the update's state.
function packQuestion(q) {
  let field = nothing;
  if (q.kind === "dispute") {
    const label = "Your note (guides the updater; needed to ask the challenger again)";
    const note = state.packNotes.get(q.id) ?? "", keep = (e) => state.packNotes.set(q.id, e.target.value ?? "");
    field = state.pds
      ? html`<p-textarea label=${label} rows="2" max-length="2000" .value=${live(note)} @input=${keep}
          @change=${keep}></p-textarea>`
      : html`<label class="field">${label}<textarea rows="2" maxlength="2000" .value=${live(note)}
          @input=${keep}></textarea></label>`;
  }
  return html`<div class="pack-question">${state.pds ? html`<p-text>${q.text}</p-text>` : html`<p>${q.text}</p>`}
    ${field}
    <div class="row">${q.options.map((o) => button(o.label, () => answerUpdate(q, o, state.packNotes.get(q.id) ?? ""),
      { variant: "secondary" }))}</div></div>`;
}

async function answerUpdate(q, o, note) {
  const left = ["rejected", "standing", "owner-drop"], loop = state.update?.loop;
  const standing = (loop?.findings ?? []).filter((f) => left.includes(f.state));
  const items = [...(loop?.unreviewed ?? []).map((r) => `Repair ${r}: no challenger reviewed it.`),
    ...standing.map((f) => `${f.id} not changed for (${FOUND[f.state]}): ${f.text}`)];
  if (o.id === "activate" && !(await ask({
    title: "Activate the pack without a passing challenge?", yes: "Activate and push", no: "Keep it waiting",
    now: "Delivery activates the candidate as it is now, commits design_pack.json, skills/NOTICE.md and the "
      + "skills the updater changed on the package checkout's current branch, and pushes that commit. It activates "
      + (items.length ? "with these left as they are:" : "with no repair left unreviewed and no finding left open."),
    items,
    then: "The commit message records that the rounds ended without a pass and which findings were not changed for.",
    after: "Later visual rounds use the new pack; run another update when upstream moves on.",
    instead: "The update keeps waiting; you can still discard it.",
  }))) return;
  try {
    const answered = await call("/design-pack/update/answer",
      { body: { question: q.id, option: o.id, note }, timeout: WRITE });
    state.packNotes.delete(q.id);
    updated(answered);
  } catch (e) {
    notify(e.message);
    await readPack();
  }
}

async function discardUpdate() {
  try {
    updated(await call("/design-pack/update/discard", { method: "POST", timeout: WRITE }));
  } catch (e) {
    notify(e.message);
    await readPack();
  }
}

async function readPack() {
  try {
    state.pack = await call("/design-pack");
    updated(state.pack.update);
  } catch (e) {
    state.packProblem = `Could not read the design pack: ${e.message}`;
    show();
  }
}

// TD-290: an update another project runs on this machine shows here once it starts and goes once it ends.
setInterval(async () => {
  if (!state.pack || document.hidden) return;
  const machine = await call("/design-pack/machine").then((r) => r.machine, () => state.pack.machine);
  if (machine !== state.pack.machine) {
    state.pack = { ...state.pack, machine };
    show();
  }
}, 5000);

function poll() {
  clearTimeout(polling);
  polling = setTimeout(async () => {
    try {
      updated(await call("/design-pack/update"));
    } catch (e) {
      state.packProblem = `Could not read the update: ${e.message}`;
      show();
      poll();
    }
  }, 2000);
}

async function startUpdate() {
  const sure = await ask({
    title: "Update the design pack?", yes: "Update", no: "Keep the current pack",
    now: "Delivery takes the newest upstream pack, detector pins and design skills together; an updater session "
      + "brings the skills in line, then the rule diff, golden pages, calibration replay and a challenger check it. "
      + "The challenger's findings go back to the updater. This uses AI credits.",
    then: "Only if every stage passes, it activates the pack, commits design_pack.json, skills/NOTICE.md and "
      + "the skills the updater changed on its package checkout's current branch and pushes that commit upstream. "
      + "If the challenge rounds end without a pass, or the challenger upholds a finding the updater rejected, it "
      + "stops before activating and asks you here.",
    after: "Later visual rounds use the new pack. If a stage fails, nothing changes and the stages below say why.",
    instead: "The current pack stays active.",
  });
  if (!sure) return;
  try {
    updated(await call("/design-pack/update", { method: "POST", timeout: 10000 }));
  } catch (e) {
    notify(e.message);
    await readPack();
  }
}

// The offered models replace typing once read; the runtime starts for it, so this can take a while.
async function readModels() {
  state.modelsNote = "Reading the models this machine's Copilot offers…";
  show();
  try {
    const answer = await call("/config/models", { timeout: 45000 });
    const offered = answer.models.length ? answer.models : null;
    arrived = { offered, note: offered ? "Models, efforts and context sizes as this machine's Copilot offers them."
      : `Could not read the offered models (${answer.error || "none offered"}); type a model name.` };
  } catch (e) {
    arrived = { offered: null, note: `Could not read the offered models (${e.message}); type a model name.` };
  }
  showIdle();
}

// The project this page edits, by its name in the machine host's list; "This project" on a clone's own host.
function named(id = current) {
  return clones()?.find((p) => p.id === id)?.name ?? "";
}

function scopeSection() {
  const loaded = state.loaded, mine = named();
  const all = clones() ?? [], twin = (p) => all.some((o) => o !== p && o.name === p.name);
  const others = all.filter((p) => p.id !== current)
    .map((p) => [`go:${p.id}`, `Project ${p.name}${twin(p) ? ` (${p.path})` : ""}`]);
  const options = [["project", mine ? `Project ${mine}` : "This project"], ["machine", "This machine (its projects)"],
    ["global", "Global (every project)"], ...others];
  const pick = (v) => {
    if (!v.startsWith("go:")) {
      state.layer = v;
      return show();
    }
    if (unsaved()) {
      show();  // the select shows the layer being edited again
      return notify(unsaved());
    }
    location.assign(here({ project: v.slice(3) }));
  };
  const control = state.pds
    ? html`<p-select id="scope" label="Layer" ?disabled=${state.saving} .value=${live(state.layer)}
        @change=${(e) => pick(e.target.value)}>${options.map(([v, said]) => html`<p-select-option value=${v}
        ?disabled=${v === "global" && !loaded.global_location}>${said}</p-select-option>`)}</p-select>`
    : html`<label class="field">Layer<select id="scope" ?disabled=${state.saving} .value=${live(state.layer)}
        @change=${(e) => pick(e.target.value)}>${options.map(([v, said]) => html`<option value=${v}
        ?selected=${v === state.layer} ?disabled=${v === "global" && !loaded.global_location}>${said}</option>`)}
        </select></label>`;
  return html`<section class="panel" aria-labelledby="scope-title">
    <p-heading size="lg"><h2 id="scope-title">Where you edit</h2></p-heading>
    <div class="row">${control}<p-text id="scope-note" size="xs" color="contrast-medium">${loaded.global_location ? ""
      : "No shared settings location is set up (run owlbear-next data PATH), so only this project's and this "
        + "machine's settings can be saved, locally."}</p-text></div>
    <p-text>A blank project value uses this machine's; a blank value on this machine uses the global one; a blank
      global value uses the built-in default.</p-text>
  </section>`;
}

// Why another project may not open now: edits of either layer or a folder name typed and not saved.
function unsaved() {
  const folder = state.folder !== null && state.folder.trim() !== (state.loaded?.folder ?? "");
  return Object.values(drafts).some((d) => Object.keys(d).length) || folder || state.machineDraft
    ? "Save or discard your edits before you open another project." : "";
}

// A value in the overview: a list or a record in full, never "[object Object]".
function plain(value) {
  return value !== null && typeof value === "object" && !(Array.isArray(value) && value.every((v) => typeof v
    !== "object")) ? JSON.stringify(value) : shown(value);
}

function at(value, key) {
  return key.split(".").reduce((o, k) => o?.[k], value);
}

// Each setting a project sets apart from the global value, with that global value and where it comes from.
function acrossSection() {
  if (!clones()) return nothing;  // a clone's own host serves one project
  const loaded = state.loaded, all = [{ name: named(), config: loaded }, ...state.others];
  const rows = Object.keys(loaded.settings.sources).map((key) => {
    const below = loaded.inherited.project, wide = loaded.inherited.machine, source = wide.sources[key];
    const global = at(wide, key), from = SOURCES[source] ?? source;  // global, built-in or the builder's
    const here = at(below, key), apart = JSON.stringify(here) !== JSON.stringify(global);  // derived values too
    const differ = all.filter((p) => JSON.stringify(at(p.config.settings, key)) !== JSON.stringify(here));
    return { key, global, from, machine: apart ? plain(here) : "same", differ, apart };
  }).filter((r) => state.everything || r.differ.length || r.apart);
  const body = rows.map((r) => row(cell(r.key.replaceAll(".", " · ")), cell(`${plain(r.global)} (${r.from})`),
    cell(r.machine),
    cell(r.differ.map((p) => `${p.name}: ${plain(at(p.config.settings, r.key))}`).join("; ") || "none")));
  const flip = (e) => { state.everything = e.target.checked === true; show(); };
  const showAll = state.pds
    ? html`<p-checkbox id="across-all" label="Show all settings" .checked=${live(state.everything)}
        @change=${flip}></p-checkbox>`
    : html`<label><input id="across-all" type="checkbox" .checked=${live(state.everything)} @change=${flip}>
        Show all settings</label>`;
  const unread = state.unread.length ? `Not read: ${state.unread.join("; ")}.` : "";
  return html`<section class="panel" aria-labelledby="across-title">
    <p-heading size="lg"><h2 id="across-title">Across projects</h2></p-heading>
    ${showAll}
    ${rows.length ? table(state.everything ? "Every setting, with the projects that set it apart"
      : "Settings a project or this machine sets apart from the global value",
      ["Setting", "Global", "This machine", "Projects"],
      "across", body, { id: "across-table" })
      : html`<p-text id="across-none">Every project uses the global settings.</p-text>`}
    ${unread ? html`<p-text id="across-unread" size="xs">${unread}</p-text>` : nothing}
  </section>`;
}

// The machine's own values: changed only here, from a terminal, never in a settings layer (TD-243).
const CHANNELS = [["minor", "Every minor version (v0.1, v0.2 …)"], ["major", "Major versions only (v1, v2 …)"]];

// The machine's settings as shown: each edited one as edited, the others as saved (TD-288, TD-300); a save after
// another page's lands only the edited ones on top of that page's.
function machineValue(key) {
  return state.machineDraft && key in state.machineDraft ? state.machineDraft[key] : state.machine.settings[key];
}

function machineEdit(key, value) {
  const draft = { ...(state.machineDraft ?? {}), [key]: value };
  if (value === state.machine.settings[key]) delete draft[key];
  state.machineDraft = Object.keys(draft).length ? draft : null;
  show();
}

function machineControls() {
  const pick = (e) => machineEdit("channel", e.target.value);
  const channel = state.pds
    ? html`<p-select id="machine-channel" label="Versions this machine takes" .value=${live(machineValue("channel"))}
        ?disabled=${state.machineSaving} @change=${pick}>${CHANNELS.map(([v, said]) => html`<p-select-option
        value=${v}>${said}</p-select-option>`)}
      </p-select>`
    : html`<label class="field">Versions this machine takes<select id="machine-channel"
        .value=${live(machineValue("channel"))} ?disabled=${state.machineSaving} @change=${pick}>${CHANNELS.map(
        ([v, said]) => html`<option value=${v} ?selected=${v === machineValue("channel")}>${said}</option>`)}
        </select></label>`;
  const box = (key, label) => {
    const flip = (e) => machineEdit(key, e.target.checked === true);
    return state.pds
      ? html`<p-checkbox label=${label} .checked=${live(machineValue(key))} ?disabled=${state.machineSaving}
          @change=${flip}></p-checkbox>`
      : html`<label><input type="checkbox" .checked=${live(machineValue(key))} ?disabled=${state.machineSaving}
          @change=${flip}> ${label}</label>`;
  };
  // TD-336: the machine's total of agent sessions at once, across every project it serves.
  const count = (e) => {
    const v = (e.target.value ?? "").trim();
    machineEdit("sessions", /^\d+$/.test(v) ? Number(v) : v);
  };
  const label = "Agent sessions at once on this machine, across its projects";
  const sessions = state.pds
    ? html`<p-input-text id="machine-sessions" label=${label} inputmode="numeric"
        .value=${live(String(machineValue("sessions")))} ?disabled=${state.machineSaving} @input=${count}
        @change=${count}></p-input-text>`
    : html`<label class="field">${label}<input id="machine-sessions" type="text" inputmode="numeric"
        .value=${live(String(machineValue("sessions")))} ?disabled=${state.machineSaving} @input=${count}></label>`;
  return html`${channel}${box("update_when_idle", "Update itself when idle")}
    ${box("update_while_paused", "Update itself while paused")}
    ${sessions}
    <div class="row">${button("Save machine settings", saveMachine, { busy: state.machineSaving,
      disabled: !state.machineDraft })}</div>`;
}

async function saveMachine() {
  if (!state.machineDraft || state.machineSaving) return;
  state.machineSaving = true;  // the controls stay disabled until it ends, so no edit is made and lost meanwhile
  state.machineWrites += 1;
  show();
  try {
    state.machine = await call("/machine/settings", { method: "PUT", machine: true, timeout: WRITE,
      body: { rev: state.machine.settings_rev, settings: { ...state.machine.settings, ...state.machineDraft } } });
    state.machineDraft = null;
    state.status = "Saved this machine's settings.";
  } catch (e) {
    if (e.status === 409) state.machine = await call("/machine", { machine: true }).catch(() => state.machine);
    notify(e.status === 409 ? `${e.message}. The page loaded them again and kept your edits; check them and save `
      + "again." : e.message);
  } finally {
    state.machineSaving = false;
    state.machineWrites += 1;
    show();
  }
}

function machineSection() {
  const m = state.machine;
  if (!m) return nothing;
  const since = m.resumed_at ? `, resumed ${new Date(m.resumed_at).toLocaleString()}` : "";
  return html`<section class="panel" aria-labelledby="machine-title">
    <p-heading size="lg"><h2 id="machine-title">This machine</h2></p-heading>
    <p-text id="machine-run">Delivery ${m.paused ? "is paused since OwlBear started: press Resume above"
      : `runs${since}`}.</p-text>
    <p-text id="machine-login">Start at login: ${m.login_item}. Change it in a terminal with
      <code>owlbear autostart on</code> or <code>owlbear autostart off</code>.</p-text>
    ${machineControls()}
    <p-text id="machine-note" size="xs" color="contrast-medium">OwlBear does not update itself yet; these settings
      take effect once it does.</p-text>
  </section>`;
}

// The machine's values, unless a machine save ran during this read; then the save's answer stands.
async function readMachine() {
  const writes = state.machineWrites;
  if (state.machineSaving) return;
  const read = await call("/machine", { machine: true }).catch(() => undefined);
  if (read !== undefined && !state.machineSaving && writes === state.machineWrites) state.machine = read;
}

// The machine host's values and every other project's settings, each shared folder once (twin clones share one).
async function readAcross() {
  const others = (clones() ?? []).filter((p) => p.id !== current);
  if (!clones()) return;
  const [, ...read] = await Promise.allSettled([readMachine(), ...others.map((p) => call("/config", { of: p.id }))]);
  const seen = new Set(state.loaded?.folder ? [state.loaded.folder] : []);
  state.others = [];
  state.unread = [];
  read.forEach((r, i) => {
    if (r.status === "rejected") return state.unread.push(`${others[i].name}: ${r.reason.message}`);
    if (r.value.folder && seen.has(r.value.folder)) return null;
    seen.add(r.value.folder);
    return state.others.push({ name: others[i].name, config: r.value });
  });
}

function folderSection() {
  const loaded = state.loaded, off = !loaded.folder || state.saving, value = state.folder ?? loaded.folder ?? "";
  const keep = (e) => { state.folder = e.target.value ?? ""; };
  const label = "Folder in the shared settings repository";
  const input = state.pds
    ? html`<p-input-text id="folder" label=${label} ?disabled=${off} .value=${live(value)} @input=${keep}
        @change=${keep}></p-input-text>`
    : html`<label class="field">${label}<input id="folder" type="text" ?disabled=${off} .value=${live(value)}
        @input=${keep}></label>`;
  return html`<section class="panel" aria-labelledby="folder-title">
    <p-heading size="lg"><h2 id="folder-title">Project folder</h2></p-heading>
    <div class="row">${input}${button("Rename folder", rename, { id: "rename", icon: "edit", disabled: off })}</div>
    <p-text id="folder-note">${loaded.folder ? "Named after the repository unless renamed. Renaming moves the folder "
      + "with its settings, memory and visual decisions, then commits and pushes the move; it is refused while a "
      + "step of this project runs." : "No shared settings location is set up, so this project has no folder there."}
    </p-text>
  </section>`;
}

function settingsSections() {
  const loaded = state.loaded, roles = Object.keys(loaded.settings.agents);
  const share = (n, of) => `${n} (${Math.round((100 * n) / of)}%)`;
  const later = [["runtime", "Runtime"], ["visible", "Needs visibility"], ["categories", "Categories"]];
  const general = [["Always visible (global switch)", loaded.settings.visible, "visible"],
    ...Object.entries(loaded.settings.runtimes).map(([n, on]) => [`Runtime ${n} switched on`, on, `runtimes.${n}`])];
  const { baseline, runtimes, categories } = loaded.catalogue;
  const text = (v) => cell(html`<p-text>${v}</p-text>`);
  return html`
    <section class="panel" aria-labelledby="agents-title">
      <p-heading size="lg"><h2 id="agents-title">Agents</h2></p-heading>
      ${table("Agents: model, effort and context apply to the next session",
        ["Agent", "Model", "Effort", "Context", "AI credits per 1M tokens"], "agents",
        roles.map((role) => row(text(role), editable(role, "model"), editable(role, "effort"), contextCell(role),
          ratesCell(role))))}
      <p-text id="models-note" size="xs" color="contrast-medium" aria-live="polite">${state.modelsNote}</p-text>
    </section>
    <section class="panel" aria-labelledby="rounds-title">
      <p-heading size="lg"><h2 id="rounds-title">Challenge rounds</h2></p-heading>
      <p-text>A reviewer and the worker go back and forth in rounds. A round with few new findings is the last; after
        the last allowed round with many, Delivery asks you. A loop keeps the values it started with.</p-text>
      ${table("Challenge rounds: they apply to loops that start after a save", ["Loop", ...ROUNDS.map(([, l]) => l)],
        "rounds", LOOPS.map(([owner, said]) => row(text(said),
          ...ROUNDS.map(([field, label]) => numberCell(owner, field, label)))))}
      <p-text size="xs" color="contrast-medium">Findings per round: 1 to 20. "Last round at or below" must be lower
        than "ask you at or above", which may not exceed the findings per round. The final review inherits the
        builder's values.</p-text>
    </section>
    <section class="panel" aria-labelledby="limits-title">
      <p-heading size="lg"><h2 id="limits-title">Session time limits</h2></p-heading>
      <p-text>An agent session ends after this many minutes in total; its step then counts as a failed attempt and
        runs again. The shaper's chat has no limit.</p-text>
      ${table("Session time limits: they apply to the next session", ["Agent", "Minutes per session"], "limits",
        roles.filter((role) => role !== "shaper").map((role) => row(text(role),
          numberCell(role, "minutes", "Minutes per session"))))}
      <p-text size="xs" color="contrast-medium">1 to 480 minutes.</p-text>
    </section>
    <section class="panel" aria-labelledby="at-once-title">
      <p-heading size="lg"><h2 id="at-once-title">Sessions at once</h2></p-heading>
      <p-text>A step waits for a free slot before it starts. A visual check runs its judges in waves of the slots it
        gets; a design pack update takes one slot per session. This machine's total holds across its projects.</p-text>
      ${table("Sessions at once: they apply to the next step that starts", ["Setting", "Value"], "at-once",
        [row(text("Agent sessions at once in one project"), sessionsAtOnce())])}
      <p-text size="xs" color="contrast-medium">At least 1. Steps running now keep their sessions.</p-text>
    </section>
    <section class="panel" aria-labelledby="subagents-title">
      <p-heading size="lg"><h2 id="subagents-title">Subagents</h2></p-heading>
      <p-text>An agent may start the runtime's built-in subagents, such as explore or code-review, for side
        questions. They work under the step's own permissions, and Delivery records each one; Maintenance shows their
        use per agent.</p-text>
      ${table("Subagents: they apply to the next session", ["Agent", "Built-in subagents"], "subagents",
        roles.filter((role) => role !== "shaper").map((role) => row(text(role), subagentsCell(role))))}
    </section>
    <section class="panel" aria-labelledby="general-title">
      <p-heading size="lg"><h2 id="general-title">Visual checks</h2></p-heading>
      ${table("Visual check settings: they apply to the next visual check", ["Setting", "Value"], "general",
        [row(text("Screenshot widths"), widths()), row(text("Design failures"), designFailures())])}
      <p-heading size="md"><h3 id="agreement-title">Agreement with your visual decisions</h3></p-heading>
      <p-text id="design-pack" size="xs">${loaded.design_pack}</p-text>
      <p-text id="agreement-note" size="xs" color="contrast-medium">${loaded.agreement.length
        ? "From the decided rounds kept in the shared repository; below 20 rounds the numbers only inform."
        : "No decided visual rounds yet, or no shared repository is set up."}</p-text>
      ${table("How often each judge's verdict matched your Pass or Fail, per model",
        ["Judge", "Model", "Decided", "Agreed", "Disagreed", "Unsure"], "agreement",
        loaded.agreement.map((a) => row(...[a.judge, a.model, String(a.decided), share(a.agreed, a.decided),
          share(a.disagreed, a.decided), share(a.unsure, a.decided)].map(text))),
        { id: "agreement-table", hidden: !loaded.agreement.length })}
    </section>
    <section class="panel" aria-labelledby="pr-title">
      <p-heading size="lg"><h2 id="pr-title">Pull requests</h2></p-heading>
      <p-text>What OwlBear adds to each pull request it opens.</p-text>
      ${table("Pull request settings: they apply to the next pull request", ["Setting", "Value"], "pr",
        [row(text("Labels"), prLabels()), row(text("Marker line"), prMarker())])}
    </section>
    ${packSection()}
    <details class="panel">
      <summary>Not applied yet: runtimes, visibility and tool categories</summary>
      ${table("Per agent; not applied yet", ["Agent", "Runtime", "Needs visibility", "Categories"], "agents-later",
        Object.entries(loaded.settings.agents).map(([role, eff]) => row(text(role),
          ...later.map(([f, label]) => inactive(`${label} for ${role}`, eff[f], `agents.${role}.${f}`)))))}
      ${table("Switches; not applied yet", ["Setting", "Value"], "general-later",
        general.map(([label, value, key]) => row(text(label), inactive(label, value, key))))}
      <p-text id="baseline" size="xs" color="contrast-medium">Every runtime has the baseline: ${baseline}.</p-text>
      ${table("What each runtime adds; not used for routing yet", ["Runtime", "Adds over the baseline", "MCP servers",
        "Live view", "Writes outside the work folder stopped by"], "runtimes", runtimes.map((r) => row(
        ...[r.runtime, r.adds, r.mcp, r.live_view, r.outside_writes].map(text))))}
      ${table("Tool categories an agent can ask for; not applied yet", ["Category", "Runtime", "Tools"], "categories",
        Object.entries(categories).map(([name, c]) => row(...[name, c.runtime, c.tools.join(", ")].map(text))))}
    </details>
    <div class="bar" role="region" aria-label="Save settings">
      ${button({ global: "Save global defaults", machine: "Save this machine's preferences" }[state.layer]
        ?? "Save project settings", save,
        { id: "save", icon: "check", busy: state.saving })}
      <p-text id="pending" size="sm" aria-live="polite">${pendingLine()}</p-text>
    </div>`;
}

function view() {
  const loaded = state.loaded;
  if (loaded && !loaded.global_location && state.layer === "global") state.layer = "project";
  return html`
    <p id="offline" role="status" ?hidden=${state.pds}>The Porsche Design System did not load from
      cdn.ui.porsche.com, so the page uses plain controls. Reload to try again.</p>
    <p-inline-notification id="error" state="error" dismiss-button="false" role=${state.pds ? nothing : "alert"}
      ?hidden=${!state.error}>${state.error}</p-inline-notification>
    <p-text id="status" role="status" aria-live="polite">${state.status}</p-text>
    ${loaded ? html`${scopeSection()}${folderSection()}${settingsSections()}${acrossSection()}${machineSection()}`
      : packSection()}`;
}

guard(unsaved);
document.addEventListener("owlbear-machine", async () => {
  if (!state.machine) return;
  await readMachine();
  show();
});

// PDS loads from its CDN (TD-39, no local delivery), so the page picks its controls once.
state.pds = await designSystem(["p-select", "p-input-text", "p-checkbox", "p-button", "p-table"]);
show();
await reload();
show();
await readAcross();
show();
await readPack();
await readModels();
</script>
</body>
</html>
