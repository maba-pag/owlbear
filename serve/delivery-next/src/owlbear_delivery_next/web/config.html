<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Settings</title>
<link rel="stylesheet" href="/assets/pds/4.10.1/index.css">
<script type="module">
  import { load } from "/assets/pds/4.10.1/load.mjs";

</script>
<!-- base -->
<style>
  p-text:empty { display: none !important; }
  .row { align-items: end; gap: var(--p-spacing-static-md); }
  #scope { min-width: 16rem; }
  p-table-cell p-input-text, p-table-cell p-select { min-width: 11rem; }
  /* A number needs a number's width, not the column's or the panel's. */
  p-table-cell p-input-text:is([inputmode="numeric"], [inputmode="decimal"]) { max-inline-size: 14rem; }
  :is([id^="machine-"], [id^="global-machine-"]):is(p-input-text, p-select):not([id$="enrolled_chats"]) {
    max-inline-size: 32rem;
  }
  details.panel > summary { font-size: var(--p-typescale-md); }
  details.panel[open] { gap: var(--p-spacing-static-md); }
  /* The groups (D-01M63C8QQMANY46N8GMNNKH1V9), like the top row's pages: the one shown underlined. */
  #groups { display: flex; flex-wrap: wrap; gap: 0 var(--p-spacing-static-lg); }
  #groups a {
    display: inline-flex; align-items: center; gap: var(--p-spacing-static-sm); min-block-size: 2.5rem;
    color: var(--p-color-contrast-high); text-decoration: none; text-underline-offset: .35em;
  }
  #groups a:hover { text-decoration: underline; text-decoration-thickness: 1px; }
  #groups a[aria-current="page"] {
    color: var(--p-color-primary); font-weight: var(--p-font-weight-semibold);
    text-decoration: underline; text-decoration-thickness: 2px;
  }
  #unset a { color: var(--p-color-primary); text-underline-offset: .2em; }
  .compaction-link { display: inline-block; min-block-size: 24px; line-height: 24px; }
  .field { display: grid; gap: var(--p-spacing-static-xs); }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Settings</h1></p-heading>
</header>
<div id="page"></div>
</main>
<!-- ask -->
<script type="module" src="/assets/page/config/main.mjs"></script>
</body>
</html>
