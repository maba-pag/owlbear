<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Changes</title>
<style>
  body {
    font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 56rem; padding: 0 1rem; color: #222;
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  tr.row { cursor: pointer; } tr.row:hover, tr.row:focus { background: #f3f3f3; }
  section { margin-top: 1.5rem; } fieldset { border: 1px solid #ccc; margin: .8rem 0; }
  .muted { color: #666; } .error { color: #a00; } textarea { width: 100%; }
  .stale { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<h1>Changes</h1>
<p id="error" class="error" role="alert"></p>
<p id="seen" class="muted"></p>
<table id="list" aria-label="Changes">
<thead><tr><th scope="col">Change</th><th scope="col">Status</th><th scope="col">Next action</th></tr></thead>
<tbody id="changes"></tbody></table>
<section id="detail" aria-live="polite"></section>
<script>
"use strict";
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("token")) {
  sessionStorage.setItem("token", hash.get("token"));
  history.replaceState(null, "", location.pathname);
}
const token = sessionStorage.getItem("token");
let selected = null, lastSeen = null, busy = false;

class HostDown extends Error {}
class Restarted extends Error {}

async function call(path, body) {
  const init = { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(5000) };
  if (body) {
    init.method = "POST";
    init.body = JSON.stringify(body);
    init.headers["Content-Type"] = "application/json";
  }
  let response;
  try {
    response = await fetch(`/api/next${path}`, init);
  } catch {
    throw new HostDown();
  }
  if (response.status === 401 && token) throw new Restarted();
  const data = await response.json();
  if (!response.ok) {
    throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
  }
  return data;
}

function el(tag, text, attrs = {}) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
}

function send(path, body) {
  call(`/changes/${selected}${path}`, body).then(() => {
    document.activeElement.blur();
    return refresh();
  }, failed);
}

function unreachable(e) {
  const error = document.getElementById("error");
  if (e instanceof Restarted) {
    error.replaceChildren("Delivery restarted at a new address — open the link from chat or ",
      el("code", "owlbear-next status"), ".");
  } else {
    error.replaceChildren("Delivery is not running. Start it with the VS Code task \"OwlBear Delivery host\" or ",
      el("code", "owlbear-next host"), " in the project, then reload this page.");
  }
  for (const id of ["list", "detail"]) document.getElementById(id).classList.add("stale");
  if (lastSeen) document.getElementById("seen").textContent = `last seen ${lastSeen.toLocaleTimeString()}`;
}

function failed(e) {
  if (e instanceof HostDown || e instanceof Restarted) return unreachable(e);
  const hint = "Open the URL the host printed, including #token=…";
  document.getElementById("error").textContent = token ? e.message : hint;
}

function questionForm(q) {
  const form = el("form"), box = el("fieldset");
  box.append(el("legend", `Question ${q.id}: ${q.text}`));
  for (const o of q.options) {
    const label = el("label"), radio = el("input", undefined, { type: "radio", name: "option", value: o.id });
    label.append(radio, ` ${o.label}`);
    box.append(label, el("br"));
  }
  const text = el("textarea", undefined, { name: "text", rows: "2", "aria-label": "Your answer in words" });
  box.append(text, el("button", "Answer", { type: "submit" }));
  form.append(box);
  form.onsubmit = (event) => {
    event.preventDefault();
    const option = form.querySelector("input[name=option]:checked");
    send("/answers", { question: q.id, option: option ? option.value : null, text: text.value });
  };
  return form;
}

function checkForm(check) {
  const box = el("fieldset"), note = el("textarea", undefined, { rows: "2", "aria-label": "Note" });
  box.append(el("legend", `Check ${check.id}`), el("p", check.steps.join("; ")));
  if (check.url) {
    const link = el("a", check.url, { href: check.url, target: "_blank", rel: "noopener" });
    box.append(el("p", "Open: "), link);
  }
  const pass = el("button", "Passed", { type: "button" }), fail = el("button", "Failed", { type: "button" });
  const result = (passed) => ({ check: check.id, passed, note: note.value, inputs: check.inputs });
  pass.onclick = () => send("/check-results", result(true));
  fail.onclick = () => send("/check-results", result(false));
  box.append(note, pass, fail);
  return box;
}

function mergeForm(m) {
  const box = el("fieldset"), links = el("p"), list = el("ul");
  box.append(el("legend", `Merge PR #${m.pr} (${m.method})`));
  links.append(el("a", `PR #${m.pr}`, { href: m.url, target: "_blank", rel: "noopener" }), " · ",
    el("a", "Diff summary", { href: m.diff, target: "_blank", rel: "noopener" }));
  box.append(links, el("p", `Exact head: ${m.head}`));
  if (m.void) box.append(el("p", `Changed since ${m.void.slice(0, 7)}: ${m.delta}`, { class: "error" }));
  for (const c of m.checks) list.append(el("li", `${c.name}: ${c.state}`));
  if (!m.checks.length) list.append(el("li", "no checks reported"));
  const approve = el("button", `Approve merging ${m.head.slice(0, 7)}`, { type: "button" });
  approve.onclick = () => send("/merge-consent", { head: m.head });
  box.append(el("p", "Checks at this head:"), list, approve);
  return box;
}

async function showDetail() {
  const target = document.getElementById("detail");
  if (!selected) return target.replaceChildren();
  const d = await call(`/changes/${selected}`);
  const parts = [el("h2", d.slug), el("p", d.line), el("p", d.brief.outcome, { class: "muted" })];
  if (d.question) parts.push(questionForm(d.question));
  if (d.merge) parts.push(mergeForm(d.merge));
  const pause = el("button", d.paused ? "Resume" : "Pause", { type: "button" });
  pause.onclick = () => send("/intent", { intent: d.paused ? "resume" : "pause" });
  parts.push(pause);
  for (const check of d.checks.filter((c) => c.waiting)) parts.push(checkForm(check));
  if (d.step === "shape" && d.brief.approved !== d.brief.version) {
    const list = el("ul");
    for (const k of d.criteria) list.append(el("li", `${k.id}: ${k.text}`));
    for (const c of d.checks) list.append(el("li", `Your check ${c.id}: ${c.steps.join("; ")}`));
    const approve = el("button", `Approve brief v${d.brief.version}`, { type: "button" });
    approve.onclick = () => send("/approve-brief", { version: d.brief.version });
    parts.push(el("h3", `Brief v${d.brief.version}: ${d.brief.title}`), list, approve);
  }
  const log = el("ol", undefined, { class: "muted" });
  for (const e of d.activity.slice(-8)) {
    log.append(el("li", `${e.at || ""} ${e.event || ""} ${e.exit || e.tool || e.reason || ""}`));
  }
  parts.push(el("h3", "Recent activity"), log);
  const editing = target.contains(document.activeElement) && document.activeElement.matches("textarea, input");
  if (!editing) target.replaceChildren(...parts);
}

async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const rows = (await call("/changes")).map((c) => {
      const row = el("tr", undefined, { class: "row", tabindex: "0" });
      row.append(el("td", c.slug), el("td", c.line), el("td", c.action || "—"));
      row.onclick = row.onkeydown = (event) => {
        if (event.type === "click" || event.key === "Enter") { selected = c.slug; refresh(); }
      };
      return row;
    });
    document.getElementById("changes").replaceChildren(...rows);
    lastSeen = new Date();
    document.getElementById("error").textContent = document.getElementById("seen").textContent = "";
    for (const id of ["list", "detail"]) document.getElementById(id).classList.remove("stale");
    await showDetail();
  } catch (e) {
    failed(e);
  } finally {
    busy = false;
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
