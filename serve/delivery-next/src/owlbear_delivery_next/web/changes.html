<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Changes</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  #page > p-text:empty { display: none !important; }
  main { max-width: 90rem; }
  #board { display: grid; gap: var(--p-spacing-fluid-md); align-items: start; }
  #list, #detail { display: grid; gap: var(--p-spacing-fluid-sm); align-content: start; min-width: 0; }
  #board:not(.open) #detail { display: none; }
  #board:not(.open) .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); }
  @media (min-width: 64rem) {
    #board.open { grid-template-columns: minmax(20rem, 26rem) minmax(0, 1fr); }
  }
  @media (max-width: 63.99rem) {
    #board.open #list { display: none; }
  }
  /* The list: one card per Change, grouped by who acts next. */
  .group { display: grid; gap: var(--p-spacing-static-sm); }
  .group > summary { font-size: var(--p-typescale-md); }
  .cards { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .card {
    position: relative; display: grid; gap: var(--p-spacing-static-xs); align-content: start;
    padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg); box-shadow: inset 0 0 0 1px transparent;
  }
  .card:hover { box-shadow: inset 0 0 0 1px var(--p-color-contrast-low); }
  .card.current { box-shadow: inset 0 0 0 2px var(--p-color-primary); }
  .card:has(.open:focus-visible) { outline: 2px solid var(--p-color-focus); outline-offset: 2px; }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: var(--p-spacing-static-sm); }
  .card .open {
    min-width: 0; overflow-wrap: anywhere; color: inherit; font-size: var(--p-typescale-sm); font-weight: 600;
    text-decoration: none;
  }
  .card .open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .card .open:focus-visible { outline: none; }
  .says, .next, .meta { margin: 0; overflow-wrap: anywhere; }
  .says { font-size: var(--p-typescale-sm); }
  .card .says { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .stage { font-weight: 600; }
  .next { font-size: var(--p-typescale-sm); font-weight: 600; }
  .meta { font-size: var(--p-typescale-xs); color: var(--p-color-contrast-medium); }
  .meta.warn { color: var(--p-color-warning); }
  /* The detail: who acts first, then what Delivery knows. */
  .detail-head {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: var(--p-spacing-static-sm);
  }
  .detail-head .back { grid-column: 1 / -1; justify-self: start; }
  .detail-head h2 { overflow-wrap: anywhere; }
  .act { box-shadow: inset 0 0 0 1px var(--p-color-contrast-low); }
  #changes { display: grid; gap: var(--p-spacing-fluid-sm); }
  .info { padding-top: var(--p-spacing-static-md); border-top: 1px solid var(--p-color-contrast-lower); }
  .panel > p-button, .panel > p-link-pure, .panel > button, .panel > a { justify-self: start; }
  .brief, .gallery { display: grid; gap: var(--p-spacing-static-sm); }
  /* The brief: the agreement first, each part with room around it; details collapsed below. */
  .brief { gap: var(--p-spacing-static-md); }
  .brief section { display: grid; gap: var(--p-spacing-static-xs); }
  .said { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .said li { display: grid; gap: 2px; overflow-wrap: anywhere; }
  .said .label { font-size: var(--p-typescale-sm); color: var(--p-color-contrast-medium); }
  .brief details { display: grid; gap: var(--p-spacing-static-xs); }
  .brief details > :not(summary) { margin-block-start: var(--p-spacing-static-xs); }
  .brief summary .count { display: block; font-size: var(--p-typescale-xs); color: var(--p-color-contrast-medium); }
  .plan, .log { display: grid; gap: var(--p-spacing-static-xs); padding: 0; list-style: none; }
  .plan li { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--p-spacing-static-sm); }
  .plan li > details, .rounds details { flex-basis: 100%; font-size: var(--p-typescale-xs); }
  .marks { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: var(--p-spacing-static-xs); }
  .log li { display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: var(--p-spacing-static-sm); }
  .log time { font-size: var(--p-typescale-xs); color: var(--p-color-contrast-medium); }
  .shots {
    display: grid; gap: var(--p-spacing-static-md);
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 34rem), 1fr));
  }
  .pair {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--p-spacing-static-xs) var(--p-spacing-static-sm);
    margin: 0;
  }
  .pair figcaption { grid-column: 1 / -1; font-size: var(--p-typescale-xs); font-weight: 600; }
  .side { display: grid; gap: 2px; align-content: start; font-size: var(--p-typescale-xs); }
  .shots img, .missing {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: top center;
    border: 1px solid var(--p-color-contrast-lower); border-radius: var(--p-radius-md); box-sizing: border-box;
  }
  .zoom { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .missing {
    display: grid; place-items: center; padding: var(--p-spacing-static-sm); text-align: center;
    border-style: dashed; border-color: var(--p-color-contrast-low);
  }
  dialog.lightbox {
    width: 96vw; max-width: none; max-height: 96vh; padding: var(--p-spacing-static-sm); border: 0;
    border-radius: var(--p-radius-lg); background: var(--p-color-canvas); color: var(--p-color-primary);
  }
  dialog.lightbox::backdrop { background: var(--p-color-backdrop, rgb(0 0 0 / .7)); }
  .lightbox .frame { overflow: auto; max-height: calc(96vh - 5rem); margin-top: var(--p-spacing-static-sm); }
  .lightbox img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .lightbox .caption { flex: 1; margin: 0; text-align: center; font-size: var(--p-typescale-sm); }
  .finding { display: grid; gap: var(--p-spacing-static-xs); padding-block: var(--p-spacing-static-xs); }
  .finding + .finding { border-top: 1px solid var(--p-color-contrast-lower); }
  /* The stepper: the Change's stages in order, the current one marked, a loop badge on those that looped. */
  .stepper { display: grid; gap: var(--p-spacing-static-xs); margin: 0; padding-left: 1.5rem; }
  .stepper li { position: relative; padding-left: var(--p-spacing-static-xs); }
  .stepper li > span { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: var(--p-spacing-static-sm); }
  .stepper [aria-current="step"] { font-weight: 600; }
  .stepper .skipped { color: var(--p-color-contrast-medium); }
  .loops { font-size: var(--p-typescale-xs); font-weight: 600; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  .stale { opacity: .45; pointer-events: none; }
  .no-pds .card .open { text-decoration: underline; }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Changes</h1></p-heading>
  <span id="header-actions"></span>
</header>
<div id="page"></div>
</main>
<!-- ask -->
<script type="module">
import { html, nothing, render } from "/assets/lit-html/3.3.3/lit-html.js";
import { live } from "/assets/lit-html/3.3.3/directives/live.js";
import { repeat } from "/assets/lit-html/3.3.3/directives/repeat.js";
import { call as host, designSystem, HostDown, Restarted, token } from "/assets/ui.mjs";

const TITLE = document.title;
const SLUG = /^[a-z0-9][a-z0-9-]{0,63}$/;
const DIALOG = "{ 'aria-haspopup': 'dialog' }";  // PDS's aria property, for a button that opens a dialog
const REVERT = "Reversing the merge needs a revert you make yourself.";
// Everything the page shows comes from here (TD-264): the list and the detail as last read, the owner's unsent input
// per form (drafts: form key -> its fields), which toggles are open (by their summary), and the notes above.
const state = {
  pds: true, changes: null, detail: null, notes: [], selected: null, started: null, error: null, seen: "",
  stale: false, refused: null, drafts: new Map(), opened: new Set(), doneOpen: false, creating: false,
};
let busy = false, again = false, lastSeen = null, arrived = false;

function show() {
  const focused = document.activeElement;
  render(view(), document.getElementById("page"));
  render(button("New Change", newChange, { icon: "add", aria: DIALOG, busy: state.creating }),
    document.getElementById("header-actions"));
  if (focused?.isConnected && document.activeElement !== focused && !document.querySelector("dialog[open]")) {
    focused.focus({ preventScroll: true });
  }
  document.title = youCount() ? `(${youCount()}) ${TITLE}` : TITLE;
}

function call(path, body) {
  return host(path, body === undefined ? {} : { body });
}

function draft(key, fresh) {
  if (!state.drafts.has(key)) state.drafts.set(key, fresh());
  return state.drafts.get(key);
}

// A toggle whose open state survives every render, kept under *key*: its summary, unless that changes as it runs.
function toggle(key, summary, ...children) {
  const toggled = (e) => (e.target.open ? state.opened.add(key) : state.opened.delete(key));
  return html`<details .open=${state.opened.has(key)} @toggle=${toggled}><summary>${summary}</summary>
    ${children}</details>`;
}

function disclosure(summary, ...children) {
  return toggle(summary, summary, ...children);
}

function unreachable(e) {
  state.error = e instanceof Restarted
    ? html`Delivery restarted at a new address — open the link from chat or <code>owlbear-next status</code>.`
    : html`Delivery is not running. Start it with the VS Code task "OwlBear Delivery host" or
      <code>owlbear-next host</code> in the project, then reload this page.`;
  state.stale = true;
  if (lastSeen) state.seen = `last seen ${lastSeen.toLocaleTimeString()}`;
}

function failed(e) {
  if (e instanceof HostDown || e instanceof Restarted) unreachable(e);
  else state.error = token ? e.message : "Open the URL the host printed, including #token=…";
  show();
}

function notify(message) {
  state.error = message;
  show();
}

// The forms the detail shows, as a key: a refusal stays beside them until they change.
function formsOf(d) {
  const r = d.visual_round, asked = d.checks.filter((c) => c.waiting).map((c) => [c.id, c.url, c.inputs]);
  return JSON.stringify([d.slug, d.question?.id, d.question?.options?.map((o) => o.id), d.merge?.head, asked,
    d.brief.version, d.brief.approved, d.pullback?.state, d.paused, r?.number, r?.outcome,
    d.owner_criteria.map((k) => k.id), d.retry?.attempt, d.retry?.head]);
}

// One action of the owner on the shown Change. A refusal goes beside the form that was used (*form*), so it is seen
// where he is looking; the poll keeps it until the forms change. True once the host took it.
async function send(path, body, d, form = "") {
  try {
    await call(`/changes/${d.slug}${path}`, body);
  } catch (e) {
    if (e instanceof HostDown || e instanceof Restarted || state.selected !== d.slug) return failed(e) && false;
    state.refused = { forms: formsOf(d), form, text: e.message };
    show();
    document.querySelector("#detail .refused")?.scrollIntoView({ block: "nearest" });
    return false;
  }
  state.refused = null;
  if (form) state.drafts.delete(form);
  document.activeElement?.blur?.();
  await refresh();
  return true;
}

function button(label, onclick, { icon, variant, aria, busy = false, disabled = false, title, keys, cls } = {}) {
  return state.pds
    ? html`<p-button type="button" compact="true" icon=${icon ?? nothing} variant=${variant ?? nothing}
        aria=${aria ?? nothing} title=${title ?? nothing} aria-keyshortcuts=${keys ?? nothing} class=${cls ?? nothing}
        .loading=${busy} ?disabled=${disabled} @click=${onclick}>${label}</p-button>`
    : html`<button type="button" title=${title ?? nothing} aria-keyshortcuts=${keys ?? nothing}
        class=${cls ?? nothing} .disabled=${busy || disabled} @click=${onclick}>${label}</button>`;
}

function external(label, href) {
  let web = false;
  try {
    web = ["http:", "https:"].includes(new URL(href).protocol);
  } catch {
    web = false;
  }
  if (!web) return html`<p-text>${label}</p-text>`;
  const link = html`<a href=${href} target="_blank" rel="noopener">${label}</a>`;
  return state.pds ? html`<p-link-pure icon="external">${link}</p-link-pure>` : link;
}

// A text field bound to the draft field *name* of form *key*.
function field(key, name, label, rows = "2") {
  const d = draft(key, () => ({})), keep = (e) => { d[name] = e.target.value ?? ""; };
  return state.pds
    ? html`<p-textarea label=${label} rows=${rows} .value=${live(d[name] ?? "")} @input=${keep}
        @change=${keep}></p-textarea>`
    : html`<label class="field">${label}<textarea rows=${rows} .value=${live(d[name] ?? "")}
        @input=${keep}></textarea></label>`;
}

// Radio choices bound to the draft field *name* of form *key*; re-rendering never changes the choice, and a choice
// the data no longer offers is dropped, so nothing unseen is sent.
function choice(key, name, label, options) {
  const d = draft(key, () => ({})), pick = (v) => { d[name] = v; show(); };
  if (d[name] !== undefined && !options.some((o) => o.id === d[name])) delete d[name];
  if (state.pds) {
    return html`<p-radio-group name=${`${key}-${name}`} label=${label} .value=${live(d[name] ?? "")}
      @change=${(e) => pick(e.target.value)}>${options.map((o) => html`<p-radio-group-option value=${o.id}
      label=${o.label}></p-radio-group-option>`)}</p-radio-group>`;
  }
  return html`<fieldset><legend>${label}</legend>${options.map((o) => html`<label><input type="radio"
    name=${`${key}-${name}`} value=${o.id} .checked=${live(d[name] === o.id)} @change=${() => pick(o.id)}>
    ${o.label}</label>`)}</fieldset>`;
}

function tick(label, checked, flipped) {
  const flip = (e) => flipped(e.target.checked === true);
  return state.pds
    ? html`<p-checkbox label=${label} .checked=${live(checked)} @change=${flip}></p-checkbox>`
    : html`<label><input type="checkbox" .checked=${live(checked)} @change=${flip}> ${label}</label>`;
}

function hd(level, title, size, { tabindex } = {}) {
  const t = { 2: html`<h2 tabindex=${tabindex ?? nothing}>${title}</h2>`, 3: html`<h3>${title}</h3>`,
    4: html`<h4>${title}</h4>`, 5: html`<h5>${title}</h5>` }[level];
  return html`<p-heading size=${size}>${t}</p-heading>`;
}

function text(value, { size, weight, color, tag } = {}) {
  return html`<p-text size=${size ?? nothing} weight=${weight ?? nothing} color=${color ?? nothing}
    tag=${tag ?? nothing}>${value}</p-text>`;
}

function list(items, ordered = false) {
  const lis = items.map((i) => html`<li>${i}</li>`);
  return ordered ? html`<ol>${lis}</ol>` : html`<ul>${lis}</ul>`;
}

function row(...children) {
  return html`<div class="row">${children}</div>`;
}

// Something the owner acts on: a framed panel; the status line above already says it is his turn.
function panel(title, form, ...children) {
  const refused = state.refused?.form === form && form ? refusal(state.refused.text) : nothing;
  return html`<section class="panel act">${hd(3, title, "md")}${children}${refused}</section>`;
}

// What Delivery knows about the Change: a plain section under a rule.
function info(title, ...children) {
  return html`<section class="info">${hd(3, title, "md")}${children}</section>`;
}

function notice(kind, title, ...lines) {
  if (!state.pds) return html`<section class="panel act">${hd(3, title, "md")}${lines.map((l) => text(l))}</section>`;
  return html`<p-inline-notification state=${kind} heading=${title} heading-tag="h3" description=${lines.join(" ")}
    dismiss-button="false"></p-inline-notification>`;
}

function refusal(said) {
  return html`<div class="refused">${notice("error", "Not done", said)}</div>`;
}

function meta(value, cls = "meta") {
  return html`<span class=${cls}>${value}</span>`;
}

function questionForm(q, d) {
  const key = `${d.slug}:question:${q.id}`, mine = draft(key, () => ({}));
  if (mine.option !== undefined && !q.options.some((o) => o.id === mine.option)) delete mine.option;  // withdrawn
  const answer = async () => {
    const picked = q.options.some((o) => o.id === mine.option) ? mine.option : null, words = mine.text ?? "";
    const chosen = q.options.find((o) => o.id === picked), told = chosen && consequence(chosen, d);
    if (told && !(await ask(told))) return;
    send("/answers", { question: q.id, option: picked, text: words }, d, key);
  };
  return panel(`Question ${q.id}`, key, text(q.text, { weight: "semibold" }),
    q.options.length ? choice(key, "option", "Choose an option", q.options) : nothing,
    field(key, "text", "Your answer in words"), button("Answer", answer));
}

// The owner's choice after the final review's last round (TD-217): the plan tasks to rebuild, those with an open
// finding ticked for him; with none ticked the work is accepted as done. A kept task that shares changed files with a
// ticked one may depend on it: said beside it, above the button and in the confirmation.
function retryForm(q, r, d) {
  const key = `${d.slug}:retry:${q.id}:${r.attempt}:${r.head}`;
  const mine = draft(key, () => ({ ticked: r.tasks.filter((t) => t.ticked).map((t) => t.id) }));
  const ticked = () => r.tasks.filter((t) => mine.ticked.includes(t.id)).map((t) => t.id);
  const risks = () => {
    const on = new Set(ticked());
    return r.tasks.filter((t) => !on.has(t.id)).map((t) => [t, t.shares.filter((x) => on.has(x))])
      .filter(([, hit]) => hit.length).map(([t, hit]) => `${t.id} may depend on ${hit.join(", ")}: they share `
        + "changed files");
  };
  const said = risks(), n = ticked().length;
  const flip = (id) => (on) => {
    mine.ticked = on ? [...new Set([...mine.ticked, id])] : mine.ticked.filter((x) => x !== id);
    show();
  };
  const decide = async () => {
    const picked = ticked(), why = risks();
    const titled = picked.map((id) => `${id}: ${r.tasks.find((t) => t.id === id).title}`);
    const sure = await ask(picked.length ? {
      title: `Rebuild ${picked.length} task${picked.length > 1 ? "s" : ""}?`, yes: "Rebuild", no: "Back to the tasks",
      now: "Delivery undoes the work of these tasks and their repairs in one commit on the branch; the rejected head "
        + "stays archived on a branch:", items: [...titled, ...why.map((s) => `Kept: ${s}`)],
      then: "Fresh builders build them again in plan order, each reviewed in its own rounds; the last one also runs "
        + "every other task's checks. The final review then looks at the result once more. This uses AI credits.",
      after: "An approval to merge no longer counts.",
      instead: "The question stays open.",
    } : {
      title: "Accept as done?", yes: "Accept as done", no: "Back to the tasks",
      now: "The final review completes; its remaining findings are recorded as accepted by you.",
      then: `Delivery publishes the Change. ${merging(d)}.`,
      instead: "The question stays open.",
    });
    if (sure) {
      const body = picked.length ? { option: "rebuild", tasks: picked, attempt: r.attempt, head: r.head }
        : { option: "accept" };
      send("/answers", { question: q.id, ...body }, d, key);
    }
  };
  const replan = async () => {
    const option = mine.from;
    if (!option) return notify("Choose where planning starts from: the existing code or a clean state.");
    if (await ask({
      title: "Plan again from the brief?", yes: "Plan again", no: "Back to the options",
      now: option === "clean" ? "Delivery undoes the Change's work in one commit, so the branch holds the target's "
        + "code again; the rejected head stays archived on a branch." : "The code stays as it is.",
      then: "The planner makes a new plan from the brief and the challenger checks it; the new plan's tasks replace "
        + "the old ones, and the final review counts its rounds anew. This uses AI credits.",
      after: "An approval to merge no longer counts.",
      instead: "The question stays open.",
    })) send("/answers", { question: q.id, option }, d, key);
  };
  return panel(`Question ${q.id}`, key, text(q.text, { weight: "semibold" }), hd(4, "Plan tasks to rebuild", "sm"),
    r.tasks.map((t) => html`${tick(`${t.id}: ${t.title}`, mine.ticked.includes(t.id), flip(t.id))}
      ${taskRounds(t.id, d, " (rebuild list)")}
      ${text(said.find((s) => s.startsWith(`${t.id} `)) ?? "", { size: "xs" })}`),
    html`<div>${said.map((s) => text(s, { size: "xs", weight: "semibold" }))}</div>`,
    row(button(n ? `Rebuild ${n} task${n > 1 ? "s" : ""}` : "Accept as done", decide, { icon: "check", aria: DIALOG }),
      button("Another round", () => send("/answers", { question: q.id, option: "another" }, d, key),
        { variant: "secondary" })),
    choice(key, "from", "Plan again from the brief, starting from", [
      { id: "replan", label: "the existing code" },
      { id: "clean", label: "a clean state: the Change's work undone" },
    ]),
    button("Plan again from the brief", replan, { variant: "secondary", aria: DIALOG }));
}

// What an answer sets off when it is more than going on: ending the Change, passing over a finding, going back.
function consequence(o, d) {
  const choices = { yes: o.label, no: "Back to the options", instead: "Choose another option." };
  if (o.next === "abandon") {
    return { title: "Abandon this Change?", yes: "Abandon", no: "Keep the Change",
      now: "The Change ends here and is marked abandoned. There is no restore.",
      then: `Delivery closes ${d.pr ? `pull request #${d.pr}` : "its pull request if one is open"}, saves work only `
        + "the worktree holds, and removes the worktree. Branches are kept.",
      after: "The branch and the saved work stay for reference; start a new Change to try again.",
      instead: "The question stays open and the Change waits for your answer." };
  }
  if (o.next === "done") {
    return { ...choices, title: `${o.label}?`,
      now: "What this question raised stays as it is; nothing is sent back to be fixed.",
      then: "Delivery goes on with the next step by itself.",
      after: "Pause at any time; a pause takes effect after the running step." };
  }
  if (o.id === "drop") {
    return { ...choices, title: "Drop this finding?",
      now: "The finding is not fixed. Your note in words tells later reviewers why.",
      then: "Delivery asks about the next disputed finding, or goes on without this one." };
  }
  if (o.next === "accept") {
    return { ...choices, title: `${o.label}?`,
      now: "Delivery cannot prove which model produced this result; you take it as it is. Its verdict still "
        + "applies, including any repair it asks for.",
      then: "Delivery goes on from this result." };
  }
  if (o.next === "shape") {
    return { ...choices, title: "Go back to the brief?",
      now: "The Change returns to its brief. Work already done is kept for now.",
      then: "Nothing runs until you revise the brief in the shaping chat and approve the new version here.",
      after: "The new brief decides which work is kept or redone." };
  }
  if (o.next === "plan") {
    return { ...choices, title: "Plan again?",
      now: "The Change returns to planning. Work already done is kept.",
      then: "The planner makes a new plan from the brief and the challenger checks it; this uses AI credits." };
  }
  return null;
}

// How the Change ends once every gate passed: the project's merge setting decides.
function merging(d) {
  return d.asks_merge ? "Delivery asks you before merging" : "Delivery merges by itself once every check passes";
}

// What an automatic merge sets off, told at the owner's last gate before it.
function finale(d) {
  const pr = d.pr ? `pull request #${d.pr}` : "the pull request";
  return `Delivery merges ${pr} into ${d.target} by itself once its checks pass, `
    + `${d.deletes_branch ? "deletes the branch, " : ""}removes the worktree after saving work only it holds, and `
    + `updates your local ${d.target} if that is safe.`;
}

const JUDGE = { design: "Design judge", correctness: "Correctness judge" };
const SEVERITY = { P0: ["Blocks the task", "error"], P1: ["Serious", "error"], P2: ["Annoying", "warning"],
  P3: ["Polish", "secondary"] };

function widthsOf(items) {
  return [...new Set(items.map((f) => f.width).filter(Boolean))].sort((a, b) => a - b);
}

function where(at, widths) {
  return widths.length ? `${at} at ${widths.join(", ")} px` : at;
}

// One problem per entry: the same judge, state, rule, severity and origin at other widths; two at one width stay two.
function problems(r) {
  const groups = new Map();
  for (const v of r.verdicts) {
    for (const f of v.findings) {
      const base = JSON.stringify([v.lens, f.state, f.rule, f.severity, f.introduced]);
      let n = 0;
      while (groups.get(`${base}#${n}`)?.items.some((seen) => seen.width === f.width)) n += 1;
      const key = `${base}#${n}`;
      if (!groups.has(key)) groups.set(key, { key, lens: v.lens, first: f, items: [] });
      groups.get(key).items.push(f);
    }
  }
  return [...groups.values()];
}

function problemRow(p, mine) {
  const [label, variant] = SEVERITY[p.first.severity] ?? [];
  const on = mine.picked.includes(p.key);
  const flip = (checked) => {
    mine.picked = checked ? [...new Set([...mine.picked, p.key])] : mine.picked.filter((k) => k !== p.key);
    show();
  };
  const said = [JUDGE[p.lens], where(p.first.state, widthsOf(p.items)), p.first.rule].filter(Boolean)
    .join(" \u00b7 ");
  return html`<div class="finding">${tick(p.first.text, on, flip)}
    ${row(label ? html`<p-tag variant=${variant} compact="true">${label}</p-tag>` : nothing,
      text(said, { size: "xs", color: "contrast-medium" }))}
    ${new Set(p.items.map((f) => f.text)).size > 1 ? disclosure("What the judge wrote at each width",
      list(p.items.map((f) => `${f.width ? `${f.width} px: ` : ""}${f.text}`))) : nothing}</div>`;
}

function verdictLine(v) {
  const said = v.verdict ?? "no verified verdict";
  const first = v.unanchored && v.unanchored !== v.verdict
    ? `, ${v.unanchored} before it saw the detector's findings` : "";
  return html`<div>${text(`${JUDGE[v.lens]}: ${said}${first}`, { weight: "semibold" })}
    ${v.reason ? text(v.reason) : nothing}</div>`;
}

// The design judge's blind preferences, mapped back to before and after.
function comparison(r) {
  const sides = new Map();
  for (const v of r.verdicts) {
    for (const [pair, side] of Object.entries(v.preferences || {})) {
      const cut = pair.lastIndexOf("-"), at = pair.slice(0, cut);
      if (!sides.has(side)) sides.set(side, new Map());
      if (!sides.get(side).has(at)) sides.get(side).set(at, []);
      sides.get(side).get(at).push(Number(pair.slice(cut + 1)));
    }
  }
  const said = [...sides].flatMap(([side, states]) => [...states].map(([at, widths]) =>
    `${side === "equal" ? "no difference" : `${side} better`} for ${where(at, widths.sort((a, b) => a - b))}`));
  return said.length ? `Without knowing which was which, the design judge found ${said.join("; ")}.` : "";
}

function detectorLines(r) {
  const seen = new Map();
  for (const s of r.detector) {
    for (const f of s.findings) {
      const key = `${f.rule} (${f.freshness})|${s.state}`;
      if (!seen.has(key)) seen.set(key, []);
      if (s.width) seen.get(key).push(s.width);
    }
  }
  return [...seen].map(([key, widths]) => {
    const [rule, at] = key.split("|");
    return `${rule} on ${where(at, [...new Set(widths)].sort((a, b) => a - b))}`;
  });
}

// The owner's decision on one visual round (TD-79): the screenshots, both verdicts, the problems he sends back,
// a comment, Pass or Fail.
function decisionForm(q, r, pictures, d) {
  const all = problems(r), key = `${d.slug}:visual:${r.number}:${r.head}`;
  const proposed = r.proposed || [];
  const mine = draft(key, () => ({ picked: all.filter((p) => p.items.some((f) => proposed.includes(f.id)))
    .map((p) => p.key) }));
  const made = all.filter((p) => p.first.introduced !== false), old = all.filter((p) => p.first.introduced === false);
  const preferred = comparison(r), evidence = detectorLines(r);
  const decide = async (option) => {
    const comment = (mine.text ?? "").trim(), chosen = made.filter((p) => mine.picked.includes(p.key));
    const findings = chosen.flatMap((p) => p.items.map((f) => f.id));
    if (option === "fail" && !findings.length && !comment) {
      return notify("To fail the round, tick a problem or write a comment.");
    }
    const instructions = chosen.flatMap((p) => (new Set(p.items.map((f) => f.text)).size > 1
      ? p.items.map((f) => `${where(f.state, widthsOf([f]))}: ${f.text}`) : [p.first.text]));
    const checks = d.checks.filter((c) => c.passed !== true).length;  // the open person checks come after the round
    const ok = await ask(option === "fail" ? {
      title: "Send these problems back to the builder?", yes: "Send back", no: "Keep reviewing",
      now: "The builder gets a fix task with:",
      items: [...instructions, ...(comment ? [`Your comment: ${comment}`] : [])],
      then: "After the fix, the reviewer checks it and both judges look again; this uses AI credits. If they do not "
        + "both pass it, Delivery may ask you again.",
      after: comment ? "Your comment stays a criterion every later round checks until you withdraw it." : "",
      instead: "The round stays open; pass it, or tick other problems.",
    } : {
      title: checks || d.asks_merge ? `Pass visual round ${r.number}?`
        : `Pass visual round ${r.number}, the last step before merging?`,
      yes: checks || d.asks_merge ? "Pass" : "Pass and merge", no: "Keep reviewing",
      now: "No problem of this round goes to the builder." + (comment ? " Your comment is kept as a note only." : ""),
      then: checks ? `Your check${checks > 1 ? "s" : ""} come${checks > 1 ? "" : "s"} next. ${merging(d)}.`
        : d.asks_merge ? "Delivery asks you before merging." : finale(d),
      after: checks || d.asks_merge ? "Until the merge, comments on the pull request come back to Delivery as work."
        : REVERT,
      instead: "The round stays open for your decision.",
    });
    if (ok) {
      const round = { round: r.number, head: r.head, pack: r.pack };
      send("/answers", { question: q.id, option, text: comment, ...round, findings }, d, key);
    }
  };
  return panel(`Decide visual round ${r.number} of ${r.head.slice(0, 7)}`, key, pictures,
    hd(4, "Verdicts", "sm"), r.verdicts.map(verdictLine),
    made.length ? html`${hd(4, "Problems this Change introduced", "sm")}${text("Blocking, serious and annoying "
      + "problems and any missed criterion of yours are ticked for you; a Fail sends the ticked ones to the "
      + "builder.")}${made.map((p) => problemRow(p, mine))}` : nothing,
    old.length ? disclosure(`Already there before the Change: ${old.length} (never sent to the build)`,
      list(old.map((p) => `${where(p.first.state, widthsOf(p.items))}: ${p.first.text}`))) : nothing,
    preferred ? text(preferred, { size: "xs" }) : nothing,
    evidence.length ? disclosure("What the design detector found (evidence for the judges)", list(evidence))
      : nothing,
    field(key, "text", "Comment: on Fail it becomes a criterion every later round checks until you withdraw it; on "
      + "Pass it is only a note"),
    row(button("Pass", () => decide("pass"), { icon: "check", aria: DIALOG }),
      button("Fail", () => decide("fail"), { variant: "secondary", icon: "close", aria: DIALOG })));
}

function criteriaPanel(d) {
  return info("Your visual criteria", text("Every later visual round checks these until you withdraw them."),
    d.owner_criteria.map((k) => {
      const withdraw = async () => {
        const stop = await ask({
          title: `Stop checking ${k.id}?`, yes: "Stop checking", no: "Keep it",
          now: `“${k.text}” is no longer checked in later visual rounds; it stays in this Change's history.`,
          after: "There is no restore. A comment on a later Fail adds a new criterion.",
          instead: "Every later visual round keeps checking it.",
        });
        if (stop) send(`/criteria/${encodeURIComponent(k.id)}/withdraw`, {}, d);
      };
      return row(text(`${k.id}: ${k.text}`), button("Withdraw", withdraw, { variant: "secondary", aria: DIALOG }));
    }));
}

function checkForm(check, d) {
  const key = `${d.slug}:check:${check.id}:${JSON.stringify(check.inputs)}`, mine = draft(key, () => ({}));
  const result = (passed) => ({ check: check.id, passed, note: mine.note ?? "", inputs: check.inputs });
  const last = !d.asks_merge && d.checks.every((c) => c.id === check.id || c.passed === true);
  const passed = async () => {
    const body = result(true);
    if (last && !(await ask({
      title: `Pass ${check.id}, the last step before merging?`, yes: "Pass and merge", no: "Not yet",
      now: `${check.id} is recorded as passed.`,
      then: `It is the last check. ${finale(d)}`,
      after: REVERT,
      instead: "Nothing merges; the check stays open.",
    }))) return;
    send("/check-results", body, d, key);
  };
  const failedCheck = async () => {
    const why = (mine.note ?? "").trim(), body = result(false);
    if (!why) return notify("Say what failed: the builder gets it as the fix task.");
    if (await ask({
      title: `Report ${check.id} as failed?`, yes: "Send to the builder", no: "Keep checking",
      now: "The builder gets this fix task:", items: [why],
      then: "Delivery fixes it, reviews the fix and prepares the check again; this uses AI credits. Then it asks you "
        + "to check again.",
      instead: "The check stays open; you can still mark it passed.",
    })) send("/check-results", body, d, key);
  };
  return panel(`Your check ${check.id}`, key, list(check.steps, true),
    check.expect ? text(`Expected: ${check.expect}`, { weight: "semibold" }) : nothing,
    check.url ? row(external("Open the preview", check.url),
      text(check.url, { size: "xs", color: "contrast-medium", tag: "span" })) : nothing,
    field(key, "note", "What failed (needed for Failed; the builder gets it as the fix task)"),
    row(button("Passed", passed, { icon: "check", aria: last ? DIALOG : undefined }),
      button("Failed", failedCheck, { variant: "secondary", icon: "close", aria: DIALOG })));
}

const CHECKED = { passed: "success", success: "success", failed: "error", failure: "error", error: "error" };

function mergeForm(m, d) {
  const head = m.head.slice(0, 7), key = `${d.slug}:merge:${m.head}`;
  const approve = async () => {
    const sure = await ask({
      title: `Merge pull request #${m.pr} at ${head}?`, yes: "Merge", no: "Not now",
      now: `Delivery merges exactly ${head} into ${d.target} (${m.method}). If the pull request gets a new head `
        + "first, this approval no longer counts.",
      then: `It checks the gates once more, merges, ${d.deletes_branch ? "deletes the branch, " : ""}removes the `
        + `worktree after saving work only it holds, and updates your local ${d.target} if that is safe.`,
      after: `The change is on ${d.target}; reversing it needs a revert you make yourself.`,
      instead: "Nothing merges. The pull request stays open; comments on it come back to Delivery as work.",
    });
    if (sure) send("/merge-consent", { head: m.head }, d, key);
  };
  return panel(`Merge PR #${m.pr}`, key,
    text(`Delivery merges this exact head (${m.method}) once you approve it; a new head needs a fresh approval.`),
    row(external(`PR #${m.pr}`, m.url), external("Diff summary", m.diff)),
    m.void ? text(`Changed since ${m.void.slice(0, 7)}: ${m.delta}`, { color: "error" }) : nothing,
    text("Checks at this head", { size: "xs", weight: "semibold" }),
    m.checks.length ? row(m.checks.map((c) => html`<p-tag variant=${CHECKED[c.state] ?? "secondary"}
      compact="true">${c.name}: ${c.state}</p-tag>`)) : text("No checks reported", { size: "xs",
      color: "contrast-medium" }),
    text(`Head ${m.head}`, { size: "xs", color: "contrast-medium" }),
    button(`Approve merging ${head}`, approve, { icon: "check", aria: DIALOG }));
}

function restartButton(d) {
  const restart = async () => {
    const sure = await ask({
      title: "Restart the final review loop?", yes: "Restart", no: "Keep it",
      now: "A fresh final review starts at round 1 and reviews the whole Change; this uses AI credits.",
      then: "Its findings go to a builder as before, under the same round rules.",
      after: "The earlier rounds stay in this Change's history. An open question about them closes, and an approval "
        + "to merge no longer counts.",
      instead: "The review loop goes on as it is.",
    });
    if (sure) send("/restart-review", {}, d);
  };
  return button("Restart review loop", restart, { variant: "secondary", icon: "refresh", aria: DIALOG });
}

function pullbackNote(p, d) {
  const behind = p.state === "behind", title = `Pull-back: ${p.state}`;
  const pull = async () => {
    const sure = await ask({
      title: `Update your local ${d.target}?`, yes: "Update", no: "Leave it",
      now: `Delivery moves your local ${d.target} to the merged one, replaying any local commits on top; their `
        + "commit IDs change.",
      after: "If local changes touch the same files, the update stops and says why.",
      instead: `Your local ${d.target} stays behind; Pull stays here.`,
    });
    if (sure) send("/pull", {}, d);
  };
  if (!state.pds) {
    return behind ? panel(title, "", text(p.reason || ""), button("Pull", pull)) : info(title, text(p.reason || ""));
  }
  return html`<p-inline-notification state=${behind ? "warning" : "success"} heading=${title} heading-tag="h3"
    dismiss-button="false" action-label=${behind ? "Pull" : nothing} action-icon=${behind ? "refresh" : nothing}
    @action=${behind ? pull : nothing}>${p.reason || ""}</p-inline-notification>`;
}

// Screenshots load with the token once each; a loaded one renders from its object URL.
const shots = new Map();

function shot(slug, kind, name, at) {
  const key = `${slug}/${kind}/${name}/${at}`;
  if (!shots.has(key)) {
    const entry = { url: null, failed: false };
    shots.set(key, entry);
    const init = { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(5000) };
    entry.loading = fetch(`/api/next/changes/${slug}/${kind}/${encodeURIComponent(name)}`, init)
      .then((r) => (r.ok ? r.blob() : Promise.reject(new Error(r.statusText))))
      .then((b) => { entry.url = URL.createObjectURL(b); }, () => { entry.failed = true; })
      .then(() => show());
  }
  return shots.get(key);
}

// One screenshot in a gallery: a button that enlarges it, in the order before then after at each width.
function zoomable(entry, gallery) {
  const index = gallery.push(entry) - 1, side = entry.side === "before" ? "before the Change" : "with the Change";
  entry.alt = `${entry.state} at ${entry.width}px ${side}, at ${entry.commit}`;
  const s = shot(entry.slug, entry.kind, entry.name, entry.at);
  return html`<button type="button" class="zoom" aria-haspopup="dialog" @click=${() => lightbox(gallery, index)}>
    <img alt=${`Enlarge: ${entry.alt}${s.failed ? " (not available)" : ""}`} loading="lazy"
      src=${s.url ?? nothing}></button>`;
}

// The enlarged screenshots: arrow keys or buttons step through them, Escape or Close ends. Built apart from the
// page's render, so a poll never touches it.
function lightbox(gallery, start) {
  const dialog = document.createElement("dialog");
  dialog.className = "lightbox";
  dialog.setAttribute("aria-label", "Screenshots");
  let at = start, size = "";
  const draw = () => {
    const e = gallery[at], s = shot(e.slug, e.kind, e.name, e.at);
    render(html`${row(
      button("Previous", () => go(-1), { icon: "arrow-left", variant: "secondary", keys: "ArrowLeft",
        title: "Previous screenshot (left arrow)" }),
      html`<p class="caption" aria-live="polite"><strong>${e.side === "before" ? "Before" : "After"}</strong> at
        ${e.commit} \u00b7 ${e.state} \u00b7 ${e.width} px wide \u00b7 ${at + 1} of ${gallery.length}${s.failed
        ? " \u00b7 not available" : ""}${size}</p>`,
      button("Next", () => go(1), { icon: "arrow-right", variant: "secondary", keys: "ArrowRight",
        title: "Next screenshot (right arrow)" }),
      button("Close", () => dialog.close(), { icon: "close", variant: "secondary" }),
    )}<div class="frame"><img alt=${e.alt} src=${s.url ?? nothing} @load=${(ev) => {
      size = ` \u00b7 ${ev.target.naturalWidth} \u00d7 ${ev.target.naturalHeight} px`;
      draw();
    }}></div>`, dialog);
    if (!s.url && !s.failed) s.loading.then(() => { if (gallery[at] === e) draw(); });
  };
  const go = (step) => {
    at = (at + step + gallery.length) % gallery.length;
    size = "";
    draw();
  };
  dialog.addEventListener("keydown", (k) => {
    if (k.key !== "ArrowLeft" && k.key !== "ArrowRight") return;
    k.preventDefault();
    go(k.key === "ArrowLeft" ? -1 : 1);
  });
  dialog.addEventListener("click", (k) => { if (k.target === dialog) dialog.close(); });
  dialog.addEventListener("close", () => dialog.remove());
  document.body.append(dialog);
  draw();
  dialog.showModal();
}

function side(label, child) {
  return html`<div class="side"><span>${label}</span>${child}</div>`;
}

// The screenshots of a visual check and what was found: its lines, and the gallery with its count.
function visualSection(slug, v, b, existing, deciding) {
  const open = deciding || v.doubts.length;
  const [said, variant] = v.passed ? ["Passed", "success"] : open ? ["Undecided", "warning"] : ["Failed", "error"];
  const gallery = [], pairs = v.files.map((name) => {
    const [, at, width] = name.match(/^(.*)-(\d+)\.png$/);
    const kept = b && b.files.includes(name);
    const comparable = kept && b.states[at] === v.states[at];  // a revised state's old shot is no baseline
    const one = (kind, s, when, head) => zoomable(
      { slug, kind, name, at: when, side: s, state: at, width, commit: head.slice(0, 7) }, gallery);
    const before = comparable ? one("before", "before", b.at, b.head)
      : html`<span class="missing">${kept ? "Not comparable: the state changed since" : "Not available"}</span>`;
    return html`<figure class="pair"><figcaption>${at} \u00b7 ${width} px</figcaption>${side("Before", before)}
      ${side("After", one("visual", "after", v.at, v.head))}</figure>`;
  });
  const lines = html`${row(text(`Visual check of ${v.head.slice(0, 7)}`, { weight: "semibold" }),
    html`<p-tag variant=${variant} compact="true">${said}</p-tag>`)}
    ${v.findings.length ? list(v.findings) : nothing}
    ${v.doubts.length ? html`${text("The judges could not decide:", { size: "xs" })}${list(v.doubts)}` : nothing}
    ${existing.length ? text(`Errors already there before the Change: ${existing.join("; ")}`, { size: "xs" })
      : nothing}
    ${b && b.findings.length ? text(`Before: ${b.findings.join("; ")}`, { size: "xs", color: "contrast-medium" })
      : nothing}`;
  return { lines, shots: html`<div class="gallery"><div class="shots">${pairs}</div></div>`, count: gallery.length };
}

function beforeSection(slug, b) {
  const gallery = [], cells = b.files.map((name) => {
    const [, at, width] = name.match(/^(.*)-(\d+)\.png$/);
    return side(`${at} \u00b7 ${width} px`, zoomable({ slug, kind: "before", name, at: b.at, side: "before",
      state: at, width, commit: (b.head || "").slice(0, 7) }, gallery));
  });
  const seen = b.errors.map((e) => `${e.state} at ${e.width}px, ${e.kind} error: ${e.text}`);
  const lines = html`${text(`Before the Change${b.head ? `, at ${b.head.slice(0, 7)}` : ""}`, { weight: "semibold" })}
    ${b.findings.length ? text(`Not available: ${b.findings.join("; ")}`, { color: "contrast-medium" }) : nothing}
    ${b.errors.length ? text(`Errors before the Change: ${seen.join("; ")}`, { size: "xs" }) : nothing}`;
  return { lines, shots: html`<div class="shots">${cells}</div>`, count: gallery.length };
}

function count(n) {
  return n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : `${n}`;
}

// The total, then a line per model; input includes cache reads and writes, so "in" is the uncached rest.
function spendLines(spend) {
  const lines = Object.entries(spend.models).map(([model, u]) => {
    const fresh = Math.max(0, u.input - u.cache_read - u.cache_write);
    const split = u.tokens && u.input + u.output === u.tokens  // sessions recorded before the split leave it partial
      ? ` (${count(fresh)} in \u00b7 ${count(u.output)} out \u00b7 ${count(u.cache_read)} cache read \u00b7 `
        + `${count(u.cache_write)} cache write)`
      : "";
    const credits = u.credits_unread ? (u.credits ? `${u.credits.toFixed(2)}+ credits` : "credits unknown")
      : `${u.credits.toFixed(2)} credits`;
    return text(`${model}: ${credits}, ${count(u.tokens)} tokens${split}`, { size: "xs", color: "contrast-medium" });
  });
  return toggle("spend", `Spent ${spentText(spend.credits, (spend.unread || []).length)}`, lines);
}

// Credits a session did not report make the total a lower bound, never a false zero (TD-94).
function spentText(credits, unknown) {
  if (!unknown) return `${credits.toFixed(2)} credits`;
  const sessions = `unknown for ${unknown} session${unknown === 1 ? "" : "s"}`;
  return credits ? `${credits.toFixed(2)}+ credits (${sessions})` : `credits ${sessions}`;
}

function ago(iso) {
  const seconds = Math.round((Date.now() - Date.parse(iso)) / 1000);
  if (Number.isNaN(seconds)) return "";
  if (seconds < 60) return "just now";
  const minutes = Math.round(seconds / 60), hours = Math.round(minutes / 60);
  return minutes < 60 ? `${minutes} min ago` : hours < 48 ? `${hours} h ago` : `${Math.round(hours / 24)} d ago`;
}

const BOOKKEEPING = new Set(["pids", "inventory", "skill", "tasks", "preserved"]);
const SAID = {
  step: (e) => `${e.kind} step ${e.exit}${e.reason ? `: ${e.reason}` : ""}`,
  tool: (e) => e.summary || `Called ${e.tool}${e.accepted === false ? " (rejected)" : ""}`,
  session: (e) => (e.resumed ? "Session resumed" : `Session started${e.role ? ` (${e.role})` : ""}`),
  denied: (e) => `Denied: ${e.reason || e.kind}`,
  publish: (e) => `Published PR #${e.pr}`,
  ci: (e) => (e.failed?.length ? `CI failed: ${e.failed.join(", ")}`
    : `CI passed${e.passed?.length ? `: ${e.passed.join(", ")}` : ""}`),
  "merge-offer": (e) => `Merge offered for ${String(e.head || "").slice(0, 7)}`,
  "merge-request": (e) => e.message || `Merge requested (${e.status})`,
  merged: (e) => `Merged PR #${e.pr}`,
  pullback: (e) => `Pull-back ${e.state}${e.reason ? `: ${e.reason}` : ""}`,
  "ro-install": (e) => `${e.command} in ${e.package}${e.ok ? "" : " failed"}`,
  "fix-drafted": (e) => `Drafted fix Change ${e.fix}`,
  brief: (e) => `Brief v${e.version} saved`,
};

// Newest first, in words; process and inventory bookkeeping stays in the activity file.
function activityLog(events) {
  const kept = events.filter((e) => e.event && !BOOKKEEPING.has(e.event)).slice(-12).reverse();
  if (!kept.length) return text("Nothing yet.", { size: "xs", color: "contrast-medium" });
  return html`<ol class="log">${kept.map((e) => html`<li>${e.at ? html`<time datetime=${e.at}
    title=${new Date(e.at).toLocaleString()}>${ago(e.at)}</time>` : html`<span></span>`}
    <span>${(SAID[e.event] ?? ((x) => x.event))(e)}</span></li>`)}</ol>`;
}

function planList(d) {
  const working = ["build", "review", "integrate"].includes(d.step) && !d.line.startsWith("Done");
  const now = working ? d.plan.find((t) => !t.done) : null;
  return html`<ol class="plan">${d.plan.map((t) => {
    const [label, variant] = t.done ? ["done", "success"] : t === now ? ["now", "info"] : ["to do", "secondary"];
    return html`<li><p-tag variant=${variant} compact="true">${label}</p-tag><span>${t.title}${t.origin
      && t.origin !== "plan" ? html` ${meta(`from ${t.origin}`)}` : nothing}</span>${taskRounds(t.id, d)}</li>`;
  })}</ol>`;
}

// TD-217: a round's marker is its most urgent finding's kind, in words with a count; the loop's latest round is bold.
const KIND = { open: ["error", "exclamation", "open"], unverified: ["warning", "warning", "unverified"],
  settled: ["secondary", "check", "settled"] };

function marker(m) {
  const [variant, icon, word] = KIND[m.kind], said = `R${m.round} \u00b7 ${m.count} ${word}`;
  return html`<p-tag variant=${variant} icon=${icon} compact="true">${m.last ? html`<strong>${said}</strong>`
    : said}</p-tag>`;
}

function marks(label, rounds) {
  return html`<span class="marks">${meta(label)}${rounds.map(marker)}</span>`;
}

// Per loop and round its summary, then each finding with what became of it and why; a toggle, never hover-only.
// A loop may name its worker and its judge: the planner and the challenger for the plan (TD-190).
function findingDetails(summary, loops) {
  const said = (f, [worker, judge]) => [`${f.id} (${f.state}): ${f.text}`, f.reason && `${worker}: ${f.reason}`,
    f.judgement && `${judge}: ${f.judgement}`, f.note && `Your note: ${f.note}`].filter(Boolean).join(" \u00b7 ");
  return disclosure(summary, loops.flatMap(([label, rounds, who = WORKERS.task]) => rounds.map((m) => html`
    ${text(`${label}, ${m.said.charAt(0).toLowerCase()}${m.said.slice(1)}`, { size: "xs", weight: "semibold" })}
    ${list(m.findings.map((f) => said(f, who)))}`)));
}
const WORKERS = { task: ["Builder", "Reviewer"], plan: ["Planner", "Challenger"], brief: ["Shaper", "Challenger"] };
const LOOPS = (loop) => ({ final: "final review", plan: "plan challenge", brief: "brief challenge" })[loop]
  ?? `task ${loop}`;

// A plan task's markers, task review and final review apart, with their finding details; nothing without rounds.
// *where* keeps each toggle's summary unique on the page: an open toggle is kept by its summary.
function taskRounds(id, d, where = "") {
  const r = d.rounds?.tasks[id];
  if (!r || !(r.task.length || r.final.length)) return nothing;
  const shown = [["Task review", r.task], ["Final review", r.final]].filter(([, rounds]) => rounds.length);
  return html`${shown.map(([label, rounds]) => marks(label, rounds))}${findingDetails(
    `Finding details of ${id}${where}`, shown)}`;
}

// The plan challenge's and the final review's own rounds, the work no round reviewed, and the rejections that stand.
function roundsInfo(r, d) {
  const parts = [];
  if (r.brief?.length && d.brief.approved) {  // before approval the approval view shows them
    parts.push(marks("Brief challenge", r.brief),
      findingDetails("Finding details of the brief challenge", [["Brief challenge", r.brief, WORKERS.brief]]));
  }
  if (r.plan?.length) {
    parts.push(marks("Plan challenge", r.plan),
      findingDetails("Finding details of the plan challenge", [["Plan challenge", r.plan, WORKERS.plan]]));
  }
  if (r.final.length) {
    const attempt = r.attempt > 1 ? ` (attempt ${r.attempt})` : "";
    parts.push(marks(`Final review${attempt}`, r.final),
      findingDetails("Finding details of the final review", [["Final review", r.final]]));
  }
  if (r.unreviewed.length) {
    parts.push(text("Repairs no round reviewed", { size: "sm", weight: "semibold" }),
      list(r.unreviewed.map((u) => `${u.id}: ${u.title} (${LOOPS(u.loop)})`)));
  }
  if (r.standing.length) {
    parts.push(text("Rejections that stand", { size: "sm", weight: "semibold" }), list(r.standing.map((f) => {
      const [worker, judge] = WORKERS[f.loop] ?? WORKERS.task;
      return [`${f.id} (${LOOPS(f.loop)}, ${f.state}): ${f.text}`, f.reason && `${worker}: ${f.reason}`,
        f.judgement && `${judge}: ${f.judgement}`].filter(Boolean).join(" \u00b7 ");
    })));
  }
  if (!parts.length) return nothing;
  return html`<section class="info rounds">${hd(3, "Review rounds", "md")}${parts}</section>`;
}

const STEP = { done: ["done", "success"], current: ["now", "info"], upcoming: ["to do", "secondary"],
  skipped: ["not needed", "secondary"] };

// The stages in order; the state is a word, never colour alone, and a loop badge says its rounds.
function stepper(p) {
  const at = [p.task ? `Task ${p.task} of ${p.tasks}` : "", p.sub || ""].filter(Boolean).join(" \u00b7 ");
  return html`<ol class="stepper">${p.stages.map((s) => {
    const [label, variant] = STEP[s.state];
    return html`<li class=${s.state} aria-current=${s.state === "current" ? "step" : nothing}><span>
      <span>${s.label}</span><p-tag variant=${variant} compact="true">${label}</p-tag>
      ${s.state === "current" && at ? meta(at) : nothing}
      ${s.rounds > 1 ? html`<span class="loops"><span aria-hidden="true">\u00d7${s.rounds}</span><span
        class="sr">${s.rounds} rounds</span></span>` : nothing}</span></li>`;
  })}</ol>`;
}

function screen(s) {
  const steps = s.steps.map((x) => (x.do === "type" ? `type "${x.text}" into ${x.target}` : `click ${x.target}`));
  return `${s.name} (${s.path}${steps.length ? `, then ${steps.join(", ")}` : ""}): ${s.expect}`;
}

// Who stated a technical item (TD-179 rule 1): the owner himself, or the shaper, whose proposal the approval accepts.
// Keys: a criterion's id, `screen:<name>`, `check:<name>`.
function yours(d, key) {
  return (d.brief.specified || []).includes(key);
}

// Each entry: what was asked (or what kind of item it is) as a small label, then the answer.
function saidList(items) {
  return html`<ul class="said">${items.map(([label, answer]) => html`<li><span class="label">${label}</span>
    <span>${answer}</span></li>`)}</ul>`;
}

function part(title, ...children) {
  return html`<section>${hd(4, title, "sm")}${children}</section>`;
}

// The agreement the owner approves (TD-122, TD-179 rule 2): his decisions, what he specified among the technical
// details, the shaper's choices that the approval accepts, and what is out.
function agreement(d, approved = false) {
  const decisions = d.brief.decisions || [], out = d.brief.non_goals || [], parts = [];
  const mine = decisions.filter((x) => x.origin === "decided").map((x) => [x.question, x.answer]);
  const specified = [
    ...d.criteria.filter((k) => yours(d, k.id)).map((k) => ["Acceptance criterion", k.text]),
    ...d.brief.visual.filter((s) => yours(d, `screen:${s.name}`)).map((s) => ["Screen the visual check takes",
      screenSaid(s)]),
    ...d.checks.filter((c) => yours(d, `check:${c.id}`)).map((c) => ["Check you do yourself", checkSaid(c)]),
  ];
  if (mine.length || specified.length) parts.push(part("Your decisions", saidList([...mine, ...specified])));
  const proposed = decisions.filter((x) => x.origin !== "decided").map((x) => [x.question, x.answer]);
  if (proposed.length) {
    const accepts = approved ? "Your approval accepted these choices." : "Approving accepts these choices.";
    parts.push(part("Choices proposed by the shaper", text(accepts), saidList(proposed)));
  }
  if (!decisions.length && !specified.length) parts.push(text("No separate decisions recorded."));
  if (out.length) parts.push(part("Not in this Change", list(out)));
  return parts;
}

function checkSaid(c) {
  return `${c.steps.join("; ")}${c.expect ? `. Expected: ${c.expect}` : ""}`;
}

// A screen as the owner reads it: what it must show, then where and after which clicks.
function screenSaid(s) {
  const steps = s.steps.map((x) => (x.do === "type" ? `type "${x.text}" into ${x.target}` : `click ${x.target}`));
  return `${s.expect} (at ${s.path}${steps.length ? `, after: ${steps.join(", ")}` : ""})`;
}

function counted(n, one, many) {
  return n ? `${n} ${n === 1 ? one : many}` : "";
}

// What the technical details hold, in a line that stays visible while they are collapsed.
function detailCount(d) {
  return [counted(d.criteria.length, "criterion", "criteria"), counted(d.brief.visual.length, "screen", "screens"),
    counted(d.checks.length, "check for you", "checks for you")].filter(Boolean).join(" \u00b7 ");
}

// The technical details, collapsed (TD-122); an item the owner stated says so (TD-179 rule 1).
function technical(d) {
  const scope = d.brief.scope || [], mark = (key) => (yours(d, key) ? " (you specified)" : ""), inside = [];
  if (d.criteria.length) {
    inside.push(hd(5, "Acceptance criteria", "sm"), list(d.criteria.map((k) => `${k.id}: ${k.text}${mark(k.id)}`)));
  }
  if (d.brief.visual.length) {
    inside.push(hd(5, "Screens the visual check captures", "sm"),
      list(d.brief.visual.map((s) => `${screen(s)}${mark(`screen:${s.name}`)}`)));
  }
  if (d.checks.length) {
    inside.push(hd(5, "Checks you do yourself", "sm"),
      list(d.checks.map((c) => `${c.id}: ${checkSaid(c)}${mark(`check:${c.id}`)}`)));
  }
  if (d.brief.ui) {
    inside.push(text(d.brief.visual.length ? "This Change has a user interface: the visual check captures its screens."
      : "This Change has a user interface: you judge it in your own check."));
  }
  if (scope.length) inside.push(text(`Scope: ${scope.join(", ")}`));
  if (!inside.length) return nothing;
  const said = detailCount(d), summary = "Technical details";
  const toggled = (e) => (e.target.open ? state.opened.add(summary) : state.opened.delete(summary));
  return html`<details .open=${state.opened.has(summary)} @toggle=${toggled}><summary>${summary}${said
    ? html`<span class="count">${said}</span>` : nothing}</summary>${inside}</details>`;
}

function approval(d) {
  const version = d.brief.version, key = `${d.slug}:approve:${version}`;
  const start = async () => {
    if (await ask(approving(d))) {
      send("/approve-brief", { version, unreviewed: Boolean(d.brief.unreviewed) }, d, key);
    }
  };
  const why = d.brief.unapprovable;  // TD-249: off until its challenge loop ended on this version
  return panel(`Brief v${version}${d.brief.title ? `: ${d.brief.title}` : ""}`, key,
    html`<div class="brief">${d.brief.outcome ? text(d.brief.outcome, { size: "md" }) : nothing}${agreement(d)}
      ${technical(d)}</div>`,
    d.rounds?.brief?.length ? html`${marks("Brief challenge", d.rounds.brief)}${findingDetails(
      "Finding details of the brief challenge", [["Brief challenge", d.rounds.brief, WORKERS.brief]])}` : nothing,
    text("Nothing is built until you approve. You approve the whole brief, including the collapsed technical "
      + "details; your own choices stay yours to change. Approval authorises work within this brief, not new "
      + "product commitments. To change the brief before approving, return to the shaping chat."),
    why ? text(`Not yet: ${why}.`, { weight: "semibold" }) : nothing,
    button(`Approve brief v${version}`, start, { icon: "check", aria: DIALOG, disabled: Boolean(why) }));
}

// What approving starts (TD-151): the brief, details included, becomes the baseline; then the challenge, planning,
// building and review, the visual round and the merge; the owner's own parts come afterwards.
function approving(d) {
  const v = d.brief.version, screens = d.brief.visual.length, checks = d.checks.length, you = [];
  const said = detailCount(d), then = ["Delivery plans the work, builds and reviews each task, and opens a pull "
    + "request."];
  if (screens) then.push(`It captures ${screens} screen${screens > 1 ? "s" : ""} for the visual check.`);
  then.push(`${merging(d)}. It takes on no new product commitment without you. AI credits are used `
    + `${d.paused ? "once you resume" : "from now on"}.`);
  if (screens) you.push("Judge the screens when Delivery asks.");
  if (checks) you.push(checks > 1 ? `Do your ${checks} checks once the pull request's checks pass.`
    : "Do your check once the pull request's checks pass.");
  return {
    title: `Approve brief v${v} and start the work?`, yes: d.paused ? "Approve; stay paused" : "Approve and start",
    no: "Keep it waiting",
    now: `Brief v${v}${said ? `, including its technical details (${said})` : ""}, becomes the approved version `
      + `every step follows${d.paused ? "; the Change stays paused until you resume" : ""}.`,
    then: then.join(" "),
    after: ["Answer questions here as they come up.", ...you, "Pause at any time; a pause takes effect after the "
      + "running step. Spent credits and finished work are not undone. To change the brief, revise it in the shaping "
      + "chat and approve the new version."].join(" "),
    instead: "Nothing is built. The brief waits here; revise it in the shaping chat or come back later.",
    ...(d.brief.unreviewed ? {  // TD-255: the revision after the challenge's last round, which no challenger judged
      tick: `I accept brief v${v} as revised after its last challenge round; no challenger reviewed that revision.`,
    } : {}),
  };
}

// The same agreement after approval (Sol, TD-179 rule 8): what was approved, and what changed since.
function briefInfo(d) {
  const at = d.brief.approved_at ? new Date(d.brief.approved_at).toLocaleString() : "";
  const v = d.brief.approved || d.brief.version;
  const added = (d.owner_criteria || []).map((k) => [`You added in visual round ${k.round}`, k.text]);
  return info(`Brief v${v}${at ? `, approved ${at}` : ""}`, html`<div class="brief">
    ${d.brief.outcome ? text(d.brief.outcome) : nothing}${agreement(d, true)}${technical(d)}
    ${part("Changes since you approved", added.length ? saidList(added)
      : text("None. A change to an approved brief comes back to you as a new version to approve."))}
    ${(d.amendments || []).length ? proposedWording(d.amendments) : nothing}</div>`);
}

// TD-179: new wording a worker proposed for a generated criterion, with the challenger's verdict. Nothing is
// applied: adopting one means revising the brief in chat, which comes back as a version to approve.
function proposedWording(amendments) {
  const judged = { equivalent: "keeps the approved intent", weaker: "weaker", unsure: "unsure" };
  const rows = amendments.flatMap((a) => a.items.flatMap((i) => [
    [`${i.criterion} as you approved it`, i.old],
    [`Proposed by the ${a.step} step`, `${i.new} (${i.why})`],
    ["Challenger", [judged[a.verdict] || "not judged yet", a.judged].filter(Boolean).join(": ")],
  ]));
  return part("Proposed wording (not applied)", saidList(rows),
    text("To adopt one, revise the brief in chat; the new version comes back to you to approve."));
}

function detailHead(d) {
  const back = state.pds
    ? html`<p-button-pure type="button" icon="arrow-left" class="back" @click=${() => choose(null)}>All
      Changes</p-button-pure>`
    : html`<button type="button" class="back" @click=${() => choose(null)}>All Changes</button>`;
  let intent = nothing;
  if (!/^(Done|Abandoned) /.test(d.line)) {  // a finished Change has nothing left to pause
    const body = { intent: d.paused ? "resume" : "pause" }, said = d.paused
      ? "Resumed: Delivery goes on once no question, check or stop holds the Change."
      : "Pause requested: the running step finishes first, then nothing new starts until you resume.";
    const go = async () => {
      if (await send("/intent", body, d) && state.selected === d.slug) {
        state.started = { text: said };
        show();
      }
    };
    intent = button(d.paused ? "Resume" : "Pause", go, d.paused ? { icon: "play" }
      : { variant: "secondary", icon: "pause" });
  }
  return html`<div class="detail-head">${back}<div>${hd(2, d.slug, "xl", { tabindex: "-1" })}${d.brief.title
    ? text(d.brief.title, { color: "contrast-medium" }) : nothing}</div>${intent}</div>`;
}

const PAUSED = /· paused by you/;

function badge(c) {
  if (/(^|· )stopped:/.test(c.line)) return ["error", "Stopped"];
  if (PAUSED.test(c.line)) return ["secondary", "Paused"];
  if (c.actor === "you") return ["warning", "Your turn"];
  if (c.actor === "admin") return ["warning", "Admin"];
  if (c.line.startsWith("Done")) return ["success", "Done"];
  if (c.line.startsWith("Abandoned")) return ["secondary", "Abandoned"];
  return c.actor === "github" ? ["secondary", "GitHub"] : ["info", "Delivery"];
}

function detailView(d) {
  const [variant, label] = badge(d), forms = formsOf(d);
  if (state.refused && state.refused.forms !== forms) state.refused = null;
  const refusedTop = state.refused && !state.refused.form ? refusal(state.refused.text) : nothing;
  const behind = d.pullback?.state === "behind";
  const r = d.visual_round, deciding = r && r.outcome === "ask" && d.question?.options.some((o) => o.id === "fail");
  const pictures = d.visual ? visualSection(d.slug, d.visual, d.before, d.visual_existing_errors, deciding)
    : d.before ? beforeSection(d.slug, d.before) : null;
  const approvingNow = d.step === "shape" && d.brief.approved !== d.brief.version;
  let question = nothing;
  if (d.question) {
    question = deciding ? decisionForm(d.question, r, html`${pictures.lines}${pictures.shots}`, d)
      : d.retry ? retryForm(d.question, d.retry, d) : questionForm(d.question, d);
  }
  return html`${detailHead(d)}
    ${row(html`<p-tag variant=${variant} compact="true">${label}</p-tag>`, text(d.line))}
    ${refusedTop}
    ${label === "Stopped" ? notice("error", "Stopped", `${d.line.replace(/^.*?stopped: /, "")}.`,
      d.action ? `What to do: ${d.action}.` : "") : nothing}
    ${behind ? pullbackNote(d.pullback, d) : nothing}
    ${question}
    ${d.merge ? mergeForm(d.merge, d) : nothing}
    ${d.checks.filter((c) => c.waiting).map((c) => checkForm(c, d))}
    ${approvingNow ? approval(d) : nothing}
    ${pictures && !deciding ? info("Before and after", pictures.lines,
      toggle("screenshots", `Screenshots (${pictures.count})`, pictures.shots)) : nothing}
    ${d.owner_criteria.length ? criteriaPanel(d) : nothing}
    ${d.progress ? info("Progress", stepper(d.progress), d.restartable ? restartButton(d) : nothing) : nothing}
    ${d.plan.length ? info("Plan", planList(d)) : nothing}
    ${d.rounds ? roundsInfo(d.rounds, d) : nothing}
    ${!approvingNow && (d.brief.outcome || d.criteria.length) ? briefInfo(d) : nothing}
    ${d.pullback && !behind ? pullbackNote(d.pullback, d) : nothing}
    ${info("Recent activity", activityLog(d.activity))}
    ${spendLines(d.spend)}`;
}

const GROUPS = { you: "Needs you", working: "Delivery is working", paused: "Paused", done: "Done" };

function groupOf(label) {
  if (["Stopped", "Your turn", "Admin"].includes(label)) return "you";
  if (label === "Paused") return "paused";
  return ["Done", "Abandoned"].includes(label) ? "done" : "working";
}

function split(line) {  // the stage, then what is happening in it
  const at = line.indexOf(" \u00b7 ");
  return at < 0 ? ["", line] : [line.slice(0, at), line.slice(at + 3)];
}

function card([c, label, variant]) {
  const current = c.slug === state.selected, [stage, rest] = split(c.line), step = c.progress?.line;
  const open = (event) => {
    if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    choose(c.slug);
  };
  const bits = [];
  if (c.now && label !== "Done" && (!step || c.now.includes(" \u00b7 "))) bits.push(split(c.now)[1]);
  if (c.step_time) bits.push(`step ${c.step_time}`);
  if (c.credits?.change || c.credits?.unknown) {
    const now = c.credits.step ? ` (this step ${c.credits.step.toFixed(2)})` : "";
    bits.push(`${spentText(c.credits.change, c.credits.unknown || 0)}${now}`);
  }
  if (c.quiet) bits.push("quiet");
  return html`<li class=${current ? "card current" : "card"}>
    <div class="top"><a href=${`?change=${encodeURIComponent(c.slug)}`} class="open" data-slug=${c.slug}
      aria-current=${current ? "true" : nothing} @click=${open}>${c.slug}</a>
      <p-tag variant=${variant} compact="true">${label}</p-tag></div>
    ${step ? html`<p class="says stage">${step}</p>` : nothing}
    <p class="says">${stage && !step ? html`<span class="stage">${stage}</span> \u00b7 ` : nothing}${rest}</p>
    ${c.action && groupOf(label) !== "working" ? html`<p class="next">Next: ${c.action}</p>` : nothing}
    ${bits.length ? html`<p class="meta">${bits.join(" \u00b7 ")}</p>` : nothing}
    ${(c.overlaps || []).map((o) => html`<p class="meta">${o}</p>`)}
  </li>`;
}

function grouped() {
  const groups = { you: [], working: [], paused: [], done: [] };
  for (const c of state.changes ?? []) {
    const [variant, label] = badge(c);
    groups[groupOf(label)].push([c, label, variant]);
  }
  groups.you.sort((a, b) => (b[1] === "Stopped") - (a[1] === "Stopped"));
  return groups;
}

function youCount() {
  return state.changes ? grouped().you.length : 0;
}

function listView() {
  const changes = state.changes, groups = grouped();
  if (!changes) return nothing;
  const head = !changes.length
    ? html`<p class="empty meta">No Changes yet. New Change opens a chat in VS Code where you shape the first one.</p>`
    : !groups.you.length ? html`<p class="meta">Nothing needs you right now.</p>` : nothing;
  const toggled = (e) => { state.doneOpen = e.target.open; };
  return html`${head}${Object.entries(GROUPS).map(([key, title]) => {
    if (!groups[key].length) return nothing;
    const said = `${title} (${groups[key].length})`;
    const cards = html`<ul class="cards">${repeat(groups[key], ([c]) => c.slug, card)}</ul>`;
    if (key !== "done") return html`<section class="group">${hd(2, said, "md")}${cards}</section>`;
    const open = state.doneOpen || groups.done.some(([c]) => c.slug === state.selected);
    return html`<details class="group" .open=${open} @toggle=${toggled}><summary>${said}</summary>${cards}</details>`;
  })}`;
}

function startedView() {
  const s = state.started;
  if (!s) return html`<p-text id="started" aria-live="polite"></p-text>`;
  return html`<p-text id="started" aria-live="polite">${s.text ?? html`Could not open the chat: ${s.reason}. Copy
    this command: <code>${s.command}</code>`}</p-text>`;
}

function view() {
  const d = state.detail && state.detail.slug === state.selected ? state.detail : null;
  return html`
    <p id="offline" role="status" ?hidden=${state.pds}>The Porsche Design System did not load from
      cdn.ui.porsche.com, so the page uses plain controls. Reload to try again.</p>
    ${startedView()}
    <p-inline-notification id="error" state="error" dismiss-button="false" ?hidden=${!state.error}>${state.error
      ?? ""}</p-inline-notification>
    <p-text id="seen" color="contrast-medium" size="xs">${state.seen}</p-text>
    <section id="notes" class="panel" aria-label="Repository settings" ?hidden=${!state.notes.length}>
      ${state.notes.map((n) => text(n, { size: "xs" }))}</section>
    <div id="board" class=${state.selected ? "open" : ""}>
      <section id="list" aria-label="Changes" class=${state.stale ? "stale" : ""}>
        <div id="changes">${listView()}</div>
      </section>
      <section id="detail" aria-label="Selected Change" class=${state.stale ? "stale" : ""}>${d ? detailView(d)
        : nothing}</section>
    </div>`;
}

function reveal(target) {
  if (matchMedia("(max-width: 63.99rem)").matches) return window.scrollTo(0, 0);
  const top = target.getBoundingClientRect().top;
  if (top < 0 || top > innerHeight / 2) target.scrollIntoView({ block: "start" });
}

// The heading takes focus only once its PDS wrapper has rendered; a hidden element cannot be focused.
function focusHeading() {
  const target = document.getElementById("detail");
  const wrapper = target.querySelector("p-heading"), name = target.querySelector("h2");
  if (!name) return;
  Promise.resolve(wrapper?.componentOnReady?.()).then(() => {
    if (name.isConnected) name.focus({ preventScroll: true });
  });
  reveal(target);
}

function choose(slug, push = true) {
  const was = state.selected;
  state.selected = slug && SLUG.test(slug) ? slug : null;
  arrived = Boolean(state.selected);
  if (state.selected !== was) state.started = null;  // a note belongs to its Change
  if (push && state.selected !== was) {
    history.pushState(null, "", state.selected ? `?change=${encodeURIComponent(state.selected)}` : location.pathname);
  }
  show();
  if (!state.selected && was) document.querySelector(`#changes a[data-slug="${CSS.escape(was)}"]`)?.focus();
  refresh();
}

async function refresh() {
  if (busy) {
    again = true;  // a selection or an action while a refresh runs gets its own refresh after it
    return;
  }
  busy = true;
  try {
    state.changes = await call("/changes");
    if (state.selected && !state.changes.some((c) => c.slug === state.selected)) {  // gone, or a stale link
      state.selected = null;
      history.replaceState(null, "", location.pathname);
    }
    state.notes = (await call("/project")).notes;
    lastSeen = new Date();
    state.error = null;
    state.seen = "";
    state.stale = false;
    const wanted = state.selected;
    if (wanted) {
      const d = await call(`/changes/${encodeURIComponent(wanted)}`);
      if (d.slug === state.selected) state.detail = d;  // the person may have chosen another Change meanwhile
    } else {
      state.detail = null;
    }
    show();
    if (arrived && state.detail?.slug === state.selected) {
      arrived = false;
      focusHeading();
    }
  } catch (e) {
    failed(e);
  } finally {
    busy = false;
    if (again) {
      again = false;
      refresh();
    }
  }
}

async function launched(id) {  // the host opens the chat in the background; VS Code may first have to start
  for (;;) {
    const s = await call(`/new-change/${encodeURIComponent(id)}`);
    if (s.state !== "opening") return s;
    await new Promise((resolve) => setTimeout(resolve, 1000));
  }
}

async function newChange() {
  const wanted = await ask({
    title: "Shape a new Change?", yes: "Open the chat", no: "Not now",
    now: "A chat opens in VS Code where the shaper works out the brief with you; the chat uses AI credits like any "
      + "Copilot chat.",
    then: "Nothing is built. When you save the brief in the chat, it appears here for your approval.",
    after: "Approve it here to start the work, or keep shaping it in the chat.",
    instead: "Nothing opens.",
  });
  if (!wanted) return;
  state.creating = true;
  state.started = { text: "Opening the shaping chat…" };
  show();
  try {
    const r = await call("/new-change", {});
    const s = r.started ? await launched(r.launch) : { state: "failed", ...r };
    state.started = s.state === "open"
      ? { text: `A chat opened in VS Code to shape the new Change.${s.warning ? ` Note: ${s.warning}.` : ""}` }
      : { reason: s.reason, command: s.command };
  } catch (e) {
    state.started = null;
    failed(e);
  } finally {
    state.creating = false;
    show();
  }
}

// The PDS components load from its CDN (PDS 4 has no local delivery), so the page picks its controls once.
const asked = new URLSearchParams(location.search).get("change");
state.selected = asked && SLUG.test(asked) ? asked : null;
arrived = Boolean(state.selected);
state.pds = await designSystem(["p-button"]);
show();
addEventListener("popstate", () => choose(new URLSearchParams(location.search).get("change"), false));
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
