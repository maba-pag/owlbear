<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlBear Delivery · Changes</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  main > p-text:empty { display: none !important; }
  main { max-width: 90rem; }
  #board { display: grid; gap: var(--p-spacing-fluid-md); align-items: start; }
  #list, #detail { display: grid; gap: var(--p-spacing-fluid-sm); align-content: start; min-width: 0; }
  #board:not(.open) #detail { display: none; }
  #board:not(.open) .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); }
  @media (min-width: 64rem) {
    #board.open { grid-template-columns: minmax(20rem, 26rem) minmax(0, 1fr); }
  }
  @media (max-width: 63.99rem) {
    #board.open #list { display: none; }
  }
  /* The list: one card per Change, grouped by who acts next. */
  .group { display: grid; gap: var(--p-spacing-static-sm); }
  .group > summary { font-size: var(--p-typescale-md); }
  .cards { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .card {
    position: relative; display: grid; gap: var(--p-spacing-static-xs); align-content: start;
    padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg); box-shadow: inset 0 0 0 1px transparent;
  }
  .card:hover { box-shadow: inset 0 0 0 1px var(--p-color-contrast-low); }
  .card.current { box-shadow: inset 0 0 0 2px var(--p-color-primary); }
  .card:has(.open:focus-visible) { outline: 2px solid var(--p-color-focus); outline-offset: 2px; }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: var(--p-spacing-static-sm); }
  .card .open {
    min-width: 0; overflow-wrap: anywhere; color: inherit; font-size: var(--p-typescale-sm); font-weight: 600;
    text-decoration: none;
  }
  .card .open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .card .open:focus-visible { outline: none; }
  .says, .next, .meta { margin: 0; overflow-wrap: anywhere; }
  .says { font-size: var(--p-typescale-sm); }
  .card .says { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .stage { font-weight: 600; }
  .next { font-size: var(--p-typescale-sm); font-weight: 600; }
  .meta { font-size: var(--p-typescale-xs); color: var(--p-color-contrast-medium); }
  .meta.warn { color: var(--p-color-warning); }
  /* The detail: who acts first, then what Delivery knows. */
  .detail-head {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: var(--p-spacing-static-sm);
  }
  .detail-head .back { grid-column: 1 / -1; justify-self: start; }
  .detail-head h2 { overflow-wrap: anywhere; }
  .act { box-shadow: inset 0 0 0 1px var(--p-color-contrast-low); }
  #changes { display: grid; gap: var(--p-spacing-fluid-sm); }
  .info { padding-top: var(--p-spacing-static-md); border-top: 1px solid var(--p-color-contrast-lower); }
  .panel > p-button, .panel > p-link-pure, .panel > button, .panel > a { justify-self: start; }
  .brief, .gallery { display: grid; gap: var(--p-spacing-static-sm); }
  /* The brief: the agreement first, each part with room around it; details collapsed below. */
  .brief { gap: var(--p-spacing-static-md); }
  .brief section { display: grid; gap: var(--p-spacing-static-xs); }
  .said { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .said li { display: grid; gap: 2px; overflow-wrap: anywhere; }
  .said .label { font-size: var(--p-typescale-sm); color: var(--p-color-contrast-medium); }
  .brief details { display: grid; gap: var(--p-spacing-static-xs); }
  .brief details > :not(summary) { margin-block-start: var(--p-spacing-static-xs); }
  .brief summary .count { display: block; font-size: var(--p-typescale-xs); color: var(--p-color-contrast-medium); }
  .plan, .log { display: grid; gap: var(--p-spacing-static-xs); padding: 0; list-style: none; }
  .plan li { display: flex; align-items: baseline; gap: var(--p-spacing-static-sm); }
  .log li { display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: var(--p-spacing-static-sm); }
  .log time { font-size: var(--p-typescale-xs); color: var(--p-color-contrast-medium); }
  .shots {
    display: grid; gap: var(--p-spacing-static-md);
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 34rem), 1fr));
  }
  .pair {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--p-spacing-static-xs) var(--p-spacing-static-sm);
    margin: 0;
  }
  .pair figcaption { grid-column: 1 / -1; font-size: var(--p-typescale-xs); font-weight: 600; }
  .side { display: grid; gap: 2px; align-content: start; font-size: var(--p-typescale-xs); }
  .shots img, .missing {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: top center;
    border: 1px solid var(--p-color-contrast-lower); border-radius: var(--p-radius-md); box-sizing: border-box;
  }
  .zoom { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .missing {
    display: grid; place-items: center; padding: var(--p-spacing-static-sm); text-align: center;
    border-style: dashed; border-color: var(--p-color-contrast-low);
  }
  dialog.lightbox {
    width: 96vw; max-width: none; max-height: 96vh; padding: var(--p-spacing-static-sm); border: 0;
    border-radius: var(--p-radius-lg); background: var(--p-color-canvas); color: var(--p-color-primary);
  }
  dialog.lightbox::backdrop { background: var(--p-color-backdrop, rgb(0 0 0 / .7)); }
  .lightbox .frame { overflow: auto; max-height: calc(96vh - 5rem); margin-top: var(--p-spacing-static-sm); }
  .lightbox img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .lightbox .caption { flex: 1; margin: 0; text-align: center; font-size: var(--p-typescale-sm); }
  .finding { display: grid; gap: var(--p-spacing-static-xs); padding-block: var(--p-spacing-static-xs); }
  .finding + .finding { border-top: 1px solid var(--p-color-contrast-lower); }
  /* The stepper: the Change's stages in order, the current one marked, a loop badge on those that looped. */
  .stepper { display: grid; gap: var(--p-spacing-static-xs); margin: 0; padding-left: 1.5rem; }
  .stepper li { position: relative; padding-left: var(--p-spacing-static-xs); }
  .stepper li > span { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: var(--p-spacing-static-sm); }
  .stepper [aria-current="step"] { font-weight: 600; }
  .stepper .skipped { color: var(--p-color-contrast-medium); }
  .loops { font-size: var(--p-typescale-xs); font-weight: 600; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  .stale { opacity: .45; pointer-events: none; }
  .no-pds .card .open { text-decoration: underline; }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Changes</h1></p-heading>
</header>
<p id="offline" role="status" hidden>The Porsche Design System did not load from cdn.ui.porsche.com, so the page
  uses plain controls. Reload to try again.</p>
<p-text id="started" aria-live="polite"></p-text>
<p-inline-notification id="error" state="error" dismiss-button="false" hidden></p-inline-notification>
<p-text id="seen" color="contrast-medium" size="xs"></p-text>
<section id="notes" class="panel" aria-label="Repository settings" hidden></section>
<div id="board">
  <section id="list" aria-label="Changes">
    <div id="changes"></div>
  </section>
  <section id="detail" aria-label="Selected Change"></section>
</div>
</main>
<!-- ask -->
<script>
"use strict";
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("token")) {
  sessionStorage.setItem("token", hash.get("token"));
  history.replaceState(null, "", location.pathname + location.search);
}
const token = sessionStorage.getItem("token");
const TITLE = document.title;
let selected = new URLSearchParams(location.search).get("change"), lastSeen = null, busy = false, again = false;
let pds = false, arrived = Boolean(selected), doneOpen = false;  // arrived: focus the detail once it shows
let shown = { slug: null, forms: "" }, draft = false;  // the rendered detail, and whether it holds unsent input
let refused = null;  // why the host refused the owner's last action; shown until the detail's forms change

class HostDown extends Error {}
class Restarted extends Error {}

async function call(path, body) {
  const init = { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(5000) };
  if (body) {
    init.method = "POST";
    init.body = JSON.stringify(body);
    init.headers["Content-Type"] = "application/json";
  }
  let response;
  try {
    response = await fetch(`/api/next${path}`, init);
  } catch {
    throw new HostDown();
  }
  if (response.status === 401 && token) throw new Restarted();
  const data = await response.json();
  if (!response.ok) {
    throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
  }
  return data;
}

function el(tag, text, attrs = {}) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
}

function refusal(said) {
  const node = notice("error", "Not done", said);
  node.classList.add("refused");
  return node;
}

// The refusal goes beside the form that was used, so it is seen where the owner is looking; the poll keeps it.
function send(path, body, origin = shown) {  // origin: the rendered detail whose form the person used; true if taken
  const from = document.activeElement?.closest?.("#detail .act");
  return call(`/changes/${origin.slug}${path}`, body).then(() => {
    refused = null;
    if (shown === origin) {  // a later detail keeps its own draft
      draft = false;
      document.activeElement.blur();
    }
    return refresh().then(() => true);
  }, (e) => {
    if (e instanceof HostDown || e instanceof Restarted || shown !== origin) return failed(e) && false;
    refused = { forms: origin.forms, text: e.message };
    for (const old of document.querySelectorAll("#detail .refused")) old.remove();
    const node = refusal(e.message);
    if (from?.isConnected) from.append(node);
    else document.querySelector("#detail .detail-head")?.after(node);
    node.scrollIntoView({ block: "nearest" });
  });
}

function notify(...nodes) {
  const error = document.getElementById("error");
  error.replaceChildren(...nodes);
  error.hidden = !nodes.length;
}

function unreachable(e) {
  if (e instanceof Restarted) {
    notify("Delivery restarted at a new address — open the link from chat or ",
      el("code", "owlbear-next status"), ".");
  } else {
    notify("Delivery is not running. Start it with the VS Code task \"OwlBear Delivery host\" or ",
      el("code", "owlbear-next host"), " in the project, then reload this page.");
  }
  for (const id of ["list", "detail"]) document.getElementById(id).classList.add("stale");
  if (lastSeen) document.getElementById("seen").textContent = `last seen ${lastSeen.toLocaleTimeString()}`;
}

function failed(e) {
  if (e instanceof HostDown || e instanceof Restarted) return unreachable(e);
  notify(token ? e.message : "Open the URL the host printed, including #token=…");
}

function text(value, attrs = {}) {
  return el("p-text", value, attrs);
}

function list(items, tag = "ul") {
  const node = el(tag);
  for (const item of items) node.append(el("li", item));
  return node;
}

function heading(level, title, size) {
  const node = el("p-heading", undefined, { size });
  node.append(el(`h${level}`, title));
  return node;
}

function button(label, onclick, attrs = {}) {
  const node = pds
    ? el("p-button", label, { type: "button", compact: "true", ...attrs })
    : el("button", label, { type: "button" });
  node.onclick = onclick;
  return node;
}

function waiting(node, on) {
  if (pds) node.loading = on;
  else node.disabled = on;
}

function external(label, href) {
  let web = false;
  try {
    web = ["http:", "https:"].includes(new URL(href).protocol);
  } catch {
    web = false;
  }
  if (!web) return text(label);
  const link = el("a", label, { href, target: "_blank", rel: "noopener" });
  if (!pds) return link;
  const pure = el("p-link-pure", undefined, { icon: "external" });
  pure.append(link);
  return pure;
}

function field(label, rows = "2") {
  if (pds) {
    const node = el("p-textarea", undefined, { label, rows });
    return [node, () => node.value || ""];
  }
  const node = el("label", label, { class: "field" }), input = el("textarea", undefined, { rows });
  node.append(input);
  return [node, () => input.value];
}

function choice(label, options) {
  if (pds) {
    const node = el("p-radio-group", undefined, { name: "option", label });
    for (const o of options) node.append(el("p-radio-group-option", undefined, { value: o.id, label: o.label }));
    return [node, () => node.value || null];
  }
  const node = el("fieldset");
  node.append(el("legend", label));
  for (const o of options) {
    const item = el("label");
    item.append(el("input", undefined, { type: "radio", name: "option", value: o.id }), ` ${o.label}`);
    node.append(item);
  }
  return [node, () => node.querySelector(":checked")?.value ?? null];
}

// Something the owner acts on: a framed panel; the status line above already says it is his turn.
function panel(title, ...children) {
  const box = el("section", undefined, { class: "panel act" });
  box.append(heading(3, title, "md"), ...children);
  return box;
}

// What Delivery knows about the Change: a plain section under a rule.
function info(title, ...children) {
  const box = el("section", undefined, { class: "info" });
  box.append(heading(3, title, "md"), ...children);
  return box;
}

function notice(state, title, ...lines) {
  if (!pds) {
    const box = el("section", undefined, { class: "panel act" });
    box.append(heading(3, title, "md"), ...lines.map((l) => text(l)));
    return box;
  }
  return el("p-inline-notification", undefined, { state, heading: title, "heading-tag": "h3",
    description: lines.join(" "), "dismiss-button": "false" });
}

function plain(tag, value, cls) {
  return el(tag, value, { class: cls });
}

function row(...children) {
  const node = el("div", undefined, { class: "row" });
  node.append(...children);
  return node;
}

function questionForm(q, d) {
  const [options, option] = choice("Choose an option", q.options), [words, said] = field("Your answer in words");
  const answer = async () => {
    const origin = shown, picked = option(), words = said();
    const chosen = q.options.find((o) => o.id === picked), told = chosen && consequence(chosen, d);
    if (told && !(await ask(told))) return;
    send("/answers", { question: q.id, option: picked, text: words }, origin);
  };
  const box = panel(`Question ${q.id}`, text(q.text, { weight: "semibold" }));
  if (q.options.length) box.append(options);
  box.append(words, button("Answer", answer));
  return box;
}

// What an answer sets off when it is more than going on: ending the Change, passing over a finding, going back.
function consequence(o, d) {
  const choices = { yes: o.label, no: "Back to the options", instead: "Choose another option." };
  if (o.next === "abandon") {
    return { title: "Abandon this Change?", yes: "Abandon", no: "Keep the Change",
      now: "The Change ends here and is marked abandoned. There is no restore.",
      then: `Delivery closes ${d.pr ? `pull request #${d.pr}` : "its pull request if one is open"}, saves work only `
        + "the worktree holds, and removes the worktree. Branches are kept.",
      after: "The branch and the saved work stay for reference; start a new Change to try again.",
      instead: "The question stays open and the Change waits for your answer." };
  }
  if (o.next === "done") {
    return { ...choices, title: `${o.label}?`,
      now: "What this question raised stays as it is; nothing is sent back to be fixed.",
      then: "Delivery goes on with the next step by itself.",
      after: "Pause at any time; a pause takes effect after the running step." };
  }
  if (o.id === "drop") {
    return { ...choices, title: "Drop this finding?",
      now: "The finding is not fixed. Your note in words tells later reviewers why.",
      then: "Delivery asks about the next disputed finding, or completes the review." };
  }
  if (o.next === "accept") {
    return { ...choices, title: `${o.label}?`,
      now: "Delivery cannot prove which model produced this result; you take it as it is. Its verdict still "
        + "applies, including any repair it asks for.",
      then: "Delivery goes on from this result." };
  }
  if (o.next === "shape") {
    return { ...choices, title: "Go back to the brief?",
      now: "The Change returns to its brief. Work already done is kept for now.",
      then: "Nothing runs until you revise the brief in the shaping chat and approve the new version here.",
      after: "The new brief decides which work is kept or redone." };
  }
  if (o.next === "plan") {
    return { ...choices, title: "Plan again?",
      now: "The Change returns to planning. Work already done is kept.",
      then: "The planner makes a new plan from the brief and the challenger checks it; this uses AI credits." };
  }
  return null;
}

// How the Change ends once every gate passed: the project's merge setting decides.
function merging(d) {
  return d.asks_merge ? "Delivery asks you before merging" : "Delivery merges by itself once every check passes";
}

// What an automatic merge sets off, told at the owner's last gate before it.
function finale(d) {
  const pr = d.pr ? `pull request #${d.pr}` : "the pull request";
  return `Delivery merges ${pr} into ${d.target} by itself once its checks pass, `
    + `${d.deletes_branch ? "deletes the branch, " : ""}removes the worktree after saving work only it holds, and `
    + `updates your local ${d.target} if that is safe.`;
}

const REVERT = "Reversing the merge needs a revert you make yourself.";

function tick(label, checked = false) {
  if (pds) {
    const node = el("p-checkbox", undefined, checked ? { label, checked: "true" } : { label });
    return [node, () => node.checked === true];
  }
  const node = el("label"), input = el("input", undefined, { type: "checkbox" });
  input.checked = checked;
  node.append(input, ` ${label}`);
  return [node, () => input.checked];
}

function disclosure(summary, ...children) {
  const node = el("details");
  node.append(el("summary", summary), ...children);
  return node;
}

const JUDGE = { design: "Design judge", correctness: "Correctness judge" };
const DIALOG = "{ 'aria-haspopup': 'dialog' }";  // PDS's aria property, for a button that opens a dialog
const SEVERITY = { P0: ["Blocks the task", "error"], P1: ["Serious", "error"], P2: ["Annoying", "warning"],
  P3: ["Polish", "secondary"] };

function widthsOf(items) {
  return [...new Set(items.map((f) => f.width).filter(Boolean))].sort((a, b) => a - b);
}

function where(state, widths) {
  return widths.length ? `${state} at ${widths.join(", ")} px` : state;
}

// One problem per entry: the same judge, state, rule, severity and origin at other widths; two at one width stay two.
function problems(r) {
  const groups = new Map();
  for (const v of r.verdicts) {
    for (const f of v.findings) {
      const base = JSON.stringify([v.lens, f.state, f.rule, f.severity, f.introduced]);
      let n = 0;
      while (groups.get(`${base}#${n}`)?.items.some((seen) => seen.width === f.width)) n += 1;
      const key = `${base}#${n}`;
      if (!groups.has(key)) groups.set(key, { lens: v.lens, first: f, items: [] });
      groups.get(key).items.push(f);
    }
  }
  return [...groups.values()];
}

function problemRow(p, proposed) {
  const ids = p.items.map((f) => f.id), widths = widthsOf(p.items), [label, variant] = SEVERITY[p.first.severity] ?? [];
  const [box, on] = tick(p.first.text, ids.some((id) => proposed.includes(id)));
  const meta = [JUDGE[p.lens], where(p.first.state, widths), p.first.rule].filter(Boolean).join(" \u00b7 ");
  const node = el("div", undefined, { class: "finding" });
  node.append(box, row(...(label ? [el("p-tag", label, { variant, compact: "true" })] : []),
    text(meta, { size: "xs", color: "contrast-medium" })));
  if (new Set(p.items.map((f) => f.text)).size > 1) {
    node.append(disclosure("What the judge wrote at each width",
      list(p.items.map((f) => `${f.width ? `${f.width} px: ` : ""}${f.text}`))));
  }
  return [node, () => (on() ? ids : [])];
}

function verdictLine(v) {
  const said = v.verdict ?? "no verified verdict";
  const first = v.unanchored && v.unanchored !== v.verdict
    ? `, ${v.unanchored} before it saw the detector's findings` : "";
  const node = el("div");
  node.append(text(`${JUDGE[v.lens]}: ${said}${first}`, { weight: "semibold" }));
  if (v.reason) node.append(text(v.reason));
  return node;
}

// The design judge's blind preferences, mapped back to before and after.
function comparison(r) {
  const sides = new Map();
  for (const v of r.verdicts) {
    for (const [pair, side] of Object.entries(v.preferences || {})) {
      const cut = pair.lastIndexOf("-"), state = pair.slice(0, cut);
      if (!sides.has(side)) sides.set(side, new Map());
      if (!sides.get(side).has(state)) sides.get(side).set(state, []);
      sides.get(side).get(state).push(Number(pair.slice(cut + 1)));
    }
  }
  const said = [...sides].flatMap(([side, states]) => [...states].map(([state, widths]) =>
    `${side === "equal" ? "no difference" : `${side} better`} for ${where(state, widths.sort((a, b) => a - b))}`));
  return said.length ? `Without knowing which was which, the design judge found ${said.join("; ")}.` : "";
}

function detectorLines(r) {
  const seen = new Map();
  for (const s of r.detector) {
    for (const f of s.findings) {
      const key = `${f.rule} (${f.freshness})|${s.state}`;
      if (!seen.has(key)) seen.set(key, []);
      if (s.width) seen.get(key).push(s.width);
    }
  }
  return [...seen].map(([key, widths]) => {
    const [rule, state] = key.split("|");
    return `${rule} on ${where(state, [...new Set(widths)].sort((a, b) => a - b))}`;
  });
}

// The owner's decision on one visual round (TD-79): the screenshots, both verdicts, the problems he sends back,
// a comment, Pass or Fail.
function decisionForm(q, r, pictures, d) {
  const box = panel(`Decide visual round ${r.number} of ${r.head.slice(0, 7)}`, ...pictures);
  box.append(heading(4, "Verdicts", "sm"), ...r.verdicts.map(verdictLine));
  const all = problems(r), picks = [];
  const made = all.filter((p) => p.first.introduced !== false), old = all.filter((p) => p.first.introduced === false);
  if (made.length) {
    box.append(heading(4, "Problems this Change introduced", "sm"), text("Blocking, serious and annoying problems "
      + "and any missed criterion of yours are ticked for you; a Fail sends the ticked ones to the builder."));
    for (const p of made) {
      const [node, ids] = problemRow(p, r.proposed || []);
      picks.push([p, ids]);
      box.append(node);
    }
  }
  if (old.length) {
    box.append(disclosure(`Already there before the Change: ${old.length} (never sent to the build)`,
      list(old.map((p) => `${where(p.first.state, widthsOf(p.items))}: ${p.first.text}`))));
  }
  const preferred = comparison(r), evidence = detectorLines(r);
  if (preferred) box.append(text(preferred, { size: "xs" }));
  if (evidence.length) {
    box.append(disclosure("What the design detector found (evidence for the judges)", list(evidence)));
  }
  const [words, said] = field("Comment: on Fail it becomes a criterion every later round checks until you withdraw "
    + "it; on Pass it is only a note");
  const decide = async (option) => {
    const origin = shown, comment = said().trim(), chosen = picks.filter(([, ids]) => ids().length);
    const findings = chosen.flatMap(([, ids]) => ids());
    if (option === "fail" && !findings.length && !comment) {
      return notify("To fail the round, tick a problem or write a comment.");
    }
    const instructions = chosen.flatMap(([p]) => (new Set(p.items.map((f) => f.text)).size > 1
      ? p.items.map((f) => `${where(f.state, widthsOf([f]))}: ${f.text}`) : [p.first.text]));
    const checks = d.checks.filter((c) => c.passed !== true).length;  // the open person checks come after the round
    const ok = await ask(option === "fail" ? {
      title: "Send these problems back to the builder?", yes: "Send back", no: "Keep reviewing",
      now: "The builder gets a fix task with:",
      items: [...instructions, ...(comment ? [`Your comment: ${comment}`] : [])],
      then: "After the fix, the reviewer checks it and both judges look again; this uses AI credits. If they do not "
        + "both pass it, Delivery may ask you again.",
      after: comment ? "Your comment stays a criterion every later round checks until you withdraw it." : "",
      instead: "The round stays open; pass it, or tick other problems.",
    } : {
      title: checks || d.asks_merge ? `Pass visual round ${r.number}?`
        : `Pass visual round ${r.number}, the last step before merging?`,
      yes: checks || d.asks_merge ? "Pass" : "Pass and merge", no: "Keep reviewing",
      now: "No problem of this round goes to the builder." + (comment ? " Your comment is kept as a note only." : ""),
      then: checks ? `Your check${checks > 1 ? "s" : ""} come${checks > 1 ? "" : "s"} next. ${merging(d)}.`
        : d.asks_merge ? "Delivery asks you before merging." : finale(d),
      after: checks || d.asks_merge ? "Until the merge, comments on the pull request come back to Delivery as work."
        : REVERT,
      instead: "The round stays open for your decision.",
    });
    if (ok) {
      const round = { round: r.number, head: r.head, pack: r.pack };
      send("/answers", { question: q.id, option, text: comment, ...round, findings }, origin);
    }
  };
  box.append(words, row(
    button("Pass", () => decide("pass"), { icon: "check", aria: DIALOG }),
    button("Fail", () => decide("fail"), { variant: "secondary", icon: "close", aria: DIALOG }),
  ));
  return box;
}

function criteriaPanel(criteria) {
  const box = info("Your visual criteria", text("Every later visual round checks these until you withdraw them."));
  for (const k of criteria) {
    const withdraw = async () => {
      const origin = shown, stop = await ask({
        title: `Stop checking ${k.id}?`, yes: "Stop checking", no: "Keep it",
        now: `“${k.text}” is no longer checked in later visual rounds; it stays in this Change's history.`,
        after: "There is no restore. A comment on a later Fail adds a new criterion.",
        instead: "Every later visual round keeps checking it.",
      });
      if (stop) send(`/criteria/${encodeURIComponent(k.id)}/withdraw`, {}, origin);
    };
    box.append(row(text(`${k.id}: ${k.text}`), button("Withdraw", withdraw, { variant: "secondary", aria: DIALOG })));
  }
  return box;
}

function checkForm(check, d) {
  const [note, noted] = field("What failed (needed for Failed; the builder gets it as the fix task)");
  const box = panel(`Your check ${check.id}`, list(check.steps, "ol"));
  if (check.expect) box.append(text(`Expected: ${check.expect}`, { weight: "semibold" }));
  if (check.url) {
    box.append(row(external("Open the preview", check.url),
      text(check.url, { size: "xs", color: "contrast-medium", tag: "span" })));
  }
  const result = (passed) => ({ check: check.id, passed, note: noted(), inputs: check.inputs });
  const last = !d.asks_merge && d.checks.every((c) => c.id === check.id || c.passed === true);
  const passed = async () => {
    const origin = shown, body = result(true);
    if (last && !(await ask({
      title: `Pass ${check.id}, the last step before merging?`, yes: "Pass and merge", no: "Not yet",
      now: `${check.id} is recorded as passed.`,
      then: `It is the last check. ${finale(d)}`,
      after: REVERT,
      instead: "Nothing merges; the check stays open.",
    }))) return;
    send("/check-results", body, origin);
  };
  const failed = async () => {
    const origin = shown, why = noted().trim(), body = result(false);
    if (!why) return notify("Say what failed: the builder gets it as the fix task.");
    if (await ask({
      title: `Report ${check.id} as failed?`, yes: "Send to the builder", no: "Keep checking",
      now: "The builder gets this fix task:", items: [why],
      then: "Delivery fixes it, reviews the fix and prepares the check again; this uses AI credits. Then it asks you "
        + "to check again.",
      instead: "The check stays open; you can still mark it passed.",
    })) send("/check-results", body, origin);
  };
  box.append(note, row(
    button("Passed", passed, { icon: "check", ...(last ? { aria: DIALOG } : {}) }),
    button("Failed", failed, { variant: "secondary", icon: "close", aria: DIALOG }),
  ));
  return box;
}

const CHECKED = { passed: "success", success: "success", failed: "error", failure: "error", error: "error" };

function mergeForm(m, d) {
  const links = row(external(`PR #${m.pr}`, m.url), external("Diff summary", m.diff));
  const box = panel(`Merge PR #${m.pr}`,
    text(`Delivery merges this exact head (${m.method}) once you approve it; a new head needs a fresh approval.`),
    links);
  if (m.void) box.append(text(`Changed since ${m.void.slice(0, 7)}: ${m.delta}`, { color: "error" }));
  const checks = m.checks.map((c) => el("p-tag", `${c.name}: ${c.state}`,
    { variant: CHECKED[c.state] ?? "secondary", compact: "true" }));
  const head = m.head.slice(0, 7), approve = async () => {
    const origin = shown, sure = await ask({
      title: `Merge pull request #${m.pr} at ${head}?`, yes: "Merge", no: "Not now",
      now: `Delivery merges exactly ${head} into ${d.target} (${m.method}). If the pull request gets a new head `
        + "first, this approval no longer counts.",
      then: `It checks the gates once more, merges, ${d.deletes_branch ? "deletes the branch, " : ""}removes the `
        + `worktree after saving work only it holds, and updates your local ${d.target} if that is safe.`,
      after: `The change is on ${d.target}; reversing it needs a revert you make yourself.`,
      instead: "Nothing merges. The pull request stays open; comments on it come back to Delivery as work.",
    });
    if (sure) send("/merge-consent", { head: m.head }, origin);
  };
  box.append(text("Checks at this head", { size: "xs", weight: "semibold" }),
    checks.length ? row(...checks) : text("No checks reported", { size: "xs", color: "contrast-medium" }),
    text(`Head ${m.head}`, { size: "xs", color: "contrast-medium" }),
    button(`Approve merging ${head}`, approve, { icon: "check", aria: DIALOG }));
  return box;
}

function pullbackNote(p, d) {
  const behind = p.state === "behind", title = `Pull-back: ${p.state}`;
  const pull = async () => {
    const origin = shown, sure = await ask({
      title: `Update your local ${d.target}?`, yes: "Update", no: "Leave it",
      now: `Delivery moves your local ${d.target} to the merged one, replaying any local commits on top; their `
        + "commit IDs change.",
      after: "If local changes touch the same files, the update stops and says why.",
      instead: `Your local ${d.target} stays behind; Pull stays here.`,
    });
    if (sure) send("/pull", {}, origin);
  };
  if (!pds) {
    const box = behind ? panel(title, text(p.reason || "")) : info(title, text(p.reason || ""));
    if (behind) box.append(button("Pull", pull));
    return box;
  }
  const note = el("p-inline-notification", p.reason || "", {
    state: behind ? "warning" : "success", heading: title, "heading-tag": "h3", "dismiss-button": "false",
  });
  if (behind) {
    note.setAttribute("action-label", "Pull");
    note.setAttribute("action-icon", "refresh");
    note.addEventListener("action", pull);
  }
  return note;
}

const shots = new Map();

function shot(slug, kind, name, at) {
  const key = `${slug}/${kind}/${name}/${at}`;
  if (!shots.has(key)) {
    const init = { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(5000) };
    shots.set(key, fetch(`/api/next/changes/${slug}/${kind}/${encodeURIComponent(name)}`, init)
      .then((r) => (r.ok ? r.blob() : Promise.reject(new Error(r.statusText))))
      .then((b) => URL.createObjectURL(b)));
  }
  return shots.get(key);
}

// One screenshot in a gallery: a button that enlarges it, in the order before then after at each width.
function zoomable(entry, gallery) {
  const index = gallery.push(entry) - 1, side = entry.side === "before" ? "before the Change" : "with the Change";
  entry.alt = `${entry.state} at ${entry.width}px ${side}, at ${entry.commit}`;
  const trigger = el("button", undefined, { type: "button", class: "zoom", "aria-haspopup": "dialog" });
  const img = el("img", undefined, { alt: `Enlarge: ${entry.alt}`, loading: "lazy" });
  trigger.append(img);
  trigger.onclick = () => lightbox(gallery, index);
  shot(entry.slug, entry.kind, entry.name, entry.at).then((url) => { img.src = url; },
    () => { img.alt += " (not available)"; });
  return trigger;
}

// The enlarged screenshots: arrow keys or buttons step through them, Escape or Close ends.
function lightbox(gallery, start) {
  const dialog = el("dialog", undefined, { class: "lightbox", "aria-label": "Screenshots" });
  const img = el("img", undefined, { alt: "" }), frame = el("div", undefined, { class: "frame" });
  const caption = el("p", undefined, { class: "caption", "aria-live": "polite" });
  let at = start;
  const show = () => {
    const e = gallery[at];
    caption.replaceChildren(el("strong", e.side === "before" ? "Before" : "After"),
      ` at ${e.commit} \u00b7 ${e.state} \u00b7 ${e.width} px wide \u00b7 ${at + 1} of ${gallery.length}`);
    img.alt = e.alt;
    img.removeAttribute("src");
    shot(e.slug, e.kind, e.name, e.at).then((url) => { if (gallery[at] === e) img.src = url; },
      () => caption.append(" \u00b7 not available"));
  };
  img.onload = () => caption.append(` \u00b7 ${img.naturalWidth} \u00d7 ${img.naturalHeight} px`);
  const go = (step) => {
    at = (at + step + gallery.length) % gallery.length;
    show();
  };
  frame.append(img);
  dialog.append(row(
    button("Previous", () => go(-1), { icon: "arrow-left", variant: "secondary", "aria-keyshortcuts": "ArrowLeft",
      title: "Previous screenshot (left arrow)" }), caption,
    button("Next", () => go(1), { icon: "arrow-right", variant: "secondary", "aria-keyshortcuts": "ArrowRight",
      title: "Next screenshot (right arrow)" }),
    button("Close", () => dialog.close(), { icon: "close", variant: "secondary" }),
  ), frame);
  dialog.addEventListener("keydown", (k) => {
    if (k.key !== "ArrowLeft" && k.key !== "ArrowRight") return;
    k.preventDefault();
    go(k.key === "ArrowLeft" ? -1 : 1);
  });
  dialog.addEventListener("click", (k) => { if (k.target === dialog) dialog.close(); });
  dialog.addEventListener("close", () => dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
  show();
}

function side(label, child) {
  const node = el("div", undefined, { class: "side" });
  node.append(el("span", label), child);
  return node;
}

// The screenshots of a visual check and what was found, as nodes for the decision or the "Before and after" section.
function visualSection(slug, v, b, existing, deciding) {
  const open = deciding || v.doubts.length;
  const state = v.passed ? ["Passed", "success"] : open ? ["Undecided", "warning"] : ["Failed", "error"];
  const verdict = el("p-tag", state[0], { variant: state[1], compact: "true" });
  const nodes = [row(text(`Visual check of ${v.head.slice(0, 7)}`, { weight: "semibold" }), verdict)];
  if (v.findings.length) nodes.push(list(v.findings));
  if (v.doubts.length) {
    nodes.push(text("The judges could not decide:", { size: "xs" }), list(v.doubts));
  }
  if (existing.length) {
    nodes.push(text(`Errors already there before the Change: ${existing.join("; ")}`, { size: "xs" }));
  }
  if (b && b.findings.length) {
    nodes.push(text(`Before: ${b.findings.join("; ")}`, { size: "xs", color: "contrast-medium" }));
  }
  const grid = el("div", undefined, { class: "shots" }), gallery = [];
  for (const name of v.files) {
    const [, state, width] = name.match(/^(.*)-(\d+)\.png$/);
    const kept = b && b.files.includes(name);
    const comparable = kept && b.states[state] === v.states[state];  // a revised state's old shot is no baseline
    const one = (kind, side, at, head) => zoomable(
      { slug, kind, name, at, side, state, width, commit: head.slice(0, 7) }, gallery);
    const before = comparable
      ? one("before", "before", b.at, b.head)
      : el("span", kept ? "Not comparable: the state changed since" : "Not available", { class: "missing" });
    const fig = el("figure", undefined, { class: "pair" });
    fig.append(el("figcaption", `${state} \u00b7 ${width} px`), side("Before", before),
      side("After", one("visual", "after", v.at, v.head)));
    grid.append(fig);
  }
  const shots = el("div", undefined, { class: "gallery" });
  shots.append(grid);
  nodes.push(shots);
  return nodes;
}

function beforeSection(slug, b) {
  const nodes = [text(`Before the Change${b.head ? `, at ${b.head.slice(0, 7)}` : ""}`, { weight: "semibold" })];
  if (b.findings.length) nodes.push(text(`Not available: ${b.findings.join("; ")}`, { color: "contrast-medium" }));
  if (b.errors.length) {
    const seen = b.errors.map((e) => `${e.state} at ${e.width}px, ${e.kind} error: ${e.text}`);
    nodes.push(text(`Errors before the Change: ${seen.join("; ")}`, { size: "xs" }));
  }
  const grid = el("div", undefined, { class: "shots" }), gallery = [];
  for (const name of b.files) {
    const [, state, width] = name.match(/^(.*)-(\d+)\.png$/);
    grid.append(side(`${state} \u00b7 ${width} px`, zoomable({ slug, kind: "before", name, at: b.at,
      side: "before", state, width, commit: (b.head || "").slice(0, 7) }, gallery)));
  }
  nodes.push(grid);
  return nodes;
}

function count(n) {
  return n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : `${n}`;
}

// The total, then a line per model; input includes cache reads and writes, so "in" is the uncached rest.
function spendLines(spend) {
  const lines = [];
  for (const [model, u] of Object.entries(spend.models)) {
    const fresh = Math.max(0, u.input - u.cache_read - u.cache_write);
    const split = u.tokens && u.input + u.output === u.tokens  // sessions recorded before the split leave it partial
      ? ` (${count(fresh)} in \u00b7 ${count(u.output)} out \u00b7 ${count(u.cache_read)} cache read \u00b7 `
        + `${count(u.cache_write)} cache write)`
      : "";
    const credits = u.credits_unread ? (u.credits ? `${u.credits.toFixed(2)}+ credits` : "credits unknown")
      : `${u.credits.toFixed(2)} credits`;
    const line = `${model}: ${credits}, ${count(u.tokens)} tokens${split}`;
    lines.push(text(line, { size: "xs", color: "contrast-medium" }));
  }
  return disclosure(`Spent ${spentText(spend.credits, (spend.unread || []).length)}`, ...lines);
}

// Credits a session did not report make the total a lower bound, never a false zero (TD-94).
function spentText(credits, unknown) {
  if (!unknown) return `${credits.toFixed(2)} credits`;
  const sessions = `unknown for ${unknown} session${unknown === 1 ? "" : "s"}`;
  return credits ? `${credits.toFixed(2)}+ credits (${sessions})` : `credits ${sessions}`;
}

function ago(iso) {
  const seconds = Math.round((Date.now() - Date.parse(iso)) / 1000);
  if (Number.isNaN(seconds)) return "";
  if (seconds < 60) return "just now";
  const minutes = Math.round(seconds / 60), hours = Math.round(minutes / 60);
  return minutes < 60 ? `${minutes} min ago` : hours < 48 ? `${hours} h ago` : `${Math.round(hours / 24)} d ago`;
}

const BOOKKEEPING = new Set(["pids", "inventory", "skill", "tasks", "preserved"]);
const SAID = {
  step: (e) => `${e.kind} step ${e.exit}${e.reason ? `: ${e.reason}` : ""}`,
  tool: (e) => e.summary || `Called ${e.tool}${e.accepted === false ? " (rejected)" : ""}`,
  session: (e) => (e.resumed ? "Session resumed" : `Session started${e.role ? ` (${e.role})` : ""}`),
  denied: (e) => `Denied: ${e.reason || e.kind}`,
  publish: (e) => `Published PR #${e.pr}`,
  ci: (e) => (e.failed?.length ? `CI failed: ${e.failed.join(", ")}`
    : `CI passed${e.passed?.length ? `: ${e.passed.join(", ")}` : ""}`),
  "merge-offer": (e) => `Merge offered for ${String(e.head || "").slice(0, 7)}`,
  "merge-request": (e) => e.message || `Merge requested (${e.status})`,
  merged: (e) => `Merged PR #${e.pr}`,
  pullback: (e) => `Pull-back ${e.state}${e.reason ? `: ${e.reason}` : ""}`,
  "ro-install": (e) => `${e.command} in ${e.package}${e.ok ? "" : " failed"}`,
  "fix-drafted": (e) => `Drafted fix Change ${e.fix}`,
  brief: (e) => `Brief v${e.version} saved`,
};

// Newest first, in words; process and inventory bookkeeping stays in the activity file.
function activityLog(events) {
  const kept = events.filter((e) => e.event && !BOOKKEEPING.has(e.event)).slice(-12).reverse();
  if (!kept.length) return text("Nothing yet.", { size: "xs", color: "contrast-medium" });
  const log = el("ol", undefined, { class: "log" });
  for (const e of kept) {
    const when = e.at ? el("time", ago(e.at), { datetime: e.at, title: new Date(e.at).toLocaleString() }) : el("span");
    const item = el("li");
    item.append(when, el("span", (SAID[e.event] ?? ((x) => x.event))(e)));
    log.append(item);
  }
  return log;
}

function planList(d) {
  const working = ["build", "review", "integrate"].includes(d.step) && !d.line.startsWith("Done");
  const now = working ? d.plan.find((t) => !t.done) : null;
  const node = el("ol", undefined, { class: "plan" });
  for (const t of d.plan) {
    const [label, variant] = t.done ? ["done", "success"] : t === now ? ["now", "info"] : ["to do", "secondary"];
    const item = el("li"), said = el("span", t.title);
    if (t.origin && t.origin !== "plan") said.append(" ", plain("span", `from ${t.origin}`, "meta"));
    item.append(el("p-tag", label, { variant, compact: "true" }), said);
    node.append(item);
  }
  return node;
}

const STEP = { done: ["done", "success"], current: ["now", "info"], upcoming: ["to do", "secondary"],
  skipped: ["not needed", "secondary"] };

// The stages in order; the state is a word, never colour alone, and a loop badge says its rounds.
function stepper(p) {
  const node = el("ol", undefined, { class: "stepper" });
  for (const s of p.stages) {
    const [label, variant] = STEP[s.state], item = el("li", undefined, { class: s.state });
    if (s.state === "current") item.setAttribute("aria-current", "step");
    const line = el("span");
    line.append(el("span", s.label), el("p-tag", label, { variant, compact: "true" }));
    const where = [p.task ? `Task ${p.task} of ${p.tasks}` : "", p.sub || ""].filter(Boolean).join(" \u00b7 ");
    if (s.state === "current" && where) line.append(plain("span", where, "meta"));
    if (s.rounds > 1) {
      const loops = plain("span", undefined, "loops"), said = `${s.rounds} rounds`;
      loops.append(el("span", `\u00d7${s.rounds}`, { "aria-hidden": "true" }), plain("span", said, "sr"));
      line.append(loops);
    }
    item.append(line);
    node.append(item);
  }
  return node;
}

function screen(s) {
  const steps = s.steps.map((x) => (x.do === "type" ? `type "${x.text}" into ${x.target}` : `click ${x.target}`));
  return `${s.name} (${s.path}${steps.length ? `, then ${steps.join(", ")}` : ""}): ${s.expect}`;
}

// Who stated a technical item (TD-179 rule 1): the owner himself, or the shaper, whose proposal the approval accepts.
// Keys: a criterion's id, `screen:<name>`, `check:<name>`.
function yours(d, key) {
  return (d.brief.specified || []).includes(key);
}

// Each entry: what was asked (or what kind of item it is) as a small label, then the answer.
function saidList(items) {
  const node = el("ul", undefined, { class: "said" });
  for (const [label, answer] of items) {
    const item = el("li");
    item.append(plain("span", label, "label"), plain("span", answer));
    node.append(item);
  }
  return node;
}

function part(title, ...children) {
  const node = el("section");
  node.append(heading(4, title, "sm"), ...children);
  return node;
}

// The agreement the owner approves (TD-122, TD-179 rule 2): his decisions, what he specified among the technical
// details, the shaper's choices that the approval accepts, and what is out.
function agreement(d, approved = false) {
  const decisions = d.brief.decisions || [], out = d.brief.non_goals || [], parts = [];
  const mine = decisions.filter((x) => x.origin === "decided").map((x) => [x.question, x.answer]);
  const specified = [
    ...d.criteria.filter((k) => yours(d, k.id)).map((k) => ["Acceptance criterion", k.text]),
    ...d.brief.visual.filter((s) => yours(d, `screen:${s.name}`)).map((s) => ["Screen the visual check takes",
      screenSaid(s)]),
    ...d.checks.filter((c) => yours(d, `check:${c.id}`)).map((c) => ["Check you do yourself", checkSaid(c)]),
  ];
  if (mine.length || specified.length) parts.push(part("Your decisions", saidList([...mine, ...specified])));
  const proposed = decisions.filter((x) => x.origin !== "decided").map((x) => [x.question, x.answer]);
  if (proposed.length) {
    const accepts = approved ? "Your approval accepted these choices." : "Approving accepts these choices.";
    parts.push(part("Choices proposed by the shaper", text(accepts), saidList(proposed)));
  }
  if (!decisions.length && !specified.length) parts.push(text("No separate decisions recorded."));
  if (out.length) parts.push(part("Not in this Change", list(out)));
  return parts;
}

function checkSaid(c) {
  return `${c.steps.join("; ")}${c.expect ? `. Expected: ${c.expect}` : ""}`;
}

// A screen as the owner reads it: what it must show, then where and after which clicks.
function screenSaid(s) {
  const steps = s.steps.map((x) => (x.do === "type" ? `type "${x.text}" into ${x.target}` : `click ${x.target}`));
  return `${s.expect} (at ${s.path}${steps.length ? `, after: ${steps.join(", ")}` : ""})`;
}

function counted(n, one, many) {
  return n ? `${n} ${n === 1 ? one : many}` : "";
}

// What the technical details hold, in a line that stays visible while they are collapsed.
function detailCount(d) {
  return [counted(d.criteria.length, "criterion", "criteria"), counted(d.brief.visual.length, "screen", "screens"),
    counted(d.checks.length, "check for you", "checks for you")].filter(Boolean).join(" \u00b7 ");
}

// The technical details, collapsed (TD-122); an item the owner stated says so (TD-179 rule 1).
function technical(d) {
  const scope = d.brief.scope || [], mark = (key) => (yours(d, key) ? " (you specified)" : ""), inside = [];
  if (d.criteria.length) {
    const said = d.criteria.map((k) => `${k.id}: ${k.text}${mark(k.id)}`);
    inside.push(heading(5, "Acceptance criteria", "sm"), list(said));
  }
  if (d.brief.visual.length) {
    inside.push(heading(5, "Screens the visual check captures", "sm"),
      list(d.brief.visual.map((s) => `${screen(s)}${mark(`screen:${s.name}`)}`)));
  }
  if (d.checks.length) {
    inside.push(heading(5, "Checks you do yourself", "sm"),
      list(d.checks.map((c) => `${c.id}: ${checkSaid(c)}${mark(`check:${c.id}`)}`)));
  }
  if (d.brief.ui) {
    inside.push(text(d.brief.visual.length ? "This Change has a user interface: the visual check captures its screens."
      : "This Change has a user interface: you judge it in your own check."));
  }
  if (scope.length) inside.push(text(`Scope: ${scope.join(", ")}`));
  if (!inside.length) return [];
  const node = el("details"), head = el("summary", "Technical details"), count = detailCount(d);
  if (count) head.append(plain("span", count, "count"));
  node.append(head, ...inside);
  return [node];
}

function approval(d) {
  const version = d.brief.version, box = el("div", undefined, { class: "brief" });
  if (d.brief.outcome) box.append(text(d.brief.outcome, { size: "md" }));
  box.append(...agreement(d), ...technical(d));
  const start = async () => {
    const origin = shown;
    if (await ask(approving(d))) send("/approve-brief", { version }, origin);
  };
  const approve = button(`Approve brief v${version}`, start, { icon: "check", aria: DIALOG });
  return panel(`Brief v${version}${d.brief.title ? `: ${d.brief.title}` : ""}`, box,
    text("Nothing is built until you approve. You approve the whole brief, including the collapsed technical "
      + "details; your own choices stay yours to change. Approval authorises work within this brief, not new "
      + "product commitments. To change the brief before approving, return to the shaping chat."), approve);
}

// What approving starts (TD-151): the brief, details included, becomes the baseline; then the challenge, planning,
// building and review, the visual round and the merge; the owner's own parts come afterwards.
function approving(d) {
  const v = d.brief.version, screens = d.brief.visual.length, checks = d.checks.length, you = [];
  const count = detailCount(d), then = ["The challenger reads the brief first and may come back with questions.",
    "Then Delivery plans the work, builds and reviews each task, and opens a pull request."];
  if (screens) then.push(`It captures ${screens} screen${screens > 1 ? "s" : ""} for the visual check.`);
  then.push(`${merging(d)}. It takes on no new product commitment without you. AI credits are used `
    + `${d.paused ? "once you resume" : "from now on"}.`);
  if (screens) you.push("Judge the screens when Delivery asks.");
  if (checks) you.push(checks > 1 ? `Do your ${checks} checks once the pull request's checks pass.`
    : "Do your check once the pull request's checks pass.");
  return {
    title: `Approve brief v${v} and start the work?`, yes: d.paused ? "Approve; stay paused" : "Approve and start",
    no: "Keep it waiting",
    now: `Brief v${v}${count ? `, including its technical details (${count})` : ""}, becomes the approved version `
      + `every step follows${d.paused ? "; the Change stays paused until you resume" : ""}.`,
    then: then.join(" "),
    after: ["Answer questions here as they come up.", ...you, "Pause at any time; a pause takes effect after the "
      + "running step. Spent credits and finished work are not undone. To change the brief, revise it in the shaping "
      + "chat and approve the new version."].join(" "),
    instead: "Nothing is built. The brief waits here; revise it in the shaping chat or come back later.",
  };
}

// The same agreement after approval (Sol, TD-179 rule 8): what was approved, and what changed since.
function briefInfo(d) {
  const at = d.brief.approved_at ? new Date(d.brief.approved_at).toLocaleString() : "";
  const v = d.brief.approved || d.brief.version, box = info(`Brief v${v}${at ? `, approved ${at}` : ""}`);
  const body = el("div", undefined, { class: "brief" });
  if (d.brief.outcome) body.append(text(d.brief.outcome));
  const added = (d.owner_criteria || []).map((k) => [`You added in visual round ${k.round}`, k.text]);
  body.append(...agreement(d, true), ...technical(d), part("Changes since you approved", added.length
    ? saidList(added)
    : text("None. A change to an approved brief comes back to you as a new version to approve.")));
  if ((d.amendments || []).length) body.append(proposedWording(d.amendments));
  box.append(body);
  return box;
}

// TD-179: new wording a worker proposed for a generated criterion, with the challenger's verdict. Nothing is
// applied: adopting one means revising the brief in chat, which comes back as a version to approve.
function proposedWording(amendments) {
  const judged = { equivalent: "keeps the approved intent", weaker: "weaker", unsure: "unsure" };
  const rows = amendments.flatMap((a) => a.items.flatMap((i) => [
    [`${i.criterion} as you approved it`, i.old],
    [`Proposed by the ${a.step} step`, `${i.new} (${i.why})`],
    ["Challenger", [judged[a.verdict] || "not judged yet", a.judged].filter(Boolean).join(": ")],
  ]));
  return part("Proposed wording (not applied)", saidList(rows),
    text("To adopt one, revise the brief in chat; the new version comes back to you to approve."));
}

function detailHead(d) {
  const head = el("div", undefined, { class: "detail-head" }), title = el("div");
  const back = pds ? el("p-button-pure", "All Changes", { type: "button", icon: "arrow-left", class: "back" })
    : el("button", "All Changes", { type: "button", class: "back" });
  back.onclick = () => choose(null);
  const name = heading(2, d.slug, "xl");
  name.firstChild.tabIndex = -1;
  title.append(name);
  if (d.brief.title) title.append(text(d.brief.title, { color: "contrast-medium" }));
  head.append(back, title);
  if (!/^(Done|Abandoned) /.test(d.line)) {  // a finished Change has nothing left to pause
    const intent = { intent: d.paused ? "resume" : "pause" }, said = d.paused
      ? "Resumed: Delivery goes on once no question, check or stop holds the Change."
      : "Pause requested: the running step finishes first, then nothing new starts until you resume.";
    head.append(button(d.paused ? "Resume" : "Pause", async () => {
      const origin = shown, note = document.getElementById("started");
      if (await send("/intent", intent, origin) && selected === origin.slug) note.textContent = said;
    }, d.paused ? { icon: "play" } : { variant: "secondary", icon: "pause" }));
  }
  return head;
}

function reveal(target) {
  if (matchMedia("(max-width: 63.99rem)").matches) return window.scrollTo(0, 0);
  const top = target.getBoundingClientRect().top;
  if (top < 0 || top > innerHeight / 2) target.scrollIntoView({ block: "start" });
}

// The heading takes focus only once its PDS wrapper has rendered; a hidden element cannot be focused.
function focusHeading(target) {
  const wrapper = target.querySelector("p-heading"), name = target.querySelector("h2");
  Promise.resolve(wrapper?.componentOnReady?.()).then(() => {
    if (name.isConnected) name.focus({ preventScroll: true });
  });
}

async function showDetail() {
  const target = document.getElementById("detail");
  if (!selected) {
    shown = { slug: null, forms: "" };
    return target.replaceChildren();
  }
  const d = await call(`/changes/${encodeURIComponent(selected)}`);
  if (d.slug !== selected) return;  // the person chose another Change while this one loaded
  const data = JSON.stringify(d);
  if (d.slug === shown.slug && data === shown.data) return;  // unchanged: no rebuild, nothing moves
  const [variant, label] = badge(d);
  const parts = [detailHead(d), row(el("p-tag", label, { variant, compact: "true" }), text(d.line))];
  if (label === "Stopped") {
    parts.push(notice("error", "Stopped", `${d.line.replace(/^.*?stopped: /, "")}.`,
      d.action ? `What to do: ${d.action}.` : ""));
  }
  const behind = d.pullback?.state === "behind";
  if (behind) parts.push(pullbackNote(d.pullback, d));
  const r = d.visual_round, deciding = r && r.outcome === "ask" && d.question?.options.some((o) => o.id === "fail");
  const pictures = d.visual ? visualSection(d.slug, d.visual, d.before, d.visual_existing_errors, deciding)
    : d.before ? beforeSection(d.slug, d.before) : null;
  if (d.question) parts.push(deciding ? decisionForm(d.question, r, pictures, d) : questionForm(d.question, d));
  if (d.merge) parts.push(mergeForm(d.merge, d));
  for (const check of d.checks.filter((c) => c.waiting)) parts.push(checkForm(check, d));
  const approving = d.step === "shape" && d.brief.approved !== d.brief.version;
  if (approving) parts.push(approval(d));
  if (pictures && !deciding) {  // decided: the verdict shows, the screenshots open on request
    const shots = pictures.pop();
    parts.push(info("Before and after", ...pictures,
      disclosure(`Screenshots (${shots.querySelectorAll("button.zoom").length})`, shots)));
  }
  if (d.owner_criteria.length) parts.push(criteriaPanel(d.owner_criteria));
  if (d.progress) parts.push(info("Progress", stepper(d.progress)));
  if (d.plan.length) parts.push(info("Plan", planList(d)));
  if (!approving && (d.brief.outcome || d.criteria.length)) parts.push(briefInfo(d));
  if (d.pullback && !behind) parts.push(pullbackNote(d.pullback, d));
  parts.push(info("Recent activity", activityLog(d.activity)), spendLines(d.spend));
  const asked = d.checks.filter((c) => c.waiting).map((c) => [c.id, c.url, c.inputs]);
  const forms = JSON.stringify([d.slug, d.question?.id, d.question?.options?.map((o) => o.id), d.merge?.head,
    asked, d.brief.version, d.brief.approved, d.pullback?.state, d.paused, r?.number, r?.outcome,
    d.owner_criteria.map((k) => k.id)]);
  if (refused?.forms === forms) parts.splice(2, 0, refusal(refused.text));
  else refused = null;
  const focused = document.activeElement, name = target.querySelector("h2");
  const using = target.contains(focused) && focused !== name;  // a control in use keeps its place until it is left
  const overlay = document.querySelector("dialog.lightbox, p-modal");  // its launcher and focus return stay
  if ((using || draft || overlay) && forms === shown.forms) return;  // keep unsent input while the same forms show
  const opened = new Set([...target.querySelectorAll("details[open] > summary")].map((s) => s.textContent));
  target.replaceChildren(...parts);
  for (const s of target.querySelectorAll("details > summary")) if (opened.has(s.textContent)) s.parentNode.open = true;
  if (arrived || (name && focused === name)) focusHeading(target);
  if (arrived) reveal(target);
  arrived = false;
  shown = { slug: d.slug, forms, data };
  draft = false;
}

const PAUSED = /· paused by you/;

function badge(c) {
  if (/(^|· )stopped:/.test(c.line)) return ["error", "Stopped"];
  if (PAUSED.test(c.line)) return ["secondary", "Paused"];
  if (c.actor === "you") return ["warning", "Your turn"];
  if (c.actor === "admin") return ["warning", "Admin"];
  if (c.line.startsWith("Done")) return ["success", "Done"];
  if (c.line.startsWith("Abandoned")) return ["secondary", "Abandoned"];
  return c.actor === "github" ? ["secondary", "GitHub"] : ["info", "Delivery"];
}

const GROUPS = { you: "Needs you", working: "Delivery is working", paused: "Paused", done: "Done" };

function groupOf(label) {
  if (["Stopped", "Your turn", "Admin"].includes(label)) return "you";
  if (label === "Paused") return "paused";
  return ["Done", "Abandoned"].includes(label) ? "done" : "working";
}

function split(line) {  // the stage, then what is happening in it
  const at = line.indexOf(" \u00b7 ");
  return at < 0 ? ["", line] : [line.slice(0, at), line.slice(at + 3)];
}

function card(c, label, variant) {
  const node = el("li", undefined, { class: c.slug === selected ? "card current" : "card" });
  const open = el("a", c.slug, { href: `?change=${encodeURIComponent(c.slug)}`, class: "open", "data-slug": c.slug });
  if (c.slug === selected) open.setAttribute("aria-current", "true");
  open.onclick = (event) => {
    if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    choose(c.slug);
  };
  const top = el("div", undefined, { class: "top" }), [stage, rest] = split(c.line);
  top.append(open, el("p-tag", label, { variant, compact: "true" }));
  node.append(top);
  const step = c.progress?.line;  // the named step and its round, in place of the status line's short stage
  if (step) node.append(plain("p", step, "says stage"));
  const says = plain("p", undefined, "says");
  if (stage && !step) says.append(plain("span", stage, "stage"), " \u00b7 ");
  says.append(rest);
  node.append(says);
  if (c.action && groupOf(label) !== "working") node.append(plain("p", `Next: ${c.action}`, "next"));
  const bits = [];
  if (c.now && label !== "Done" && (!step || c.now.includes(" \u00b7 "))) bits.push(split(c.now)[1]);
  if (c.step_time) bits.push(`step ${c.step_time}`);
  if (c.credits?.change || c.credits?.unknown) {
    const step = c.credits.step ? ` (this step ${c.credits.step.toFixed(2)})` : "";
    bits.push(`${spentText(c.credits.change, c.credits.unknown || 0)}${step}`);
  }
  if (c.quiet) bits.push("quiet");
  if (bits.length) node.append(plain("p", bits.join(" \u00b7 "), "meta"));
  for (const o of c.overlaps || []) node.append(plain("p", o, "meta"));
  return node;
}

function showList(changes) {
  const groups = { you: [], working: [], paused: [], done: [] };
  for (const c of changes) {
    const [variant, label] = badge(c);
    groups[groupOf(label)].push([c, label, variant]);
  }
  groups.you.sort((a, b) => (b[1] === "Stopped") - (a[1] === "Stopped"));
  const nodes = [];
  if (!changes.length) {
    nodes.push(plain("p", "No Changes yet. New Change opens a chat in VS Code where you shape the first one.",
      "empty meta"));
  } else if (!groups.you.length) {
    nodes.push(plain("p", "Nothing needs you right now.", "meta"));
  }
  for (const [key, title] of Object.entries(GROUPS)) {
    if (!groups[key].length) continue;
    const cards = el("ul", undefined, { class: "cards" }), said = `${title} (${groups[key].length})`;
    cards.append(...groups[key].map((g) => card(...g)));
    const box = el(key === "done" ? "details" : "section", undefined, { class: "group" });
    if (key === "done") {
      box.open = doneOpen || groups.done.some(([c]) => c.slug === selected);
      box.addEventListener("toggle", () => { doneOpen = box.open; });
      box.append(el("summary", said), cards);
    } else {
      box.append(heading(2, said, "md"), cards);
    }
    nodes.push(box);
  }
  const focused = document.activeElement?.closest?.("#changes a[data-slug]")?.dataset.slug;
  const onDone = Boolean(document.activeElement?.matches?.("#changes details.group > summary"));
  document.getElementById("changes").replaceChildren(...nodes);
  if (focused) document.querySelector(`#changes a[data-slug="${CSS.escape(focused)}"]`)?.focus();
  if (onDone) document.querySelector("#changes details.group > summary")?.focus();
  document.title = groups.you.length ? `(${groups.you.length}) ${TITLE}` : TITLE;
}

const SLUG = /^[a-z0-9][a-z0-9-]{0,63}$/;

function choose(slug, push = true) {
  const was = selected;
  selected = slug && SLUG.test(slug) ? slug : null;
  arrived = Boolean(selected);
  if (selected !== was) document.getElementById("started").textContent = "";  // a note belongs to its Change
  if (push && selected !== was) {
    history.pushState(null, "", selected ? `?change=${encodeURIComponent(selected)}` : location.pathname);
  }
  document.getElementById("board").classList.toggle("open", Boolean(selected));
  if (!selected && was) document.querySelector(`#changes a[data-slug="${CSS.escape(was)}"]`)?.focus();
  refresh();
}

async function refresh() {
  if (busy) {
    again = true;  // a selection or an action while a refresh runs gets its own refresh after it
    return;
  }
  busy = true;
  try {
    const changes = await call("/changes");
    if (selected && !changes.some((c) => c.slug === selected)) {  // gone, or a stale link
      selected = null;
      history.replaceState(null, "", location.pathname);
      document.getElementById("board").classList.remove("open");
    }
    showList(changes);
    const notes = (await call("/project")).notes;
    document.getElementById("notes").replaceChildren(...notes.map((n) => text(n, { size: "xs" })));
    document.getElementById("notes").hidden = !notes.length;
    lastSeen = new Date();
    notify();
    document.getElementById("seen").textContent = "";
    for (const id of ["list", "detail"]) document.getElementById(id).classList.remove("stale");
    await showDetail();
  } catch (e) {
    failed(e);
  } finally {
    busy = false;
    if (again) {
      again = false;
      refresh();
    }
  }
}

async function launched(id) {  // the host opens the chat in the background; VS Code may first have to start
  for (;;) {
    const s = await call(`/new-change/${encodeURIComponent(id)}`);
    if (s.state !== "opening") return s;
    await new Promise((resolve) => setTimeout(resolve, 1000));
  }
}

async function newChange(event) {
  const trigger = event.currentTarget, result = document.getElementById("started");
  const wanted = await ask({
    title: "Shape a new Change?", yes: "Open the chat", no: "Not now",
    now: "A chat opens in VS Code where the shaper works out the brief with you; the chat uses AI credits like any "
      + "Copilot chat.",
    then: "Nothing is built. When you save the brief in the chat, it appears here for your approval.",
    after: "Approve it here to start the work, or keep shaping it in the chat.",
    instead: "Nothing opens.",
  });
  if (!wanted) return;
  waiting(trigger, true);
  result.textContent = "Opening the shaping chat…";
  try {
    const r = await call("/new-change", {});
    const s = r.started ? await launched(r.launch) : { state: "failed", ...r };
    if (s.state === "open") {
      const note = s.warning ? ` Note: ${s.warning}.` : "";
      result.textContent = `A chat opened in VS Code to shape the new Change.${note}`;
    } else {
      result.replaceChildren(`Could not open the chat: ${s.reason}. Copy this command: `, el("code", s.command));
    }
  } catch (e) {
    result.textContent = "";
    failed(e);
  } finally {
    waiting(trigger, false);
  }
}

async function start() {
  // The PDS components load from its CDN (PDS 4 has no local delivery), so the page picks its controls once.
  const loaded = customElements.whenDefined("p-button").then(() => true);
  pds = await Promise.race([loaded, new Promise((resolve) => setTimeout(resolve, 3000, false))]);
  if (!pds) {
    document.documentElement.classList.add("no-pds");
    document.getElementById("offline").hidden = false;
  }
  document.querySelector("header").append(button("New Change", newChange, { icon: "add", aria: DIALOG }));
  for (const type of ["input", "change"]) {
    document.getElementById("detail").addEventListener(type, () => { draft = true; });
  }
  addEventListener("popstate", () => choose(new URLSearchParams(location.search).get("change"), false));
  if (selected && !SLUG.test(selected)) selected = null;
  document.getElementById("board").classList.toggle("open", Boolean(selected));
  refresh();
  setInterval(refresh, 3000);
}

start();
</script>
