<!doctype html>
<html lang="en" class="scheme-light-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="owlbear-scope" content="all">
<title>OwlBear Delivery · Backlog</title>
<link rel="stylesheet" href="/assets/pds/index.css">
<script type="module">
  import { load } from "/assets/pds/load.mjs";
  load();
</script>
<!-- base -->
<style>
  #page > p-text:empty { display: none !important; }
  .row { align-items: end; }
  #add > * { flex: 1 1 14rem; }
  #add > :nth-child(2) { flex-grow: 2; }
  #add > :last-child { flex: 0 0 auto; }
  .entries { display: grid; gap: var(--p-spacing-static-sm); margin: 0; padding: 0; list-style: none; }
  .entry {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--p-spacing-static-md);
    padding: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    background: var(--p-color-surface); border-radius: var(--p-radius-lg);
  }
  .entry.unselectable { grid-template-columns: minmax(0, 1fr); }
  .entry .body, .entry .more { display: grid; gap: var(--p-spacing-static-sm); min-width: 0; }
  .entry .title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-spacing-static-sm); }
  .entry .title, .entry li { overflow-wrap: anywhere; }
  .entry .more { padding-top: var(--p-spacing-static-sm); }
  .entry .triage { flex-wrap: nowrap; }
  .entry .triage p-select, .entry .triage label { flex: 0 1 14rem; min-width: 0; }
  .said { white-space: pre-wrap; }
  .later > summary { font-size: var(--p-typescale-lg); }
  .later[open] > summary { margin-bottom: var(--p-spacing-static-sm); }
  .quiet .entry { background: none; box-shadow: inset 0 0 0 1px var(--p-color-contrast-lower); }
  ul.plain { margin: 0; padding-inline-start: var(--p-spacing-static-lg); }
  pre { margin: 0; white-space: pre-wrap; font-size: var(--p-typescale-xs); }
  fieldset.concerns { display: flex; flex-wrap: wrap; gap: var(--p-spacing-static-sm) var(--p-spacing-static-md);
    margin: 0; padding: 0; border: 0; }
  fieldset.concerns legend { font-size: var(--p-typescale-xs); font-weight: 600; padding: 0; }
</style>
</head>
<body>
<main>
<!-- tabs -->
<header>
  <p-heading size="2xl"><h1>Backlog</h1></p-heading>
</header>
<div id="page"></div>
</main>
<!-- ask -->
<script type="module">
import { html, nothing, render } from "/assets/lit-html/3.3.3/lit-html.js";
import { live } from "/assets/lit-html/3.3.3/directives/live.js";
import { repeat } from "/assets/lit-html/3.3.3/directives/repeat.js";
import { call, designSystem, here, loaded, project } from "/assets/ui.mjs";

const KINDS = ["untriaged", "defect", "improvement", "idea", "question"];
const SOURCES = { owner: "you", watcher: "the watcher", assistant: "the assistant", review: "a review", run: "a run" };
const TAGS = { untriaged: "secondary", defect: "error", improvement: "info", idea: "success", question: "warning" };
const DIALOG = "{ 'aria-haspopup': 'dialog' }";
const GET = 15000, WRITE = 60000;  // reads and writes go to GitHub's issues, a network round trip or several
// Everything the page shows comes from here, so a re-render never loses what the person typed, ticked or opened.
const state = {
  pds: true, loaded: null, error: "", status: "", started: null, creating: false, adding: false,
  idea: { title: "", text: "", clone: "" },  // the Add an idea form, and the clone it is found in
  choosing: null,  // the entries a Change starts from while the owner picks its clone
  notes: new Map(),  // entry key -> notes typed and not saved yet (an entry's key: its repository and number)
  linkTo: new Map(),  // entry key -> the entry chosen in its "Link to another entry" list
  selected: new Set(), opened: new Set(),
};
// projects: all, global, untriaged or a folder, kept in ?show=; "" until loaded, then the page's project's folder
const filter = { projects: new URLSearchParams(location.search).get("show") ?? "", kind: "all" };

function show() {
  const focused = document.activeElement;
  render(view(), document.getElementById("page"));
  if (focused?.isConnected && document.activeElement !== focused) focused.focus();
}

function notify(message = "") {
  state.error = message ? message.charAt(0).toUpperCase() + message.slice(1) : "";
  show();
}

function button(label, onclick, { variant, icon, aria, busy = false, disabled = false } = {}) {
  return state.pds
    ? html`<p-button type="button" compact="true" variant=${variant ?? nothing} icon=${icon ?? nothing}
        aria=${aria ?? nothing} .loading=${busy} ?disabled=${disabled} @click=${onclick}>${label}</p-button>`
    : html`<button type="button" .disabled=${busy || disabled} @click=${onclick}>${label}</button>`;
}

// A choice list showing *value* as the data has it; *chosen* gets the person's pick.
function select(label, options, value, chosen, { compact = false, hideLabel = false } = {}) {
  const changed = (e) => chosen(e.target.value);
  if (state.pds) {
    return html`<p-select label=${label} compact=${compact ? "true" : nothing}
        hide-label=${hideLabel ? "true" : nothing} .value=${live(value)} @change=${changed}>
      ${options.map(([v, said]) => html`<p-select-option value=${v}>${said}</p-select-option>`)}</p-select>`;
  }
  return html`<label class="field">${label}<select .value=${live(value)} @change=${changed}>
    ${options.map(([v, said]) => html`<option value=${v} ?selected=${v === value}>${said}</option>`)}
    </select></label>`;
}

// A text field bound to a draft: *typed* keeps each keystroke, so a re-render shows the draft again.
function field(label, value, typed, { multiline = false, rows = "3" } = {}) {
  const max = multiline ? "4000" : "200", keep = (e) => typed(e.target.value ?? "");
  if (state.pds) {
    return multiline
      ? html`<p-textarea label=${label} max-length=${max} rows=${rows} .value=${live(value)} @input=${keep}
          @change=${keep}></p-textarea>`
      : html`<p-input-text label=${label} max-length=${max} .value=${live(value)} @input=${keep}
          @change=${keep}></p-input-text>`;
  }
  return html`<label class="field">${label}${multiline
    ? html`<textarea maxlength=${max} rows=${rows} .value=${live(value)} @input=${keep}></textarea>`
    : html`<input type="text" maxlength=${max} .value=${live(value)} @input=${keep}>`}</label>`;
}

function tick(label, checked, flipped) {
  const flip = (e) => flipped(e.target.checked === true);
  return state.pds
    ? html`<p-checkbox label=${label} hide-label="true" .checked=${live(checked)} @change=${flip}></p-checkbox>`
    : html`<input type="checkbox" aria-label=${label} .checked=${live(checked)} @change=${flip}>`;
}

function labelled(label, checked, flipped, disabled = false) {
  const flip = (e) => flipped(e.target.checked === true);
  return state.pds
    ? html`<p-checkbox label=${label} .checked=${live(checked)} ?disabled=${disabled} @change=${flip}></p-checkbox>`
    : html`<label><input type="checkbox" .checked=${live(checked)} .disabled=${disabled} @change=${flip}>
        ${label}</label>`;
}

// The clones of the entry's repository on this machine: where its Changes start and its writes go.
function clonesOf(e) {
  return state.loaded.clones.filter((c) => c.repository === e.repository);
}

function concerns(e) {
  if (e.projects === null) return `not triaged yet${e.origin ? ` (found in ${e.origin})` : ""}`;
  return `${e.projects.length ? e.projects.join(", ") : "Global"}${e.origin ? ` · found in ${e.origin}` : ""}`;
}

// The Change an entry went into: its clone's id and slug; an older bare slug only when exactly one clone of the
// project it was found in has it.
function changeLink(e) {
  if (!e.change) return nothing;
  const [id, slug] = e.change.includes("/") ? e.change.split("/") : [null, e.change];
  const owners = clonesOf(e).filter((c) => (id === null ? c.name === e.origin && c.changes.includes(slug)
    : c.id === id));
  if (owners.length !== 1) return html` · in Change ${slug} (not found on this machine)`;
  const c = owners[0], key = c.id ? `${c.id}/${slug}` : slug;
  const named = state.loaded.clones.length > 1 ? `${c.label}: ${slug}` : slug;
  return html` · in Change <a href=${`/?change=${encodeURIComponent(key)}`}>${named}</a>`;
}

function age(iso) {
  const minutes = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (minutes < 60) return `${minutes} min ago`;
  if (minutes < 60 * 48) return `${Math.round(minutes / 60)} h ago`;
  return `${Math.round(minutes / 1440)} d ago`;
}

function reference(ref) {
  try {
    if (["http:", "https:"].includes(new URL(ref).protocol)) return html`<a href=${ref} rel="noopener">${ref}</a>`;
  } catch {
    // not a URL: a Change, step, session or path
  }
  return ref;
}

async function patch(e, fields, said = `Saved "${e.title}".`, of = e.via) {
  try {
    const body = { method: "PATCH", body: fields, timeout: WRITE, of };
    const r = await call(`/backlog/${encodeURIComponent(e.id)}`, body);
    if ("notes" in fields) state.notes.delete(e.key);
    state.error = "";
    state.status = `${said}${r.notice ? ` ${r.notice}` : ""}`;
    await refresh();
  } catch (error) {
    notify(error.message);
  }
}

function linkPart(e, byId) {
  const others = state.loaded.entries.filter((o) => o.repository === e.repository && o.id !== e.id
    && !e.links.includes(o.id));
  // the pick as of the click, not as of the last render: choosing in the list does not render again
  const target = () => (others.some((o) => o.id === state.linkTo.get(e.key)) ? state.linkTo.get(e.key)
    : others[0]?.id);
  return html`<div class="more">
    ${e.links.length ? html`<p-text size="xs" weight="semibold">Linked entries</p-text><ul class="plain">
      ${e.links.map((id) => html`<li>${byId.get(`${e.repository}#${id}`)?.title ?? id} ${button("Unlink",
        () => patch(e, { links: e.links.filter((x) => x !== id) }), { variant: "secondary" })}</li>`)}</ul>`
      : nothing}
    ${others.length ? html`<div class="row">${select("Link to another entry", others.map((o) => [o.id, o.title]),
      target(), (v) => state.linkTo.set(e.key, v))}${button("Link", () => patch(e, { links: [...e.links, target()] }),
      { variant: "secondary" })}</div>` : nothing}
  </div>`;
}

function dropButton(e) {
  const drop = () => patch(e, { status: "dropped" }, `Dropped "${e.title}"; Reopen brings it back.`);
  return button("Drop", drop, { variant: "secondary", icon: "close" });
}

function statusPart(e, drop = true) {
  if (e.status === "inbox" || e.status === "open") {
    const done = button("Mark done", () => patch(e, { status: "done" }), { variant: "secondary", icon: "check" });
    return html`<div class="row">${done}${drop ? dropButton(e) : nothing}</div>`;
  }
  const reopen = button("Reopen", () => patch(e, { status: e.kind === "untriaged" ? "inbox" : "open" }),
    { variant: "secondary", icon: "refresh" });
  if (e.status !== "in-change") return html`<div class="row">${reopen}</div>`;
  const clones = clonesOf(e), several = clones.length > 1;
  const options = [["-", "not named yet"], ...clones.flatMap((c) => c.changes.map((slug) => [
    c.id ? `${c.id}/${slug}` : slug, several ? `${c.label}: ${slug}` : slug]))];
  const named = (v) => {
    if (v === "-" || v === e.change) return;
    const owner = clones.find((c) => (c.id ? v.startsWith(`${c.id}/`) : true));
    patch(e, { change: v }, undefined, owner?.id ?? e.via);  // the clone holding the Change checks and names it
  };
  return html`<div class="row">${select("The Change it went into", options, e.change || "-", named)}${reopen}</div>`;
}

function kindPicker(e, inline = false) {
  const options = KINDS.map((k) => [k, inline && k === "untriaged" ? "Choose a kind" : k]);
  const chosen = (v) => { if (v !== e.kind) patch(e, { kind: v }); };
  return select("Kind", options, e.kind, chosen, { compact: inline, hideLabel: inline });
}

// What the entry concerns: Global, or the projects ticked (TD-241); the last one ticked stays until Global is.
function concernsPicker(e) {
  const mine = e.projects ?? [], global = e.projects !== null && !mine.length;
  const folders = [...new Set([...clonesOf(e).map((c) => c.name).filter(Boolean), ...mine])].sort();
  const flip = (f) => (on) => patch(e, { projects: on ? [...mine, f] : mine.filter((x) => x !== f) });
  return html`<fieldset class="concerns"><legend>Concerns</legend>
    ${labelled("Global: every project", global, (on) => { if (on) patch(e, { projects: [] }); }, global)}
    ${folders.map((f) => labelled(f, mine.includes(f), flip(f), mine.length === 1 && mine[0] === f))}
  </fieldset>`;
}

function details(e, byId) {
  const inbox = e.status === "inbox", notes = state.notes.get(e.key) ?? e.notes;
  const toggled = (ev) => (ev.target.open ? state.opened.add(e.key) : state.opened.delete(e.key));
  return html`<details .open=${state.opened.has(e.key)} @toggle=${toggled}>
    <summary>Details, notes and links</summary>
    <div class="more">
      ${e.text ? html`<p-text class="said">${e.text}</p-text>` : nothing}
      ${e.evidence.length ? html`<p-text size="xs" weight="semibold">Evidence</p-text>
        <ul class="plain">${e.evidence.map((ref) => html`<li>${reference(ref)}</li>`)}</ul>` : nothing}
      ${inbox ? nothing : html`<div class="row">${kindPicker(e)}</div>`}
      ${concernsPicker(e)}
      ${field("Your notes: context for whoever shapes the Change", notes, (v) => state.notes.set(e.key, v),
        { multiline: true })}
      <div class="row">${button("Save notes", () => patch(e, { notes: (state.notes.get(e.key) ?? e.notes).trim() }),
        { variant: "secondary" })}
      </div>
      ${linkPart(e, byId)}
      ${statusPart(e, !inbox)}
    </div>
  </details>`;
}

function card(e, byId) {
  const choosable = (e.status === "inbox" || e.status === "open") && !e.opening;
  const seen = e.count > 1 ? `seen ${e.count} times, last ${age(e.last_seen)}` : `seen ${age(e.last_seen)}`;
  const choose = (on) => {
    if (on) state.selected.add(e.key);
    else state.selected.delete(e.key);
    show();
  };
  return html`<li class=${choosable ? "entry" : "entry unselectable"}>
    ${choosable ? tick(`Select ${e.title}`, state.selected.has(e.key), choose) : nothing}
    <div class="body">
      <div class="title"><p-text weight="semibold">${e.title}</p-text>
        <p-tag variant=${TAGS[e.kind]} compact="true">${e.kind}</p-tag>
        ${e.status !== "inbox" && e.status !== "open" ? html`<p-tag compact="true">${e.status}</p-tag>` : nothing}
        ${e.opening ? html`<p-tag variant="info" compact="true">chat opening</p-tag>` : nothing}</div>
      <p-text size="xs" color="contrast-medium">From ${SOURCES[e.source] ?? e.source} · ${seen}${changeLink(e)}
        · <span class="concerns">${concerns(e)}</span> ·
        ${e.url ? html`<a href=${e.url} rel="noopener">#${e.id}</a>` : `#${e.id}`}</p-text>
      ${e.status === "inbox" && !e.opening ? html`<div class="row triage">${kindPicker(e, true)}${dropButton(e)}</div>`
        : nothing}
      ${details(e, byId)}
    </div>
  </li>`;
}

// An untriaged entry shows under its origin too, so the project it was found in sees it to triage (TD-241).
function shows(e) {
  const f = filter.projects, untriaged = e.projects === null;
  const concerned = f === "all" || (f === "global" ? !untriaged && !e.projects.length
    : f === "untriaged" ? untriaged : (e.projects ?? []).includes(f) || (untriaged && e.origin === f));
  return concerned && (filter.kind === "all" || e.kind === filter.kind);
}

// The selectable entries still ticked; an entry that moved on or is opening a chat drops out.
function chosen() {
  return state.loaded.entries.filter((e) => state.selected.has(e.key) && !e.opening
    && ["inbox", "open"].includes(e.status));
}

// The filter row: the projects an entry concerns and its class; the state is the page's sections. The page's
// project (?project=) is the first choice; a vanished project falls back to all.
function filters() {
  const { entries, clones } = state.loaded;
  const folders = [...new Set([...clones.map((c) => c.name), ...entries.flatMap((e) => e.projects ?? [])]
    .filter(Boolean))].sort();
  if (!filter.projects) filter.projects = clones.find((c) => c.id && c.id === project)?.name ?? "all";
  if (!["all", "global", "untriaged", ...folders].includes(filter.projects)) filter.projects = "all";
  const options = [["all", "All"], ["global", "Global"], ["untriaged", "Not triaged yet"],
    ...folders.map((f) => [f, f])];
  const shown = (v) => {
    filter.projects = v;
    history.replaceState(null, "", here({ show: v === "all" ? "" : v }));  // a reload or link keeps it
    show();
  };
  const kinds = select("Class", [["all", "all"], ...KINDS.map((k) => [k, k])], filter.kind,
    (v) => { filter.kind = v; show(); });
  return html`<div id="filters" class="row" role="group" aria-label="Show only">
    ${select("Projects", options, filter.projects, shown)}${kinds}</div>`;
}

function list(id, entries, byId, empty) {
  const items = entries.length ? repeat(entries, (e) => e.key, (e) => card(e, byId))
    : html`<li><p-text size="sm" color="contrast-medium">${empty}</p-text></li>`;
  return html`<ul id=${id} class="entries" aria-labelledby=${id === "later" ? "later-title" : nothing}>${items}</ul>`;
}

function addForm() {
  const add = () => addIdea(), clones = state.loaded.clones;
  if (!clones.some((c) => c.id === state.idea.clone)) state.idea.clone = clones[0]?.id ?? "";
  const where = clones.length > 1 ? select("Found in", clones.map((c) => [c.id, c.label]), state.idea.clone,
    (v) => { state.idea.clone = v; }) : nothing;
  return html`<section class="panel" aria-labelledby="add-title">
    <p-heading size="md"><h2 id="add-title">Add an idea</h2></p-heading>
    <div id="add" class="row">${where}
      ${field("Title", state.idea.title, (v) => { state.idea.title = v; })}
      ${field("What you noticed (optional)", state.idea.text, (v) => { state.idea.text = v; },
        { multiline: true, rows: "1" })}
      ${button("Add idea", add, { icon: "add", busy: state.adding })}
    </div>
  </section>`;
}

function started() {
  if (state.choosing) return chooser();
  const s = state.started;
  if (!s) return html`<p-text id="started" aria-live="polite"></p-text>`;
  return html`<p-text id="started" aria-live="polite">${s.text ?? html`Could not open the chat: ${s.reason}. Run this
    command instead:<pre><code>${s.command}</code></pre>`}</p-text>`;
}

function view() {
  const loaded = state.loaded;
  const body = [];
  if (loaded) {
    for (const key of [...state.selected]) if (!chosen().some((e) => e.key === key)) state.selected.delete(key);
    const byId = new Map(loaded.entries.map((e) => [e.key, e]));
    const head = filters();
    const lists = { inbox: [], open: [], later: [] };
    for (const e of loaded.entries.filter(shows)) lists[e.status in lists ? e.status : "later"].push(e);
    const repositories = [...new Set(loaded.clones.map((c) => c.repository))];
    const notes = [`The backlog is the issues of ${repositories.join(" and ")}.`,
      loaded.unreadable.length ? `Issues without a readable entry: ${loaded.unreadable.join(", ")}.` : "",
      ...loaded.failed.map((f) => `Not read just now: ${f}.`)];
    const ticked = chosen().length;
    body.push(html`<p-text id="where" size="xs" color="contrast-medium">${notes.filter(Boolean).join(" ")}</p-text>
      ${head}
      ${addForm()}
      <section aria-labelledby="inbox-title">
        <div><p-heading size="xl"><h2 id="inbox-title">Inbox (${lists.inbox.length})</h2></p-heading>
          <p-text>Choose a kind to move an entry to Open, or drop it.</p-text></div>
        ${list("inbox", lists.inbox, byId, "Nothing new to triage.")}
      </section>
      <section aria-labelledby="open-title">
        <div><p-heading size="xl"><h2 id="open-title">Open (${lists.open.length})</h2></p-heading>
          <p-text>Tick entries to shape a Change from them.</p-text></div>
        ${list("open", lists.open, byId, "No open entries.")}
      </section>
      <details class="later quiet">
        <summary id="later-title">In a Change, done or dropped (${lists.later.length})</summary>
        ${list("later", lists.later, byId, "Nothing here yet.")}
      </details>
      <div id="selection" class="bar" role="region" aria-label="Selected entries" ?hidden=${!ticked && !state.creating}>
        <p-text id="chosen" weight="semibold">${ticked} selected</p-text>
        <div id="actions" class="row">
          ${button(`Create Change from ${ticked}`, createChange, { icon: "add", aria: DIALOG, busy: state.creating })}
          ${button("Clear selection", () => { state.selected.clear(); show(); }, { variant: "secondary" })}
        </div>
      </div>`);
  }
  return html`
    <p id="offline" role="status" ?hidden=${state.pds}>The Porsche Design System did not load from
      cdn.ui.porsche.com, so the page uses plain controls. Reload to try again.</p>
    <p-inline-notification id="error" state="error" dismiss-button="false" ?hidden=${!state.error}>${state.error}
    </p-inline-notification>
    ${started()}
    <p-text id="status" role="status" aria-live="polite">${state.status}</p-text>
    ${body}`;
}

// Each repository's backlog once, from the first of its clones that answers; a chat opening in another clone shows on
// its entries too. An entry's key is its repository and number, since numbers repeat across repositories. Every clone
// is read whatever the filter shows: each is a place a Change may start or a Change was made.
async function load() {
  const projects = loaded() ?? [{ id: "", name: "", path: "" }];
  const each = await Promise.allSettled(projects.map((p) => call("/backlog", { timeout: GET, of: p.id })));
  const clones = [], first = new Map(), unreadable = [], failed = [];
  each.forEach((r, i) => {
    const p = projects[i];
    if (r.status === "rejected") return failed.push(`${p.name || "this project"}: ${r.reason.message}`);
    const b = r.value, mark = (e) => ({ ...e, key: `${b.repository}#${e.id}`, via: p.id, repository: b.repository });
    const name = b.project || p.name, twin = projects.some((o) => o !== p && o.name === p.name);
    clones.push({ id: p.id, name, label: twin ? `${name} (${p.path})` : name, repository: b.repository,
      changes: b.changes });
    if (!first.has(b.repository)) {
      first.set(b.repository, b.entries.map(mark));
      unreadable.push(...b.unreadable);
      return undefined;
    }
    const opening = new Map(b.entries.filter((e) => e.opening).map((e) => [e.id, e.opening]));
    for (const e of first.get(b.repository)) e.opening ||= opening.get(e.id);
    return undefined;
  });
  if (!clones.length && failed.length) throw each.find((r) => r.status === "rejected").reason;
  return { entries: [...first.values()].flat(), unreadable, clones, failed };
}

async function refresh() {
  try {
    state.loaded = await load();
  } catch (e) {
    return notify(e.message);
  }
  show();
}

async function addIdea() {
  const title = state.idea.title.trim(), text = state.idea.text.trim();
  if (!title) return notify("Give the idea a title.");
  state.adding = true;
  show();
  try {
    const of = state.idea.clone;
    const r = await call("/backlog", { method: "POST", body: { title, text }, timeout: WRITE, of });
    state.idea = { title: "", text: "", clone: of };
    state.error = "";
    const what = r.new ? `Added "${r.entry.title}" to the inbox.` : `"${r.entry.title}" was already there; `
      + `seen ${r.entry.count} times now.`;
    state.status = `${what}${r.notice ? ` ${r.notice}` : ""}`;
    state.adding = false;
    await refresh();
  } catch (e) {
    state.adding = false;
    notify(e.message);
  }
}

async function launched(id, of) {  // the host opens the chat in the background; VS Code may first have to start
  for (;;) {
    const s = await call(`/new-change/${encodeURIComponent(id)}`, { timeout: GET, of });
    if (s.state !== "opening") return s;
    await new Promise((resolve) => setTimeout(resolve, 1000));
  }
}

// The clone a Change from *picked* starts in, when the entries name it: one project, held by one clone here. A
// Global or untriaged entry names none.
function clear(picked) {
  const clones = clonesOf(picked[0]), named = new Set(picked.flatMap((e) => (e.projects?.length ? e.projects : ["?"])));
  const only = named.size === 1 && !named.has("?") ? clones.filter((c) => c.name === [...named][0]) : [];
  return clones.length === 1 ? clones[0] : only.length === 1 ? only[0] : null;
}

// Global, untriaged or several projects' entries, or a project with several clones here: the owner picks the clone.
function chooser() {
  const clones = clonesOf(state.choosing.picked[0]);
  const go = () => { const { picked, of } = state.choosing; state.choosing = null; show(); shapeFrom(picked, of); };
  const stop = () => { state.choosing = null; show(); };
  return html`<div id="choose" class="row">${select("Shape the Change in", clones.map((c) => [c.id, c.label]),
    state.choosing.of, (v) => { state.choosing.of = v; })}
    ${button("Continue", go)}${button("Cancel", stop, { variant: "secondary" })}</div>`;
}

async function createChange() {
  const picked = chosen();
  if (!picked.length) return notify("Select one or more entries first.");
  if (new Set(picked.map((e) => e.repository)).size > 1) {
    return notify("These entries are in different repositories' backlogs; pick entries of one of them.");
  }
  const target = clear(picked);
  if (target) return shapeFrom(picked, target.id);
  state.choosing = { picked, of: clonesOf(picked[0])[0].id };
  show();
  return undefined;
}

async function shapeFrom(picked, of) {
  const titles = picked.map((e) => e.title), many = picked.length > 1;
  const wanted = await ask({
    title: `Shape a Change from ${many ? `these ${picked.length} entries` : "this entry"}?`, yes: "Open the chat",
    no: "Keep selected",
    now: "A chat opens in VS Code where the shaper turns them, with their notes, evidence and links, into a brief; "
      + "the chat uses AI credits. Once it opens, they are marked as in a Change.",
    items: titles,
    then: "Nothing is built. The brief appears on the Changes page for your approval.",
    after: "Approve the brief there to start the work; set each entry's Change here once it exists.",
    instead: "The entries stay selected and unchanged.",
  });
  if (!wanted) return;
  state.creating = true;
  state.started = { text: "Opening the shaping chat…" };
  show();
  try {
    const r = await call("/backlog/change", { body: { ids: picked.map((e) => e.id) }, timeout: WRITE, of });
    const s = r.started ? await launched(r.launch, of) : { state: "failed", ...r };
    if (r.started) state.selected.clear();
    state.error = "";
    state.started = s.state === "open"
      ? { text: `A chat opened in VS Code to shape a Change from ${picked.length} entries.`
        + (s.warning ? ` Note: ${s.warning}.` : "") }
      : { reason: s.reason, command: s.command };
  } catch (e) {
    state.started = null;
    state.error = e.message.charAt(0).toUpperCase() + e.message.slice(1);
  } finally {
    state.creating = false;
    await refresh();
  }
}

// The PDS components load from its CDN (PDS 4 has no local delivery), so the page picks its controls once.
state.pds = await designSystem();
document.addEventListener("visibilitychange", () => { if (!document.hidden && !state.creating) refresh(); });
refresh();
</script>
</body>
</html>
