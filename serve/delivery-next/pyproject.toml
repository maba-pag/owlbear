[project]
name = "owlbear-delivery-next"
version = "0.1.0"
requires-python = ">=3.14.8"
description = "OwlBear Delivery-next — thin step loop, state store and status line"
dependencies = ["github-copilot-sdk==1.0.19", "psutil>=7.2.2", "pydantic>=2.13.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_delivery_next"]
