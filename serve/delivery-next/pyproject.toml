[project]
name = "owlbear-delivery-next"
version = "0.1.0"
requires-python = ">=3.14.8"
description = "OwlBear Delivery-next — thin step loop, state store and status line"
dependencies = [
  "fastapi>=0.142.2",
  "github-copilot-sdk==1.0.19",
  "mcp>=2,<2.4",
  "psutil>=7.2.2",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "truststore>=0.10.4",
  "uvicorn>=0.54.0",
]

[project.scripts]
owlbear-next = "owlbear_delivery_next.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_delivery_next"]
