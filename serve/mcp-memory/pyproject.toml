[project]
name = "owlbear-mcp-memory"
version = "0.1.0"
requires-python = ">=3.12.13"
description = "OwlBear MCP server — memory operations"
dependencies = ["mcp[cli]>=1.27.1", "pydantic>=2.13.4", "pyyaml>=6.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_mcp_memory"]
