[project]
name = "owlbear-decisions"
version = "0.1.0"
requires-python = ">=3.14.8"
description = "OwlBear decisions core — file contract, validator and record migration preview"
dependencies = ["pydantic>=2.13.4", "ruamel.yaml>=0.19.1"]

[project.scripts]
decisions-validate = "owlbear_decisions.validate:main"
decisions-migrate-preview = "owlbear_decisions.migrate:main"
decisions-view = "owlbear_decisions.view:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_decisions"]
