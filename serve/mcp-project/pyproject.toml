[project]
name = "owlbear-mcp-project"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear MCP server — project metadata and lifecycle"
dependencies = [
  "pydantic>=2.10.0",
  "mcp[cli]>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_mcp_project"]
