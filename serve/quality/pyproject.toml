[project]
name = "owlbear-quality"
version = "0.1.0"
requires-python = ">=3.14.8"
description = "OwlBear deterministic lint execution and exception inspection"
dependencies = ["pyyaml>=6.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_quality"]
