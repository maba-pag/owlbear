[project]
name = "owlbear-browser"
version = "0.1.0"
requires-python = ">=3.14.4"
description = "OwlBear browser package — authenticated web content extraction via Edge CDP"
dependencies = [
    "lxml>=4.9.4",
    "playwright>=1.58.0",
    "trafilatura>=1.12.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_browser"]
