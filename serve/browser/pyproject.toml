[project]
name = "owlbear-browser"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear browser package — authenticated web content extraction via Edge CDP"
dependencies = [
    "lxml>=4.9",
    "playwright>=1.49",
    "trafilatura>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_browser"]
