[project]
name = "owlbear-browser"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear browser package — authenticated web content extraction via Edge CDP"
dependencies = [
    "lxml>=6.1.1",
    "playwright>=1.60.0",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_browser"]
