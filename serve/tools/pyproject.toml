[project]
name = "owlbear-tools"
version = "0.1.0"
requires-python = ">=3.14.8"
description = "OwlBear utility tools — indexes and related scripts"
dependencies = [
    "pyyaml>=6.0.3",
    "tree-sitter-language-pack>=1.12.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_tools"]

[project.scripts]
commit-owned = "owlbear_tools.commit_owned:main"
doc-index = "owlbear_tools.doc_index:main"
indexes = "owlbear_tools.indexes:main"
py-index = "owlbear_tools.py_index:main"
semble = "owlbear_tools.semble:main"
ts-index = "owlbear_tools.ts_index:main"
test-root = "owlbear_tools.test_root:main"
test = "owlbear_tools.testing:test_main"
tests = "owlbear_tools.testing:test_main"
lint = "owlbear_tools.quality:lint"
lint-python = "owlbear_tools.quality:lint_python"
lint-markdown = "owlbear_tools.quality:lint_markdown"
lint-yaml = "owlbear_tools.quality:lint_yaml"
lint-shell = "owlbear_tools.quality:lint_shell"
lint-actions = "owlbear_tools.quality:lint_actions"
lint-editorconfig = "owlbear_tools.quality:lint_editorconfig"
lint-biome = "owlbear_tools.quality:lint_biome"
format = "owlbear_tools.quality:format_commands"
format-python = "owlbear_tools.quality:format_python"
format-biome = "owlbear_tools.quality:format_biome"
format-whitespace = "owlbear_tools.quality:format_whitespace"
format-eof = "owlbear_tools.quality:format_eof"
quality = "owlbear_tools.quality:quality"
todo = "owlbear_tools.todo:todo_check"
help = "owlbear_tools.commands:help_main"
hooks-install = "owlbear_tools.project:hooks_install"
setup-project = "owlbear_tools.project:setup_project"
doctor = "owlbear_tools.project:doctor"
dep-status = "owlbear_tools.dependency_environment:dep_status"
dep-sync = "owlbear_tools.dependency_environment:dep_sync"
