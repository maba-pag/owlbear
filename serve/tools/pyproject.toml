[project]
name = "owlbear-tools"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear utility tools — indexes and related scripts"
dependencies = [
    "owlbear-delivery",
    "pyyaml>=6.0.3",
    "tree-sitter-language-pack>=1.12.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_tools"]

[project.scripts]
commit-owned = "owlbear_tools.commit_owned:main"
doc-index = "owlbear_tools.doc_index:main"
indexes = "owlbear_tools.indexes:main"
py-index = "owlbear_tools.py_index:main"
semble = "owlbear_tools.semble:main"
ts-index = "owlbear_tools.ts_index:main"
test-root = "owlbear_tools.test_root:main"
test = "owlbear_tools.testing:test_main"
test-e2e = "owlbear_tools.testing:test_e2e_main"
lint = "owlbear_tools.quality:lint"
lint-cockpit = "owlbear_tools.quality:lint_cockpit"
lint-python = "owlbear_tools.quality:lint_python"
lint-markdown = "owlbear_tools.quality:lint_markdown"
lint-yaml = "owlbear_tools.quality:lint_yaml"
lint-shell = "owlbear_tools.quality:lint_shell"
lint-actions = "owlbear_tools.quality:lint_actions"
lint-editorconfig = "owlbear_tools.quality:lint_editorconfig"
lint-cockpit-code = "owlbear_tools.quality:lint_cockpit_code"
lint-cockpit-style = "owlbear_tools.quality:lint_cockpit_style"
lint-cockpit-html = "owlbear_tools.quality:lint_cockpit_html"
megalint = "owlbear_tools.megalinter:megalint"
lint-full = "owlbear_tools.quality:lint_full"
format-python = "owlbear_tools.quality:format_python"
format-whitespace = "owlbear_tools.quality:format_whitespace"
format-eof = "owlbear_tools.quality:format_eof"
format-full = "owlbear_tools.quality:format_full"
typecheck-cockpit = "owlbear_tools.quality:typecheck_cockpit"
quality-full = "owlbear_tools.quality:quality_full"
todo = "owlbear_tools.todo:todo_check"
help = "owlbear_tools.commands:help_main"
hooks-install = "owlbear_tools.project:hooks_install"
setup-project = "owlbear_tools.project:setup_project"
doctor = "owlbear_tools.project:doctor"
target-branch = "owlbear_tools.delivery_config:target_branch"
migrate-delivery-state = "owlbear_tools.delivery_migration:main"
retire-delivery-integration = "owlbear_tools.delivery_integration_retirement:main"
deps-status = "owlbear_tools.maintenance:deps_status"
deps-sync = "owlbear_tools.maintenance:deps_sync"
pds-sync = "owlbear_tools.maintenance:pds_sync"
megalint-clean = "owlbear_tools.megalinter:megalint_clean"

[tool.uv.sources]
owlbear-delivery = { workspace = true }
