[project]
name = "owlbear-tools"
version = "0.1.0"
requires-python = ">=3.12.13"
description = "OwlBear utility tools — doc-index and related scripts"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_tools"]

[project.scripts]
doc-index = "owlbear_tools.doc_index:main"
test-root = "owlbear_tools.test_root:main"
lint = "owlbear_tools.lint:lint"
lint-all = "owlbear_tools.lint:lint_all"
megalint = "owlbear_tools.lint:megalint"
eslint-fix = "owlbear_tools.lint:eslint_fix"
todo = "owlbear_tools.lint:todo_check"
