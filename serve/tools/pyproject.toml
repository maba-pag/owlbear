[project]
name = "owlbear-tools"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear utility tools — indexes and related scripts"
dependencies = [
    "owlbear-delivery",
    "pyyaml>=6.0.3",
    "tree-sitter-language-pack>=1.12.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_tools"]

[project.scripts]
commit-owned = "owlbear_tools.commit_owned:main"
doc-index = "owlbear_tools.doc_index:main"
indexes = "owlbear_tools.indexes:main"
py-index = "owlbear_tools.py_index:main"
semble = "owlbear_tools.semble:main"
ts-index = "owlbear_tools.ts_index:main"
test-root = "owlbear_tools.test_root:main"
test = "owlbear_tools.testing:test_main"
test-e2e = "owlbear_tools.testing:test_e2e_main"
lint = "owlbear_tools.lint:lint"
megalint = "owlbear_tools.lint:megalint"
typecheck = "owlbear_tools.lint:typecheck"
lint-full = "owlbear_tools.lint:lint_full"
eslint-fix = "owlbear_tools.lint:eslint_fix"
megalint-hook = "owlbear_tools.lint:megalint_hook"
text-hygiene-check = "owlbear_tools.lint:text_hygiene_check"
todo = "owlbear_tools.lint:todo_check"
help = "owlbear_tools.commands:help_main"
hooks-install = "owlbear_tools.project:hooks_install"
setup-project = "owlbear_tools.project:setup_project"
doctor = "owlbear_tools.project:doctor"
target-branch = "owlbear_tools.project:target_branch"
migrate-delivery-state = "owlbear_tools.delivery_migration:main"
retire-delivery-integration = "owlbear_tools.delivery_integration_retirement:main"
deps-status = "owlbear_tools.project:deps_status"
deps-sync = "owlbear_tools.project:deps_sync"
pds-sync = "owlbear_tools.project:pds_sync"
megalint-clean = "owlbear_tools.project:megalint_clean"

[tool.uv.sources]
owlbear-delivery = { workspace = true }
