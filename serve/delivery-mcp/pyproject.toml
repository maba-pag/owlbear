[project]
name = "owlbear-delivery-mcp"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear MCP server — target delivery operations"
dependencies = [
  "mcp>=2,<2.1",
  "owlbear-delivery",
  "owlbear-delivery-github",
  "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_delivery_mcp"]

[tool.uv.sources]
owlbear-delivery = { workspace = true }
owlbear-delivery-github = { workspace = true }
