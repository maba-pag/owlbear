[project]
name = "owlbear-memory-mcp"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear MCP server — memory operations"
dependencies = ["mcp[cli]>=2,<2.1", "owlbear-memory", "pydantic>=2.13.4", "pyyaml>=6.0.3"]

[tool.uv.sources]
owlbear-memory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_memory_mcp"]
