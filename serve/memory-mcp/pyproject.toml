[project]
name = "owlbear-memory-mcp"
version = "0.1.0"
requires-python = ">=3.14.8"
description = "OwlBear MCP server — memory operations"
dependencies = ["mcp>=2,<2.4", "owlbear-memory", "pydantic>=2.13.4"]

[tool.uv.sources]
owlbear-memory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_memory_mcp"]
