migrations:
  - id: MIG-001
    title: Snapshot legacy authority and runtime
    owner: DN-012
    from: Active openspec/ packages and .owlbear/kanban task/archive/decision stores.
    to: Versioned immutable legacy snapshot plus active-work disposition inventory outside active engine paths.
    ordered_steps:
      - Stop dispatch and require no active claims.
      - Inventory every active and archived change, task, request, and evidence record.
      - Record reintroduce-native, completed-history, dropped, or superseded disposition for every active item.
      - Copy or move legacy stores into the versioned snapshot and record content hashes.
      - Verify snapshot counts and hashes before deleting active readers.
    consumer_inventory:
      - owlbear-kanban legacy task and request readers
      - mcp-kanban generic task tools
      - Cockpit task and decision routes
      - agents, skills, prompts, tests, setup, and docs referencing OpenSpec or legacy task files
    compatibility: No runtime compatibility; history is readable as an inventory only.
    deletion_owner: DN-012
    absence_proof: PROOF-009
  - id: MIG-002
    title: Replace task runtime with graph-aware jobs
    owner: DN-003
    from: >-
      Mutable Markdown tasks with copied body/AC, parent hierarchy, arbitrary moves, verify/collect states, and
      task-scoped requests.
    to: >-
      Structured purpose-specific jobs referencing authoritative graph targets, immutable receipts, and graph-scoped
      invalidation.
    ordered_steps:
      - Install native models, stores, transactions, and health behind the engine facade.
      - Switch dispatch and lifecycle callers to job APIs.
      - Switch MCP and Cockpit contracts.
      - Remove generic task mutation, old statuses, parent aggregates, and compatibility models.
    consumer_inventory:
      - orchestrator
      - shaper, builder, verifier, collector, and challengers
      - MCP server and Cockpit backend/frontend
      - setup, hooks, scripts, tests, and documentation
    compatibility: Atomic replacement only.
    deletion_owner: DN-012
    absence_proof: PROOF-009
  - id: MIG-003
    title: Replace user and agent entry surfaces
    owner: DN-012
    from: >-
      /ideate chat handoff, /opsx commands, /shape OpenSpec input, generic task MCP tools, and current Cockpit task
      editor.
    to: Resumable native /design, delivery-node shape jobs, purpose-specific job tools, and graph-aware Cockpit.
    ordered_steps:
      - Install new agents, skills, prompts, hooks, and MCP contracts.
      - Install new Cockpit backend and frontend.
      - Update setup and seed.
      - Remove OpenSpec generated and shared surfaces.
      - Remove retired agents/workflows and old UI/API routes.
    consumer_inventory:
      - VS Code prompt and agent users
      - orchestrator and pipeline agents
      - MCP clients
      - Cockpit users
      - consumer setup
    compatibility: No aliases or quick lane remain.
    deletion_owner: DN-012
    absence_proof: PROOF-009

risks:
  - id: RISK-001
    class: destructive
    title: Legacy snapshot loses or overwrites history
    scenarios:
      - Destination already exists.
      - Source changes during snapshot.
      - Partial copy or crash occurs.
      - Inventory count or hash differs.
    disposition: >-
      Classify the complete set before mutation, never overwrite, stop dispatch, use atomic manifests, verify every
      hash, and retain source until proof passes.
    owner: DN-012
    proof: PROOF-009
  - id: RISK-002
    class: concurrency
    title: Concurrent writers corrupt shared worktree or control-plane state
    scenarios:
      - Two build or shape jobs become dispatchable.
      - Writer crashes without release.
      - Cockpit mutation races an agent transaction.
      - Transaction crashes between graph, job, receipt, and activity writes.
    disposition: >-
      Global expiring writer lease, agent compatibility in wave assembly, OCC tokens, transaction manifests,
      deterministic recovery, and no direct store mutation.
    owner: DN-004
    proof: PROOF-003
  - id: RISK-003
    class: lifecycle
    title: Stale authority or evidence closes work
    scenarios:
      - Intent or design changes after admission.
      - Node plan changes after build.
      - Code changes after acceptance.
      - Superseded receipt remains referenced.
    disposition: >-
      Canonical digests, dependency-closure invalidation, supersession receipts, path/boundary stale checks, and
      transition predicates that require current valid receipts.
    owner: DN-003
    proof: PROOF-003
  - id: RISK-004
    class: security
    title: Proof checkout or graph paths escape controlled directories
    scenarios:
      - Malicious change or job ID contains traversal.
      - Symlink redirects receipt, snapshot, or checkout writes.
      - Proof setup exposes secrets in evidence.
    disposition: >-
      Strict ID syntax, resolved-path containment, no-follow/symlink policy, bounded evidence, diagnostic redaction,
      and cleanup health scans.
    owner: DN-001
    proof: PROOF-001
  - id: RISK-005
    class: compatibility
    title: Atomic API and agent cutover leaves mixed old/new callers
    scenarios:
      - Generated OpenSpec command remains installed.
      - Cockpit frontend calls old task endpoints.
      - Retired agent remains dispatchable.
      - Consumer seed installs old config.
    disposition: >-
      One cutover manifest, absence scans, full build/test over all domains, fixture consumer install, and no
      compatibility aliases.
    owner: DN-012
    proof: PROOF-009
  - id: RISK-006
    class: scale
    title: Hundreds of graph records overwhelm the control-plane runtime
    scenarios:
      - Dispatch scans every receipt repeatedly.
      - Invalidation traverses the complete history for every query.
      - Corrective cycles make dependency and validity queries grow without bound.
    disposition: >-
      Indexed current-validity projections, cached dependency closure with explicit invalidation, paginated history,
      bounded health scans, and scale fixtures.
    owner: DN-003
    proof: PROOF-003
  - id: RISK-007
    class: authority
    title: Local node shaping hides global delivery expansion
    scenarios:
      - New interface is described as an implementation detail.
      - Missing integration work becomes a local packet.
      - Proof boundary changes without re-admission.
    disposition: >-
      Namespace-limited graph transaction, reference subset validation, independent shape review, typed
      material-discovery finding, and global re-admission.
    owner: DN-006
    proof: PROOF-005
  - id: RISK-008
    class: independence
    title: Reviewer or acceptor approves its own changes
    scenarios:
      - Inline reviewer edits code.
      - Acceptor creates tracked harness.
      - Auditor patches documentation before passing.
    disposition: >-
      Tool-deny hooks, engine role checks, receipt author separation, tracked-diff check before/after read-only jobs,
      and corrective-job-only failure routes.
    owner: DN-008
    supporting_nodes: [DN-014]
    proof: PROOF-007
  - id: RISK-009
    class: proof
    title: Ephemeral diagnostic setup bypasses the claimed production boundary
    scenarios:
      - Injected completed workflow replaces application assembly.
      - Scratch fixture invents an ungrounded contract.
      - Mock replaces the endpoint, command, or UI under test.
    disposition: >-
      Proof contracts name assembled boundary and allowed lower replacements; receipts enumerate setup/replacements;
      accept/audit reject boundary substitution.
    owner: DN-008
    supporting_nodes: [DN-014]
    proof: PROOF-007
  - id: RISK-010
    class: usability
    title: New control plane becomes harder to understand or operate
    scenarios:
      - Graph is the only navigation mode.
      - Status is indicated only by color.
      - Corrective histories obscure current work.
      - Design decisions cannot be resolved efficiently on mobile.
    disposition: >-
      Kanban remains primary, list/outline alternatives, accessible text/icon signals, current-chain default,
      responsive request flow, and Playwright desktop/mobile proof.
    owner: DN-011
    proof: PROOF-012
  - id: RISK-011
    class: scale
    title: Agent startup and context cost grows with the complete change
    scenarios:
      - Every packet reloads the complete graph and receipt history.
      - Node shaping creates file-level or artifact-level microjobs.
      - Repeated corrective cycles require full rediscovery.
    disposition: >-
      Targeted authority projections, one shaping session per delivery node, outcome-cohesive packet budgets, warm
      inline review, and concise predecessor receipts.
    owner: DN-006
    supporting_nodes: [DN-007]
    proof: PROOF-005
  - id: RISK-012
    class: scale
    title: Large changes overwhelm Cockpit rendering and navigation
    scenarios:
      - Cockpit renders every graph detail eagerly.
      - Corrective histories obscure the latest valid chain.
      - Mobile users cannot navigate a large graph.
    disposition: >-
      Incremental loading or virtualization, list and outline alternatives, latest-valid-chain defaults,
      filtering/grouping, and desktop/mobile scale fixtures.
    owner: DN-011
    proof: PROOF-012

proofs:
  - id: PROOF-001
    title: Native authority, hashing, and path-safety proof
    boundary: ""
    owner: DN-001
    method:
      - Parse valid and invalid four-file packages.
      - Assert canonical digest stability and semantic changes.
      - Exercise traversal, symlink, malformed YAML, duplicate ID, and partial-file cases.
    allowed_replacements: [temporary workspace filesystem]
    durable_outputs: [unit and contract tests]
  - id: PROOF-002
    title: Admission invariant proof
    boundary: Public validate/admit change operation before any jobs exist.
    owner: DN-002
    method:
      - Execute A1-A10-equivalent table-driven and property cases.
      - Assert stable finding codes and zero job mutation on failure.
      - Assert receipt and initial shape jobs are atomic on success.
    allowed_replacements: [temporary repository and command runner below admission]
    durable_outputs: [admission tests and historical fixtures]
  - id: PROOF-003
    title: Job runtime, transaction, dispatch, and invalidation proof
    boundary: Public engine job, claim, completion, invalidation, and health operations.
    owner: DN-003
    method:
      - Exercise purpose-specific transitions, dependency release, claims, crashes, OCC races, supersession,
        request resolution, and recovery.
      - Assert no partial valid receipt or dangling job after injected write failures.
    allowed_replacements: [clock, process identity, temporary filesystem]
    durable_outputs: [engine state-machine, concurrency, and crash tests]
  - id: PROOF-004
    title: Resumable design and admission interaction proof
    boundary: >-
      Real /ideate and /design prompt/agent contracts operating on a native fixture change through public tools.
    owner: DN-005
    method:
      - Resume after interruption without losing decisions.
      - Verify one-question options include tradeoffs, recommendation, and confidence.
      - Reject unresolved authority and admit a complete fixture.
    allowed_replacements: [external research response below designer workflow]
    durable_outputs: [agent scenario tests]
  - id: PROOF-005
    title: Node shaping boundary proof
    boundary: Real shaper contract plus engine finish_shape transaction for one admitted delivery node.
    owner: DN-006
    method:
      - Create a valid packet DAG and resulting jobs.
      - Reject new interface, migration, risk, or proof boundary as material expansion.
      - Assert no partial packet jobs on challenge or transaction failure.
    allowed_replacements: [repository search results below the shaper]
    durable_outputs: [shape scenario and transaction tests]
  - id: PROOF-006
    title: Builder inline-review proof
    boundary: >-
      Real builder job from claim through scoped commit, system-generated reviewer context, finding repair, and
      finish_build receipt.
    owner: DN-007
    method:
      - Verify reviewer cannot write or omit mandatory authority/diff context.
      - Exercise pass, local repair loop, material contradiction, commit failure, and stale packet digest.
    allowed_replacements: [sample product module and deterministic command runner]
    durable_outputs: [builder/reviewer scenario tests]
  - id: PROOF-007
    title: Independent node acceptance proof
    boundary: >-
      Real acceptor over engine-created disposable checkout, node contract, packet receipts, and assembled proof.
    owner: DN-008
    method:
      - Pass a complete node at exact SHA.
      - Reject local defect, missing harness, boundary bypass, stale receipt, and tracked acceptor edit.
      - Assert corrective jobs and cleanup are exact and minimal.
    allowed_replacements: [dependencies explicitly below each fixture proof boundary]
    durable_outputs: [acceptance and proof-checkout tests]
  - id: PROOF-008
    title: Whole-change audit proof
    boundary: Real auditor over all accepted nodes and admitted workflows in one exact-commit checkout.
    owner: DN-014
    method:
      - Pass full promise and decisions.
      - Reject cross-node integration, migration absence, stale acceptance, unresolved request, and tracked edit.
    allowed_replacements: [dependencies explicitly below each admitted workflow boundary]
    durable_outputs: [audit scenario tests]
  - id: PROOF-009
    title: Atomic cutover and consumer setup proof
    boundary: >-
      Public setup plus cutover command/script against a populated legacy fixture and a fresh consumer fixture.
    owner: DN-012
    method:
      - Verify no overwrite, complete inventory/dispositions, hash equality, crash recovery, clean native stores,
        no OpenSpec dependency or old references, and successful consumer launch.
    allowed_replacements: [temporary repositories, package installation command recorder]
    durable_outputs: [setup, snapshot, absence, and distribution tests]
  - id: PROOF-011
    title: MCP control-plane contract proof
    boundary: Public MCP tools over the real graph-aware engine.
    owner: DN-009
    method:
      - Exercise change, validation, admission, job, request, evidence, health, history, and completion tool contracts.
      - Assert generic task mutation and old lifecycle tools are absent.
    allowed_replacements: [temporary engine store]
    durable_outputs: [MCP integration tests]
  - id: PROOF-012
    title: Cockpit desktop/mobile workflow proof
    boundary: Built Cockpit SPA and real FastAPI backend over a seeded native change/job store.
    owner: DN-011
    method:
      - Navigate Changes, graph/list, Kanban, requests, attempts/findings/receipts, and legacy inventory.
      - Resolve a decision, inspect stale/corrective chain, and verify keyboard/mobile behavior.
      - Capture desktop/mobile screenshots and assert nonblank, nonoverlapping, bounded layout.
    allowed_replacements: [fixture change/job store; no mocked HTTP API]
    durable_outputs: [Vitest component tests, Playwright E2E, screenshots]
  - id: PROOF-013
    title: Complete native delivery audit
    boundary: >-
      Public native validation over durable incident/generic fixtures plus a fresh consumer workspace running the
      complete /design to shape/build/accept/audit flow through real MCP, engine, shared writer policy, proof
      checkout, and Cockpit.
    owner: DN-013
    method:
      - Reject original browser lifecycle, workspace repair/removal, memory purge, and memory lifecycle defects
        with stable codes, then admit their corrected forms.
      - Run generic valid/invalid DAG, stale, supersession, and corrective-cycle cases.
      - Execute a representative cross-module change and one corrective cycle.
      - Assert exact receipts, no late unowned expansion, final audit, clean setup, and no active legacy surface.
    allowed_replacements:
      - fixture repositories below named proof boundaries
      - true external services below admitted seams
    durable_outputs: [incident and property-based fixture suite, end-to-end release scenario, audit receipt]
  - id: PROOF-014
    title: Orchestration, writer serialization, and proof-checkout proof
    boundary: >-
      Real orchestrator contract over public engine-selected waves, writer leases, claims, structured completion,
      and disposable proof-checkout operations.
    owner: DN-004
    method:
      - Dispatch assigned shape, build, accept, and audit agents from engine-selected waves without interpreting
        agent prose.
      - Assert tracked-file writers never overlap and accept or audit never overlaps a writer.
      - Exercise crash, expired claim, rate-limit, stale lease, proof-checkout setup, containment, exact-commit
        materialization, and orphan cleanup paths.
      - Assert every structured attempt is finalized once and replanning reads current graph/job state.
    allowed_replacements: [clock, subagent runner, temporary repository]
    durable_outputs: [orchestrator scenario, writer-compatibility, and proof-checkout tests]
  - id: PROOF-015
    title: Cockpit backend contract proof
    boundary: Public FastAPI HTTP and SSE routes over the real graph-aware engine.
    owner: DN-010
    method:
      - Exercise change, graph, job, request, attempt, finding, receipt, health, legacy, conflict, and event contracts.
      - Assert arbitrary task mutation and old lifecycle routes are absent.
    allowed_replacements: [temporary engine store]
    durable_outputs: [FastAPI integration tests]

