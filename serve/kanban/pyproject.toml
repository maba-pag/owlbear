[project]
name = "owlbear-kanban"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OwlBear native delivery runtime — transport-free"
dependencies = ["pydantic>=2.13.4", "ruamel.yaml>=0.19.1", "pyyaml>=6.0.3", "markdown-it-py>=4.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_kanban"]
