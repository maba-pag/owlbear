[project]
name = "owlbear-kanban"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear kanban engine — transport-free"
dependencies = ["pydantic>=2.0", "pyyaml>=6.0", "ruamel.yaml>=0.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_kanban"]
