[project]
name = "owlbear-memory"
version = "0.1.0"
requires-python = ">=3.12.13"
description = "OwlBear memory primitives — models, errors, and storage"
dependencies = ["pydantic>=2.13.4", "ruamel.yaml>=0.19.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_memory"]
