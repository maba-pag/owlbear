[project]
name = "owlbear-voice"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear voice addon (speech recognition + TTS)"
dependencies = [
  "moonshine-voice>=0.0.49",
  "numpy>=1.26",
  "pyttsx3>=2.90",
  "sounddevice>=0.4",
]

[project.optional-dependencies]
kokoro = [
  "kokoro>=0.9.4",
  "soundfile",
]

[project.scripts]
owlbear-voice = "owlbear_voice.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_voice"]
