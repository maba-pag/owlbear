[project]
name = "owlbear-mcp-kanban"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear MCP server — kanban operations"
dependencies = ["mcp[cli]>=1.27.0,<2.0", "owlbear-kanban", "pydantic>=2.13.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_mcp_kanban"]

[tool.uv.sources]
owlbear-kanban = { workspace = true }
