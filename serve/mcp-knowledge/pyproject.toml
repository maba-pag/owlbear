[project]
name = "owlbear-mcp-knowledge"
version = "0.1.0"
requires-python = ">=3.12"
description = "OwlBear MCP server — knowledge operations"
dependencies = ["mcp[cli]>=1.27.0", "owlbear-knowledge[full]"]

[tool.uv.sources]
owlbear-knowledge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_mcp_knowledge"]
