[project]
name = "owlbear-delivery-github"
version = "0.1.0"
requires-python = ">=3.12.14"
description = "OwlBear fixed-operation GitHub publication adapter"
dependencies = ["owlbear-delivery", "pydantic>=2.13.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear_delivery_github"]

[tool.uv.sources]
owlbear-delivery = { workspace = true }
