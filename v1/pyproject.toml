[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owlbear"
version = "0.1.0"
description = "Always-on, laptop-resident AI development system"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"

dependencies = [
  "genai-prices>=0.0.54,<0.1.0",
  "httpx>=0.28.0",
  "openai>=1.60.0",
  "pydantic>=2.10.0",
  "pydantic-ai>=1.0.0,<2.0.0",
  "pydantic-settings>=2.7.0",
  "tenacity>=9.0.0",
  "truststore>=0.10.0",
  "typer>=0.15.0",
]

[project.scripts]
bearclaw = "bearclaw.cli:app"

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
crawl = [
  "trafilatura>=2.0.0",
] # shared with search — intentional duplication, see docs/research/consolidate-trafilatura-extras.md
knowledge = ["qdrant-client>=1.13", "FlagEmbedding>=1.3.5"]
search = [
  "duckduckgo-search>=7.0",
  "trafilatura>=2.0.0",
] # shared with crawl — intentional duplication, see docs/research/consolidate-trafilatura-extras.md
slack = ["slack_sdk>=3.27.0", "aiohttp>=3.9.0"]
voice = [
  "moonshine-voice>=0.0.49,<0.1.0",
  "numpy>=1.26",
  "pyttsx3>=2.90",
  "sounddevice>=0.4",
]
benchmark = ["beir>=2.0.0", "psutil>=5.9", "ranx>=0.3"]
orchestrator = ["agent-client-protocol>=0.9.0,<1.0.0"]
dev = [
  "bandit>=1.9.0",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0",
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/owlbear", "src/bearclaw"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D1",     # missing docstring rules — not yet enforced
  "COM812", # trailing comma — conflicts with formatter
  "ISC001", # implicit string concatenation — conflicts with formatter
  "S101",   # assert used — needed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",     # type annotations not required in tests
  "D",       # docstring rules not enforced in tests
  "N801",    # TestFromAC_* class naming convention required by test-writer workflow
  "S101",    # assert is fine in tests
  "S105",    # token/password false positives in test assertions
  "S106",    # hardcoded password in function args — test fixtures
  "SLF001",  # private member access — needed for white-box testing
  "ERA001",  # commented-out code — section header comments like '# send()'
  "PLR2004", # magic values are fine in tests
  "PLC0415", # imports inside test functions are intentional
  "TCH",     # type-checking blocks impractical in tests
  "PT019",   # @patch-injected mocks with _ prefix are not unused fixtures
]
"tests/benchmarks/**/*.py" = [
  "T201", # print is the primary output mechanism for benchmarks
  "S311", # pseudo-random is fine for benchmark vector generation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "strict"
markers = [
  "api: marks tests requiring live API access (deselect with '-m \"not api\"')",
  "slow: marks slow tests (deselect with '-m \"not slow\"')",
  "benchmark: marks benchmark tests requiring model/data downloads (deselect with '-m \"not benchmark\"')",
]

[tool.bandit]
targets = ["src/"]

[tool.coverage.run]
source = ["src/owlbear", "src/bearclaw"]
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 90
