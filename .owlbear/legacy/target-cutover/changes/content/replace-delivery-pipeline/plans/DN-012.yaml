---
mode: build
packets:
  - id: DN-012-PK-002
    outcome: Implement the public IF-017 native work-root handoff, retained
      selector, destination-sidecar custody, and shared fail-closed startup
      resolution.
    obligations:
      - REQ-017
      - KEEP-007
    in_scope:
      - Add typed prepare, probe, activate, complete, and query operations
        through setup/handoff.py.
      - Classify relocatable native records while preserving retained authority
        and source-only legacy records.
      - Require the sole DN-016 claim and writer, explicit approval, current
        identities, contained paths, and an empty destination.
      - Stage, hash-verify, and atomically publish the destination and prepared
        record.
      - Run a sealed destination probe that verifies parity and denies mutation.
      - Publish the activation receipt and .owlbear/native-root.yaml atomically.
      - Add one shared setup, MCP, and Cockpit resolver with fail-closed
        selector semantics.
      - Ignore destination-local .storage.lock and activity.jsonl through root
        and seed rules.
      - Restrict destination completion to the owning DN-016 finish_build, fail,
        or release operation.
    excluded:
      - Live carrier or native-store mutation in this workspace.
      - IF-018 production, DN-016 execution or acceptance, DN-015 finalization,
        and carrier deletion.
      - Dual reads, post-activation fallback, hot swap, legacy translation,
        compatibility behavior, and protected configuration edits.
    modules:
      - MOD-001
      - MOD-002
      - MOD-004
      - MOD-006
      - MOD-008
      - MOD-009
    interfaces:
      - IF-001
      - IF-002
      - IF-003
      - IF-004
      - IF-010
      - IF-011
      - IF-017
    dependencies: []
    acceptance_scenarios:
      - id: AC-1
        scenario: Given a classified temporary carrier, sole DN-016 writer,
          approval, and empty destination, setup/handoff.py prepare publishes a
          hash-bound prepared record; unsafe, stale, occupied, colliding, or
          unclassified input returns a typed error without publication.
      - id: AC-2
        scenario: Given a prepared record and stopped peers, setup/handoff.py
          probe reports claim, coordination, receipt, hash, query, and launch
          parity; mutation returns a maintenance denial without destination
          changes.
      - id: AC-3
        scenario: Given a passing probe and unchanged source, activation
          publishes stable activation and selector records; setup, MCP, and
          Cockpit select .owlbear/native, while selector loss, corruption,
          mismatch, unsafe selection, environment override, or split
          configuration fails without source fallback.
      - id: AC-4
        scenario: Given activation, completion permits finish_build, fail, or
          release only for the owning DN-016 claim; recovery, planning,
          dispatch, requests, unrelated mutation, or changed ownership returns a
          typed denial.
      - id: AC-5
        scenario: Given a fresh consumer without selector or destination, setup
          creates empty stores under .owlbear/kanban and performs no implicit
          migration.
      - id: AC-6
        scenario: Given destination-local .storage.lock and activity.jsonl, root
          and seeded repository status ignore those sidecars while product
          records remain visible.
      - id: AC-7
        scenario: Given mixed native and legacy carrier records, prepare
          publishes only relocatable native categories and retained identity
          parity; destination inspection shows legacy tasks, Markdown archive,
          decisions, activity.jsonl, README, lock files, and carrier
          configuration absent while source paths and hashes remain unchanged.
    impact_closure:
      paths:
        - .gitignore
        - seed/.gitignore
        - serve/kanban/src/owlbear_kanban/
        - serve/mcp-kanban/src/owlbear_mcp_kanban/server.py
        - serve/cockpit/src/owlbear_cockpit/main.py
        - setup/handoff.py
