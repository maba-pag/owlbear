    proof:
      boundary: Public setup/handoff.py subprocesses and normal setup, MCP, and
        Cockpit startup over real typed stores in temporary repositories.
      commands:
        - uv run pytest -n0 serve/kanban/tests/test_handoff.py
          serve/kanban/tests/test_work_root.py
          serve/kanban/tests/test_workspace.py
          serve/kanban/tests/test_dispatch_runtime.py
          serve/mcp-kanban/tests/test_mcp_surface_contract.py
          tests/test_bootstrap_handoff_command.py tests/test_cockpit_launch.py
          tests/test_init_scaffold.py tests/test_native_distribution.py -q
        - uv run ruff check serve/kanban/src/owlbear_kanban
