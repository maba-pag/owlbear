      allowed_lower_replacements:
        - temporary repositories
      evidence_outputs:
        - pytest result
        - prepared record
        - activation receipt
        - selector observations
        - source-only classification
        - sidecar observations
        - typed denials
        - Ruff results
        - pre/post tracked-state comparison
    required_outputs:
      - Typed IF-017 API and public command.
      - Immutable prepared and activation records plus retained selector.
      - Shared fail-closed setup, MCP, and Cockpit resolver.
      - Destination-sidecar ignore rules.
      - Restricted destination completion runtime.
      - Durable positive, rejection, replay, recovery, and fresh-consumer
        fixtures.
    profile:
      domain: Python lifecycle handoff, startup selection, and destructive
        transaction safety
      risk: Irreversible activation, concurrency, containment, selector loss,
        and split authority
      tools: Python 3.14, uv, pytest, Ruff
    context_budget:
      expected_files: 28
      expected_interfaces:
        - IF-017
        - IF-003
        - IF-004
        - IF-010
        - IF-011
      change_envelope: One cohesive handoff and startup-resolution
