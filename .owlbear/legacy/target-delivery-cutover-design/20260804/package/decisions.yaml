# Transitional bootstrap metadata required by the current Designer workflow. The target package does
# not derive from or archive this file; accepted meaning is incorporated into intent.md or design.md.
schema_version: 1
change_id: target-delivery-cutover
decisions:
  - id: DEC-001
    status: accepted
    question: What owns semantic delivery authority?
    decision: intent.md and design.md are authored authority; the Delivery Contract is deterministic generated output bound to their source hashes.
    rationale: This removes silent semantic re-authoring while retaining stable machine identities.
    authority: frozen walkthrough Steps 3-9
  - id: DEC-002
    status: accepted
    question: Who chooses correction transitions?
    decision: The active Planner, Builder, or Assembly verifier chooses advance, retry, return, or block after advisory review; runtime validates and applies the transition.
    rationale: Reviewers provide independent evidence without becoming lifecycle actors.
    authority: frozen walkthrough Steps 11-13
  - id: DEC-003
    status: accepted
    question: How is completed work published?
    decision: Integration publishes reviewed product state and one immutable completed-package snapshot in the same compare-and-swap target commit.
    rationale: Product and completion authority cannot become observably inconsistent.
    authority: frozen walkthrough Step 14
  - id: DEC-004
    status: accepted
    question: How is the implementation migrated?
    decision: Use one quiescent schema-v2 cutover with a recovery snapshot; do not retain dual runtime behavior or compatibility readers.
    rationale: Compatibility would preserve the contradictions this change removes.
    authority: project no-legacy policy and frozen walkthrough
  - id: DEC-005
    status: accepted
    question: How much durable test coverage should the change add?
    decision: Add tests only for credible observable behavior, public contracts, persisted state, Git safety, recovery, and assembled workflows; do not test agent or documentation wording merely to map requirements.
    rationale: Tests are maintained risk controls, not completion counters.
    authority: user instruction 2026-08-04
  - id: DEC-006
    status: accepted
    question: What is the initial normative block representation?
    decision: Prototype strict fenced YAML blocks embedded in owning intent and design sections; keep this choice reversible until readability and deterministic parser proof pass.
    rationale: YAML provides structured parsing without making users edit generated JSON.
    authority: Designer implementation discretion under frozen Step 7
  - id: DEC-007
    status: accepted
    question: How is rare completed work reopened?
    decision: Keep reopen as documented manual recovery from retained package, branch, and package-history ref.
    rationale: A permanent restore workflow is disproportionate before repeated operational use.
    authority: frozen walkthrough Step 14
  - id: DEC-008
    status: accepted
    question: Which current semantic and evidence fields survive schema-v2?
    decision: Keep change identity, the exact intent H1 display title, fenced commitments and outcomes, derived outcome scopes, and source bindings in the generated contract; do not add standalone limits, a change-assembly scope, generic semantic updates, or completion summaries.
    rationale: The title has a concrete presentation consumer. Limits that constrain Delivery already belong in commitments or outcomes; the removed fields have no production writer or concrete downstream decision, while transition context and completed-package lookup own the real successor workflows.
    authority: frozen walkthrough Steps 7, 8, and 14 plus current consumer audit
open_decisions: []
