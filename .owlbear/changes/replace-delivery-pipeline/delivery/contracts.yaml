---
schema_version: 1
change_id: replace-delivery-pipeline
modules:
  - id: MOD-001
    paths:
      - serve/kanban/src/owlbear_kanban/
    current_responsibility: >-
      Native change authority, delivery graphs, purpose-specific jobs, receipts,
      invalidation, transactions, proof checkout, health, and graph-aware dispatch.
    planned_change: >-
      Replace task authority with native change, delivery graph, purpose-specific
      jobs, receipts, invalidation,
      transactions, proof checkout, and graph-aware dispatch behind a reorganized
      engine facade.
  - id: MOD-002
    paths:
      - serve/mcp-kanban/src/owlbear_mcp_kanban/
    current_responsibility: >-
      Native change, job, completion, request, finding, rejection, evidence, health,
      and history MCP tools over the graph-aware engine.
    planned_change: >-
      Expose intent-level change, job, completion, request, evidence, health, and
      history tools; remove generic task mutation.
  - id: MOD-003
    paths:
      - share/agents/
      - share/skills/
      - share/prompts/
      - share/instructions/
      - share/WIRING.md
    current_responsibility: >-
      Native designer, frontier planner, builder/reviewer, acceptor, auditor, and
      graph-aware orchestration agents and workflows.
    planned_change: >-
      Install designer, frontier planner, outcome builder, inline reviewer, acceptor,
      auditor, and graph-aware orchestrator contracts; retire incompatible roles and
      workflows.
  - id: MOD-004
    paths:
      - serve/cockpit/src/owlbear_cockpit/
    current_responsibility: >-
      FastAPI native change, graph, job, request, finding, receipt, activity, health,
      legacy inventory, ideas, and memory APIs with SSE invalidation.
    planned_change: >-
      Add change, graph, job, request, finding, receipt, legacy inventory, and SSE
      contracts over the graph-aware engine; remove arbitrary task movement/editing.
  - id: MOD-005
    paths:
      - serve/cockpit/web/src/
    current_responsibility: >-
      Peer Specification and Delivery views with Requests, Activity, Evidence, Legacy,
      Ideas, Memories, and workspace health UI over the native Cockpit API.
    planned_change: >-
      Present Specification and Delivery as peer top-level surfaces with change authority
      and graph views, immutable-purpose job cards, request context, receipt/finding
      history, exact proof revisions, and legacy inventory.
  - id: MOD-006
    paths:
      - setup/
      - seed/
      - README.md
      - README-consumer.md
      - share/README.md
      - .github/copilot-instructions.md
    current_responsibility: >-
      Native consumer setup, seed assets, workspace instructions, and public documentation
      with OpenSpec installation and generated commands removed.
    planned_change: >-
      Scaffold the native stores and ecosystem, remove OpenSpec installation/generated
      commands, and document only the new workflow.
  - id: MOD-007
    paths:
      - openspec/
      - .github/skills/openspec-*/
      - .github/prompts/opsx-*.prompt.md
    current_responsibility: >-
      No active product responsibility; OpenSpec changes, stock schema, generated
      commands, and alternate lifecycle surfaces have been removed.
    planned_change: Preserve verified absence from active product and consumer paths.
  - id: MOD-008
    paths:
      - tests/
      - serve/kanban/tests/
      - serve/mcp-kanban/tests/
      - serve/cockpit/web/e2e/
      - serve/cockpit/web/src/**/*.test.*
    current_responsibility: >-
      Native change, delivery graph, runtime, MCP, agent, setup, backend, frontend,
      cutover, browser, and compatibility-boundary regression coverage.
    planned_change: >-
      Replace obsolete workflow contracts and add incident fixtures, generic graph
      properties, native end-to-end workflow, cutover, and browser proof.
  - id: MOD-009
    paths:
      - .owlbear/hooks/
      - seed/.owlbear/hooks/
      - .owlbear/kanban/
      - seed/.owlbear/kanban/
    current_responsibility: >-
      Agent write guards, session context, transitional task/request stores, native
      authority/job stores, activity, and local board configuration.
    planned_change: >-
      Enforce new role write scopes, authority/job stores, proof-checkout containment,
      and purpose-specific runtime state.

interfaces:
  - id: IF-001
    name: Native ChangeRevision loader
    producer: DN-001
    consumers:
      - DN-002
      - DN-003
      - DN-005
      - DN-006
      - DN-008
      - DN-009
      - DN-010
      - DN-012
      - DN-014
    contract: >-
      Strict joined model over intent.md, design.md, decisions.yaml,
      delivery/obligations.yaml, delivery/contracts.yaml, and delivery/nodes.yaml
      with
      isolated
      plans/<node-id>.yaml records and one physical-layout-independent canonical delivery
      digest.
    authority: MOD-001
    failure_semantics: Structured parse/reference diagnostics; no partial
      revision returned.
    migration: MIG-004
    proof: PROOF-001
  - id: IF-002
    name: Admission diagnostics and receipt
    producer: DN-002
    consumers: [DN-003, DN-005, DN-006, DN-009, DN-010, DN-012, DN-013]
    contract: Versioned findings and immutable admission receipt tied to one
      delivery digest.
    authority: MOD-001
    failure_semantics: Error findings forbid job creation; warnings and limits
      remain explicit.
    migration:
    proof: PROOF-002
  - id: IF-003
    name: Graph-aware job and receipt runtime
    producer: DN-003
    consumers:
      - DN-004
      - DN-006
      - DN-007
      - DN-008
      - DN-009
      - DN-010
      - DN-012
      - DN-013
      - DN-014
    contract: >-
      Purpose-specific jobs reference graph targets/digests; immutable attempts, findings,
      receipts, and supersession
      determine validity. Non-admission receipts freeze typed path and authority-target
      impact closures; engine-owned
      repository history permits only proven non-intersecting descendant revisions.
      Job disposition is restricted to
      pending, cancelled, or superseded. The transport-free start_job operation returns
      either the atomically claimed
      job and immutable started event or one stable start diagnostic while preserving
      lower-layer code and target
      evidence. Every immutable attempt event retains required claim identity. Release
      and failure atomically clear
      matching active pointers and append their outcome event; exact replay returns
      the stored outcome while a changed
      claim returns the operation-specific non-owner diagnostic without mutation.
      NativeRuntime receives positive
      claim-expiry policy and exposes a supplied-time, job-ID-ordered recovery sweep
      that turns strictly expired claims
      into retryable jobs plus immutable crashed events. Intent-specific priority and cancellation
      operations require matching delivery-digest and OCC-token identity on pending unclaimed jobs,
      return refreshed job authority, replay matching desired state, and never expose generic job
      editing.
    authority: MOD-001
    failure_semantics: >-
      Atomic transaction abort or recoverable manifest; no partial valid receipt.
      Job start rejects stale authority,
      invalid predecessor receipts, pending requests, terminal disposition, active
      claims, and conflicting replay
      identity with dedicated stable diagnostics and no job or attempt mutation. Missing
      or empty attempt-event claim
      identity returns ERR_ATTEMPT_EVENT_IDENTITY_INVALID. Finalization replay checks
      completed-event ownership before
      cleared pointers, so any mismatched request field for the same completed job
      and attempt returns the
      operation-specific non-owner diagnostic rather than an existing outcome or a
      no-active diagnostic. Recovery
      rejects non-positive policy, leaves claims active through the exact expiry boundary,
      isolates identity and
      transaction-conflict diagnostics per job, and replays exact persisted crash
      outcomes without duplication.
    migration: MIG-004
    proof: PROOF-003
  - id: IF-004
    name: Dispatch and writer coordination
    producer: DN-004
    consumers: [DN-006, DN-007, DN-008, DN-009, DN-012, DN-014]
    contract: >-
      Dependency-aware waves, one global tracked-file writer, no accept/audit overlap,
      expiring
      claims, and exact assigned agent profile. Admission makes every initial plan
      job
      eligible from
      sealed predecessor contracts, and pick_jobs orders them by stable delivery topology.
      Build
      readiness requires a current plan receipt, current authored packet dependencies,
      and current
      accept receipts for every predecessor delivery node. Successful finish_accept
      marks each
      dependent plan reconciliation-required, creates or releases its plan job, and
      keeps dependent
      builds blocked until a superseding plan receipt is current.
    runtime_producer: owlbear_kanban.dispatch
    runtime_consumers:
      - orchestrator
      - frontier-planner
      - builder
      - acceptor
      - auditor
    authority: MOD-001
    failure_semantics: Conflicting or stale lease rejects dispatch without
      mutation.
    migration: MIG-004
    proof: PROOF-014
  - id: IF-005
    name: Disposable exact-commit proof checkout
    producer: DN-004
    consumers: [DN-008, DN-013, DN-014]
    contract: >-
      Contained read-only checkout under .owlbear/scratch/proof for one commit with
      normal toolchain and crash-safe
      cleanup.
    authority: MOD-001
    failure_semantics: Setup or cleanup failure becomes a health finding and no
      accept/audit receipt is valid.
    migration:
    proof: PROOF-014
  - id: IF-015
    name: Bootstrap native job-dispatch MCP bridge
    producer: DN-004
    consumers: [DN-009]
    contract: >-
      The strict pick, start, purpose-specific finish, release, and expired-claim recovery
      operation subset introduced for bootstrap exposes IF-004 to the VS Code orchestrator
      without adding authority, duplicate registrations, or alternate lifecycle semantics;
      after IF-010 assembly these remain the same registrations and schemas inside that API.
      For accept and audit,
      start_job composes IF-005 setup before claim creation and returns contained
      checkout context; purpose-specific
      finish, release, and recovery perform idempotent cleanup without adding another
      tool.
    runtime_producer: owlbear_mcp_kanban
    runtime_consumers: [orchestrator]
    authority: MOD-002
    failure_semantics: >-
      Stable dispatch, lifecycle, and proof-checkout diagnostics map without prose
      routing. Checkout setup failure
      creates no claim, rejected start removes prepared checkout, and residual cleanup
      state becomes a health finding
      that forbids a valid accept or audit receipt.
    migration: MIG-004
    proof: PROOF-014
  - id: IF-006
    name: Resumable design and admission session
    producer: DN-005
    consumers: [DN-006, DN-012]
    contract: >-
      /ideate and /design share one durable change session, one-question decisions,
      specialist evidence, complete
      graph review, and explicit admission.
    authority: MOD-003
    failure_semantics: Unresolved material decision or failed admission leaves
      the change draft and creates no jobs.
    migration: MIG-003
    proof: PROOF-004
  - id: IF-007
    name: Delivery frontier plan completion
    producer: DN-006
    consumers: [DN-007, DN-008, DN-010, DN-012]
    contract: >-
      A resumable planner consumes engine-selected plan-ready jobs, but each completion
      publishes
      one isolated node plan, node-plan digest, complete packet DAG, plan receipt,
      build
      jobs, and
      accept job inside admitted node bounds. An initial plan receipt records admitted
      predecessor
      contracts; an acceptance-triggered reconciliation publishes a superseding plan
      receipt based
      on accepted implementation evidence before dependent builds become ready.
    authority: MOD-003
    failure_semantics: >-
      Illegal delivery expansion routes to Specification re-entry; one material choice
      creates a
      Decision Request; no partial plan or packet jobs persist for the failing node,
      and prior
      completed node plans remain valid.
    migration: MIG-004
    proof: PROOF-005
  - id: IF-008
    name: Build completion with inline review
    producer: DN-007
    consumers: [DN-008, DN-010, DN-012]
    contract: >-
      Scoped commit, changed paths, proof, reviewer findings/resolution, exact packet
      digest, and immutable build
      receipt.
    authority: MOD-003
    failure_semantics: >-
      Review failure stays in the warm builder attempt; material contradiction emits
      a typed design finding.
    migration: MIG-002
    proof: PROOF-006
  - id: IF-009
    name: Delivery-node acceptance
    producer: DN-008
    consumers: [DN-010, DN-012, DN-013, DN-014]
    contract: >-
      Read-only exact-commit verdict, evidence replacements, findings, receipt, and
      corrective route for one delivery node; finish_accept atomically issues a valid
      receipt,
      marks dependent plans reconciliation-required, and blocks dependent builds until
      superseding
      plans incorporate accepted implementation evidence.
    authority: MOD-003
    failure_semantics: Failure creates typed findings and corrective jobs;
      reviewer never patches tracked files.
    migration:
    proof: PROOF-007
  - id: IF-010
    name: Native MCP control-plane API
    producer: DN-009
    consumers: [DN-005, DN-006, DN-007, DN-008, DN-010, DN-012, DN-013, DN-014]
    contract: >-
      One strict native registry exposes list_changes, show_change, validate_change,
      admit_change, list_jobs, show_job, pick_jobs, start_job, finish_plan, finish_build,
      finish_accept, finish_audit, reject_accept, reject_audit, release_job,
      recover_expired_claims, create_request, list_requests, show_request, list_attempts,
      list_findings, show_finding, show_receipt, change_health, work_health, and
      list_activity. It completes the control plane while retaining IF-015's work operations
      as the same registrations and schemas, not a duplicate bridge.
    authority: MOD-002
    failure_semantics: Stable domain error codes map engine failures without
      leaking partial mutation.
    migration: MIG-003
    proof: PROOF-011
  - id: IF-011
    name: Cockpit change and job HTTP/SSE API
    producer: DN-010
    consumers: [DN-011, DN-012, DN-013]
    contract: >-
      Typed change, graph, job, request, attempt, finding, receipt, health, legacy
      inventory, and invalidation
      resources with conflict tokens, intent-specific priority/cancellation controls, and SSE events.
    authority: MOD-004
    failure_semantics: Domain errors map to stable HTTP responses; stale
      conflicts return current authority identity.
    migration: MIG-003
    proof: PROOF-015
  - id: IF-012
    name: Cockpit Specification and Delivery experience
    producer: DN-011
    consumers: [DN-012, DN-013]
    contract: >-
      Accessible responsive peer Specification and Delivery views plus Requests, Activity,
      Evidence, and Legacy views over native API contracts, including intent-specific job priority
      and cancellation actions without arbitrary status or kind mutation. Existing Memory and Ideas
      routes retain their core workflows as unchanged peer utilities.
    authority: MOD-005
    failure_semantics: Fetch/conflict/error states preserve current data and
      expose actionable retry or resolution.
    migration: MIG-003
    proof: PROOF-012
  - id: IF-013
    name: Legacy snapshot and native installation
    producer: DN-012
    consumers: [DN-013]
    contract: >-
      Hash-verified immutable legacy manifest, explicit active-item dispositions,
      empty native stores, no active
      old runtime in shipped source or consumer distribution, and reproducible consumer setup.
      For this self-hosting change only, DEC-036 defers mutation of the external bootstrap-carrier
      board to DN-015; the final manifest, receipt, and commit close that exception.
    authority: MOD-006
    failure_semantics: Any missing disposition/hash or remaining active legacy
      reference blocks cutover.
    migration: MIG-001
    proof: PROOF-009
  - id: IF-016
    name: Public bootstrap carrier finalizer
    producer: DN-012
    consumers: [DN-015]
    contract: >-
      A fixture-proved fail-closed command accepts the real bootstrap board, complete dispositions,
      expected authority and code revisions, and an explicit finalization approval; it verifies
      terminal readiness and zero claims, writes an immutable snapshot and finalization receipt,
      removes active board and sibling-carrier state, verifies absence, and returns the exact paths
      that the DN-015 builder must commit before native build finalization, without performing any
      later legacy board mutation.
    authority: MOD-006
    failure_semantics: >-
      Missing or stale proof, nonterminal projection, active claim, source change, existing destination,
      hash mismatch, unsafe path, publication failure, or absence failure leaves no completed
      finalization and preserves a recoverable source.
    migration: MIG-005
    proof: PROOF-009
  - id: IF-014
    name: Whole-change audit and closure
    producer: DN-014
    consumers: [DN-010, DN-012, DN-013]
    contract: >-
      Read-only exact-commit final verdict over accepted nodes, Product Promise, decisions,
      migrations, normal
      workflows, receipts, and closure state.
    authority: MOD-003
    failure_semantics: >-
      Failure creates typed findings and corrective jobs; pass issues the final audit
      receipt and mechanically
      closes the change.
    migration:
    proof: PROOF-008

migrations:
  - id: MIG-001
    title: Snapshot legacy authority and runtime
    owner: DN-012
    from: Active openspec/ packages and .owlbear/kanban task/archive/decision
      stores.
    to: Versioned immutable legacy snapshot plus active-work disposition
      inventory outside active engine paths.
    ordered_steps:
      - Stop dispatch and require no active claims.
      - Inventory every active and archived change, task, request, and evidence
        record.
      - Record reintroduce-native, completed-history, dropped, or superseded
        disposition for every active item.
      - Copy or move legacy stores into the versioned snapshot and record
        content hashes.
      - Verify snapshot counts and hashes before deleting active readers.
      - >-
        For this self-hosting change only, fixture-prove these steps in DN-012, then execute them
        against the external bootstrap-carrier board in DN-015 under DEC-036.
    consumer_inventory:
      - owlbear-kanban legacy task and request readers
      - mcp-kanban generic task tools
      - Cockpit task and decision routes
      - agents, skills, prompts, tests, setup, and docs referencing OpenSpec or
        legacy task files
    compatibility: No runtime compatibility; history is readable as an inventory
      only.
    deletion_owner: DN-012
    absence_proof: PROOF-009
  - id: MIG-002
    title: Replace task runtime with graph-aware jobs
    owner: DN-003
    from: >-
      Mutable Markdown tasks with copied body/AC, parent hierarchy, arbitrary moves,
      verify/collect states, and
      task-scoped requests.
    to: >-
      Structured purpose-specific jobs referencing authoritative graph targets, immutable
      receipts, and graph-scoped
      invalidation.
    ordered_steps:
      - Install native models, stores, transactions, and health behind the
        engine facade.
      - Switch dispatch and lifecycle callers to job APIs.
      - Switch MCP and Cockpit contracts.
      - Remove generic task mutation, old statuses, parent aggregates, and
        compatibility models.
    consumer_inventory:
      - orchestrator
      - planner, builder, verifier, collector, and challengers
      - MCP server and Cockpit backend/frontend
      - setup, hooks, scripts, tests, and documentation
    compatibility: Atomic replacement only.
    deletion_owner: DN-012
    absence_proof: PROOF-009
  - id: MIG-003
    title: Replace user and agent entry surfaces
    owner: DN-012
    from: >-
      /ideate chat handoff, /opsx commands, /shape OpenSpec input, generic task MCP
      tools, and current Cockpit task
      editor.
    to: Resumable native /design, delivery frontier plan jobs, purpose-specific
      job tools, and graph-aware Cockpit.
    ordered_steps:
      - Install IF-015 as the closed bootstrap job-dispatch bridge for the
        native orchestrator.
      - Complete IF-010 by adding change, admission, request, evidence, health,
        history, and remaining read tools.
      - Install new Cockpit backend and frontend.
      - Update setup and seed.
      - Remove OpenSpec generated and shared surfaces.
      - >-
        Remove retired agents/workflows, old UI/API routes, and any bridge-only duplicate
        registration after IF-010
        owns the assembled API.
    consumer_inventory:
      - VS Code prompt and agent users
      - orchestrator and pipeline agents
      - MCP clients
      - IF-015 bootstrap job-dispatch tool registrations and schemas
      - Cockpit users
      - consumer setup
    compatibility: No aliases or quick lane remain.
    deletion_owner: DN-012
    absence_proof: PROOF-009
  - id: MIG-004
    title: Split delivery authority and replace shape vocabulary
    owner: DN-001
    from: >-
      The earlier bootstrap graph.yaml authority and implemented shape job, receipt,
      profile, completion, MCP, agent, and Cockpit vocabulary that preceded the current
      modular authority and plan-only runtime.
    to: >-
      Canonically joined delivery/obligations.yaml, delivery/contracts.yaml, and
      delivery/nodes.yaml authority; isolated plans/<node-id>.yaml records; and plan-only
      lifecycle
      vocabulary across DN-003, DN-004, and DN-009 contracts.
    ordered_steps:
      - Prove physical-layout-independent digest parity before switching the
        loader.
      - Move delivery sections into the three modular authority files and node
        plans into isolated files.
      - Replace shape job, receipt, profile, transaction, dispatch, MCP, agent,
        test, and Cockpit vocabulary with plan.
      - Re-prove DN-003 runtime and DN-004 dispatch/IF-015 contracts before
        DN-009 consumes the corrected API.
      - Remove graph.yaml plan mutation, finish_shape, shape discriminators, and
        every dual registration.
    consumer_inventory:
      - ChangeRevision loader, canonical digest, admission, health, and fixtures
      - NativeRuntime jobs, receipts, transactions, invalidation, and runtime
        query
      - DispatchRuntime, IF-015 MCP bridge, orchestrator, planner, and builder
      - DN-009 assembled MCP API, Cockpit backend/frontend, setup, seed, tests,
        and documentation
    compatibility: Atomic replacement only; no graph.yaml fallback or shape
      alias remains.
    deletion_owner: DN-012
    absence_proof: PROOF-013
  - id: MIG-005
    title: Retire the self-hosting bootstrap carrier
    owner: DN-015
    from: >-
      The real owlbear-dev legacy board and separately clean sibling runtime retained only to carry
      this replacement through DN-013 proof.
    to: >-
      A versioned immutable snapshot, explicit terminal dispositions, finalization receipt, and final
      Git commit with no active legacy board, sibling carrier, or post-finalization mutation path.
    ordered_steps:
      - Verify DN-012 and DN-013 proof identities and the expected authority and code revisions.
      - Require every legacy projection including the root to be released and ready for terminal disposition.
      - Require zero active claims, writers, pending requests, or unclassified active records.
      - Dispatch DN-015's native build job under the global writer lease without projecting it into the legacy board.
      - Run IF-016 against the real board with explicit finalization approval.
      - Verify every manifest hash, finalization receipt field, removed active path, and retained native path.
      - Commit the snapshot, receipt, source removals, and carrier retirement before native build finalization.
      - Run DN-015 acceptance read-only in a disposable checkout of that exact commit.
      - Forbid every subsequent legacy dispatch, task mutation, or compatibility read.
    consumer_inventory:
      - root bootstrap task and all descendant legacy projections
      - external sibling MCP carrier configuration and process
      - final operator invocation and scoped Git commit
      - native source, consumer distribution, and immutable legacy inventory
    compatibility: One terminal self-hosting operation only; no shipped or runtime compatibility.
    deletion_owner: DN-015
    absence_proof: PROOF-016

risks:
  - id: RISK-001
    class: destructive
    title: Legacy snapshot loses or overwrites history
    scenarios:
      - Destination already exists.
      - Source changes during snapshot.
      - Partial copy or crash occurs.
      - Inventory count or hash differs.
    disposition: >-
      Classify the complete set before mutation, never overwrite, stop dispatch, use
      atomic manifests, verify every
      hash, and retain source until proof passes.
    owner: DN-012
    proof: PROOF-009
  - id: RISK-002
    class: concurrency
    title: Concurrent writers corrupt shared worktree or control-plane state
    scenarios:
      - Two build or plan jobs become dispatchable.
      - Writer crashes without release.
      - Cockpit mutation races an agent transaction.
      - Transaction crashes between graph, job, receipt, and activity writes.
    disposition: >-
      Global expiring writer lease, agent compatibility in wave assembly, OCC tokens,
      transaction manifests,
      deterministic recovery, and no direct store mutation.
    owner: DN-004
    proof: PROOF-003
  - id: RISK-003
    class: lifecycle
    title: Stale authority or evidence closes work
    scenarios:
      - Intent or design changes after admission.
      - Node plan changes after build.
      - Code changes after acceptance.
      - Superseded receipt remains referenced.
    disposition: >-
      Canonical digests, frozen typed impact closures, conservative repository-history
      classification, explicit
      supersession references, dependency-closure invalidation, and transition predicates
      that require current
      receipts.
    owner: DN-003
    proof: PROOF-003
  - id: RISK-004
    class: security
    title: Proof checkout or graph paths escape controlled directories
    scenarios:
      - Malicious change or job ID contains traversal.
      - Symlink redirects receipt, snapshot, or checkout writes.
      - Proof setup exposes secrets in evidence.
    disposition: >-
      Strict ID syntax, resolved-path containment, no-follow/symlink policy, bounded
      evidence, diagnostic redaction,
      and cleanup health scans.
    owner: DN-001
    proof: PROOF-001
  - id: RISK-005
    class: compatibility
    title: Atomic API and agent cutover leaves mixed old/new callers
    scenarios:
      - Generated OpenSpec command remains installed.
      - Cockpit frontend calls old task endpoints.
      - Retired agent remains dispatchable.
      - Consumer seed installs old config.
    disposition: >-
      One cutover manifest, absence scans, full build/test over all domains, fixture
      consumer install, and no
      compatibility aliases.
    owner: DN-012
    proof: PROOF-009
  - id: RISK-006
    class: scale
    title: Hundreds of graph records overwhelm the control-plane runtime
    scenarios:
      - Dispatch scans every receipt repeatedly.
      - Invalidation traverses the complete history for every query.
      - Corrective cycles make dependency and validity queries grow without
        bound.
    disposition: >-
      Indexed current-validity projections, cached dependency closure with explicit
      invalidation, paginated history,
      bounded health scans, and scale fixtures.
    owner: DN-003
    proof: PROOF-003
  - id: RISK-007
    class: authority
    title: Local node planning hides global delivery expansion
    scenarios:
      - New interface is described as an implementation detail.
      - Missing integration work becomes a local packet.
      - Proof boundary changes without re-admission.
    disposition: >-
      Namespace-limited graph transaction, reference subset validation, independent
      plan review, typed
      material-discovery finding, and global re-admission.
    owner: DN-006
    proof: PROOF-005
  - id: RISK-008
    class: independence
    title: Reviewer or acceptor approves its own changes
    scenarios:
      - Inline reviewer edits code.
      - Acceptor creates tracked harness.
      - Auditor patches documentation before passing.
    disposition: >-
      Tool-deny hooks, engine role checks, receipt author separation, tracked-diff
      check before/after read-only jobs,
      and corrective-job-only failure routes.
    owner: DN-008
    supporting_nodes: [DN-014]
    proof: PROOF-007
  - id: RISK-009
    class: proof
    title: Ephemeral diagnostic setup bypasses the claimed production boundary
    scenarios:
      - Injected completed workflow replaces application assembly.
      - Scratch fixture invents an ungrounded contract.
      - Mock replaces the endpoint, command, or UI under test.
    disposition: >-
      Proof contracts name assembled boundary and allowed lower replacements; receipts
      enumerate setup/replacements;
      accept/audit reject boundary substitution.
    owner: DN-008
    supporting_nodes: [DN-014]
    proof: PROOF-007
  - id: RISK-010
    class: usability
    title: New control plane becomes harder to understand or operate
    scenarios:
      - Graph is the only navigation mode.
      - Status is indicated only by color.
      - Corrective histories obscure current work.
      - Design decisions cannot be resolved efficiently on mobile.
    disposition: >-
      Peer Specification and Delivery surfaces, list/outline alternatives, accessible
      text/icon
      signals, current-chain default,
      responsive request flow, and Playwright desktop/mobile proof.
    owner: DN-011
    proof: PROOF-012
  - id: RISK-011
    class: scale
    title: Agent startup and context cost grows with the complete change
    scenarios:
      - Every packet reloads the complete graph and receipt history.
      - Node planning creates file-level or artifact-level microjobs.
      - Repeated corrective cycles require full rediscovery.
    disposition: >-
      Targeted authority projections, one resumable frontier planner with atomic per-node
      outputs,
      outcome-cohesive packet budgets, warm inline review, and concise predecessor
      receipts.
    owner: DN-006
    supporting_nodes: [DN-007]
    proof: PROOF-005
  - id: RISK-012
    class: scale
    title: Large changes overwhelm Cockpit rendering and navigation
    scenarios:
      - Cockpit renders every graph detail eagerly.
      - Corrective histories obscure the latest valid chain.
      - Mobile users cannot navigate a large graph.
    disposition: >-
      Incremental loading or virtualization, list and outline alternatives, latest-valid-chain
      defaults,
      filtering/grouping, and desktop/mobile scale fixtures.
    owner: DN-011
    proof: PROOF-012
  - id: RISK-013
    class: interface
    title: Bootstrap MCP bridge becomes a duplicate control plane
    scenarios:
      - DN-004 exposes change, request, evidence, health, or history tools
        outside its closed work bridge.
      - IF-015 and IF-010 register different schemas or error mappings for the
        same job operation.
      - Bridge-only registrations remain after the complete native MCP surface
        lands.
      - Accept or audit claim state diverges from its prepared proof checkout
        after setup, start rejection, or cleanup.
    disposition: >-
      Treat IF-015 as the closed work-operation subset of IF-010, with one registration and
      schema per operation; adapt only strict IF-004/IF-003 results while composing IF-005
      for read-only starts; exercise exact subset schemas, ordering, cleanup, and diagnostics
      in PROOF-014; and require PROOF-011 plus MIG-003/PROOF-009 to assert the exact assembled
      registry and absence of duplicate or legacy registrations.
    owner: DN-004
    proof: PROOF-014
  - id: RISK-014
    class: destructive
    title: Bootstrap carrier retires early or without durable closure evidence
    scenarios:
      - A legacy projection or request is not terminal-ready.
      - A claim, writer, or sibling carrier process remains active.
      - Snapshot or receipt publication succeeds only partially.
      - Active board removal occurs before hash or absence verification.
      - The build commit fails after filesystem finalization.
      - Acceptance observes a different revision or mutates tracked state.
      - A caller attempts legacy dispatch or mutation after finalization.
    disposition: >-
      Make DN-015 a non-projected terminal node, require exact revisions and explicit finalization
      approval, execute mutation only in its engine-selected build under the writer lease, fail closed
      on nonterminal or active state, retain recoverable uncommitted evidence until the scoped build
      commit succeeds, and verify absence plus no-later-mutation independently in a read-only exact-commit
      accept job under PROOF-016.
    owner: DN-015
    proof: PROOF-016

proofs:
  - id: PROOF-001
    title: Native authority, hashing, and path-safety proof
    boundary: Public owlbear-kanban ChangeRevision loader and receipt store over
      a temporary workspace.
    owner: DN-001
    method:
      - Parse valid and invalid modular packages and isolated node plans.
      - Assert canonical digest stability and semantic changes.
      - Assert equivalent joined delivery authority has the same digest across
        physical wrapping.
      - Exercise traversal, symlink, malformed YAML, duplicate ID, and
        partial-file cases.
    allowed_replacements: [temporary workspace filesystem]
    durable_outputs: [unit and contract tests]
  - id: PROOF-002
    title: Admission invariant proof
    boundary: Public validate/admit change operation before any jobs exist.
    owner: DN-002
    method:
      - Execute A1-A10-equivalent table-driven and property cases.
      - Assert stable finding codes and zero job mutation on failure.
      - Assert receipt and initial plan jobs are atomic on success.
    allowed_replacements:
      - temporary repository and command runner below admission
    durable_outputs: [admission tests and historical fixtures]
  - id: PROOF-003
    title: Job runtime, transaction, dispatch, and invalidation proof
    boundary: Public engine job, claim, completion, invalidation, and health
      operations.
    owner: DN-003
    method:
      - Exercise purpose-specific transitions, dependency release, claims,
        crashes, OCC races, supersession, request resolution, and recovery.
      - Exercise exact, non-intersecting descendant, intersecting path, missing,
        non-descendant, rename, copy, malformed-history, unsafe-path,
        predecessor-cycle, and explicit-supersession receipt classes.
      - Assert no partial valid receipt or dangling job after injected write
        failures.
    allowed_replacements:
      - clock
      - process identity
      - temporary filesystem
      - temporary Git repository
    durable_outputs: [engine state-machine, concurrency, and crash tests]
  - id: PROOF-004
    title: Resumable design and admission interaction proof
    boundary: >-
      Real /ideate and /design prompt/agent contracts operating on a native fixture
      change through public tools.
    owner: DN-005
    method:
      - Resume after interruption without losing decisions.
      - Verify one-question options include tradeoffs, recommendation, and
        confidence.
      - Reject unresolved authority and admit a complete fixture.
    allowed_replacements: [external research response below designer workflow]
    durable_outputs: [agent scenario tests]
  - id: PROOF-005
    title: Frontier planning boundary proof
    boundary: >-
      Real resumable planner contract plus engine finish_plan transactions for a plan-ready
      frontier.
    owner: DN-006
    method:
      - Create valid packet DAGs and resulting jobs for several independently
        published nodes.
      - Reject new interface, migration, risk, or proof boundary as material
        expansion.
      - Assert one node failure publishes no partial plan and preserves earlier
        completed nodes.
      - Assert initial plans are engine-selected in stable topological order
        from admitted contracts without requiring predecessor implementation
        acceptance.
      - Finish predecessor acceptance and prove dependent plans become
        reconciliation-required while their builds remain blocked until
        superseding plan receipts are current.
      - Invalidate a predecessor accept receipt and prove dependent reconciled
        plan/build closure becomes stale.
    allowed_replacements: [repository search results below the planner]
    durable_outputs: [planner scenario and transaction tests]
  - id: PROOF-006
    title: Builder inline-review proof
    boundary: >-
      Real builder job from claim through scoped commit, system-generated reviewer
      context, finding repair, and
      finish_build receipt.
    owner: DN-007
    method:
      - Verify reviewer cannot write or omit mandatory authority/diff context.
      - Exercise pass, local repair loop, material contradiction, commit
        failure, and stale packet digest.
    allowed_replacements:
      - sample product module and deterministic command runner
    durable_outputs: [builder/reviewer scenario tests]
  - id: PROOF-007
    title: Independent node acceptance proof
    boundary: >-
      Real acceptor over engine-created disposable checkout, node contract, packet
      receipts, and assembled proof.
    owner: DN-008
    method:
      - Pass a complete node at exact SHA.
      - Reject local defect, missing harness, boundary bypass, stale receipt,
        and tracked acceptor edit.
      - Assert corrective jobs and cleanup are exact and minimal.
    allowed_replacements:
      - dependencies explicitly below each fixture proof boundary
    durable_outputs: [acceptance and proof-checkout tests]
  - id: PROOF-008
    title: Whole-change audit proof
    boundary: Real auditor over all accepted nodes and admitted workflows in one
      exact-commit checkout.
    owner: DN-014
    method:
      - Pass full promise and decisions.
      - Reject cross-node integration, migration absence, stale acceptance,
        unresolved request, and tracked edit.
    allowed_replacements:
      - dependencies explicitly below each admitted workflow boundary
    durable_outputs: [audit scenario tests]
  - id: PROOF-009
    title: Atomic cutover and consumer setup proof
    boundary: >-
      Public setup plus cutover command/script against a populated legacy fixture
      and a fresh consumer fixture.
    owner: DN-012
    method:
      - Verify no overwrite, complete inventory/dispositions, hash equality,
        crash recovery, clean native stores, no OpenSpec dependency or old
        references, and successful consumer launch.
      - >-
        Record the exact command, manifest, hash, and commit evidence required for DEC-036's final
        post-archive bootstrap-board operation; PROOF-009 itself remains fixture-bounded.
    allowed_replacements:
      - temporary repositories
      - package installation command recorder
    durable_outputs: [setup, snapshot, absence, and distribution tests]
  - id: PROOF-011
    title: MCP control-plane contract proof
    boundary: Public MCP tools over the real graph-aware engine.
    owner: DN-009
    method:
      - Exercise change, validation, admission, job, request, evidence, health,
        history, and completion tool contracts.
      - >-
        Assert the registered tool names exactly equal IF-010's declared catalog, including
        finding reads and accept/audit rejection operations.
      - Assert generic task mutation and old lifecycle tools are absent.
    allowed_replacements: [temporary engine store]
    durable_outputs: [MCP integration tests]
  - id: PROOF-012
    title: Cockpit desktop/mobile workflow proof
    boundary: Built Cockpit SPA and real FastAPI backend over a seeded native
      change/job store.
    owner: DN-011
    method:
      - Navigate Changes, graph/list, Kanban, requests,
        attempts/findings/receipts, and legacy inventory.
      - Resolve a decision, inspect stale/corrective chain, and verify
        keyboard/mobile behavior.
      - Confirm Memory and Ideas routes still complete their existing core workflows after the shell rebuild.
      - Capture desktop/mobile screenshots and assert nonblank, nonoverlapping,
        bounded layout.
    allowed_replacements: [fixture change/job store; no mocked HTTP API]
    durable_outputs: [Vitest component tests, Playwright E2E, screenshots]
  - id: PROOF-013
    title: Complete native delivery audit
    boundary: >-
      Public native validation over durable incident/generic fixtures plus a fresh
      consumer workspace running the
      complete /design to plan/build/accept/audit flow through real MCP, engine,
      shared writer policy, proof
      checkout, and Cockpit.
    owner: DN-013
    method:
      - Reject original browser lifecycle, workspace repair/removal, memory
        purge, and memory lifecycle defects with stable codes, then admit their
        corrected forms.
      - Run generic valid/invalid DAG, stale, supersession, and corrective-cycle
        cases.
      - Execute a representative cross-module change and one corrective cycle.
      - Assert exact receipts, no late unowned expansion, final audit, clean
        setup, and no active legacy surface.
      - Assert modular authority and isolated plans retain canonical digest
        semantics and that finish_shape, shape lifecycle discriminators, and
        dual registrations are absent.
    allowed_replacements:
      - fixture repositories below named proof boundaries
      - true external services below admitted seams
    durable_outputs:
      - incident and property-based fixture suite
      - end-to-end release scenario
      - audit receipt
  - id: PROOF-014
    title: Orchestration, writer serialization, and proof-checkout proof
    boundary: >-
      Real orchestrator contract over public engine-selected waves, writer leases,
      claims, structured completion,
      and disposable proof-checkout operations.
    owner: DN-004
    method:
      - Exercise the public IF-015 operation subset over the real DispatchRuntime and
        assert that subset is exactly pick_jobs, start_job,
        finish_plan, finish_build, finish_accept, finish_audit, release_job, and
        recover_expired_claims, with the same registrations used by IF-010, strict schemas,
        and stable domain-error mapping.
      - For accept and audit, assert start_job returns canonical contained
        IF-005 checkout context, setup failure creates no claim, start rejection
        removes the checkout, and finish, release, and expired recovery clean it
        without adding another work operation.
      - Dispatch assigned plan, build, accept, and audit agents from
        engine-selected waves without interpreting agent prose.
      - Assert tracked-file writers never overlap and accept or audit never
        overlaps a writer.
      - Exercise crash, expired claim, rate-limit, stale lease, proof-checkout
        setup, containment, exact-commit materialization, and orphan cleanup
        paths.
      - Assert every structured attempt is finalized once and replanning reads
        current graph/job state.
    allowed_replacements: [clock, subagent runner, temporary repository]
    durable_outputs:
      - bootstrap MCP contract
      - orchestrator scenario
      - writer-compatibility
      - and proof-checkout tests
  - id: PROOF-015
    title: Cockpit backend contract proof
    boundary: Public FastAPI HTTP and SSE routes over the real graph-aware
      engine.
    owner: DN-010
    method:
      - Exercise change, graph, job, request, attempt, finding, receipt, health,
        legacy, conflict, and event contracts.
      - Assert arbitrary task mutation and old lifecycle routes are absent.
    allowed_replacements: [temporary engine store]
    durable_outputs: [FastAPI integration tests]
  - id: PROOF-016
    title: Real bootstrap carrier finalization proof
    boundary: >-
      Read-only DN-015 accept job in an engine-created disposable checkout of the exact build commit
      that applied public IF-016 to the real self-hosting workspace and sibling carrier.
    owner: DN-015
    method:
      - Verify the build receipt binds the expected authority, source revision, finalization approval,
        complete terminal dispositions, zero-claim preflight evidence, and exact committed revision.
      - Recompute all snapshot counts and hashes and verify finalization receipt identity, active-board
        and sibling-carrier absence, retained native source/distribution, and no compatibility reader.
      - Prove the checkout remains unmodified and legacy dispatch or mutation cannot be invoked from
        the committed product or distribution.
    allowed_replacements:
      - none; real workspace and exact build commit required
    durable_outputs:
      - immutable real-workspace legacy snapshot and manifest
      - bootstrap finalization receipt
      - terminal build receipt and scoped Git commit
      - exact-commit DN-015 accept receipt
