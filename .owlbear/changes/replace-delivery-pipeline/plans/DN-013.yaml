---
mode: build
packets:
  - id: DN-013-PK-001
    outcome: Make generic proof fixtures generation-independent and complete the
      five-method native release proof across incident and generic Python suites
      and assembled Cockpit without changing production behavior.
    obligations:
      - REQ-018
      - NEG-010
      - KEEP-004
      - KEEP-005
      - KEEP-006
      - KEEP-007
    in_scope:
      - Remove the copied revision's inherited DN-001 plan in
        test_invalidation.py and transactionally publish a synthetic build plan
        containing DN-001-PK-001 through NodePlanStore.prepare and
        RuntimeTransaction.
      - Derive the fixture node-plan digest with compute_node_plan_digest and
        bind receipts, jobs, findings, and routes consistently to DN-001-PK-001.
      - Preserve real InvalidationRuntime, receipt, job and finding stores,
        transaction injection, replay, conflict, and closure assertions.
      - Add kind=shape to the public job-parser stable-diagnostic matrix in
        test_jobs.py, expecting no job and WRONG_KIND while canonical kinds
        continue to round-trip.
      - Re-run the incident, generic, stale-health, fresh-consumer, MCP-catalog,
        and assembled browser proof.
    excluded:
      - Production kanban, MCP, Cockpit, setup, snapshot, finalization,
        authority, interface, migration, lifecycle, compatibility, or
        legacy-carrier changes.
      - Changes to maintained proof collaborators unless a planned test edit
        exposes a directly caused proof defect.
      - Tracked delivery plans, DN-015 finalization, and live bootstrap-board
        mutation.
    modules:
      - MOD-008
    interfaces:
      - IF-002
      - IF-003
      - IF-005
      - IF-009
      - IF-010
      - IF-011
      - IF-012
      - IF-013
      - IF-014
    dependencies: []
    acceptance_scenarios:
      - id: AC-1
        scenario: Given copied authority whose DN-001 plan is verification-only,
          fixture setup removes only the copied plan and transactionally
          publishes a build plan containing DN-001-PK-001; fixture records use
          its computed digest and InvalidationRuntime accepts the packet
          reference.
      - id: AC-2
        scenario: Given related and unrelated synthetic work plus one packet
          finding, InvalidationRuntime returns the maintained minimum closure,
          creates one DN-001-PK-001 corrective build, preserves unrelated work,
          replays byte-stably, and diagnoses a changed replay request.
      - id: AC-3
        scenario: Given failure at before-publication, after-first-publication,
          or before-manifest-cleanup, InvalidationRuntime returns
          ERR_INVALIDATION_ABORTED without a supersession receipt, corrective
          job, partial rewrite, or transaction manifest.
      - id: AC-4
        scenario: Given canonical plan, build, accept, audit, or supersession
          mappings, parse_job_mapping round-trips the record; given shape or
          execute, it returns no job and WRONG_KIND.
      - id: AC-5
        scenario: Given a stale-digest job, missing predecessor receipt, and
          broken supersession reference, work_health returns
          ERR_WORK_DIGEST_STALE, ERR_WORK_RECEIPT_REFERENCE_MISSING, and
          ERR_WORK_SUPERSESSION_BROKEN on byte-stable repeated reads.
      - id: AC-6
        scenario: Given the maintained incident, graph, transaction,
          invalidation, stale-health, fresh-consumer, job-kind, and MCP-catalog
          scenarios, the Python proof exits zero and produces stable defect
          codes, canonical digest evidence, audit-proof-013, clean health, no
          legacy directory, exact tool-catalog equality, and finish_shape
          absence.
      - id: AC-7
        scenario: Given the exported completed consumer, the native-release
          Playwright project builds Cockpit and completes desktop and mobile
          journeys through real FastAPI, producing audit, correction, health,
          legacy-absence, geometry, JSON, and screenshot evidence.
    impact_closure:
