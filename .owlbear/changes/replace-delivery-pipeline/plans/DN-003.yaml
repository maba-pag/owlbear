        - KEEP-006
        - KEEP-007
        - RISK-002
        - RISK-003
        - RISK-006
        - PROOF-003
    proof:
      boundary: Public engine job, claim, completion, invalidation, and health
        operations.
      commands:
        - uv run pytest -n0 serve/kanban/tests/test_native_runtime.py
          serve/kanban/tests/test_runtime_transaction.py
          serve/kanban/tests/test_invalidation.py
          serve/kanban/tests/test_runtime_requests.py
          serve/kanban/tests/test_attempts.py serve/kanban/tests/test_jobs.py
          serve/kanban/tests/test_change_receipts.py
          serve/kanban/tests/test_runtime_query.py -q --tb=short
        - uv run lint serve/kanban/tests/test_native_runtime.py
      collection_command: uv run pytest -n0
        serve/kanban/tests/test_native_runtime.py
        serve/kanban/tests/test_runtime_transaction.py
        serve/kanban/tests/test_invalidation.py
        serve/kanban/tests/test_runtime_requests.py
        serve/kanban/tests/test_attempts.py serve/kanban/tests/test_jobs.py
        serve/kanban/tests/test_change_receipts.py
        serve/kanban/tests/test_runtime_query.py --collect-only -q
      bounded_partition_commands:
        - uv run pytest -n0 serve/kanban/tests/test_native_runtime.py
          serve/kanban/tests/test_runtime_transaction.py
          serve/kanban/tests/test_invalidation.py -q --tb=short
        - uv run pytest -n0 serve/kanban/tests/test_runtime_requests.py
          serve/kanban/tests/test_attempts.py serve/kanban/tests/test_jobs.py -q
          --tb=short
        - uv run pytest -n0 serve/kanban/tests/test_change_receipts.py
          serve/kanban/tests/test_runtime_query.py -q --tb=short
      supplemental_command: uv run pytest -n0
        serve/kanban/tests/test_dispatch_runtime.py -q --tb=short
      consumer_compatibility_command: uv run pytest -n0
        serve/mcp-kanban/tests/test_mcp_acceptance_tools.py::test_public_audit_success_closes_accepted_whole_change_and_replays
        --timeout=120 -q --tb=short
      consumer_collection_command: uv run pytest -n0
        serve/mcp-kanban/tests/test_mcp_acceptance_tools.py::test_public_audit_success_closes_accepted_whole_change_and_replays
        --collect-only -q
      allowed_lower_replacements:
        - clock
        - process identity
        - temporary filesystem
        - temporary Git repository
      evidence_outputs:
        - Persisted-receipt public eligibility evidence.
        - Non-monotonic authored and graph ordering evidence.
        - Primary collection of 267 identities with SHA-256
          `2e338f872d8c897b5112f49629ed53883534882f9789a092ade061166d85a651`.
        - Supplemental dispatch collection of 16 identities with SHA-256
          `46e24981184063c02859c7c2128240f967f2f593f5cfe57a82c97cc763dcb2ed`.
        - Representative MCP default-path compatibility identity.
        - Typed partition ledger when the tracked 300-second runner limit
          applies.
        - Focused lint, scoped diff, and byte-unchanged frozen inputs.
    required_outputs:
      - Both fake-admission receipt sites and private runtime receipt-store
        reach-throughs repaired with persisted schema-valid ReceiptStore
        records.
      - Public verification-only reconciliation eligibility and failure
        regressions.
      - Non-monotonic causal and reconciliation fixtures plus opt-in
        terminal-order fixture with unchanged default importer behavior.
      - Preserved default importer compatibility through one representative
        public MCP accept/audit identity, plus 284 combined test identities
        across 267 primary, 16 dispatch-supplemental, and 1 representative MCP
        case.
      - Passing primary proof, supplemental consumer suites, lint, scoped diff,
        and partition ledger when required.
    profile:
      domain: Python graph-aware runtime proof
      risk: Verification-only eligibility, accepted-dependency ordering,
        atomicity, and proof completeness
      tools:
        - uv
        - pytest
        - pytest-timeout
        - workspace lint
        - temporary Git repositories
        - scoped Git inspection
    context_budget:
      expected_modified_files: 1
      editable_file: serve/kanban/tests/test_native_runtime.py
      change_envelope: One durable test file; production source only if public
        tests expose an admitted IF-003 defect.
