---
mode: build
packets:
  - id: DN-003-PK-001
    outcome: Make PROOF-003 discriminate persisted-record verification-only
      eligibility and canonical accepted-dependency ordering while preserving
      shipped behavior and test identities.
    obligations:
      - REQ-008
      - REQ-009
      - REQ-015
      - REQ-016
      - REQ-023
      - REQ-026
      - NEG-001
      - NEG-002
      - NEG-010
      - KEEP-006
      - KEEP-007
    in_scope:
      - Replace forged admission reads and private runtime receipt-store
        reach-through with schema-valid records persisted and evaluated through
        `ReceiptStore(revision)`.
      - Replace the private verification-generation predicate assertion with
        public `start_job` and `finish_plan` behavior.
      - Add an optional terminal job-order input whose default preserves
        identity assignment and whose supplied value must be a complete
        permutation of `1..len(nodes)`.
      - Use non-monotonic IDs in causal and reconciliation fixtures and opt-in
        non-monotonic terminal ordering.
      - Preserve default importer behavior, collected identities, rollback,
        replay, and mutation-free failure.
      - Change production only if repaired public tests expose an admitted
        IF-003 defect.
    excluded:
      - Authority, schema, lifecycle, migration, documentation, generated, MCP,
        Cockpit, agent, setup, configuration, conftest, importing-consumer-test,
        unrelated-helper, unrelated-test, and live control-plane edits.
      - Private-only eligibility proof, fake receipt reads, numeric-sort
        proxies, assertion weakening, node-ID changes, and deselection.
    modules:
      - MOD-001
      - MOD-008
      - MOD-009
    interfaces:
      - IF-001
      - IF-002
      - IF-003
    dependencies: []
    predecessor_acceptance:
      - accept-dn-001-1ec9888c522d
    acceptance_scenarios:
      - id: AC-01
        obligation: REQ-008
        scenario: Given public rejection and a corrective route, NativeRuntime
          persists a finding, minimum invalidation, corrective jobs, and prior
          attempts; injected failure leaves no fragment.
      - id: AC-02
        obligation: REQ-009
        scenario: Given lifecycle events, public runtime persists plan, build,
          accept, and audit kinds while RuntimeQuery separately projects
          readiness, claims, blocks, staleness, and disposition.
      - id: AC-03
        obligation: REQ-015
        scenario: Given a scoped request, current resolution persists options,
          tradeoffs, confidence, and dependent invalidation; stale identity
          leaves unrelated state unchanged.
      - id: AC-04
        obligation: REQ-016
        scenario: Given participant failure, race, expiry, or recovery input,
          public operations abort partial publication or converge state with
          health diagnostics.
      - id: AC-05
        obligation: REQ-023
        scenario: Given 500 runtime records, RuntimeQuery returns bounded
          deterministic pages and cached projections while health remains
          bounded and non-mutating.
      - id: AC-06
        obligation: REQ-026
        scenario: Given matching pending-unclaimed administration input,
          priority or cancellation succeeds and replays; stale, claimed, or
          terminal input conflicts without partial mutation.
      - id: AC-07
        obligation: NEG-001
        scenario: Given persisted jobs and receipts, artifact inspection shows
          identity references rather than copied normative prose.
      - id: AC-08
        obligation: NEG-002
        scenario: Given waiting, claim, block, stale, cancellation,
          supersession, or failure state, public projection keeps those facts
          outside status and limits disposition to pending, cancelled, or
          superseded.
      - id: AC-09
        obligation: NEG-010
        scenario: Given stale, superseded, bootstrap, legacy, missing, invalid,
          or ambiguous records, public currentness and start operations refuse
          dependency satisfaction without mutation.
      - id: AC-10
        obligation: KEEP-006
        scenario: Given RuntimeQuery calls, projections retain claims,
          dependencies, blocking, history, and resolved request state.
      - id: AC-11
        obligation: KEEP-007
        scenario: Given traversal, race, interruption, malformed recovery, or
          expired claim input, public stores reject escapes, preserve bytes,
          report health, and recover retryable state.
      - id: AC-12
        obligation: REQ-016
        scenario: Given admission or acceptance generation records persisted
          through ReceiptStore, public NativeRuntime `start_job` plus
          `finish_plan` publishes one verification-only accept job for an
          eligible exact candidate and replays it; ineligible or stale input
          publishes nothing.
      - id: AC-13
        obligation: REQ-009
        scenario: Given non-monotonic accepted job IDs in native causal and
          reconciliation fixtures and an opt-in non-identity terminal
          permutation, public reconciliation preserves authored dependency order
          and terminal completion preserves `DeliveryGraph.nodes` order; numeric
          sorting fails native assertions while default imported-helper identity
          behavior remains unchanged.
    impact_closure:
      paths:
        - pyproject.toml
        - conftest.py
        - serve/kanban/src/owlbear_kanban/
        - serve/kanban/tests/conftest.py
        - serve/kanban/tests/test_native_runtime.py
        - serve/kanban/tests/test_runtime_transaction.py
        - serve/kanban/tests/test_invalidation.py
        - serve/kanban/tests/test_runtime_requests.py
        - serve/kanban/tests/test_attempts.py
        - serve/kanban/tests/test_jobs.py
        - serve/kanban/tests/test_change_receipts.py
        - serve/kanban/tests/test_runtime_query.py
        - serve/kanban/tests/test_dispatch_runtime.py
        - serve/kanban/tests/test_change_revision.py
        - serve/kanban/tests/test_proof_checkout.py
        - serve/mcp-kanban/pyproject.toml
        - serve/mcp-kanban/src/owlbear_mcp_kanban/
        - serve/mcp-kanban/tests/test_mcp_acceptance_tools.py
        - serve/mcp-kanban/tests/test_mcp_surface_contract.py
        - share/agents/auditor.agent.md
        - share/skills/w-whole-change-audit/SKILL.md
        - .owlbear/changes/replace-delivery-pipeline/intent.md
        - .owlbear/changes/replace-delivery-pipeline/design.md
        - .owlbear/changes/replace-delivery-pipeline/decisions.yaml
        - .owlbear/changes/replace-delivery-pipeline/delivery/obligations.yaml
        - .owlbear/changes/replace-delivery-pipeline/delivery/contracts.yaml
        - .owlbear/changes/replace-delivery-pipeline/delivery/nodes.yaml
      authority_targets:
        - DN-001
        - DN-002
        - DN-003
        - IF-001
        - IF-002
        - IF-003
        - MOD-001
        - MOD-008
        - MOD-009
        - REQ-008
        - REQ-009
        - REQ-015
        - REQ-016
        - REQ-023
        - REQ-026
        - NEG-001
        - NEG-002
