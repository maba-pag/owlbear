  - id: DEC-027
    title: Dispatch one fresh agent invocation per job
    status: accepted
    decided_at: 2026-07-25
    authority: user
    selected: one-invocation-one-job
    rationale: >-
      The native engine's graph-aware picker and lifecycle gates own scheduling authority; the
      orchestrator only invokes the profile selected for one job and maps its result back to the
      engine. Allowing a builder to repick sequential jobs inside one synchronous subagent call
      would save repeated instruction loading, but prior-task context, compaction, and duplicated
      dispatch behavior put critical instructions and role boundaries at greater risk than the
      expected input-token savings justify.
    options:
      - id: one-invocation-one-job
        label: Start a fresh top-level agent invocation for every engine-selected job
        confidence: 0.96
        recommended: true
        pros:
          - Scheduling remains entirely visible to and controlled by the native engine
          - Every agent starts with a clean context and complete current instructions
          - Job, claim, attempt, result, and receipt boundaries remain identical
        cons:
          - Repeats agent instructions and authority loading for sequential compatible jobs
        risks:
          - Excessively small packets can make initialization cost dominate delivery
      - id: engine-selected-builder-continuation
        label: Let a builder repick compatible jobs inside one synchronous invocation
        confidence: 0.58
        recommended: false
        pros:
          - Reuses repository and domain context across sequential build jobs
        cons:
          - Carries irrelevant prior-job context and partially duplicates orchestration behavior
        risks:
          - Context compaction drops critical initial instructions during later jobs
          - Communication and lifecycle ownership become harder to reason about
      - id: one-invocation-per-node
        label: Execute every packet in one delivery node through one agent invocation
        confidence: 0.24
        recommended: false
        pros:
          - Maximizes context reuse within a delivery node
        cons:
          - Couples execution granularity to node size and weakens packet isolation
        risks:
          - Late failure or context exhaustion makes recovery expensive and ambiguous

