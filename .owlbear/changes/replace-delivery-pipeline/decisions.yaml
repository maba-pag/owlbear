          - Reopen recovery discovers abandoned claims through the existing ordered job inventory
          - Supplied recovery time keeps boundary tests and replay deterministic
        cons:
          - Every runtime assembler must provide a positive duration
          - One sweep may commit several independent job/event transactions
        risks:
          - Per-job concurrent changes must be isolated rather than aborting already completed sweep outcomes
      - id: request-policy-single-or-sweep
        label: Supply expiry duration on every recovery request
        confidence: 0.38
        recommended: false
        pros:
