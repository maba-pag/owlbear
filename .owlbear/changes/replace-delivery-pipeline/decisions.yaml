  - id: DEC-024
    title: Inject native claim expiry and recover through a deterministic sweep
    status: accepted
    decided_at: 2026-07-24
    authority: user
    selected: runtime-policy-deterministic-sweep
    rationale: >-
      Claim expiry is stable runtime policy, while recovery time and executor identity belong to one
