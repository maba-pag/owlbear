          - Policy is repeated in every invocation and replay identity
        risks:
          - Recovery outcomes depend on which caller-selected duration happened to run first
      - id: legacy-config-policy
        label: Load legacy BoardConfig claim_timeout
        confidence: 0.25
        recommended: false
        pros:
