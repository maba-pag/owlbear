  authority: user
  method: VS Code approval prompt
  approved_digest: 3f6c656289911320bb5e7faf37b5e86ffa8511e729ade201a03a19913e33d990
  scope:
    - Product intent and active obligations in intent.md and graph.yaml.
    - Accepted DEC-027 through DEC-033 and supersession of the conflicting prior choices.
    - Peer Specification and Delivery phases, frontier planning, acceptance-triggered reconciliation,
      modular authority, isolated plans, engine scheduling, and plan/build/accept/audit vocabulary.
  renewal: Any semantic authority edit requires fresh challenge and explicit exact-digest approval.

bootstrap_projection:
  carrier: current-pipeline-from-stable-sibling
  authority_mode: reference-only
  identity_fields: [change_id, delivery_digest, delivery_node_id, packet_id]
  dependency_mode: admitted-delivery-dag
  dispatch_lock: bootstrap-projection-audit
  enable_condition: >-
    The complete replacement projection must pass read-back identity, receipt, dependency, status,
    block, supersession, and duplicate-key checks before any audit block is removed.
  stale_policy: Any semantic authority edit stops dispatch until a new approved receipt and projection exist.
  non_atomic_limit: >-
    Receipt creation and legacy projection mutation are not atomic. Partial projection remains blocked
    and is repaired or removed before work starts.

limits:
  - Bootstrap projection dispatch remains disabled until complete digest-bound projection audit.
  - Direct Ruff on unchanged admission modules has five pre-existing findings; yamllint is unavailable.
  - Admission certifies delivery completeness and feasibility, not implementation correctness.
  - The current graph.yaml remains the bootstrap carrier until MIG-004 implements modular loading.
  - Existing native shape-vocabulary jobs and receipts are stale migration inputs, not valid plan work.

immutability:
  mutation: forbidden
  correction: append a superseding receipt and issue a newly approved admission receipt
  authority: Git history plus the delivery digest
