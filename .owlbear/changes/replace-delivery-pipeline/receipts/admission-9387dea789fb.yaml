bootstrap_projection:
  carrier: current-pipeline-from-stable-sibling
  initial_jobs: one blocked shape task per delivery node
  authority_mode: reference-only
  identity_fields: [change_id, delivery_digest, delivery_node_id, packet_id]
  initial_packet_id: aggregate
  dependency_mode: admitted-delivery-dag
  dispatch_lock: bootstrap-projection-audit
  enable_condition: >-
    The complete fourteen-task projection must pass read-back identity, receipt, parent, dependency,
    status, block, and duplicate-key checks before its audit blocks are removed.
  stale_policy: Any authority edit stops dispatch until a new receipt and projection are approved.
  non_atomic_limit: >-
    Receipt creation and legacy Kanban task creation are not atomic. A partial projection must be
    repaired or removed before work starts and cannot weaken the admitted graph.

limits:
  - Implementation packet boundaries remain intentionally unshaped until delivery-node shape jobs run.
  - Admission certifies delivery completeness and feasibility, not implementation correctness.
  - >-
    The current pipeline runs from the recorded stable sibling as a one-time carrier; projected tasks
    are non-authoritative and no compatibility path survives cutover.
  - >-
    Bootstrap task creation is not atomic with receipt creation, so dispatch remains disabled until
    the complete digest-bound projection passes idempotency and dependency audit.

immutability:
  mutation: forbidden
  correction: append a supersession receipt and issue a newly approved admission receipt
  authority: Git history plus the delivery digest
