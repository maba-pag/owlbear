# Knowledge base corpus manifest
# Total: ~548 documents (~520 research, 23 skills, 5 instructions)
# File counts are approximate and updated as of 2026-04-02; actual counts drift over time.

sources:
  - name: "Research docs"
    type: file_glob
    config:
      glob: ".owlbear/research/*.md"
    scope: global
    enabled: true

  - name: "Skills"
    type: file_glob
    config:
      glob: "share/skills/*/SKILL.md"
    scope: global
    enabled: true

  - name: "Instructions"
    type: file_glob
    config:
      glob: "share/instructions/*.md"
    scope: global
    enabled: true
