---
# Reference-only knowledge corpus manifest; current sources are registered at runtime.
sources:
  - name: "Research docs"
    type: file_glob
    config:
      glob: ".owlbear/research/*.md"
    scope: global
    enabled: true

  - name: "Skills"
    type: file_glob
    config:
      glob: "share/skills/*/SKILL.md"
    scope: global
    enabled: true

  - name: "Instructions"
    type: file_glob
    config:
      glob: "share/instructions/*.md"
    scope: global
    enabled: true
