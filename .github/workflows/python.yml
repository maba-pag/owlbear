---
name: Python

"on":
  workflow_call:
    inputs:
      durations:
        description: The run times, a JSON object of test file path to seconds, that every shard splits by
        type: string
        required: true
  workflow_dispatch:
    inputs:
      workers:
        description: xdist workers per shard, to benchmark a worker count; empty keeps 6
        type: string
        default: ""
      durations:
        description: Run times, a JSON object of test file path to seconds; {} splits files by a hash of their path
        type: string
        default: "{}"

concurrency:
  group: python-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI_SHARDS: 4

jobs:
  tests:
    name: Python tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Write the run times this run splits by
        id: durations
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          printf '%s' "$DURATIONS" > "$RUNNER_TEMP/ci-durations.json"
          python3 .github/scripts/ci_durations.py check "$RUNNER_TEMP/ci-durations.json"

      # A pass holds only for the run times it split by: under others, a skipped shard could own another's failure.
      - name: Fingerprint inputs
        id: fingerprint
        run: |
          value="$({ git ls-files -s -- . ':!:.owlbear/research'; cat "$RUNNER_TEMP/ci-durations.json"; } \
            | sha256sum | cut -c1-40)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Look up passing result for identical inputs
        id: reuse
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-python-${{ matrix.shard }}-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      - name: Report reused result
        if: steps.reuse.outputs.cache-hit == 'true'
        run: echo "Reused a passing result for identical inputs; tests skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup uv
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-suffix: python-tests
          cache-dependency-glob: uv.lock
          prune-cache: false

      - name: Check uv runtime
        if: steps.reuse.outputs.cache-hit != 'true'
        run: python3 .github/scripts/check_uv_version.py

      - name: Install pinned Python
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv python install

      - name: Install locked workspace
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv sync --locked --all-packages --all-groups

      # Only tests marked flaky with an issue found open here get one re-run; the token stays out of the tests.
      - name: Find open flaky issues
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/flaky_issues.py

      # 6 workers per 4-vCPU runner: in a benchmark, 10 spent ~53 s collecting and 4 ran the tests ~25 s slower.
      # Shards take whole test files, packed by the run times Scope handed over; main's CI refreshes them weekly.
      - name: Run test shard
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_DURATIONS: ${{ runner.temp }}/ci-durations.json
          CI_WORKERS: ${{ inputs.workers }}
          OWLBEAR_FLAKY_REPORT: ${{ runner.temp }}/test-results/flaky.json
          # Agent shells set safe.bareRepository=explicit; a test relying on finding a bare repository fails here too.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.bareRepository
          GIT_CONFIG_VALUE_0: explicit
        run: |
          plugin_dir="$RUNNER_TEMP/ci-plugins"
          mkdir -p "$plugin_dir"
          cp .github/scripts/ci_shard.py "$plugin_dir/"
          PYTHONPATH="$plugin_dir" uv run --no-sync pytest tests serve -p ci_shard \
            -m "not model and not browser" -n "${CI_WORKERS:-6}" --dist worksteal \
            --junitxml="$RUNNER_TEMP/test-results/junit.xml"

      - name: Upload test results
        if: ${{ !cancelled() && steps.reuse.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-python-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn

      - name: Record passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "$HEAD_SHA" > "$RUNNER_TEMP/ci-pass/head"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Save passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-python-${{ matrix.shard }}-${{ steps.fingerprint.outputs.value }}
