---
name: Security

"on":
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SNYK_API: https://api.eu.snyk.io
  SNYK_ORG: porsche-ag-fdi3-scanners

jobs:
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write  # the findings' comments with the owner's box (TD-363)
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04  # v1.0.0

      # Tests only: no monitor and no --report, so nothing is written into the Snyk org (TD-360).
      # Snyk Code only: its tests are unlimited, and Renovate keeps dependencies current (TD-382).
      - name: Snyk Code
        id: code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --org="$SNYK_ORG" --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Comment each Code finding with the owner's box (TD-363)
        if: >-
          failure() && steps.code.outcome == 'failure'
          && github.event_name == 'pull_request' && hashFiles('snyk-code.sarif') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/snyk_findings.py comment snyk-code.sarif
