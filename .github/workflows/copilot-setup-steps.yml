---
name: Copilot setup steps

"on":
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout task revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-python: true

      - name: Check uv runtime
        run: python3 .github/scripts/check_uv_version.py

      - name: Setup pinned Node.js
        if: hashFiles('serve/cockpit/web/package-lock.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Install pinned Python
        timeout-minutes: 5
        run: uv python install

      - name: Verify pinned Node runtime
        if: hashFiles('serve/cockpit/web/package-lock.json') != ''
        run: |
          node --version
          npm --version
          python3 .github/scripts/check_node_runtime.py \
            --version-file serve/cockpit/web/.nvmrc \
            --engines-file serve/cockpit/web/package.json \
            --expected-version "$(tr -d '\r\n' < serve/cockpit/web/.nvmrc)"

      - name: Install locked Python workspace and test tools
        timeout-minutes: 8
        env:
          # Only the deselected `model` tests import this stack; it is 96% of the workspace download.
          CI_SKIPPED_PACKAGES: >-
            torch triton nvidia-cublas nvidia-cuda-cupti nvidia-cuda-nvrtc nvidia-cuda-runtime
            nvidia-cudnn-cu13 nvidia-cufft nvidia-cufile nvidia-curand nvidia-cusolver nvidia-cusparse
            nvidia-cusparselt-cu13 nvidia-nccl-cu13 nvidia-nvjitlink nvidia-nvshmem-cu13 nvidia-nvtx
            cuda-bindings cuda-pathfinder cuda-toolkit flagembedding accelerate transformers
            sentence-transformers peft datasets ir-datasets pyarrow pandas scipy scikit-learn sympy
            tokenizers safetensors sentencepiece hf-xet huggingface-hub
        run: |
          skipped=()
          for package in $CI_SKIPPED_PACKAGES; do skipped+=(--no-install-package "$package"); done
          uv sync --locked --all-packages --group dev "${skipped[@]}"

      - name: Install locked Cockpit dependencies
        if: hashFiles('serve/cockpit/web/package-lock.json') != ''
        timeout-minutes: 5
        working-directory: serve/cockpit/web
        run: npm ci --engine-strict --no-audit --no-fund

      - name: Report Python and uv versions
        run: |
          uv --version
          uv run --locked --no-sync python --version
