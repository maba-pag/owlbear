---
name: Copilot setup steps

"on":
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout task revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-python: true

      - name: Check uv runtime
        run: python3 .github/scripts/check_uv_version.py

      - name: Setup pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Python
        timeout-minutes: 5
        run: uv python install

      - name: Verify pinned Node runtime
        run: |
          node --version
          npm --version
          python3 .github/scripts/check_node_runtime.py \
            --version-file .nvmrc \
            --engines-file package.json \
            --expected-version "$(tr -d '\r\n' < .nvmrc)"

      - name: Install locked Python workspace and test tools
        timeout-minutes: 8
        run: uv sync --locked --all-packages --group dev

      - name: Install locked Node tooling
        timeout-minutes: 5
        run: npm ci --engine-strict --no-audit --no-fund

      - name: Report Python and uv versions
        run: |
          uv --version
          uv run --locked --no-sync python --version
