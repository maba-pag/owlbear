---
name: Copilot setup steps

# Provisions the GitHub Copilot coding agent sandbox with the OwlBear Python
# runtime. Without this workflow the agent falls back to the runner image's
# system Python, which is below the >=3.14.6 floor declared by every serve/*
# package. These steps run before the agent's network restrictions apply, so
# uv and the pinned CPython build are downloaded and cached here.
#
# The job name must be exactly "copilot-setup-steps" for GitHub to discover it.

"on":
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .python-version
      - uv.lock
  push:
    branches: [dev]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .python-version
      - uv.lock

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned CPython runtime
        run: uv python install

      - name: Install the locked Python workspace
        run: uv sync --frozen --all-packages --all-groups

      - name: Report the provisioned runtime
        run: uv run python -VV
