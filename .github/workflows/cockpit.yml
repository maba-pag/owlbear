---
name: Cockpit

"on":
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/cockpit.yml
      - .github/scripts/check_node_runtime.py
      - biome.json
      - serve/cockpit/web/**
  workflow_dispatch:

concurrency:
  group: cockpit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Cockpit unit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: serve/cockpit/web
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Fingerprint inputs
        id: fingerprint
        working-directory: .
        run: |
          value="$(git ls-files -s -- .github/workflows/cockpit.yml .github/scripts/check_node_runtime.py \
            biome.json serve/cockpit/web | sha256sum | cut -c1-40)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Look up passing result for identical inputs
        id: reuse
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-cockpit-unit-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      - name: Report reused result
        if: steps.reuse.outputs.cache-hit == 'true'
        run: echo "Reused a passing result for identical inputs; checks skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Check Node declaration and installed runtime
        if: steps.reuse.outputs.cache-hit != 'true'
        run: |
          python3 ../../../.github/scripts/check_node_runtime.py \
            --version-file .nvmrc \
            --engines-file package.json \
            --expected-version "$(tr -d '\r\n' < .nvmrc)"

      - name: Install locked Cockpit dependencies
        if: steps.reuse.outputs.cache-hit != 'true'
        run: npm ci --engine-strict --no-audit --no-fund

      - name: Run Cockpit behavior tests
        if: steps.reuse.outputs.cache-hit != 'true'
        run: npm test

      - name: Type-check Cockpit browser tests
        if: steps.reuse.outputs.cache-hit != 'true'
        run: npm run typecheck:e2e

      - name: Verify PDS Biome plugin
        if: steps.reuse.outputs.cache-hit != 'true'
        run: npm run test:biome-pds

      - name: Verify bounded PDS asset synchronization
        if: steps.reuse.outputs.cache-hit != 'true'
        run: npm run test:sync-pds

      - name: Record passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "$HEAD_SHA" > "$RUNNER_TEMP/ci-pass/head"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Save passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-cockpit-unit-${{ steps.fingerprint.outputs.value }}

  browser:
    name: Cockpit browser
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: serve/cockpit/web
    env:
      E2E_COMPAT_BROWSERS: chromium
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Fingerprint inputs
        id: fingerprint
        working-directory: .
        run: |
          value="$(git ls-files -s -- .github/workflows/cockpit.yml biome.json serve/cockpit/web \
            | sha256sum | cut -c1-40)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Look up passing result for identical inputs
        id: reuse
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-cockpit-browser-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      - name: Report reused result
        if: steps.reuse.outputs.cache-hit == 'true'
        run: echo "Reused a passing result for identical inputs; checks skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Install locked Cockpit dependencies
        if: steps.reuse.outputs.cache-hit != 'true'
        run: npm ci --engine-strict --no-audit --no-fund

      - name: Install Chromium and Linux dependencies
        if: steps.reuse.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Build and smoke-test the production bundle
        if: steps.reuse.outputs.cache-hit != 'true'
        run: npm run test:e2e:compat

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cockpit-browser-diagnostics
          path: |
            serve/cockpit/web/test-results
            serve/cockpit/web/playwright-report
          if-no-files-found: ignore
          retention-days: 15

      - name: Record passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "$HEAD_SHA" > "$RUNNER_TEMP/ci-pass/head"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Save passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-cockpit-browser-${{ steps.fingerprint.outputs.value }}
