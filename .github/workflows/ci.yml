---
name: CI

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.scope.outputs.suites }}
      durations: ${{ steps.durations.outputs.value }}
      durations-current: ${{ steps.durations.outputs.current }}
      durations-key: ${{ steps.week.outputs.key }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: List the suites this change touches
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          base="$BASE_SHA"
          if [ "$EVENT" = push ]; then base="$(git rev-parse "$HEAD_SHA^1")"; fi  # a merge against its first parent
          python3 .github/scripts/ci_scope.py "$base" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # The Python shards split whole test files by run times main's CI keeps in the Actions cache. Scope reads them
      # once, so every shard of the run, a re-run one included, splits by the same copy.
      - name: Name this week's run times
        id: week
        if: contains(fromJSON(steps.scope.outputs.suites), 'python')
        run: echo "key=ci-durations-v1-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the latest run times
        id: restore
        if: contains(fromJSON(steps.scope.outputs.suites), 'python')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ci-durations
          key: ${{ steps.week.outputs.key }}
          restore-keys: ci-durations-v1-
      - name: Hand the run times to the Python shards
        id: durations
        if: contains(fromJSON(steps.scope.outputs.suites), 'python')
        env:
          WEEK: ${{ steps.week.outputs.key }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: python3 .github/scripts/ci_durations.py snapshot "$WEEK" "$MATCHED" >> "$GITHUB_OUTPUT"

  python:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'python')
    uses: ./.github/workflows/python.yml
    with:
      durations: ${{ needs.scope.outputs.durations }}

  # The first passing Python run on main in a week averages its run times into the cache.
  durations:
    name: Refresh test run times
    needs: [scope, python]
    if: github.event_name == 'push' && needs.scope.outputs.durations-current == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download the shards' test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: test-results-python-shard-*
          path: ${{ runner.temp }}/test-results
      - name: Average them with the run times this run was split by
        env:
          DURATIONS: ${{ needs.scope.outputs.durations }}
          CI_SHARDS: 4
        run: python3 .github/scripts/ci_durations.py refresh "$RUNNER_TEMP/test-results"
      - name: Save this week's run times
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ci-durations
          key: ${{ needs.scope.outputs.durations-key }}

  python-browser:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'python-browser')
    uses: ./.github/workflows/python-browser.yml

  static:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'static')
    uses: ./.github/workflows/static.yml

  tooling:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'tooling')
    uses: ./.github/workflows/tooling.yml

  agent-ecosystem:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'agent-ecosystem')
    uses: ./.github/workflows/agent-ecosystem.yml

  security:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'security')
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write  # its findings' comments (TD-363)
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  ci:
    name: CI
    if: always()
    needs: [scope, python, python-browser, static, tooling, agent-ecosystem, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every selected suite passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          if needs["scope"]["result"] != "success":
              sys.exit(f"the scope job ended {needs['scope']['result']}")
          selected = json.loads(needs["scope"]["outputs"]["suites"])
          failed = {name: needs[name]["result"] for name in selected if needs[name]["result"] != "success"}
          if failed:
              sys.exit(f"suites that did not pass: {failed}")
          print(f"passed: {', '.join(selected) or 'no suite touched'}")
          EOF
