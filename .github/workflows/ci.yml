---
name: CI

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.scope.outputs.suites }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: List the suites this change touches
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          base="$BASE_SHA"
          if [ "$EVENT" = push ]; then base="$(git rev-parse "$HEAD_SHA^1")"; fi  # a merge against its first parent
          python3 .github/scripts/ci_scope.py "$base" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  python:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'python')
    uses: ./.github/workflows/python.yml

  python-browser:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'python-browser')
    uses: ./.github/workflows/python-browser.yml

  cockpit:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'cockpit')
    uses: ./.github/workflows/cockpit.yml

  static:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'static')
    uses: ./.github/workflows/static.yml

  tooling:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'tooling')
    uses: ./.github/workflows/tooling.yml

  agent-ecosystem:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'agent-ecosystem')
    uses: ./.github/workflows/agent-ecosystem.yml

  security:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.suites), 'security')
    uses: ./.github/workflows/security.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  ci:
    name: CI
    if: always()
    needs: [scope, python, python-browser, cockpit, static, tooling, agent-ecosystem, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every selected suite passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          if needs["scope"]["result"] != "success":
              sys.exit(f"the scope job ended {needs['scope']['result']}")
          selected = json.loads(needs["scope"]["outputs"]["suites"])
          failed = {name: needs[name]["result"] for name in selected if needs[name]["result"] != "success"}
          if failed:
              sys.exit(f"suites that did not pass: {failed}")
          print(f"passed: {', '.join(selected) or 'no suite touched'}")
          EOF
