---
name: Python browser

"on":
  workflow_call:
  workflow_dispatch:

concurrency:
  group: python-browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser:
    name: Python browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Fingerprint inputs
        id: fingerprint
        run: |
          value="$(git ls-files -s -- .github/workflows/python-browser.yml .github/scripts/flaky_issues.py \
            .python-version conftest.py serve/tools/src/owlbear_tools/flaky.py \
            pyproject.toml uv.lock serve/browser serve/browser-mcp serve/web-content | sha256sum | cut -c1-40)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Look up passing result for identical inputs
        id: reuse
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-python-browser-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      - name: Report reused result
        if: steps.reuse.outputs.cache-hit == 'true'
        run: echo "Reused a passing result for identical inputs; tests skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup uv
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-suffix: python-browser
          cache-dependency-glob: uv.lock
          prune-cache: false

      - name: Check uv runtime
        if: steps.reuse.outputs.cache-hit != 'true'
        run: python3 .github/scripts/check_uv_version.py

      - name: Install pinned Python
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv python install

      - name: Install locked browser packages
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv sync --locked --package owlbear-browser-mcp --group dev

      # The runner image already has the libraries headless Chromium needs; --with-deps also fetched
      # fonts and upgrades over apt, which stalled for up to 15 minutes (actions/runner-images#14823).
      - name: Install Chromium
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv run --no-sync playwright install chromium

      # Only tests marked flaky with an issue found open here get one re-run; the token stays out of the tests.
      - name: Find open flaky issues
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/flaky_issues.py

      - name: Run browser-marked tests
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          OWLBEAR_FLAKY_REPORT: ${{ runner.temp }}/test-results/flaky.json
          # Agent shells set safe.bareRepository=explicit; a test relying on finding a bare repository fails here too.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.bareRepository
          GIT_CONFIG_VALUE_0: explicit
        run: >-
          uv run --no-sync pytest serve/browser serve/browser-mcp -m browser -n 4 --dist worksteal
          --junitxml="$RUNNER_TEMP/test-results/junit.xml"

      - name: Upload test results
        if: ${{ !cancelled() && steps.reuse.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-python-browser-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn

      - name: Record passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "$HEAD_SHA" > "$RUNNER_TEMP/ci-pass/head"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Save passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-python-browser-${{ steps.fingerprint.outputs.value }}

  delivery-next-browser:
    name: Delivery-next browser tests ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Fingerprint inputs
        id: fingerprint
        run: |
          value="$(git ls-files -s -- .github/workflows/python-browser.yml .github/scripts/flaky_issues.py \
            .github/scripts/ci_shard.py .python-version conftest.py serve/tools/src/owlbear_tools/flaky.py \
            pyproject.toml uv.lock serve/delivery-next serve/decisions serve/memory | sha256sum | cut -c1-40)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # Each shard has its own key: one shard's pass must never let the other skip its tests.
      - name: Look up passing result for identical inputs
        id: reuse
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-delivery-next-browser-${{ matrix.shard }}-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      - name: Report reused result
        if: steps.reuse.outputs.cache-hit == 'true'
        run: echo "Reused a passing result for identical inputs; tests skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup uv
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-suffix: delivery-next-browser
          cache-dependency-glob: uv.lock
          prune-cache: false

      - name: Check uv runtime
        if: steps.reuse.outputs.cache-hit != 'true'
        run: python3 .github/scripts/check_uv_version.py

      - name: Install pinned Python
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv python install

      - name: Install locked Delivery-next packages
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv sync --locked --package owlbear-delivery-next --group dev

      # The runner image already has the libraries headless Chromium needs; --with-deps also fetched
      # fonts and upgrades over apt, which stalled for up to 15 minutes (actions/runner-images#14823).
      - name: Install Chromium
        if: steps.reuse.outputs.cache-hit != 'true'
        run: uv run --no-sync playwright install chromium

      # Only tests marked flaky with an issue found open here get one re-run; the token stays out of the tests.
      - name: Find open flaky issues
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/flaky_issues.py

      # One line per test and a thread timeout that prints every stack, so a hang names its test.
      - name: Run browser-marked tests
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARDS: 2
          OWLBEAR_FLAKY_REPORT: ${{ runner.temp }}/test-results/flaky.json
          # Agent shells set safe.bareRepository=explicit; a test relying on finding a bare repository fails here too.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.bareRepository
          GIT_CONFIG_VALUE_0: explicit
        run: |
          plugin_dir="$RUNNER_TEMP/ci-plugins"
          mkdir -p "$plugin_dir"
          cp .github/scripts/ci_shard.py "$plugin_dir/"
          PYTHONPATH="$plugin_dir" uv run --no-sync pytest serve/delivery-next -m browser -p ci_shard \
            -n 4 --dist worksteal -v -o timeout_method=thread --timeout 180 \
            --junitxml="$RUNNER_TEMP/test-results/junit.xml"

      - name: Upload test results
        if: ${{ !cancelled() && steps.reuse.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-delivery-next-browser-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn

      - name: Record passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-pass"
          echo "$HEAD_SHA" > "$RUNNER_TEMP/ci-pass/head"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Save passing result
        if: github.event_name == 'pull_request' && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-pass
          key: ci-pass-v1-delivery-next-browser-${{ matrix.shard }}-${{ steps.fingerprint.outputs.value }}
