---
name: Dependency Upgrade

"on":
  schedule:
    - cron: "0 6 1 * *"  # 1st of each month at 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: dep-upgrade
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: dev

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python
        run: uv python install

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc

      - name: Upgrade Python dependencies
        run: uv lock --upgrade

      - name: Sync Python venv
        run: uv sync

      - name: Upgrade npm dependencies
        working-directory: serve/cockpit/web
        run: |
          npm update
          npm audit fix || true

      - name: Run Python tests
        id: pytest
        continue-on-error: true
        run: uv run pytest tests/ serve/ -m "not api" -q --tb=short

      - name: Run frontend tests
        id: vitest
        continue-on-error: true
        working-directory: serve/cockpit/web
        run: npm test -- --run

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet uv.lock serve/cockpit/web/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR (tests passed)
        if: >-
          steps.diff.outputs.changed == 'true' &&
          steps.pytest.outcome == 'success' &&
          steps.vitest.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.11
        with:
          branch: chore/dep-upgrade
          base: dev
          title: "chore(deps): monthly dependency upgrade"
          body: |
            Automated monthly dependency upgrade.

            - `uv lock --upgrade` applied
            - `npm update` applied
            - All Python tests passed
            - All frontend tests passed
          labels: dependencies
          commit-message: "chore(deps): monthly dependency upgrade"
          delete-branch: true

      - name: Create issue (tests failed)
        if: >-
          steps.diff.outputs.changed == 'true' &&
          (steps.pytest.outcome == 'failure' || steps.vitest.outcome == 'failure')
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.11
        with:
          branch: chore/dep-upgrade-failing
          base: dev
          title: "chore(deps): monthly upgrade (tests failing)"
          body: |
            Automated monthly dependency upgrade — **tests failing**.

            | Suite | Result |
            |-------|--------|
            | Python (pytest) | ${{ steps.pytest.outcome }} |
            | Frontend (vitest) | ${{ steps.vitest.outcome }} |

            Review the test output in the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: dependencies
          commit-message: "chore(deps): monthly dependency upgrade (failing)"
          delete-branch: true
          draft: true
