---
name: Cockpit verification

"on":
  pull_request:
    branches:
      - dev
    paths:
      - "serve/cockpit/web/**"
      - "serve/cockpit/README.md"
      - ".github/scripts/check_node_runtime.py"
      - ".github/workflows/cockpit-verification.yml"
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: cockpit-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    name: Prove Cockpit on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - "24.16.0"
          - "24.19.0"
    defaults:
      run:
        working-directory: serve/cockpit/web
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Check Node declaration and installed runtime
        run: |
          python3 ../../../.github/scripts/check_node_runtime.py \
            --version-file .nvmrc \
            --engines-file package.json \
            --expected-version "${{ matrix.node }}"

      - name: Install locked Cockpit dependencies
        run: npm ci --engine-strict

      - name: Run Cockpit behavior tests
        run: npm test

      - name: Check Cockpit sources
        run: |
          npx eslint src e2e --max-warnings 0
          npm run lint:css
          npm run lint:html

      - name: Build production Cockpit
        run: npm run build

  browser_compatibility:
    name: Prove browser compatibility
    needs: proof
    if: needs.proof.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: serve/cockpit/web
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Install locked Cockpit dependencies
        run: npm ci --engine-strict

      - name: Install Playwright browser engines
        timeout-minutes: 10
        run: npx playwright install chromium firefox webkit

      - name: Run cross-engine compatibility smoke tests
        run: npm run test:e2e:compat
