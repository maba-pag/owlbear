---
name: Snyk monitor

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: snyk-monitor
  cancel-in-progress: true

permissions:
  contents: read

env:
  SNYK_API: https://api.eu.snyk.io
  SNYK_ORG: porsche-ag-fdi3-scanners
  SNYK_REPO_URL: https://github.com/maba-pag/owlbear

jobs:
  monitor:
    name: Snyk monitor (main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04  # v1.0.0

      - name: Monitor open-source dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          snyk monitor --all-projects --org="$SNYK_ORG"
          --target-reference=main --remote-repo-url="$SNYK_REPO_URL"

      - name: Report Snyk Code results
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          status=0
          snyk code test --report --org="$SNYK_ORG" --project-name="maba-pag/owlbear" \
            --target-reference=main --remote-repo-url="$SNYK_REPO_URL" || status=$?
          # Exit code 1 only means issues were found; the report still reached Snyk.
          if [ "$status" -gt 1 ]; then exit "$status"; fi
