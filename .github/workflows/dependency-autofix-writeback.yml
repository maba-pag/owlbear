---
name: Dependency autofix write-back

"on":
  workflow_run:
    workflows:
      - Dependency verification
    types:
      - completed

concurrency:
  group: dependency-autofix-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  write-back:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Download run artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response="$RUNNER_TEMP/artifacts.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > "$response"
          count="$(jq '[.artifacts[] | select(.name | startswith("dependency-autofix-"))] | length' "$response")"
          if [ "$count" = 0 ]; then
            echo "No autofix artifact was produced."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" != 1 ]; then
            echo "Expected one autofix artifact, found $count." >&2
            exit 1
          fi
          archive_url="$(
            jq -r '.artifacts[] | select(.name | startswith("dependency-autofix-")) | .archive_download_url' \
              "$response"
          )"
          curl --fail-with-body --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$archive_url" > "$RUNNER_TEMP/dependency-autofix.zip"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Safely extract artifact
        if: steps.artifact.outputs.available == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/dependency-autofix
          ARCHIVE_PATH: ${{ runner.temp }}/dependency-autofix.zip
        run: |
          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE_PATH"])
          target = Path(os.environ["ARTIFACT_DIR"])
          expected = {"fixes.patch", "metadata.json"}
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              names = {entry.filename for entry in entries}
              if names != expected or len(entries) != len(expected):
                  raise SystemExit(f"Unexpected artifact entries: {sorted(names)}")
              target.mkdir(mode=0o700)
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  mode = entry.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"Unsafe artifact entry: {entry.filename}")
                limit = 64 * 1024 if entry.filename == "metadata.json" else 25 * 1024 * 1024
                if entry.file_size > limit:
                  raise SystemExit(f"Oversized artifact entry: {entry.filename}")
                  (target / entry.filename).write_bytes(bundle.read(entry))
          PY

      - name: Fetch authoritative pull request state
        if: steps.artifact.outputs.available == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/dependency-autofix
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="$(jq -er '.prNumber | select(type == "number" and . > 0 and floor == .)' \
            "$ARTIFACT_DIR/metadata.json")"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/${PR_NUMBER}" \
            > "$RUNNER_TEMP/pull-request.json"

          page=1
          : > "$RUNNER_TEMP/pull-request-files.ndjson"
          while true; do
            page_file="$RUNNER_TEMP/pull-request-files-$page.json"
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/${PR_NUMBER}/files?per_page=100&page=$page" \
              > "$page_file"
            jq -c '.[]' "$page_file" >> "$RUNNER_TEMP/pull-request-files.ndjson"
            [ "$(jq length "$page_file")" -lt 100 ] && break
            page=$((page + 1))
          done

      - name: Validate patch against live pull request
        if: steps.artifact.outputs.available == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/dependency-autofix
          FILES_PATH: ${{ runner.temp }}/pull-request-files.ndjson
          PR_PATH: ${{ runner.temp }}/pull-request.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path, PurePosixPath

          artifact = Path(os.environ["ARTIFACT_DIR"])
          metadata = json.loads((artifact / "metadata.json").read_text(encoding="utf-8"))
          pull = json.loads(Path(os.environ["PR_PATH"]).read_text(encoding="utf-8"))
          changed = {
              json.loads(line)["filename"]
              for line in Path(os.environ["FILES_PATH"]).read_text(encoding="utf-8").splitlines()
          }
          patch = artifact / "fixes.patch"
          required = {
              "baseSha", "headRef", "headRepository", "headSha", "mode",
              "patchSha256", "paths", "prNumber",
          }
          if set(metadata) != required:
              raise SystemExit("Artifact metadata schema is invalid.")
          if hashlib.sha256(patch.read_bytes()).hexdigest() != metadata["patchSha256"]:
              raise SystemExit("Patch digest does not match artifact metadata.")

          labels = {label["name"] for label in pull["labels"]}
          safe = "autofix" in labels
          unsafe = "unsafe-autofix" in labels
          expected_mode = "unsafe" if unsafe else "safe" if safe else "none"
          if not ({"dependencies", "renovate"} & labels):
              raise SystemExit("Pull request no longer has a dependency gate label.")
          if safe == unsafe or metadata["mode"] != expected_mode:
              raise SystemExit("Pull request fix labels no longer match the artifact mode.")
          if pull["state"] != "open":
              raise SystemExit("Pull request is no longer open.")
          if metadata["headRepository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Artifact was not generated for this repository.")
          if pull["head"]["repo"]["full_name"] != metadata["headRepository"]:
              raise SystemExit("Pull request headRepository changed after verification.")
          if pull["head"]["sha"] != metadata["headSha"]:
              raise SystemExit("Pull request HEAD_SHA changed after verification.")
          if pull["head"]["ref"] != metadata["headRef"]:
              raise SystemExit("Pull request head ref changed after verification.")
          if pull["base"]["sha"] != metadata["baseSha"]:
              raise SystemExit("Pull request base changed after verification.")

          output = subprocess.check_output(
              ["git", "apply", "--numstat", "-z", "--", str(patch)],
          )
          paths = []
          for record in output.split(b"\0"):
              if record:
                  paths.append(record.split(b"\t", 2)[2].decode("utf-8"))
          if paths != metadata["paths"] or len(paths) != len(set(paths)):
              raise SystemExit("Patch paths do not match artifact metadata.")

          generated = "serve/cockpit/web/public/porsche-design-system/"
          denied = (".github/", ".owlbear/", "store/")
          suffixes = {
              ".css", ".html", ".js", ".json", ".jsx", ".md", ".mjs",
              ".py", ".toml", ".ts", ".tsx", ".yaml", ".yml",
          }
          for path in paths:
              candidate = PurePosixPath(path)
              valid = path.startswith(generated) or (
                  path in changed
                  and not path.startswith(denied)
                  and candidate.name not in {".gitmodules", ".npmrc", ".pypirc"}
                  and (candidate.suffix in suffixes or candidate.name.endswith("lock"))
              )
              if candidate.is_absolute() or ".." in candidate.parts or not valid:
                  raise SystemExit(f"Patch path is not permitted: {path}")
          PY

      - name: Create and push autofix commit without checkout
        id: commit
        if: steps.artifact.outputs.available == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/dependency-autofix
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_PATH: ${{ runner.temp }}/pull-request.json
        run: |
          HEAD_REF="$(jq -er '.head.ref' "$PR_PATH")"
          HEAD_SHA="$(jq -er '.head.sha' "$PR_PATH")"
          git check-ref-format "refs/heads/$HEAD_REF"

          repository="$RUNNER_TEMP/repository.git"
          index="$RUNNER_TEMP/autofix.index"
          git init --bare "$repository"
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git --git-dir="$repository" config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $basic_auth"
          git --git-dir="$repository" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git --git-dir="$repository" fetch --no-tags origin "$HEAD_SHA"
          GIT_INDEX_FILE="$index" git --git-dir="$repository" read-tree "$HEAD_SHA"
          GIT_INDEX_FILE="$index" git --git-dir="$repository" apply --cached \
            "$ARTIFACT_DIR/fixes.patch"
          tree="$(GIT_INDEX_FILE="$index" git --git-dir="$repository" write-tree)"

          REPOSITORY_PATH="$repository" PARENT_SHA="$HEAD_SHA" TREE_SHA="$tree" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          metadata = json.loads(
              (Path(os.environ["ARTIFACT_DIR"]) / "metadata.json").read_text(encoding="utf-8"),
          )
            for treeish in (os.environ["PARENT_SHA"], os.environ["TREE_SHA"]):
              output = subprocess.check_output(
                [
                  "git", f"--git-dir={os.environ['REPOSITORY_PATH']}", "ls-tree", "-rz",
                  treeish, "--", *metadata["paths"],
                ],
              )
              for entry in (record for record in output.split(b"\0") if record):
                mode, object_type, _remainder = entry.split(None, 2)
                if mode in {b"120000", b"160000"} or object_type != b"blob":
                  raise SystemExit("Patch touches a symlink or submodule.")
          PY

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit="$(
            printf '%s\n' 'chore: apply dependency autofixes' |
              git --git-dir="$repository" commit-tree "$tree" -p "$HEAD_SHA"
          )"
          git --git-dir="$repository" push origin "$commit:refs/heads/$HEAD_REF"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      - name: Dispatch verification for the new head
        if: steps.commit.outputs.sha != ''
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/dependency-autofix
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          jq -n \
            --arg event_type dependency-autofix-updated \
            --argjson metadata "$(cat "$ARTIFACT_DIR/metadata.json")" \
            --arg head_sha "$NEW_HEAD_SHA" \
            '{
              event_type: $event_type,
              client_payload: {
                baseSha: $metadata.baseSha,
                headRef: $metadata.headRef,
                headRepository: $metadata.headRepository,
                headSha: $head_sha,
                mode: $metadata.mode,
                prNumber: $metadata.prNumber
              }
            }' > "$RUNNER_TEMP/dispatch.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dispatches" \
            --data-binary "@$RUNNER_TEMP/dispatch.json"

      - name: Write summary
        if: always()
        env:
          AVAILABLE: ${{ steps.artifact.outputs.available }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "## Dependency autofix write-back"
            echo
            echo "- Artifact available: \`${AVAILABLE:-false}\`"
            echo "- Pull request: \`${PR_NUMBER:-not resolved}\`"
            echo "- Commit: \`${COMMIT_SHA:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
