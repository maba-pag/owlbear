name: Sync dev to main

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build tree, diff, skip push"
        type: boolean
        default: false

concurrency:
  group: sync-to-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 0

      - name: Capture dev metadata
        id: meta
        run: |
          DEV_SHA=$(git rev-parse --short=8 HEAD)
          DEV_DATE=$(date -u +%Y-%m-%dT%H:%MZ)
          ACTOR="${{ github.actor }}"
          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
          echo "dev_date=$DEV_DATE" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

      - name: Validate include-list paths exist on dev
        run: |
          failed=0
          for p in share serve seed setup pyproject.toml uv.lock .python-version .gitignore SECURITY.md README-consumer.md; do
            if [ ! -e "$p" ]; then
              echo "MISSING: $p"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "Include-list validation failed -- one or more required paths are absent on dev."
            exit 1
          fi
          echo "All include-list paths present."

      - name: Build clean consumer tree
        run: |
          TREE=$(mktemp -d)
          cp -r share serve seed setup "$TREE/"
          cp pyproject.toml uv.lock .python-version .gitignore SECURITY.md "$TREE/"
          cp README-consumer.md "$TREE/README.md"
          echo "TREE=$TREE" >> "$GITHUB_ENV"

      - name: Fetch main for diff comparison
        run: |
          git fetch origin main --depth=1 || true

      - name: Generate diff summary
        id: diff
        run: |
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            # Create temp tree object from consumer tree for comparison
            cd "$TREE"
            git init -q
            git add -A
            TREE_COMMIT=$(git -c user.name=tmp -c user.email=tmp commit -q --allow-empty -m tmp && git rev-parse HEAD)
            cd "$GITHUB_WORKSPACE"

            # Diff against main
            DIFF=$(git diff --stat origin/main -- share serve seed setup pyproject.toml uv.lock .python-version .gitignore SECURITY.md README-consumer.md 2>/dev/null || echo "First sync — no previous main to compare")
            FILE_COUNT=$(echo "$DIFF" | grep -c '|' || echo 0)
          else
            DIFF="First sync — no previous main to compare"
            FILE_COUNT=0
          fi

          {
            echo 'diff<<EOF'
            printf '%s\n' "$DIFF"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        if: inputs.dry_run
        run: |
          echo "## Dry Run — Sync Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source:** dev @ \`${{ steps.meta.outputs.dev_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.meta.outputs.dev_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Actor:** ${{ steps.meta.outputs.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Changed files (${{ steps.diff.outputs.file_count }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.diff.outputs.diff }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Push skipped (dry run)." >> "$GITHUB_STEP_SUMMARY"

      - name: Create merge commit and push to main
        if: ${{ !inputs.dry_run }}
        run: |
          cd "$TREE"

          # Re-init clean tree (diff step may have initialized)
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          COMMIT_MSG="sync: dev@${{ steps.meta.outputs.dev_sha }} (${{ steps.meta.outputs.dev_date }}, ${{ steps.meta.outputs.actor }})"
          git commit -m "$COMMIT_MSG"

          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main --force

      - name: Write job summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "## Sync Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source:** dev @ \`${{ steps.meta.outputs.dev_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.meta.outputs.dev_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Actor:** ${{ steps.meta.outputs.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Changed files (${{ steps.diff.outputs.file_count }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.diff.outputs.diff }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
