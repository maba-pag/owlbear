---
name: Sync dev to main

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — show diff preview and skip push"
        type: boolean
        default: false
      sync_share:
        description: "share/ (agents, skills, instructions, prompts)"
        type: boolean
        default: true
      sync_browser:
        description: "serve/browser/ + serve/mcp-browser/"
        type: boolean
        default: true
      sync_kanban:
        description: "serve/kanban/ + serve/mcp-kanban/"
        type: boolean
        default: true
      sync_knowledge:
        description: "serve/knowledge/ + serve/mcp-knowledge/"
        type: boolean
        default: true
      sync_mcp_memory:
        description: "serve/mcp-memory/"
        type: boolean
        default: true
      sync_cockpit:
        description: "serve/cockpit/"
        type: boolean
        default: true
      sync_tools:
        description: "serve/tools/"
        type: boolean
        default: true
      sync_setup:
        description: "setup/ + seed/ (init script, templates)"
        type: boolean
        default: true
      sync_infra:
        description: "CI, linters, editor & root configs"
        type: boolean
        default: true
      message:
        description: "Optional note for the sync commit (e.g. 'cockpit v0.2.0')"
        type: string
        required: false

concurrency:
  group: sync-to-main
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      SYNC_SHARE: ${{ inputs.sync_share }}
      SYNC_BROWSER: ${{ inputs.sync_browser }}
      SYNC_KANBAN: ${{ inputs.sync_kanban }}
      SYNC_KNOWLEDGE: ${{ inputs.sync_knowledge }}
      SYNC_COCKPIT: ${{ inputs.sync_cockpit }}
      SYNC_TOOLS: ${{ inputs.sync_tools }}
      SYNC_MCP_MEMORY: ${{ inputs.sync_mcp_memory }}
      SYNC_SETUP: ${{ inputs.sync_setup }}
      SYNC_INFRA: ${{ inputs.sync_infra }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_MESSAGE: ${{ inputs.message }}

    steps:
      - name: Resolve scopes
        run: |
          scopes=""
          if [[ "$SYNC_SHARE" == "true" ]]; then scopes="${scopes:+$scopes,}share"; fi

          # Collect serve sub-scopes
          serve_scopes=""
          if [[ "$SYNC_BROWSER" == "true" ]]; then serve_scopes="${serve_scopes:+$serve_scopes,}browser"; fi
          if [[ "$SYNC_KANBAN" == "true" ]]; then serve_scopes="${serve_scopes:+$serve_scopes,}kanban"; fi
          if [[ "$SYNC_KNOWLEDGE" == "true" ]]; then serve_scopes="${serve_scopes:+$serve_scopes,}knowledge"; fi
          if [[ "$SYNC_COCKPIT" == "true" ]]; then serve_scopes="${serve_scopes:+$serve_scopes,}cockpit"; fi
          if [[ "$SYNC_TOOLS" == "true" ]]; then serve_scopes="${serve_scopes:+$serve_scopes,}tools"; fi
          if [[ "$SYNC_MCP_MEMORY" == "true" ]]; then serve_scopes="${serve_scopes:+$serve_scopes,}mcp-memory"; fi

          if [[ -n "$serve_scopes" ]]; then
            # If all serve sub-scopes are selected, collapse to "serve"
            if [[ "$serve_scopes" == "browser,kanban,knowledge,cockpit,tools,mcp-memory" ]]; then
              scopes="${scopes:+$scopes,}serve"
            else
              scopes="${scopes:+$scopes,}$serve_scopes"
            fi
          fi

          if [[ "$SYNC_SETUP" == "true" ]]; then scopes="${scopes:+$scopes,}setup"; fi
          if [[ "$SYNC_INFRA" == "true" ]]; then scopes="${scopes:+$scopes,}infra"; fi

          if [[ -z "$scopes" ]]; then
            echo "::error::No sync scopes selected — enable at least one."
            exit 1
          fi

          # Shorten label when everything is selected
          if [[ "$scopes" == "share,serve,setup,infra" ]]; then scopes="all"; fi

          # Export whether ALL serve packages are selected (for full-wipe logic)
          any_serve="false"
          all_serve="false"
          if [[ -n "$serve_scopes" ]]; then any_serve="true"; fi
          if [[ "$serve_scopes" == "browser,kanban,knowledge,cockpit,tools,mcp-memory" ]]; then all_serve="true"; fi

          {
            echo "SCOPES=$scopes"
            echo "ANY_SERVE=$any_serve"
            echo "ALL_SERVE=$all_serve"
          } >> "$GITHUB_ENV"
          echo "Syncing scopes: $scopes"

      - name: Checkout dev branch (full history)
        # fetch-depth: 0 needed — incremental approach attaches new commits to origin/main HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Capture dev metadata
        run: |
          {
            echo "SHORT_SHA=$(git rev-parse --short HEAD)"
            echo "FULL_SHA=$(git rev-parse HEAD)"
            echo "DATE=$(date -u +"%Y-%m-%d")"
          } >> "$GITHUB_ENV"

      - name: Warn on unresolved TODO markers
        run: |
          # Build path list from selected sync scopes
          paths=""
          if [[ "$SYNC_SHARE" == "true" ]]; then paths="$paths share"; fi
          if [[ "$SYNC_BROWSER" == "true" ]]; then paths="$paths serve/browser serve/mcp-browser"; fi
          if [[ "$SYNC_KANBAN" == "true" ]]; then paths="$paths serve/kanban serve/mcp-kanban"; fi
          if [[ "$SYNC_KNOWLEDGE" == "true" ]]; then paths="$paths serve/knowledge serve/mcp-knowledge"; fi
          if [[ "$SYNC_COCKPIT" == "true" ]]; then paths="$paths serve/cockpit"; fi
          if [[ "$SYNC_TOOLS" == "true" ]]; then paths="$paths serve/tools"; fi
          if [[ "$SYNC_MCP_MEMORY" == "true" ]]; then paths="$paths serve/mcp-memory"; fi
          if [[ "$SYNC_SETUP" == "true" ]]; then paths="$paths setup seed"; fi
          if [[ "$SYNC_INFRA" == "true" ]]; then
            paths="$paths .github .vscode .editorconfig .gitattributes .gitignore"
            paths="$paths .markdownlint-cli2.jsonc .markdownlint.json .markdownlintignore"
            paths="$paths .mega-linter.yml .pre-commit-config.yaml .python-version"
            paths="$paths .yamllint.yml pyproject.toml SECURITY.md uv.lock"
            paths="$paths README-consumer.md"
          fi

          if [[ -z "$paths" ]]; then
            echo "No paths to scan for TODO markers."
            exit 0
          fi

          # shellcheck disable=SC2086
          todo_hits=$(grep -rHnI '> \*\*TODO:\*\*' $paths 2>/dev/null \
            | grep -v -e '^share/skills/w-doc-update/SKILL\.md:' \
                      -e '^\.github/workflows/sync-to-main\.yml:' \
            || true)

          if [[ -z "$todo_hits" ]]; then
            echo "No unresolved TODO markers in synced paths."
            exit 0
          fi

          # Emit one ::warning per hit with file and line metadata
          todo_count=$(printf '%s\n' "$todo_hits" | wc -l | tr -d ' ')
          while IFS=: read -r file line content; do
            echo "::warning file=${file},line=${line},title=Unresolved TODO marker::${content}"
          done <<< "$todo_hits"

          echo ""
          echo "⚠️ ${todo_count} unresolved TODO marker(s) in synced scopes."

      - name: Validate selected paths exist on dev
        run: |
          failed=0
          paths=""

          if [[ "$SYNC_SHARE" == "true" ]]; then
            paths="$paths share"
          fi
          if [[ "$SYNC_BROWSER" == "true" ]]; then
            paths="$paths serve/browser serve/mcp-browser"
          fi
          if [[ "$SYNC_KANBAN" == "true" ]]; then
            paths="$paths serve/kanban serve/mcp-kanban"
          fi
          if [[ "$SYNC_KNOWLEDGE" == "true" ]]; then
            paths="$paths serve/knowledge serve/mcp-knowledge"
          fi
          if [[ "$SYNC_COCKPIT" == "true" ]]; then
            paths="$paths serve/cockpit"
          fi
          if [[ "$SYNC_TOOLS" == "true" ]]; then
            paths="$paths serve/tools"
          fi
          if [[ "$SYNC_MCP_MEMORY" == "true" ]]; then
            paths="$paths serve/mcp-memory"
          fi
          if [[ "$SYNC_SETUP" == "true" ]]; then
            paths="$paths setup seed"
          fi
          if [[ "$SYNC_INFRA" == "true" ]]; then
            paths="$paths .github .vscode .editorconfig .gitattributes .gitignore"
            paths="$paths .markdownlint-cli2.jsonc .markdownlint.json .markdownlintignore"
            paths="$paths .mega-linter.yml .pre-commit-config.yaml .python-version"
            paths="$paths .yamllint.yml pyproject.toml SECURITY.md uv.lock"
            paths="$paths README-consumer.md"
          fi

          for p in $paths; do
            if [ ! -e "$p" ]; then
              echo "MISSING: $p"
              failed=1
            fi
          done

          if [ $failed -ne 0 ]; then
            echo "Include-list validation failed — one or more required paths are absent on dev."
            exit 1
          fi
          echo "All selected paths present on dev."

      - name: Install uv for MCP dev-source gate
        if: ${{ env.SYNC_KANBAN == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install Python (uv managed)
        if: ${{ env.SYNC_KANBAN == 'true' }}
        run: uv python install

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare consumer branch
        # Incremental: new commit is a child of origin/main.
        # First-ever sync: create orphan branch when main does not exist yet.
        run: |
          if git fetch origin main --no-tags 2>/dev/null; then
            echo "main branch exists — creating incremental commit on top of origin/main"
            git checkout -b consumer origin/main
            echo "MAIN_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "main branch not found — creating orphan commit (first-ever sync)"
            git checkout --orphan consumer
            git rm -rf . --quiet || true
            echo "MAIN_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Sync selected scopes from dev
        # All scopes on → full wipe (guarantees no stale files from prior syncs).
        # Partial → selective overlay (unselected scopes keep their state on main).
        env:
          ALL_SCOPES: ${{ env.SCOPES }}
          ALL_SERVE: ${{ env.ALL_SERVE }}
        run: |
          if [[ "$ALL_SCOPES" == "all" ]]; then
            echo "=== Full wipe — all scopes selected"
            git rm -rf . --quiet || true
            git checkout dev -- \
              share serve setup seed \
              .github .vscode .editorconfig .gitattributes .gitignore \
              .markdownlint-cli2.jsonc .markdownlint.json .markdownlintignore \
              .mega-linter.yml .pre-commit-config.yaml .python-version \
              .yamllint.yml pyproject.toml SECURITY.md uv.lock \
              README-consumer.md
            git mv -f README-consumer.md README.md
          else
            echo "=== Partial sync — scopes: $ALL_SCOPES"

            if [[ "$SYNC_SHARE" == "true" ]]; then
              echo "--- share/"
              git rm -rf share --quiet 2>/dev/null || true
              git checkout dev -- share
            fi

            # --- serve/ packages (granular) ---
            if [[ "$ALL_SERVE" == "true" ]]; then
              echo "--- serve/ (all packages)"
              git rm -rf serve --quiet 2>/dev/null || true
              git checkout dev -- serve
            else
              if [[ "$SYNC_BROWSER" == "true" ]]; then
                echo "--- serve/browser + serve/mcp-browser"
                git rm -rf serve/browser serve/mcp-browser --quiet 2>/dev/null || true
                git checkout dev -- serve/browser serve/mcp-browser
              fi

              if [[ "$SYNC_KANBAN" == "true" ]]; then
                echo "--- serve/kanban + serve/mcp-kanban"
                git rm -rf serve/kanban serve/mcp-kanban --quiet 2>/dev/null || true
                git checkout dev -- serve/kanban serve/mcp-kanban
              fi

              if [[ "$SYNC_KNOWLEDGE" == "true" ]]; then
                echo "--- serve/knowledge + serve/mcp-knowledge"
                git rm -rf serve/knowledge serve/mcp-knowledge --quiet 2>/dev/null || true
                git checkout dev -- serve/knowledge serve/mcp-knowledge
              fi

              if [[ "$SYNC_COCKPIT" == "true" ]]; then
                echo "--- serve/cockpit"
                git rm -rf serve/cockpit --quiet 2>/dev/null || true
                git checkout dev -- serve/cockpit
              fi

              if [[ "$SYNC_TOOLS" == "true" ]]; then
                echo "--- serve/tools"
                git rm -rf serve/tools --quiet 2>/dev/null || true
                git checkout dev -- serve/tools
              fi

              if [[ "$SYNC_MCP_MEMORY" == "true" ]]; then
                echo "--- serve/mcp-memory"
                git rm -rf serve/mcp-memory --quiet 2>/dev/null || true
                git checkout dev -- serve/mcp-memory
              fi
            fi

            if [[ "$SYNC_SETUP" == "true" ]]; then
              echo "--- setup/ + seed/"
              git rm -rf setup seed --quiet 2>/dev/null || true
              git checkout dev -- setup seed
            fi

            if [[ "$SYNC_INFRA" == "true" ]]; then
              echo "--- infra (CI, linters, root configs)"
              git rm -rf .github .vscode --quiet 2>/dev/null || true
              git checkout dev -- \
                .github .vscode .editorconfig .gitattributes .gitignore \
                .markdownlint-cli2.jsonc .markdownlint.json .markdownlintignore \
                .mega-linter.yml .pre-commit-config.yaml .python-version \
                .yamllint.yml pyproject.toml SECURITY.md uv.lock \
                README-consumer.md
              git mv -f README-consumer.md README.md
            fi
          fi

      - name: Setup Node.js (cockpit)
        if: ${{ env.SYNC_COCKPIT == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Setup Node.js (diagrams only)
        if: ${{ env.SYNC_COCKPIT != 'true' && env.SYNC_SHARE == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: lts/*

      - name: Build cockpit SPA
        if: ${{ env.SYNC_COCKPIT == 'true' }}
        working-directory: serve/cockpit/web
        run: npm ci && npm run sync:pds && npm run build

      - name: Install Chromium for cockpit E2E
        if: ${{ env.SYNC_COCKPIT == 'true' }}
        working-directory: serve/cockpit/web
        run: npx playwright install chromium --with-deps

      - name: Assert SPA bundle exists
        if: ${{ env.SYNC_COCKPIT == 'true' }}
        run: |
          if [ ! -f serve/cockpit/dist/index.html ]; then
            echo "ERROR: serve/cockpit/dist/index.html not found — build may have failed or outDir is misconfigured."
            exit 1
          fi

      - name: Stage built SPA bundle
        if: ${{ env.SYNC_COCKPIT == 'true' }}
        run: git add -f serve/cockpit/dist/

      - name: Export Excalidraw diagrams to PNG
        if: ${{ env.SYNC_SHARE == 'true' }}
        run: |
          # The export script lives in .owlbear/ (dev-only, not synced to main).
          # Check it out from dev, run it, then remove the working tree copy.
          git checkout dev -- .owlbear/scripts/export-diagrams
          cd .owlbear/scripts/export-diagrams
          npm ci
          npx playwright install chromium --with-deps
          npm run export
          cd ../../..
          git add -f share/diagrams/*.png
          git rm -rf .owlbear --quiet 2>/dev/null || true

      - name: Prune dev-only files from consumer tree
        run: |
          # .vscode/ — consumers get theirs from seed/.vscode/ via init.py
          git rm -rf .vscode --quiet 2>/dev/null || true

          # .github/copilot-instructions.md — describes owlbear-dev internals
          git rm -f .github/copilot-instructions.md --quiet 2>/dev/null || true

          # Package test suites validate dev; consumers only execute package sources.
          find serve -mindepth 2 -maxdepth 2 -type d -name tests -print0 \
            | xargs -0 -r git rm -rf --quiet --

          # serve/cockpit/web/ — consumers only need the pre-built dist/
          if [[ "$SYNC_COCKPIT" == "true" ]]; then
            git rm -rf serve/cockpit/web --quiet 2>/dev/null || true
          fi

      - name: Prune stale files not present on dev
        run: |
          # Remove tracked files on main that no longer exist on dev.
          # Only prunes within synced scopes and truly orphaned paths.
          # Files in unsynced scopes are left untouched.

          declare -A scope_map=(
            ["share/"]="$SYNC_SHARE"
            ["serve/browser/"]="$SYNC_BROWSER"
            ["serve/mcp-browser/"]="$SYNC_BROWSER"
            ["serve/kanban/"]="$SYNC_KANBAN"
            ["serve/mcp-kanban/"]="$SYNC_KANBAN"
            ["serve/knowledge/"]="$SYNC_KNOWLEDGE"
            ["serve/mcp-knowledge/"]="$SYNC_KNOWLEDGE"
            ["serve/cockpit/"]="$SYNC_COCKPIT"
            ["serve/tools/"]="$SYNC_TOOLS"
            ["serve/mcp-memory/"]="$SYNC_MCP_MEMORY"
            ["setup/"]="$SYNC_SETUP"
            ["seed/"]="$SYNC_SETUP"
            [".github/"]="$SYNC_INFRA"
          )

          stale_count=0
          while IFS= read -r file; do
            # Skip build artifacts
            case "$file" in
              serve/cockpit/dist/*) continue ;;
            esac

            # Check if file belongs to a known scope
            in_known_scope=false
            scope_synced=false
            for prefix in "${!scope_map[@]}"; do
              if [[ "$file" == "$prefix"* ]]; then
                in_known_scope=true
                [[ "${scope_map[$prefix]}" == "true" ]] && scope_synced=true
                break
              fi
            done

            # Don't touch files in scopes that weren't synced this run
            if [[ "$in_known_scope" == "true" && "$scope_synced" == "false" ]]; then
              continue
            fi

            # Remove if not present on dev
            if ! git cat-file -e "dev:$file" 2>/dev/null; then
              git rm --quiet "$file" 2>/dev/null || true
              echo "  Removed stale: $file"
              stale_count=$((stale_count + 1))
            fi
          done < <(git ls-files)

          if [ $stale_count -gt 0 ]; then
            echo "Pruned $stale_count stale file(s) from consumer branch."
          else
            echo "No stale files found."
          fi

      - name: Detect changes
        run: |
          if [ "$MAIN_EXISTS" = "true" ] && git diff --staged --quiet HEAD 2>/dev/null; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "No changes detected — main is already up to date."
          else
            echo "NO_CHANGES=false" >> "$GITHUB_ENV"
          fi

      - name: Diff preview
        run: |
          {
            echo "### Diff preview — scopes: ${{ env.SCOPES }}"
            echo ""
            if [ "$NO_CHANGES" = "true" ]; then
              echo "No changes — selected scopes are already up to date."
            elif [ "$MAIN_EXISTS" = "false" ]; then
              echo "First-ever sync — files to be committed:"
              echo ""
              echo '```'
              git ls-files --cached
              echo '```'
            else
              echo '```'
              git diff --staged --stat HEAD
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: ${{ env.NO_CHANGES != 'true' }}
        env:
          COMMIT_SCOPES: ${{ env.SCOPES }}
          COMMIT_SHORT_SHA: ${{ env.SHORT_SHA }}
          COMMIT_MESSAGE: ${{ env.INPUT_MESSAGE }}
          COMMIT_SERVER_URL: ${{ github.server_url }}
          COMMIT_REPOSITORY: ${{ github.repository }}
          COMMIT_RUN_ID: ${{ github.run_id }}
          COMMIT_FULL_SHA: ${{ env.FULL_SHA }}
        run: |
          subject="sync($COMMIT_SCOPES): dev@$COMMIT_SHORT_SHA"
          if [[ -n "$COMMIT_MESSAGE" ]]; then subject="$subject — $COMMIT_MESSAGE"; fi

          run_url="$COMMIT_SERVER_URL/$COMMIT_REPOSITORY/actions/runs/$COMMIT_RUN_ID"

          git commit -m "$subject" \
            -m "" \
            --trailer "Dev-Ref: $COMMIT_FULL_SHA" \
            --trailer "Run: $run_url"

      - name: Push to main
        if: ${{ env.NO_CHANGES != 'true' && env.INPUT_DRY_RUN != 'true' }}
        run: |
          git push origin consumer:main

      - name: Job summary — success
        if: ${{ success() }}
        env:
          SUMMARY_DRY_RUN: ${{ env.INPUT_DRY_RUN }}
          SUMMARY_SHORT_SHA: ${{ env.SHORT_SHA }}
          SUMMARY_DATE: ${{ env.DATE }}
          SUMMARY_ACTOR: ${{ github.actor }}
          SUMMARY_SCOPES: ${{ env.SCOPES }}
        run: |
          {
            echo ""
            if [ "$NO_CHANGES" = "true" ]; then
              echo "## Sync — No Changes"
            elif [ "$SUMMARY_DRY_RUN" = "true" ]; then
              echo "## Sync Dry Run"
            else
              echo "## Sync Complete"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **SHA** | \`$SUMMARY_SHORT_SHA\` |"
            echo "| **Date** | $SUMMARY_DATE |"
            echo "| **Actor** | $SUMMARY_ACTOR |"
            echo "| **Scopes** | $SUMMARY_SCOPES |"
            echo "| **Dry run** | $SUMMARY_DRY_RUN |"
            if [ "$SUMMARY_DRY_RUN" = "true" ]; then
              echo ""
              echo "> Push skipped (dry run). Re-run without dry_run to sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary — failure
        if: ${{ always() && failure() }}
        run: |
          {
            echo "## Sync Failed"
            echo ""
            echo "Failed for actor **${{ github.actor }}**"
            echo "at SHA \`${{ env.SHORT_SHA || 'unknown' }}\` on ${{ env.DATE || 'unknown' }}."
            echo ""
            echo "Scopes: ${{ env.SCOPES || 'unknown' }}"
            echo ""
            echo "Check the step logs above for details."
          } >> "$GITHUB_STEP_SUMMARY"
