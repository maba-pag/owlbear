name: Sync dev to main

on:
  workflow_dispatch:

concurrency:
  group: sync-to-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate include-list paths exist on dev
        run: |
          failed=0
          for p in share serve seed setup pyproject.toml uv.lock .python-version .gitignore SECURITY.md README-consumer.md; do
            if [ ! -e "$p" ]; then
              echo "MISSING: $p"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "Include-list validation failed -- one or more required paths are absent on dev."
            exit 1
          fi
          echo "All include-list paths present."

      - name: Build clean consumer tree
        run: |
          TREE=$(mktemp -d)
          cp -r share serve seed setup "$TREE/"
          cp pyproject.toml uv.lock .python-version .gitignore SECURITY.md "$TREE/"
          cp README-consumer.md "$TREE/README.md"
          echo "TREE=$TREE" >> "$GITHUB_ENV"

      - name: Create orphan commit and push to main
        run: |
          cd "$TREE"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: update from dev (workflow dispatch)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main --force

      - name: Write job summary
        run: |
          echo "## Sync Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Actor:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
