---
name: Dependency verification

"on":
  pull_request:
    types:
      - opened
      - labeled
      - synchronize

concurrency:
  group: dependency-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  classify:
    name: Classify dependency surfaces
    if: contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
      compatibility: ${{ steps.scope.outputs.compatibility }}
      diagrams: ${{ steps.scope.outputs.diagrams }}
      fix_mode: ${{ steps.scope.outputs.fix_mode }}
      frontend_runtime: ${{ steps.scope.outputs.frontend_runtime }}
      megalinter: ${{ steps.scope.outputs.megalinter }}
      node: ${{ steps.scope.outputs.node }}
      pds: ${{ steps.scope.outputs.pds }}
      precommit: ${{ steps.scope.outputs.precommit }}
      python: ${{ steps.scope.outputs.python }}
      renovate: ${{ steps.scope.outputs.renovate }}
      root_node: ${{ steps.scope.outputs.root_node }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed dependency surfaces
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/dependency-paths"
          git diff --unified=0 "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/dependency.diff"
          python3 serve/tools/src/owlbear_tools/dependency_ci.py \
            --paths-file "$RUNNER_TEMP/dependency-paths" \
            --diff-file "$RUNNER_TEMP/dependency.diff" \
            --labels-json "$LABELS_JSON" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  prepare-fixes:
    name: Prepare autofix candidate
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.candidate.outputs.changed || 'false' }}
      megalinter_check: ${{ steps.megalinter_check.outcome }}
      native_check: ${{ steps.native_check.outcome }}
    steps:
      - name: No autofix requested
        if: needs.classify.outputs.fix_mode == 'none'
        run: echo "Verification will use the untouched pull-request head."

      - name: Checkout pull request head
        if: needs.classify.outputs.fix_mode != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup uv
        if: needs.classify.outputs.fix_mode != 'none'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Setup Node.js
        if: needs.classify.outputs.fix_mode != 'none'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Install fix tooling
        if: needs.classify.outputs.fix_mode != 'none'
        run: |
          uv sync --locked --all-extras
          npm ci --prefix serve/cockpit/web

      - name: Apply native fixes
        if: needs.classify.outputs.fix_mode != 'none'
        continue-on-error: true
        env:
          FIX_MODE: ${{ needs.classify.outputs.fix_mode }}
        run: |
          if [ "$FIX_MODE" = unsafe ]; then
            uv run lint --all --unsafe-fixes
          else
            uv run lint --all
          fi

      - name: Apply MegaLinter fixes and checks
        id: megalinter_check
        if: needs.classify.outputs.fix_mode != 'none'
        continue-on-error: true
        env:
          FIX_MODE: ${{ needs.classify.outputs.fix_mode }}
        run: |
          if [ "$FIX_MODE" = unsafe ]; then
            uv run megalint --unsafe-fixes
          else
            uv run megalint
          fi

      - name: Refresh PDS assets
        if: needs.classify.outputs.fix_mode != 'none' && needs.classify.outputs.pds == 'true'
        working-directory: serve/cockpit/web
        run: npm run sync:pds

      - name: Check native fixed tree
        id: native_check
        if: needs.classify.outputs.fix_mode != 'none'
        continue-on-error: true
        run: uv run lint --all --no-fix

      - name: Capture autofix candidate
        id: candidate
        if: needs.classify.outputs.fix_mode != 'none'
        env:
          FIX_MODE: ${{ needs.classify.outputs.fix_mode }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git add -N -- .
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/autofix"
          git diff --binary --full-index --no-renames > "$RUNNER_TEMP/autofix/autofix.patch"
          PATCH_SHA256="$(sha256sum "$RUNNER_TEMP/autofix/autofix.patch" | cut -d' ' -f1)"
          export PATCH_SHA256
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "fix_mode": os.environ["FIX_MODE"],
              "head_branch": os.environ["HEAD_BRANCH"],
              "head_repository": os.environ["HEAD_REPOSITORY"],
              "head_sha": os.environ["HEAD_SHA"],
              "patch_sha256": os.environ["PATCH_SHA256"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "autofix" / "manifest.json"
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload autofix candidate
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dependency-autofix-candidate
          path: ${{ runner.temp }}/autofix
          if-no-files-found: error
          retention-days: 1

  proof-python:
    name: Prove Python dependency update
    needs:
      - classify
      - prepare-fixes
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dependency-autofix-candidate
          path: ${{ runner.temp }}/autofix

      - name: Apply autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        run: git apply --binary "$RUNNER_TEMP/autofix/autofix.patch"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --all-extras

      - name: Compile Python sources
        run: uv run python -m compileall -q serve setup tests

      - name: Check Python sources
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Python behavior tests
        run: uv run pytest tests serve -m "not api and not e2e and not browser and not cockpit"

  proof-cockpit:
    name: Prove Cockpit production compatibility
    needs:
      - classify
      - prepare-fixes
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: serve/cockpit/web
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dependency-autofix-candidate
          path: ${{ runner.temp }}/autofix

      - name: Apply autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: git apply --binary "$RUNNER_TEMP/autofix/autofix.patch"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Install locked Cockpit dependencies
        run: npm ci

      - name: Run Cockpit behavior tests
        run: npm test

      - name: Check Cockpit sources
        run: |
          npx eslint src e2e --max-warnings 0
          npm run lint:css
          npm run lint:html

      - name: Build production Cockpit
        run: npm run build

      - name: Run maintained browser smoke tests
        if: needs.classify.outputs.frontend_runtime == 'true'
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e

      - name: Verify generated PDS assets
        if: needs.classify.outputs.pds == 'true'
        run: |
          npm run sync:pds
          git status --porcelain --untracked-files=all -- public/porsche-design-system \
            | tee "$RUNNER_TEMP/pds-status"
          test ! -s "$RUNNER_TEMP/pds-status"

  proof-root-node:
    name: Prove root npm dependency update
    needs:
      - classify
      - prepare-fixes
    if: needs.classify.outputs.root_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dependency-autofix-candidate
          path: ${{ runner.temp }}/autofix

      - name: Apply autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        run: git apply --binary "$RUNNER_TEMP/autofix/autofix.patch"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked root npm dependencies
        run: npm ci

  proof-diagrams:
    name: Prove diagram exporter dependency update
    needs:
      - classify
      - prepare-fixes
    if: needs.classify.outputs.diagrams == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .owlbear/scripts/export-diagrams
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dependency-autofix-candidate
          path: ${{ runner.temp }}/autofix

      - name: Apply autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: git apply --binary "$RUNNER_TEMP/autofix/autofix.patch"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: .owlbear/scripts/export-diagrams/package-lock.json

      - name: Install diagram exporter dependencies
        run: npm ci

      - name: Render one maintained diagram
        run: |
          npx playwright install chromium --with-deps
          npm run export:file -- \
            ../../../share/diagrams/mcp-topology.excalidraw \
            "$RUNNER_TEMP/mcp-topology.png"
          test -s "$RUNNER_TEMP/mcp-topology.png"

  compatibility:
    name: Prove dependency tooling compatibility
    needs:
      - classify
      - prepare-fixes
    if: needs.classify.outputs.compatibility == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dependency-autofix-candidate
          path: ${{ runner.temp }}/autofix

      - name: Apply autofix candidate
        if: needs.prepare-fixes.outputs.changed == 'true'
        run: git apply --binary "$RUNNER_TEMP/autofix/autofix.patch"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install Python tooling
        run: uv sync --locked --all-extras

      - name: Setup Node.js
        if: >-
          needs.classify.outputs.precommit == 'true' ||
          needs.classify.outputs.megalinter == 'true' ||
          needs.classify.outputs.renovate == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Install frontend lint dependencies
        if: needs.classify.outputs.precommit == 'true' || needs.classify.outputs.megalinter == 'true'
        run: npm ci --prefix serve/cockpit/web

      - name: Validate updated GitHub Actions workflows
        if: needs.classify.outputs.workflows == 'true'
        run: |
          uv run pre-commit run actionlint --all-files
          uv run pytest tests/test_dependency_verification_workflow.py -q --tb=short

      - name: Validate Renovate configuration
        if: needs.classify.outputs.renovate == 'true'
        run: npx --yes --package renovate renovate-config-validator .github/renovate.json

      - name: Exercise updated pre-commit hooks
        if: needs.classify.outputs.precommit == 'true'
        run: uv run lint --all --no-fix

      - name: Exercise updated MegaLinter image
        if: needs.classify.outputs.megalinter == 'true'
        run: uv run megalint --no-fix

  gate:
    name: Verify dependency update
    needs:
      - classify
      - prepare-fixes
      - proof-python
      - proof-cockpit
      - proof-root-node
      - proof-diagrams
      - compatibility
    if: always() && needs.classify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate dependency proof
        env:
          APPLICABLE: ${{ needs.classify.outputs.applicable }}
          COCKPIT: ${{ needs.proof-cockpit.result }}
          COCKPIT_EXPECTED: ${{ needs.classify.outputs.applicable }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          COMPATIBILITY_EXPECTED: ${{ needs.classify.outputs.compatibility }}
          DIAGRAMS: ${{ needs.proof-diagrams.result }}
          DIAGRAMS_EXPECTED: ${{ needs.classify.outputs.diagrams }}
          FIX_CHANGED: ${{ needs.prepare-fixes.outputs.changed }}
          FIX_MODE: ${{ needs.classify.outputs.fix_mode }}
          MEGALINTER_CHECK: ${{ needs.prepare-fixes.outputs.megalinter_check }}
          NATIVE_CHECK: ${{ needs.prepare-fixes.outputs.native_check }}
          PREPARE: ${{ needs.prepare-fixes.result }}
          PYTHON: ${{ needs.proof-python.result }}
          PYTHON_EXPECTED: ${{ needs.classify.outputs.python }}
          ROOT_NODE: ${{ needs.proof-root-node.result }}
          ROOT_NODE_EXPECTED: ${{ needs.classify.outputs.root_node }}
        run: |
          failed=false

          check_expected() {
            expected="$1"
            result="$2"
            if [ "$expected" = true ]; then
              [ "$result" = success ] || failed=true
            else
              [ "$result" = skipped ] || [ "$result" = success ] || failed=true
            fi
          }

          [ "$PREPARE" = success ] || failed=true
          check_expected "$PYTHON_EXPECTED" "$PYTHON"
          check_expected "$COCKPIT_EXPECTED" "$COCKPIT"
          check_expected "$ROOT_NODE_EXPECTED" "$ROOT_NODE"
          check_expected "$DIAGRAMS_EXPECTED" "$DIAGRAMS"
          check_expected "$COMPATIBILITY_EXPECTED" "$COMPATIBILITY"

          if [ "$FIX_MODE" != none ]; then
            [ "$MEGALINTER_CHECK" = success ] || failed=true
            [ "$NATIVE_CHECK" = success ] || failed=true
          fi

          {
            echo "## Dependency verification gate"
            echo
            echo "| Proof | Applicable | Result |"
            echo "|---|---|---|"
            echo "| Python | $PYTHON_EXPECTED | $PYTHON |"
            echo "| Cockpit | $COCKPIT_EXPECTED | $COCKPIT |"
            echo "| Root npm | $ROOT_NODE_EXPECTED | $ROOT_NODE |"
            echo "| Diagram exporter | $DIAGRAMS_EXPECTED | $DIAGRAMS |"
            echo "| Tooling compatibility | $COMPATIBILITY_EXPECTED | $COMPATIBILITY |"
            echo "| Autofix mode | $FIX_MODE | candidate changed: $FIX_CHANGED |"
            echo
            if [ "$APPLICABLE" != true ]; then
              echo "No recognized dependency surface changed."
            elif [ "$failed" = true ]; then
              echo "At least one applicable dependency proof failed."
            elif [ "$FIX_CHANGED" = true ]; then
              echo "Verified fixes are pending trusted writeback."
            else
              echo "All applicable dependency proofs passed on the pull-request head."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" = false ]

      - name: Require verified autofix writeback
        if: needs.prepare-fixes.outputs.changed == 'true'
        run: |
          echo "::error::Verified fixes are pending writeback; the follow-up run must pass on the committed SHA."
          exit 1
