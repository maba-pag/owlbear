---
name: Dependency verification

"on":
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/renovate.json
      - .github/scripts/check_uv_workspace_lock.py
      - .github/scripts/check_ruff_toolchain.py
      - .github/workflows/**
      - .mega-linter.yml
      - .pre-commit-config.yaml
      - .python-version
      - .owlbear/scripts/diagrams/**
      - share/diagrams/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - serve/*/pyproject.toml
      - serve/cockpit/web/.nvmrc
      - serve/cockpit/web/package.json
      - serve/cockpit/web/package-lock.json
      - serve/tools/src/owlbear_tools/dependency_ci.py
      - serve/tools/src/owlbear_tools/megalinter.py
      - tests/test_archify_diagrams.py
      - tests/test_dependency_verification_workflow.py
      - uv.lock
  workflow_dispatch:

concurrency:
  group: dependency-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  resolve_runtimes:
    name: Resolve Python runtimes
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_matrix: ${{ steps.runtime.outputs.python_matrix }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve pinned Python runtimes
        id: runtime
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python_upper="$(tr -d '\r\n' < .python-version)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'python_matrix=["3.12.14","3.13","%s"]\n' "$python_upper" >> "$GITHUB_OUTPUT"
          else
            printf 'python_matrix=["3.12.14","%s"]\n' "$python_upper" >> "$GITHUB_OUTPUT"
          fi

  classify:
    name: Classify dependency surfaces
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
      compatibility: ${{ steps.scope.outputs.compatibility }}
      diagrams: ${{ steps.scope.outputs.diagrams }}
      megalinter: ${{ steps.scope.outputs.megalinter }}
      node: ${{ steps.scope.outputs.node }}
      pds: ${{ steps.scope.outputs.pds }}
      precommit: ${{ steps.scope.outputs.precommit }}
      python: ${{ steps.scope.outputs.python }}
      proof_tooling: ${{ steps.proof_tooling.outputs.proof_tooling }}
      workspace_lock_tooling: ${{ steps.proof_tooling.outputs.workspace_lock_tooling }}
      ruff_toolchain: ${{ steps.scope.outputs.ruff_toolchain }}
      renovate: ${{ steps.scope.outputs.renovate }}
      root_node: ${{ steps.scope.outputs.root_node }}
      shared_node_runtime: ${{ steps.scope.outputs.shared_node_runtime }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed dependency surfaces
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            : > "$RUNNER_TEMP/dependency-paths"
            for output in \
              python node shared_node_runtime root_node diagrams pds precommit \
              ruff_toolchain workflows megalinter renovate applicable compatibility \
              workspace_lock_tooling
            do
              echo "$output=true" >> "$GITHUB_OUTPUT"
            done
          else
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/dependency-paths"
            git diff --unified=0 "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/dependency.diff"
            python3 serve/tools/src/owlbear_tools/dependency_ci.py \
              --paths-file "$RUNNER_TEMP/dependency-paths" \
              --diff-file "$RUNNER_TEMP/dependency.diff" \
              --base-ref "$MERGE_BASE" \
              --head-ref "$HEAD_SHA" \
              --repository-root "$GITHUB_WORKSPACE" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Protect dependency proof tooling
        id: proof_tooling
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "proof_tooling=true" >> "$GITHUB_OUTPUT"
            echo "workspace_lock_tooling=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          proof_tooling=false
          workspace_lock_tooling=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/scripts/check_uv_workspace_lock.py)
                workspace_lock_tooling=true
                ;;
              .github/workflows/*|\
              .github/scripts/check_ruff_toolchain.py|\
              serve/tools/src/owlbear_tools/dependency_ci.py|\
              serve/tools/src/owlbear_tools/megalinter.py|\
              tests/test_dependency_verification_workflow.py)
                proof_tooling=true
                ;;
            esac
          done < "$RUNNER_TEMP/dependency-paths"
          echo "proof_tooling=$proof_tooling" >> "$GITHUB_OUTPUT"
          echo "workspace_lock_tooling=$workspace_lock_tooling" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for runtime declaration
        if: steps.scope.outputs.node == 'true' || steps.scope.outputs.shared_node_runtime == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc

      - name: Check Node runtime declaration
        if: steps.scope.outputs.node == 'true' || steps.scope.outputs.shared_node_runtime == 'true'
        run: |
          python3 .github/scripts/check_node_runtime.py \
            --version-file serve/cockpit/web/.nvmrc \
            --engines-file serve/cockpit/web/package.json \
            --expected-version "$(tr -d '\r\n' < serve/cockpit/web/.nvmrc)"

  proof-python:
    name: Prove Python ${{ matrix.python }} compatibility
    needs:
      - classify
      - resolve_runtimes
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false) &&
      needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.resolve_runtimes.outputs.python_matrix) }}
    env:
      UV_PROJECT_ENVIRONMENT: .venv-${{ matrix.python }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Check uv runtime
        run: python3 .github/scripts/check_uv_version.py

      - name: Install requested Python
        run: uv python install "${{ matrix.python }}"

      - name: Install locked Python workspace
        run: uv sync --locked --python "${{ matrix.python }}" --all-packages --all-extras --all-groups

      - name: Prove workspace lock regeneration
        if: matrix.python == '3.12.14'
        run: uv run --python "${{ matrix.python }}" python .github/scripts/check_uv_workspace_lock.py

      - name: Compile Python sources
        if: github.event_name == 'workflow_dispatch' || matrix.python == '3.12.14'
        run: |
          uv run --python "${{ matrix.python }}" python -m compileall -q serve setup tests .owlbear/hooks seed

      - name: Check Python sources
        if: github.event_name == 'workflow_dispatch' || matrix.python == '3.12.14'
        run: |
          uv run --python "${{ matrix.python }}" ruff check .
          uv run --python "${{ matrix.python }}" ruff format --check .

      - name: Run Python behavior tests
        if: github.event_name == 'workflow_dispatch' || matrix.python == '3.12.14'
        run: |
          uv run --python "${{ matrix.python }}" pytest tests serve \
            -m "not api and not e2e and not browser and not cockpit"

  proof-node:
    name: Prove Node dependency surfaces
    needs:
      - classify
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false) &&
      needs.classify.result == 'success' &&
      (needs.classify.outputs.pds == 'true' ||
      needs.classify.outputs.root_node == 'true' ||
      needs.classify.outputs.diagrams == 'true' ||
      needs.classify.outputs.shared_node_runtime == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            serve/cockpit/web/package-lock.json

      - name: Install locked root dependencies
        if: needs.classify.outputs.root_node == 'true' || needs.classify.outputs.shared_node_runtime == 'true'
        run: npm ci

      - name: Verify pinned Archify release and static render
        if: needs.classify.outputs.diagrams == 'true' || needs.classify.outputs.shared_node_runtime == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          python3 .owlbear/scripts/diagrams/sync.py
          python3 -c '
          import json
          from pathlib import Path

          manifest = json.loads(Path("share/diagrams/manifest.json").read_text(encoding="utf-8"))
          manifest_sources = {diagram["source"] for diagram in manifest["diagrams"]}
          architecture_sources = {
              path.as_posix() for path in Path("share/diagrams").rglob("*.architecture.json")
          }
          if manifest_sources != architecture_sources:
              missing = sorted(architecture_sources - manifest_sources)
              unlisted = sorted(manifest_sources - architecture_sources)
              raise SystemExit(
                  f"Archify manifest source coverage mismatch: missing={missing}; unlisted={unlisted}"
              )
          for diagram in manifest["diagrams"]:
              print("\t".join((diagram["source"], diagram["artifact"])))
          ' > "$RUNNER_TEMP/archify-diagrams.tsv"
          test -s "$RUNNER_TEMP/archify-diagrams.tsv"
          diagram_index=0
          while IFS=$'\t' read -r source artifact; do
            test -n "$source"
            test -n "$artifact"
            test -f "$source"
            test -f "$artifact"
            output="$RUNNER_TEMP/archify-diagram-${diagram_index}.svg"
            python3 .owlbear/scripts/diagrams/render.py \
              --input "$source" \
              --output "$output" \
              --offline
            if cmp --silent "$output" "$artifact"; then
              :
            else
              echo "Archify artifact is stale: $artifact"
              echo "Regenerate with:"
              echo "  python3 .owlbear/scripts/diagrams/render.py"
              echo "    --input \"$source\" --output \"$artifact\" --offline"
              exit 1
            fi
            diagram_index=$((diagram_index + 1))
          done < "$RUNNER_TEMP/archify-diagrams.tsv"

      - name: Install locked Cockpit dependencies
        if: needs.classify.outputs.pds == 'true'
        working-directory: serve/cockpit/web
        run: npm ci --engine-strict

      - name: Verify generated PDS assets
        if: needs.classify.outputs.pds == 'true'
        working-directory: serve/cockpit/web
        run: |
          npm run sync:pds
          git status --porcelain --untracked-files=all -- public/porsche-design-system \
            | tee "$RUNNER_TEMP/pds-status"
          test ! -s "$RUNNER_TEMP/pds-status"

  compatibility:
    name: Prove dependency tooling compatibility
    needs: classify
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false) &&
      (needs.classify.outputs.compatibility == 'true' ||
      needs.classify.outputs.proof_tooling == 'true' ||
      needs.classify.outputs.workspace_lock_tooling == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Check uv runtime
        run: python3 .github/scripts/check_uv_version.py

      - name: Install locked Python workspace
        run: uv sync --locked --all-packages --all-extras --all-groups

      - name: Exercise dependency proof tooling
        if: needs.classify.outputs.proof_tooling == 'true'
        run: uv run pytest -q tests/test_dependency_verification_workflow.py serve/tools/tests/test_megalinter.py

      - name: Exercise workspace lock proof
        if: needs.classify.outputs.workspace_lock_tooling == 'true'
        run: uv run python .github/scripts/check_uv_workspace_lock.py

      - name: Verify Ruff toolchain parity
        if: needs.classify.outputs.ruff_toolchain == 'true'
        run: uv run python .github/scripts/check_ruff_toolchain.py

      - name: Setup Node.js for frontend lint hooks
        if: needs.classify.outputs.precommit == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: serve/cockpit/web/.nvmrc
          cache: npm
          cache-dependency-path: serve/cockpit/web/package-lock.json

      - name: Install locked Cockpit dependencies
        if: needs.classify.outputs.precommit == 'true'
        run: npm ci --prefix serve/cockpit/web

      - name: Validate updated GitHub Actions workflows
        if: needs.classify.outputs.workflows == 'true'
        run: uv run pre-commit run actionlint --all-files

      - name: Exercise updated pre-commit hooks
        if: needs.classify.outputs.precommit == 'true'
        run: uv run lint --no-fix

      # Deferred removal option (comment-only; keep the step below active for now):
      # - name: Exercise updated MegaLinter image
      #   if: needs.classify.outputs.megalinter == 'true'
      #   run: uv run megalint --no-fix
      - name: Exercise updated MegaLinter image
        if: needs.classify.outputs.megalinter == 'true'
        run: uv run megalint --no-fix

      - name: Validate Renovate policy JSON
        if: needs.classify.outputs.renovate == 'true'
        run: python3 -m json.tool .github/renovate.json >/dev/null

  gate:
    name: Verify dependency update
    needs:
      - classify
      - resolve_runtimes
      - proof-python
      - proof-node
      - compatibility
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate dependency proof
        env:
          CLASSIFY: ${{ needs.classify.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          COMPATIBILITY_EXPECTED: >-
            ${{ needs.classify.outputs.compatibility == 'true' ||
            needs.classify.outputs.proof_tooling == 'true' ||
            needs.classify.outputs.workspace_lock_tooling == 'true' }}
          NODE: ${{ needs.proof-node.result }}
          NODE_EXPECTED: >-
            ${{ needs.classify.outputs.pds == 'true' ||
            needs.classify.outputs.root_node == 'true' ||
            needs.classify.outputs.diagrams == 'true' ||
            needs.classify.outputs.shared_node_runtime == 'true' }}
          PYTHON: ${{ needs.proof-python.result }}
          PYTHON_EXPECTED: ${{ needs.classify.outputs.python }}
        run: |
          failed=false
          [ "$CLASSIFY" = success ] || failed=true

          check_expected() {
            expected="$1"
            result="$2"
            if [ "$expected" = true ]; then
              [ "$result" = success ] || failed=true
            else
              [ "$result" = skipped ] || [ "$result" = success ] || failed=true
            fi
          }

          check_expected "$PYTHON_EXPECTED" "$PYTHON"
          check_expected "$NODE_EXPECTED" "$NODE"
          check_expected "$COMPATIBILITY_EXPECTED" "$COMPATIBILITY"

          {
            echo "## Dependency verification gate"
            echo
            echo "| Proof | Expected | Result |"
            echo "|---|---|---|"
            echo "| Python lock and behavior | $PYTHON_EXPECTED | $PYTHON |"
            echo "| Node dependency surfaces | $NODE_EXPECTED | $NODE |"
            echo "| Tooling compatibility | $COMPATIBILITY_EXPECTED | $COMPATIBILITY |"
            echo
            if [ "$failed" = true ]; then
              echo "At least one applicable dependency proof failed."
            else
              echo "All applicable dependency proofs passed on the pull-request head."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" = false ]
