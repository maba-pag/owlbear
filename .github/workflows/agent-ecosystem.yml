---
name: Agent ecosystem validation

"on":
  pull_request:
    branches: [dev]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/agent-ecosystem.yml
      - .owlbear/hooks/**
      - .owlbear/agents/**
      - .owlbear/instructions/**
      - .owlbear/prompts/**
      - .owlbear/scripts/validate_agents.py
      - .owlbear/scripts/validate_prompts.py
      - .owlbear/scripts/validate_skills.py
      - .owlbear/skills/**
      - .github/scripts/check_uv_version.py
      - .pre-commit-config.yaml
      - .vscode/mcp.json
      - seed/.vscode/mcp.json
      - serve/*-mcp/**
      - share/agents/**
      - share/instructions/**
      - share/prompts/**
      - share/skills/**
      - tests/test_agent_ecosystem_validation.py
      - tests/test_write_guard_hooks.py
      - serve/knowledge/**
      - tests/test_knowledge_ops_contract.py

concurrency:
  group: agent-ecosystem-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-agent-ecosystem:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: dev-tools
          cache-dependency-glob: uv.lock
          prune-cache: false
      - run: python3 .github/scripts/check_uv_version.py
      - run: uv python install
      - run: uv run --frozen python .owlbear/scripts/validate_agents.py
      - run: uv run --frozen python .owlbear/scripts/validate_skills.py
      - run: uv run --frozen python .owlbear/scripts/validate_prompts.py
      - run: >-
          uv run --frozen pytest -q
          tests/test_agent_ecosystem_validation.py
          tests/test_write_guard_hooks.py
          tests/test_knowledge_ops_contract.py
