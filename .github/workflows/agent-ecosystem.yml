---
name: Agent ecosystem validation

"on":
  workflow_call:
  workflow_dispatch:

concurrency:
  group: agent-ecosystem-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate-agent-ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-suffix: dev-tools
          cache-dependency-glob: uv.lock
          prune-cache: false
      - run: python3 .github/scripts/check_uv_version.py
      - run: uv python install
      - run: uv run --frozen python .owlbear/scripts/validate_agents.py
      - run: uv run --frozen python .owlbear/scripts/validate_skills.py
      - run: uv run --frozen python .owlbear/scripts/validate_prompts.py
      - run: >-
          uv run --frozen pytest -q
          tests/test_agent_ecosystem_validation.py
          tests/test_knowledge_ops_contract.py
