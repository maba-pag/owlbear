---
name: Agent ecosystem validation

"on":
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/agent-ecosystem.yml
      - .owlbear/hooks/**
      - .owlbear/agents/**
      - .owlbear/prompts/**
      - .owlbear/scripts/validate_agents.py
      - .owlbear/scripts/validate_prompts.py
      - .owlbear/scripts/validate_skills.py
      - .owlbear/skills/**
      - .pre-commit-config.yaml
      - share/agents/**
      - share/prompts/**
      - share/skills/**
      - tests/test_agent_ecosystem_validation.py
      - tests/test_write_guard_hooks.py
      - uv.lock
  push:
    branches: [dev]
    paths:
      - .github/workflows/agent-ecosystem.yml
      - .owlbear/hooks/**
      - .owlbear/agents/**
      - .owlbear/prompts/**
      - .owlbear/scripts/validate_agents.py
      - .owlbear/scripts/validate_prompts.py
      - .owlbear/scripts/validate_skills.py
      - .owlbear/skills/**
      - .pre-commit-config.yaml
      - share/agents/**
      - share/prompts/**
      - share/skills/**
      - tests/test_agent_ecosystem_validation.py
      - tests/test_write_guard_hooks.py
      - uv.lock

permissions: {}

jobs:
  validate-agent-ecosystem:
    if: github.repository == 'maba-pag/owlbear'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: python3 .github/scripts/check_uv_version.py
      - run: uv python install
      - run: uv run --frozen python .owlbear/scripts/validate_agents.py
      - run: uv run --frozen python .owlbear/scripts/validate_skills.py
      - run: uv run --frozen python .owlbear/scripts/validate_prompts.py
      - run: uv run --frozen pytest -q tests/test_agent_ecosystem_validation.py tests/test_write_guard_hooks.py
