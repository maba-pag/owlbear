---
name: MegaLinter

"on":
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      fix:
        description: "Apply autofixes after linting"
        type: boolean
        default: false
      fix_mode:
        description: "How to publish autofixes when enabled"
        type: choice
        options:
          - pull_request
          - commit
        default: pull_request

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPLY_FIXES: ${{ inputs.fix && 'all' || 'none' }}
      APPLY_FIXES_EVENT: all
      APPLY_FIXES_MODE: ${{ inputs.fix_mode }}

    permissions:
      actions: read
      contents: write
      pull-requests: write
      security-events: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: MegaLinter
        id: megalinter
        uses: oxsecurity/megalinter/flavors/cupcake@8fbdead70d1409964ab3d5afa885e18ee85388bb  # v9.4.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: megalinter-reports
          path: megalinter-reports
          retention-days: 15

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
          category: megalinter

      - name: Create pull request with applied fixes
        id: fix_pr
        if: >-
          ${{ inputs.fix && inputs.fix_mode == 'pull_request' && steps.megalinter.outputs.has_updated_sources == '1' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: megalinter-fixes-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: "[MegaLinter] Apply linters fixes"
          title: "[MegaLinter] Apply linters fixes"
          body: |
            Automated fixes generated by the MegaLinter workflow.

            Base branch: `${{ github.ref_name }}`
          delete-branch: true

      - name: Prepare fix commit
        if: ${{ inputs.fix && inputs.fix_mode == 'commit' && steps.megalinter.outputs.has_updated_sources == '1' }}
        run: sudo chown -Rc "$UID" .git/

      - name: Commit and push applied fixes
        id: fix_commit
        if: ${{ inputs.fix && inputs.fix_mode == 'commit' && steps.megalinter.outputs.has_updated_sources == '1' }}
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9  # v7.1.0
        with:
          branch: ${{ github.ref_name }}
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_user_name: megalinter-bot
          commit_user_email: 129584137+megalinter-bot@users.noreply.github.com

      - name: Job summary
        if: always()
        shell: bash
        env:
          INPUT_FIX: ${{ inputs.fix }}
          INPUT_FIX_MODE: ${{ inputs.fix_mode }}
          FIX_MODE_DISPLAY: ${{ inputs.fix && inputs.fix_mode || 'disabled' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MEGALINTER_HAS_UPDATED_SOURCES: ${{ steps.megalinter.outputs.has_updated_sources }}
          FIX_PR_OUTCOME: ${{ steps.fix_pr.outcome }}
          FIX_PR_URL: ${{ steps.fix_pr.outputs.pull-request-url }}
          FIX_COMMIT_OUTCOME: ${{ steps.fix_commit.outcome }}
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## MegaLinter Results"
            echo ""
            echo "Auto-fix enabled: $INPUT_FIX"
            echo "Auto-fix mode: $FIX_MODE_DISPLAY"
            echo ""
            if [ "$INPUT_FIX" = "true" ] && [ "$MEGALINTER_HAS_UPDATED_SOURCES" = "1" ]; then
              if [ "$INPUT_FIX_MODE" = "pull_request" ] && [ "$FIX_PR_OUTCOME" = "success" ]; then
                echo "Created or updated fix PR: $FIX_PR_URL"
              elif [ "$FIX_COMMIT_OUTCOME" = "success" ]; then
                echo "Applied fixes were committed back to branch $GITHUB_REF_NAME."
              else
                echo "MegaLinter updated files, but publishing those fixes did not complete."
              fi
              echo ""
            elif [ "$INPUT_FIX" = "true" ]; then
              echo "Auto-fix was enabled, but MegaLinter did not report updated files."
              echo ""
            fi
            if [ "$MEGALINTER_OUTCOME" = "success" ]; then
              echo "All linters passed."
            else
              ARTIFACT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "Some linters reported issues." \
                "See [megalinter-reports artifact](${ARTIFACT_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if lint failed
        if: steps.megalinter.outcome != 'success'
        run: exit 1
