name: MegaLinter

on:
  workflow_dispatch:

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: MegaLinter
        id: megalinter
        uses: oxsecurity/megalinter/flavors/python@8fbdead70d1409964ab3d5afa885e18ee85388bb # v9.4.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: megalinter-reports
          path: megalinter-reports
          retention-days: 15

      - name: Upload SARIF report
        if: always() && hashFiles('megalinter-reports/megalinter-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v3
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
          category: megalinter

      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo "## MegaLinter Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.megalinter.outcome }}" = "success" ]; then
            echo "All linters passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Some linters reported issues. See the [megalinter-reports artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> "$GITHUB_STEP_SUMMARY"
            if [ -f "megalinter-reports/megalinter-report.sarif" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "SARIF results uploaded to Security tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Fail if lint failed
        if: steps.megalinter.outcome != 'success'
        run: exit 1
