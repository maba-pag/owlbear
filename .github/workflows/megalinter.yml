---
name: MegaLinter

"on":
  workflow_dispatch:
    inputs:
      fix:
        description: "Apply autofixes after linting"
        type: boolean
        default: false
      fix_mode:
        description: "How to publish autofixes when enabled"
        type: choice
        options:
          - pull_request
          - commit
        default: pull_request

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    env:
      APPLY_FIXES: ${{ inputs.fix && 'all' || 'none' }}
      APPLY_FIXES_EVENT: all
      APPLY_FIXES_MODE: ${{ inputs.fix_mode }}

    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: MegaLinter
        id: megalinter
        uses: oxsecurity/megalinter/flavors/cupcake@8fbdead70d1409964ab3d5afa885e18ee85388bb  # v9.4.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: megalinter-reports
          path: megalinter-reports
          retention-days: 15

      - name: Create pull request with applied fixes
        id: fix_pr
        if: ${{ inputs.fix && inputs.fix_mode == 'pull_request' && steps.megalinter.outputs.has_updated_sources == '1' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.11
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: megalinter-fixes-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: "[MegaLinter] Apply linters fixes"
          title: "[MegaLinter] Apply linters fixes"
          body: |
            Automated fixes generated by the MegaLinter workflow.

            Base branch: `${{ github.ref_name }}`
          delete-branch: true

      - name: Prepare fix commit
        if: ${{ inputs.fix && inputs.fix_mode == 'commit' && steps.megalinter.outputs.has_updated_sources == '1' }}
        run: sudo chown -Rc "$UID" .git/

      - name: Commit and push applied fixes
        id: fix_commit
        if: ${{ inputs.fix && inputs.fix_mode == 'commit' && steps.megalinter.outputs.has_updated_sources == '1' }}
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9  # v7.1.0
        with:
          branch: ${{ github.ref_name }}
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_user_name: megalinter-bot
          commit_user_email: 129584137+megalinter-bot@users.noreply.github.com

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MegaLinter Results"
            echo ""
            echo "Auto-fix enabled: ${{ inputs.fix }}"
            echo "Auto-fix mode: ${{ inputs.fix && inputs.fix_mode || 'disabled' }}"
            echo ""
            if [ "${{ inputs.fix }}" = "true" ] && [ "${{ steps.megalinter.outputs.has_updated_sources }}" = "1" ]; then
              if [ "${{ inputs.fix_mode }}" = "pull_request" ] && [ "${{ steps.fix_pr.outcome }}" = "success" ]; then
                echo "Created or updated fix PR: ${{ steps.fix_pr.outputs.pull-request-url }}"
              elif [ "${{ steps.fix_commit.outcome }}" = "success" ]; then
                echo "Applied fixes were committed back to branch ${{ github.ref_name }}."
              else
                echo "MegaLinter updated files, but publishing those fixes did not complete."
              fi
              echo ""
            elif [ "${{ inputs.fix }}" = "true" ]; then
              echo "Auto-fix was enabled, but MegaLinter did not report updated files."
              echo ""
            fi
            if [ "${{ steps.megalinter.outcome }}" = "success" ]; then
              echo "All linters passed."
            else
              ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "Some linters reported issues." \
                "See [megalinter-reports artifact](${ARTIFACT_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if lint failed
        if: steps.megalinter.outcome != 'success'
        run: exit 1
