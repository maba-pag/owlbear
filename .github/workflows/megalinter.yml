---
name: MegaLinter

"on":
  workflow_dispatch:

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: MegaLinter
        id: megalinter
        uses: oxsecurity/megalinter/flavors/python@8fbdead70d1409964ab3d5afa885e18ee85388bb # v9.4.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: megalinter-reports
          path: megalinter-reports
          retention-days: 15

      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo "## MegaLinter Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.megalinter.outcome }}" = "success" ]; then
            echo "All linters passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Some linters reported issues. See the [megalinter-reports artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if lint failed
        if: steps.megalinter.outcome != 'success'
        run: exit 1
