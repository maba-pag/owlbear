---
name: Release

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request_target:
    types:
      - labeled
      - unlabeled
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'pull_request_target'
          && github.event.pull_request.merged
          && startsWith(github.event.label.name, 'release:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:  # on the guarded job, so a skipped run never displaces a waiting drain
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout main, never a pull request's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Tag labelled merges whose CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ vars.RELEASE_TAGS }}
        run: python3 .github/scripts/release.py
