[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "ruff>=0.15",
  "strictyaml>=1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["v1"]
asyncio_mode = "strict"
markers = [
  "api: tests that require API integrations or network services",
  "slow: tests that are long-running",
]
