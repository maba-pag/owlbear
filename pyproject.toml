[tool.uv]
system-certs = true
required-version = ">=0.11.0"

[tool.uv.workspace]
members = ["serve/*"]

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0.3",
  "ruff==0.16.5",
  "ruamel.yaml>=0.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "serve"]
pythonpath = ["serve/delivery/src", "serve/tools/src"]
addopts = "--import-mode=importlib -m 'not e2e' -n auto --dist loadfile -p no:logfire -p no:pytest_logfire"
timeout = 30
session_timeout = 600
asyncio_mode = "strict"
markers = [
  "api: tests that require API integrations or network services",
  "browser: tests that require an installed browser runtime",
  "cockpit: tests that require installed Cockpit frontend dependencies",
  "slow: tests that are long-running",
  "integration: marks tests that require the kanban-md binary (deselect with -m 'not integration')",
  "e2e: end-to-end tests requiring VS Code agent runtime prerequisites (run explicitly with -m e2e)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [
  "serve/delivery/src",
  "serve/delivery-github/src",
  "serve/knowledge/src",
  "serve/delivery-mcp/src",
  "serve/knowledge-mcp/src",
  "serve/memory-mcp/src",
  "serve/browser-mcp/src",
  "serve/browser/src",
  "serve/cockpit/src",
  "serve/tools/src",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing comma — conflicts with formatter
  "CPY001", # per-file copyright headers are not used in this repository
  "D105",   # magic methods usually inherit their behavioral contract from Python
  "D107",   # constructor documentation belongs on the class
  "ISC001", # implicit string concatenation — conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
".owlbear/hooks/*.py" = [
  "C901",   # hook scripts have inherently complex path-extraction logic
  "INP001", # .owlbear/hooks/ is not a package — direct-run scripts are expected here
  "PLR0912", # guard scripts branch by path rule category
  "T201",   # print() is the stdout I/O contract for VS Code hook scripts
]
"seed/.owlbear/hooks/*.py" = [
  "C901",   # hook scripts have inherently complex path-extraction logic
  "INP001", # seed/.owlbear/hooks/ is not a package — direct-run scripts are expected here
  "PLR0912", # guard scripts branch by path rule category
  "T201",   # print() is the stdout I/O contract for VS Code hook scripts
]
"serve/browser/src/owlbear_browser/_errors.py" = [
  "N818",   # AuthenticationRequired is an established public API name
]
"serve/delivery-mcp/src/owlbear_delivery_mcp/target_models.py" = [
  "N818",   # DeliveryStartupDiagnostic is an established public API name
]
".owlbear/scripts/*.py" = [
  "INP001", # .owlbear/scripts/ is not a package — direct-run files are expected here
  "T201",   # print() is intentional in CLI scripts
]
".github/scripts/*.py" = [
  "INP001", # .github/scripts/ contains direct-run CI helpers, not an importable package
  "T201",   # print() is intentional in direct-run CI helpers
]
".github/skills/session-review/tests/test_extract_transcript.py" = [
  "S101", # assert-based checks are intentional in the skill's extractor tests
]
"seed/.owlbear/scripts/*.py" = [
  "INP001", # seed/.owlbear/scripts/ is not a package — direct-run files are expected here
  "T201",   # print() is intentional in CLI scripts
]
".owlbear/scratch/*.py" = [
  "ANN401", # Any is appropriate for spike scripts interfacing with browser objects
  "INP001", # .owlbear/scratch/ is not a package — spike scripts are direct-run files
  "S603",   # subprocess with trusted paths — edge binary validated by _find_edge()
  "T201",   # print() is intentional in CLI spike scripts
]
"setup/*.py" = [
  "INP001", # setup/ is not a package — direct-run scripts are expected here
  "T201",   # print() is intentional in CLI scripts
]
"serve/*/examples/**/*.py" = [
  "INP001", # examples/ is a script-style directory, not a package
  "T201",   # print() is intentional in example output
  "EM101",  # string literals in stub raises are acceptable in examples
]
"tests/**/*.py" = [
  "ANN",     # type annotations not required in tests
  "D",       # docstring rules not enforced in tests
  "INP001",  # tests are discovered as non-package modules under importlib mode
  "S101",    # assert is fine in tests
  "PLR2004", # magic values are fine in tests
  "TCH",     # type-checking blocks impractical in tests
]
"tests/fixtures/delivery-authority/**/*.py" = [
  "INP001", # structural snippets are parsed as source fixtures, not imported modules
  "S603",   # subprocess calls are inert AST fixture text, never executed
  "S607",   # executable names are inert AST fixture text, never executed
]
"serve/*/tests/**/*.py" = [
  "ANN",     # type annotations not required in tests
  "D",       # docstring rules not enforced in tests
  "INP001",  # serve/*/tests/ dirs without __init__.py — importlib mode handles discovery
  "S101",    # assert is fine in tests
  "PLR2004", # magic values are fine in tests
  "TCH",     # type-checking blocks impractical in tests
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "owlbear_knowledge.protocols.common.BoundaryModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source_pkgs = [
  "owlbear_delivery",
  "owlbear_delivery_github",
  "owlbear_knowledge",
  "owlbear_browser_mcp",
  "owlbear_delivery_mcp",
  "owlbear_knowledge_mcp",
  "owlbear_memory_mcp",
  "owlbear_browser",
  "owlbear_cockpit",
  "owlbear_tools",
]
